<!doctype html><html lang="zh-CN" data-nutbook-edit-contract="nutbook-html/v1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nutbook 批量导入界面预览</title><style>
*{box-sizing:border-box}body{margin:0;color:#1a1c1d;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#fff;--line:#e2e2e5;--paper:#fff}.app-shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{display:flex;flex-direction:column;gap:10px;padding:28px 18px 22px;background:#f7f7f8;border-right:1px solid var(--line)}.brand{font-size:24px;letter-spacing:2px;margin:0 0 25px}.sidebar>button{text-align:left;padding:10px;border:0;border-radius:8px;background:transparent;font:inherit}.sidebar>button.selected{background:#e9e9ec}main{padding:38px 42px;max-width:1000px}h1{margin:8px 0;font-size:30px;letter-spacing:-1px}.badge{display:inline-block;padding:4px 10px;border-radius:20px;background:#f0f0f2;color:#65656d;font-size:12px}.intro{max-width:650px;color:#686870;margin:8px 0 26px}.stages{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.stages button,.play{border:1px solid var(--line);border-radius:8px;padding:9px 15px;background:#fff;font:inherit;cursor:pointer}.stages button[aria-pressed=true],.play{background:#1a1c1d;color:#fff;border-color:#1a1c1d}.sample{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:26px 0}.row{display:grid;grid-template-columns:1fr 95px;padding:14px 20px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row p{margin:0}.row p:last-child{color:#8a8a90;text-align:right}.help{border-top:1px solid var(--line);padding-top:22px;color:#686870;max-width:650px}.hint{font-size:12px;color:#8a8a90}@media(max-width:700px){.app-shell{grid-template-columns:175px 1fr}.sidebar{padding:20px 10px}main{padding:24px 18px}h1{font-size:24px}.row{padding:12px;grid-template-columns:1fr}.row p:last-child{text-align:left}.stages{gap:6px}.stages button{padding:6px 9px}}
      .folder-task-progress{flex:none;margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper,#fff);font-size:12px;line-height:1.5;max-width:100%;app-region:no-drag;-webkit-app-region:no-drag}
      .folder-task-progress p{margin:5px 0;overflow-wrap:anywhere}.folder-task-progress progress{display:block;width:100%;height:7px;accent-color:#267756;margin:9px 0}.folder-task-progress button{border:1px solid var(--line);border-radius:6px;background:transparent;padding:4px 10px;color:inherit;cursor:pointer}.folder-task-progress [data-task-compact]{display:none}
      .document-mode .folder-task-progress,.sidebar-collapsed .folder-task-progress{width:48px;padding:4px;font-size:10px}.document-mode .folder-task-progress strong,.document-mode .folder-task-progress p,.sidebar-collapsed .folder-task-progress strong,.sidebar-collapsed .folder-task-progress p{display:none}.document-mode .folder-task-progress [data-task-compact],.sidebar-collapsed .folder-task-progress [data-task-compact]{display:block;font-size:9px;white-space:nowrap}.document-mode .folder-task-progress button,.sidebar-collapsed .folder-task-progress button{padding:3px;font-size:10px}

</style></head><body><div class="app-shell"><aside class="sidebar"><p class="brand" data-id="brand" data-editable="text">NUTBOOK</p><button class="selected" data-id="nav-all" data-editable="text">所有文件</button><button data-id="nav-recent" data-editable="text">最近打开</button><button data-id="nav-favorites" data-editable="text">收藏</button><button data-id="nav-settings" data-editable="text">设置</button></aside><main><span class="badge" data-id="demo-label" data-editable="text">交互预览 · 不会导入真实文件</span><h1 data-id="title" data-editable="text">批量导入时，你会看到什么</h1><p class="intro" data-id="intro" data-editable="text">左下角使用软件中的实际任务卡组件。每批 50 份提交后立即显示并可打开；完成结果会保留，直到你手动关闭。</p><div class="stages" role="group" aria-label="切换导入阶段"><button data-stage="check" data-id="stage-check" data-editable="text">检查文件</button><button data-stage="prepare" data-id="stage-prepare" data-editable="text">分批导入</button><button data-stage="commit" data-id="stage-commit" data-editable="text">提交当前批</button><button data-stage="done" data-id="stage-done" data-editable="text">导入完成</button></div><button class="play" id="play" data-id="play-label" data-editable="text">播放完整流程</button><div class="sample"><div class="row"><p data-id="file-1" data-editable="text">项目方案.md</p><p data-id="type-1" data-editable="text">Markdown</p></div><div class="row"><p data-id="file-2" data-editable="text">产品介绍.html</p><p data-id="type-2" data-editable="text">HTML</p></div><div class="row"><p data-id="file-3" data-editable="text">会议记录.md</p><p data-id="type-3" data-editable="text">Markdown</p></div></div><p class="help" data-id="help" data-editable="text">取消会保留已经导入的文件，并停止剩余批次。文件管理中的文件夹名称旁会显示小感叹号，提示尚未扫描完成；点击“扫描”可补扫。</p><p class="hint" data-id="hint" data-editable="text">点击上方阶段按钮，或播放完整流程。取消和关闭按钮可以实际点击。</p></main></div><script>
const currentLanguage=()=> 'zh-CN';
      function updateFolderTaskProgress({ message, processed, total, done = false, cancel, cancelId } = {}) {
        let card = document.getElementById('folderTaskProgress');
        if (!card) {
          card = document.createElement('section');card.id = 'folderTaskProgress';card.className = 'folder-task-progress';card.setAttribute('aria-live','polite');card.dataset.i18nSkip = 'true';
          card.innerHTML = '<strong data-task-title></strong><p data-task-message></p><span data-task-compact></span><progress></progress><button type="button"></button>';
          const sidebar = document.querySelector('.sidebar');(sidebar || document.body).append(card);
        }
        const en = currentLanguage() === 'en-US', button = card.querySelector('button');
        card.querySelector('[data-task-title]').textContent = en ? 'File import' : '文件导入';
        if (message) { card.querySelector('[data-task-message]').textContent = message;card.title = message; }
        const bar=card.querySelector('progress');if(total>0){bar.max=total;bar.value=processed||0;card.querySelector('[data-task-compact]').textContent=`${processed||0}/${total}`;}else if(!done){bar.removeAttribute('value');card.querySelector('[data-task-compact]').textContent=en?'Import':'导入中';}
        if(done){bar.max=1;bar.value=1;card.querySelector('[data-task-compact]').textContent=en?'Done':'已结束';button.id='folderTaskDismiss';button.textContent=en?'Close':'关闭';button.disabled=false;button.onclick=()=>card.remove();}
        else if(cancel){button.id=cancelId;button.textContent=en?'Cancel':'取消';button.disabled=false;button.onclick=cancel;}
        else button.disabled=true;
        button.title=button.textContent;button.setAttribute('aria-label',button.textContent);
        return card;
      }

let timer=null;const stop=()=>{if(timer){clearInterval(timer);timer=null;}};
function render(options){const card=updateFolderTaskProgress(options);for(const [selector,id] of [['[data-task-title]','task-title'],['[data-task-message]','task-message'],['[data-task-compact]','task-compact'],['button','task-action']]){const n=card.querySelector(selector);n.dataset.id=id;n.dataset.editable='text';}card.querySelector('progress').setAttribute('aria-label','文件导入进度');}
function show(stage,count=350){document.querySelectorAll('[data-stage]').forEach(n=>n.setAttribute('aria-pressed',String(n.dataset.stage===stage)));const options=stage==='check'?{message:'正在检查文件，已找到 1000 份'}:stage==='prepare'?{message:`已导入 ${count}/1000 份，可立即打开 · 第 ${Math.min(Math.floor(count/50)+1,20)}/20 批`,processed:count,total:1000}:stage==='commit'?{message:'正在提交当前批，取消后将保留已导入文件…',processed:1000,total:1000}:{message:'导入完成：新增 1000 份文件',done:true};if(stage!=='done'){options.cancelId='demo-cancel';options.cancel=()=>{stop();render({message:'已取消，已导入文件已保留；可在文件管理点击“扫描”补扫',done:true});};}render(options);}
document.querySelectorAll('[data-stage]').forEach(n=>n.onclick=()=>{stop();show(n.dataset.stage);});document.getElementById('play').onclick=()=>{stop();show('check');let tick=0;timer=setInterval(()=>{tick++;if(tick<3)show('check');else if(tick<13)show('prepare',(tick-3)*100);else if(tick<16)show('commit');else{stop();show('done');}},600);};show('prepare');
</script></body></html>
