name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: 1.98.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR quality and runtime tests
    runs-on: ubuntu-24.04
    timeout-minutes: 28

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The full quality gate compiles and tests the Tauri crate on Linux.
      # Keep these in sync with Tauri's Ubuntu 24.04 prerequisites instead of
      # relying on the hosted runner image to provide GTK/GLib transitively.
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/debug/.fingerprint
            src-tauri/target/debug/build
            src-tauri/target/debug/deps
            src-tauri/target/debug/incremental
            src-tauri/target/release/.fingerprint
            src-tauri/target/release/build
            src-tauri/target/release/deps
            src-tauri/target/release/incremental
          key: ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      - name: Run local-equivalent quality gate
        run: npm run check:ci

  macos-compile:
    name: PR macOS release compile
    runs-on: macos-15
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release/.fingerprint
            src-tauri/target/release/build
            src-tauri/target/release/deps
            src-tauri/target/release/incremental
          key: ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      - name: Compile macOS release binaries
        run: cargo check --release --manifest-path src-tauri/Cargo.toml --bins

  windows-probe-build:
    name: Build Windows protocol probe
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "1"
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Restore Rust build cache
        id: windows-rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release/.fingerprint
            src-tauri/target/release/build
            src-tauri/target/release/deps
            src-tauri/target/release/incremental
          key: ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock') }}-native-probe-v1
          restore-keys: |
            ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      - name: Prepare frontend and lightweight resources
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build:frontend
          npm run prepare:publishing-runtime

      - name: Build protocol probe from fresh app assets
        shell: bash
        run: |
          set -euo pipefail
          cargo clean --release --manifest-path src-tauri/Cargo.toml --package nutbook-backend
          cargo build --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml --example content_protocol_probe

      - name: Stage and hash Windows protocol probe
        run: node scripts/windows-ci-artifact.mjs stage probe "$env:RUNNER_TEMP/windows-probe"

      - name: Upload Windows protocol probe
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-probe-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-probe
          if-no-files-found: error
          retention-days: 7

      - name: Keep Windows build intermediates
        if: always() && steps.windows-rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release/.fingerprint
            src-tauri/target/release/build
            src-tauri/target/release/deps
            src-tauri/target/release/incremental
          key: ${{ steps.windows-rust-cache.outputs.cache-primary-key }}

  windows-probe:
    name: Windows native protocol lifetime and compatibility
    needs: windows-probe-build
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download this run's Windows probe
        if: needs.windows-probe-build.outputs.artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.windows-probe-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/windows-probe

      - name: Verify Windows probe revision and bytes
        run: node scripts/windows-ci-artifact.mjs verify probe "$env:RUNNER_TEMP/windows-probe"

      - name: Native protocol lifetime and compatibility gate
        timeout-minutes: 2
        env:
          NUTBOOK_PROTOCOL_PROBE_BIN: ${{ runner.temp }}/windows-probe/content_protocol_probe.exe
          NUTBOOK_SMOKE_REPORT: windows-smoke-report
        run: node scripts/test-content-resource-native.mjs --release --no-build

      - name: Preserve native protocol evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-protocol-evidence-${{ github.run_attempt }}
          path: windows-smoke-report/
          if-no-files-found: warn
          retention-days: 7

  windows-app-build:
    name: Build Windows application and check native resources
    needs: windows-probe
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "1"
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Restore Rust build cache
        id: windows-rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release/.fingerprint
            src-tauri/target/release/build
            src-tauri/target/release/deps
            src-tauri/target/release/incremental
          key: ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock') }}-native-v2
          restore-keys: |
            ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      - name: Prepare frontend and lightweight resources
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build:frontend
          npm run prepare:publishing-runtime

      - name: Windows native resource contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windows-smoke-report
          # Discard stale generated app assets while retaining dependency caches.
          cargo clean --release --manifest-path src-tauri/Cargo.toml --package nutbook-backend
          rustc -Vv > windows-smoke-report/toolchain.txt
          node scripts/test-windows-resource-identity.mjs
          node scripts/test-windows-history-resource-paths.mjs
          node scripts/test-windows-preview-adapter.mjs
          cargo test --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml --lib markdown_ref::tests -- --test-threads=1
          cargo test --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml --lib preview_resource_resolution -- --test-threads=1
          cargo test --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml --lib content_resource:: -- --test-threads=1
          cargo test --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml --lib resource_capture_url_roundtrip_identity -- --test-threads=1
          cargo test --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml --lib compact_preview_resources_fit_windows_path_budget -- --test-threads=1
          cargo test --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml --lib capture_authority_survives_port_reuse -- --test-threads=1
          cargo test --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml --lib windows_cli_alias_and_gui_images_are_rejected -- --test-threads=1
          cargo test --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml --lib windows_html_export_all_formats_smoke -- --ignored --test-threads=1
          cargo test --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml --lib exports_native_charts_with_editable_data -- --ignored --test-threads=1

      - name: Build Windows application once without installer
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --features tauri/custom-protocol,tauri/test --manifest-path src-tauri/Cargo.toml --bin NUTBOOK --bin nutbook-cli-bin

      - name: Stage and hash Windows application
        run: node scripts/windows-ci-artifact.mjs stage app "$env:RUNNER_TEMP/windows-app"

      - name: Upload Windows application
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-app
          if-no-files-found: error
          retention-days: 7

      - name: Capture native loader evidence on failure
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force windows-smoke-report | Out-Null
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $executables = @(Get-ChildItem src-tauri/target/release/deps/nutbook_backend-*.exe -ErrorAction SilentlyContinue) + @(Get-Item src-tauri/target/release/NUTBOOK.exe -ErrorAction SilentlyContinue) + @(Get-Item src-tauri/target/release/examples/content_protocol_probe.exe -ErrorAction SilentlyContinue)
          foreach ($exe in ($executables | Select-Object -First 4)) {
            if ($mt) { & $mt.FullName -nologo "-inputresource:$($exe.FullName);#1" "-out:windows-smoke-report/$($exe.BaseName).manifest" 2>&1 | Out-File "windows-smoke-report/$($exe.BaseName)-manifest.log" }
          }
          Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-30)} -MaxEvents 20 -ErrorAction SilentlyContinue | Select-Object TimeCreated,Id,ProviderName,Message | ConvertTo-Json -Depth 3 | Out-File windows-smoke-report/windows-events.json

      - name: Preserve Windows build failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-evidence-${{ github.run_attempt }}
          path: windows-smoke-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Keep Windows build intermediates
        if: always() && steps.windows-rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release/.fingerprint
            src-tauri/target/release/build
            src-tauri/target/release/deps
            src-tauri/target/release/incremental
          key: ${{ steps.windows-rust-cache.outputs.cache-primary-key }}

  windows-runtime:
    name: Windows native desktop smoke
    needs: windows-app-build
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download this run's Windows app
        if: needs.windows-app-build.outputs.artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.windows-app-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/windows-app

      - name: Verify Windows app revision and bytes
        run: node scripts/windows-ci-artifact.mjs verify app "$env:RUNNER_TEMP/windows-app"

      - name: Setup native WebView2 driver
        shell: pwsh
        run: ./scripts/setup-windows-webdriver.ps1

      - name: Actual Windows application smoke
        timeout-minutes: 5
        env:
          NUTBOOK_SMOKE_APP: ${{ runner.temp }}/windows-app/NUTBOOK.exe
          NUTBOOK_SMOKE_REPORT: windows-smoke-report
        run: node scripts/windows-runtime-smoke.mjs

      - name: Preserve bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-runtime-evidence-${{ github.run_attempt }}
          path: windows-smoke-report/
          if-no-files-found: warn
          retention-days: 7

  windows-compile:
    # Preserve the required context and require every Windows stage.
    name: PR Windows release compile
    if: always()
    needs: [windows-probe-build, windows-probe, windows-app-build, windows-runtime]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Windows stage to succeed
        env:
          PROBE_BUILD: ${{ needs.windows-probe-build.result }}
          PROBE: ${{ needs.windows-probe.result }}
          APP_BUILD: ${{ needs.windows-app-build.result }}
          RUNTIME: ${{ needs.windows-runtime.result }}
        run: |
          test "$PROBE_BUILD" = success
          test "$PROBE" = success
          test "$APP_BUILD" = success
          test "$RUNTIME" = success

  cross-platform-gate:
    name: Cross-platform Gate
    if: always()
    needs: [quality, macos-compile, windows-compile]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every planned platform to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          MACOS: ${{ needs.macos-compile.result }}
          WINDOWS: ${{ needs.windows-compile.result }}
        run: |
          test "$QUALITY" = success
          test "$MACOS" = success
          test "$WINDOWS" = success
