name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and runtime tests
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build frontend
        run: npm run build:frontend

      - name: Check frontend
        run: npm run check:frontend

      - name: Check localization
        run: npm run check:i18n

      - name: Run frontend and runtime regressions
        run: npm run check:regressions

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture

      - name: Run HTML edit integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --test html_edit -- --nocapture

  windows-check:
    name: Windows compile check
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml
