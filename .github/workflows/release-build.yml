name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing, immutable version tag to build into a draft Release (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  TAURI_CLI_VERSION: 2.11.2
  RUST_VERSION: 1.98.0

jobs:
  prepare-release:
    name: Verify immutable release candidate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Require the exact successful release preflight
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' <<<"$tag"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          commit="$(git rev-list -n 1 "$tag")"
          test "$(git rev-parse HEAD)" = "$commit"

          runs="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-preflight.yml/runs?event=workflow_dispatch&status=completed&per_page=100")"
          run="$(jq -cer --arg commit "$commit" '
            [.[].workflow_runs[]?
             | select(.event == "workflow_dispatch" and .head_sha == $commit and .conclusion == "success")]
            | if length == 0 then error("no successful Release preflight exists for the tagged commit")
              else max_by(.created_at)
              end
          ' <<<"$runs")"
          run_id="$(jq -r .id <<<"$run")"
          jobs="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          for required_job in \
            "Release preflight / Windows package inputs" \
            "Release preflight / macOS release compile"; do
            jq -e --arg name "$required_job" '
              [.[].jobs[]? | select(.name == $name and .status == "completed" and .conclusion == "success")]
              | length == 1
            ' <<<"$jobs" >/dev/null || {
              printf 'Release preflight run %s did not successfully complete required job: %s\n' "$run_id" "$required_job" >&2
              exit 1
            }
          done
          printf 'commit=%s\npreflight_run=%s\n' "$commit" "$run_id" >> "$GITHUB_OUTPUT"

      - name: Confirm tag and package versions agree
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.gate.outputs.commit }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(awk -F'\"' '/^version = / { print $2; exit }' src-tauri/Cargo.toml)"
          test "${tag#v}" = "$tauri_version"
          test "$tauri_version" = "$cargo_version"
          if gh release view "$tag" --json isDraft,assets >/tmp/release.json; then
            test "$(jq -r .isDraft /tmp/release.json)" = "true"
            test "$(jq '.assets | length' /tmp/release.json)" -eq 0 || {
              printf '%s\n' "Refusing to mix a new build with assets already attached to this draft Release." >&2
              exit 1
            }
          else
            gh release create "$tag" --draft --title "$tag" --generate-notes
          fi
          printf 'tag=%s\ncommit=%s\n' "$tag" "$COMMIT" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            artifact-name: verified-macos-intel
            asset-suffix: _x64.dmg
            source-glob: src-tauri/target/release/bundle/dmg/*.dmg
            expected-architecture: x86_64
            runner: macos-15-intel
            args: --bundles dmg
          - label: macOS Apple Silicon
            artifact-name: verified-macos-arm
            asset-suffix: _aarch64.dmg
            source-glob: src-tauri/target/release/bundle/dmg/*.dmg
            expected-architecture: arm64
            runner: macos-14
            args: --bundles dmg
          - label: Windows
            artifact-name: verified-windows
            asset-suffix: _x64-setup.exe
            source-glob: src-tauri/target/release/bundle/nsis/*.exe
            runner: windows-latest
            args: --bundles nsis

    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Assert checked-out commit is preflighted commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare-release.outputs.commit }}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Restore Rust build cache shared with release preflight
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release/.fingerprint
            src-tauri/target/release/build
            src-tauri/target/release/deps
            src-tauri/target/release/incremental
          key: release-rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            release-rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      - name: Restore pinned Tauri CLI cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nutbook-tauri-cli
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.TAURI_CLI_VERSION }}

      - name: Remove cached release outputs before packaging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src-tauri/target/release/bundle src-tauri/generated-resources/nutbook-cli release
          test ! -e src-tauri/target/release/bundle
          test ! -e src-tauri/generated-resources/nutbook-cli

      - name: Install frontend dependencies
        run: npm ci

      - name: Install exact Tauri CLI when absent
        shell: bash
        env:
          TAURI_CLI_ROOT: ${{ runner.temp }}/nutbook-tauri-cli
        run: |
          set -euo pipefail
          cli="$TAURI_CLI_ROOT/bin/cargo-tauri"
          if [ ! -x "$cli" ]; then
            cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked --root "$TAURI_CLI_ROOT"
          fi
          "$cli" --version | grep -F "tauri-cli $TAURI_CLI_VERSION"
          printf '%s/bin\n' "$TAURI_CLI_ROOT" >> "$GITHUB_PATH"

      - name: Build package without publishing it
        run: cargo tauri build ${{ matrix.args }}

      - name: Verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#dmg_files[@]}" -eq 1
          hdiutil verify "${dmg_files[0]}"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/nutbook-dmg.XXXXXX")"
          cleanup() { hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmg_files[0]}"
          app_path="$mount_dir/NUTBOOK.app"
          binary_path="$app_path/Contents/MacOS/NUTBOOK"
          test -d "$app_path"
          test -x "$binary_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          signature_info="$(codesign -dvv "$app_path" 2>&1)"
          grep -q '^Signature=adhoc$' <<<"$signature_info"
          file "$binary_path" | grep -q '${{ matrix.expected-architecture }}'

      - name: Stage installer and checksum
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(${{ matrix.source-glob }})
          test "${#sources[@]}" -eq 1
          mkdir -p release
          asset_name="NUTBOOK_${RELEASE_TAG#v}${{ matrix.asset-suffix }}"
          asset="release/$asset_name"
          cp "${sources[0]}" "$asset"
          test -s "$asset"
          shasum -a 256 "$asset" | awk '{print tolower($1)}' > "$asset.sha256"
          grep -Eq '^[0-9a-f]{64}$' "$asset.sha256"

      - name: Upload verified package for the single release uploader
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      # actions/cache saves at job teardown.  Never allow it to save installers
      # or a generated platform CLI that could belong to a different tag.
      - name: Remove release outputs before cache save
        if: always()
        shell: bash
        run: rm -rf src-tauri/target/release/bundle src-tauri/generated-resources/nutbook-cli release

  finalize-release:
    name: Verify and upload draft Release
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all verified packages
        uses: actions/download-artifact@v7
        with:
          pattern: verified-*
          merge-multiple: true
          path: release

      - name: Verify exact package bytes and upload once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          expected=(
            "NUTBOOK_${version}_x64.dmg"
            "NUTBOOK_${version}_aarch64.dmg"
            "NUTBOOK_${version}_x64-setup.exe"
          )
          for asset in "${expected[@]}"; do
            test -s "release/$asset"
            test -s "release/$asset.sha256"
            expected_checksum="$(tr -d '[:space:]' < "release/$asset.sha256")"
            actual_checksum="$(shasum -a 256 "release/$asset" | awk '{print tolower($1)}')"
            test "$expected_checksum" = "$actual_checksum"
          done
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" -eq 6
          gh release upload "$TAG" release/* --clobber

      - name: Re-download published draft assets and verify bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download "$TAG" --dir downloaded --clobber
          for checksum_file in release/*.sha256; do
            asset_name="$(basename "${checksum_file%.sha256}")"
            expected_checksum="$(tr -d '[:space:]' < "$checksum_file")"
            actual_checksum="$(shasum -a 256 "downloaded/$asset_name" | awk '{print tolower($1)}')"
            test "$expected_checksum" = "$actual_checksum"
          done
