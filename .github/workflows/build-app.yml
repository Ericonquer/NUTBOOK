name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build into a verified draft Release (for example v0.9.1)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  checks: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare-release:
    name: Prepare draft Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Require successful CI checks for tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          test "${tag#v}" != "$tag"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          commit="$(git rev-list -n 1 "$tag")"
          checks="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/commits/${commit}/check-runs?per_page=100")"
          for required_check in "Quality and runtime tests" "Windows compile check"; do
            check="$(jq -cer --arg name "$required_check" '
              [.[].check_runs[]? | select(.name == $name)]
              | if length == 0 then error("missing required CI check: \($name)")
                else max_by(.completed_at // .started_at // .created_at // "")
                end
            ' <<<"$checks")"
            status="$(jq -r .status <<<"$check")"
            conclusion="$(jq -r .conclusion <<<"$check")"
            if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
              printf 'Required CI check "%s" for %s is %s/%s; draft Release will not be created.\n' \
                "$required_check" "$commit" "$status" "$conclusion" >&2
              exit 1
            fi
          done

      - name: Confirm tag and package versions agree
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          test "${tag#v}" != "$tag"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(awk -F'"' '/^version = / { print $2; exit }' src-tauri/Cargo.toml)"
          test "${tag#v}" = "$tauri_version"
          test "$tauri_version" = "$cargo_version"
          if gh release view "$tag" --json isDraft --jq .isDraft >/tmp/is-draft; then
            test "$(cat /tmp/is-draft)" = "true"
          else
            gh release create "$tag" --draft --title "$tag" --generate-notes
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            asset-suffix: _x64.dmg
            source-glob: src-tauri/target/release/bundle/dmg/*.dmg
            expected-architecture: x86_64
            runner: macos-15-intel
            args: --bundles dmg
          - label: macOS Apple Silicon
            asset-suffix: _aarch64.dmg
            source-glob: src-tauri/target/release/bundle/dmg/*.dmg
            expected-architecture: arm64
            runner: macos-14
            args: --bundles dmg
          - label: Windows
            asset-suffix: _x64-setup.exe
            source-glob: src-tauri/target/release/bundle/nsis/*.exe
            runner: windows-latest
            args: --bundles nsis

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build package without publishing it
        run: cargo tauri build ${{ matrix.args }}

      - name: Verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#dmg_files[@]}" -eq 1
          hdiutil verify "${dmg_files[0]}"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/nutbook-dmg.XXXXXX")"
          cleanup() { hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmg_files[0]}"
          app_path="$mount_dir/NUTBOOK.app"
          binary_path="$app_path/Contents/MacOS/NUTBOOK"
          test -d "$app_path"
          test -x "$binary_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          signature_info="$(codesign -dvv "$app_path" 2>&1)"
          grep -q '^Signature=adhoc$' <<<"$signature_info"
          file "$binary_path" | grep -q '${{ matrix.expected-architecture }}'

      - name: Stage installer and checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(${{ matrix.source-glob }})
          test "${#sources[@]}" -eq 1
          mkdir -p release
          asset_name="NUTBOOK_${RELEASE_TAG#v}${{ matrix.asset-suffix }}"
          asset="release/$asset_name"
          cp "${sources[0]}" "$asset"
          test -s "$asset"
          shasum -a 256 "$asset" | awk '{print tolower($1)}' > "$asset.sha256"
          grep -Eq '^[0-9a-f]{64}$' "$asset.sha256"
          printf 'asset_name=%s\n' "$asset_name" >> "$GITHUB_OUTPUT"
        id: stage

      - name: Upload verified assets to draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.prepare-release.outputs.tag }}" "release/${{ steps.stage.outputs.asset_name }}" "release/${{ steps.stage.outputs.asset_name }}.sha256" --clobber

      - name: Keep CI copy
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}-verified-package
          path: release/
          if-no-files-found: error
          compression-level: 0

  finalize-release:
    name: Verify draft Release inventory
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Assert complete draft inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          expected=(
            "NUTBOOK_${version}_x64.dmg"
            "NUTBOOK_${version}_aarch64.dmg"
            "NUTBOOK_${version}_x64-setup.exe"
          )
          release="$(gh release view "$TAG" --json isDraft,isPrerelease,assets)"
          test "$(jq -r .isDraft <<<"$release")" = "true"
          test "$(jq -r .isPrerelease <<<"$release")" = "false"
          for asset in "${expected[@]}"; do
            entry="$(jq -cer --arg name "$asset" '[.assets[] | select(.name == $name)] | if length == 1 then .[0] else error("missing or duplicate asset") end' <<<"$release")"
            test "$(jq -r .size <<<"$entry")" -gt 0
            checksum="${asset}.sha256"
            checksum_entry="$(jq -cer --arg name "$checksum" '[.assets[] | select(.name == $name)] | if length == 1 then .[0] else error("missing or duplicate checksum") end' <<<"$release")"
            test "$(jq -r .size <<<"$checksum_entry")" -gt 0
            mkdir -p checksums
            gh release download "$TAG" --pattern "$checksum" --dir checksums --clobber
            grep -Eq '^[0-9a-f]{64}$' "checksums/$checksum"
          done
          test "$(jq '.assets | length' <<<"$release")" -eq 6
