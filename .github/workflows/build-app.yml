name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            artifact-name: NUTBOOK-macos-intel
            runner: macos-15-intel
            args: --bundles dmg
          - label: macOS Apple Silicon
            artifact-name: NUTBOOK-macos-apple-silicon
            runner: macos-14
            args: --bundles dmg
          - label: Windows
            artifact-name: NUTBOOK-windows
            runner: windows-latest
            args: --bundles nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri package
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ${{ matrix.artifact-name }}-[bundle]
