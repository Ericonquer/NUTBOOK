      }
      shadow.querySelector("[data-color-mode]").onchange = (event) => {
        if (!action() || flushPending({ endInteraction: true }) === false) return;

      };

      const handle = shadow.querySelector("[data-drag-handle]");

          generation++;

      seek: async (time) => {

      },
      getConfig: () => structuredClone(config),
      canvas,
      fullscreenChanged(enabled) {

      },
      isPanelOpen: () => Boolean(panel?.isConnected),
      togglePanel() {

        }

        cleanupInteraction = () => {
        };

        panel.remove();
        panel = null;
        shadow = null;
        flushPending = () => {
        };
        return false;
      },
      setEditMode(enabled) {
        if (clock.state().disposed) return false;
        cleanupInteraction();
        cleanupInteraction = () => {
        };

        };

        staticView();

      cancelMeasurement: () => {

      measurementState: () => measurement.state(),
      dispose() {

        cleanupInteraction();
        staticView();

        measurement.dispose();

        panel?.remove();
