  <script>
    // Embedded into each standalone presentation. Navigation remains owned by the deck.
window.createNutbookPresentationBridge = function createNutbookPresentationBridge(adapter) {
  const pages = adapter.pages.map((page, index) => ({ ...page, index: index + 1 }));
  const ids = new Set(pages.map((page) => page.id));
  if (!pages.length || ids.size !== pages.length || pages.some((page) => !page.id)) {
    throw new Error("Presentation pages need unique, non-empty IDs");
  }
  return {
    version: 1,
    capabilities: { managedPresenter: true },
    pages,
    get activePageId() { return adapter.activePageId(); },
    whenReady() { return Promise.resolve(adapter.whenReady?.() ?? true); },
    goTo(id) { return ids.has(id) ? adapter.goTo(id) : false; },
    subscribe(listener) { return adapter.subscribe(listener); },
    setManagedMode(enabled) { return adapter.setManagedMode(Boolean(enabled)); },
    setEditMode(enabled) { return adapter.setEditMode?.(Boolean(enabled)) ?? true; }
  };
};

  </script>
  <script>
    (() => {
      const slides = [...document.querySelectorAll(".slide")];
      const counter = document.querySelector("[data-counter]");
      const controls = document.querySelector("[data-presentation-controls]");
      const subscribers = new Set();
      let editMode = false;
      let managedMode = false;
      let index = Math.max(0, slides.findIndex((slide) => slide.classList.contains("is-active")));
      function isEditableTarget(target) {
        return Boolean(target?.closest?.("input, textarea, select, [contenteditable='true']"));
      }
      const reducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)");
      function fragments(slide) { return [...(slide?.querySelectorAll?.(".fragment") ?? [])]; }
      function resetFragments(slide, showAll = false) {
        const items = fragments(slide);
        if (!items.length || reducedMotion?.matches) return;
        items.forEach((item, itemIndex) => item.classList.toggle("is-fragment-visible", showAll || itemIndex === 0));
      }
      function revealNext() {
        const items = fragments(slides[index]);
        if (!items.length || reducedMotion?.matches) return false;
        const hidden = items.find((item) => !item.classList.contains("is-fragment-visible"));
        if (!hidden) return false;
        hidden.classList.add("is-fragment-visible");
        return true;
      }
      function revealPrevious() {
        const items = fragments(slides[index]);
        if (!items.length || reducedMotion?.matches) return false;
        const visible = items.filter((item) => item.classList.contains("is-fragment-visible"));
        if (visible.length <= 1) return false;
        visible.at(-1)?.classList.remove("is-fragment-visible");
        return true;
      }
      function show(next, restoreFragments = false) {
        index = Math.max(0, Math.min(slides.length - 1, next));
        slides.forEach((slide, i) => slide.classList.toggle("is-active", i === index));
        if (counter) counter.textContent = `${index + 1} / ${slides.length}`;
        const activeSlide = slides[index];
        resetFragments(activeSlide, restoreFragments);
        window.NutbookPresentationMotion?.sync?.(activeSlide);
        window.NutbookPresentationMotion?.replay?.(activeSlide);
        const pageId = activeSlide?.dataset.nutbookPageId;
        if (pageId) subscribers.forEach((listener) => listener(pageId));
      }
      function next() { if (!editMode && !revealNext()) show(index + 1); }
      function previous() { if (!editMode && !revealPrevious()) show(index - 1, true); }
      document.querySelector("[data-prev]")?.addEventListener("click", previous);
      document.querySelector("[data-next]")?.addEventListener("click", next);
      document.querySelector("[data-fullscreen]")?.addEventListener("click", () => {
        if (typeof window.__NUTBOOK_REQUEST_HOST_FULLSCREEN__ === "function") {
          window.__NUTBOOK_REQUEST_HOST_FULLSCREEN__();
          return;
        }
        const target = document.documentElement;
        if (document.fullscreenElement) document.exitFullscreen?.();
        else target.requestFullscreen?.();
      });
      window.addEventListener("keydown", (event) => {
        if (editMode || managedMode || event.isComposing || event.defaultPrevented || isEditableTarget(event.target)) return;
        if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
          event.preventDefault();
          next();
        }
        if (event.key === "ArrowLeft" || event.key === "PageUp") {
          event.preventDefault();
          previous();
        }
        if (event.key.toLowerCase() === "f") document.querySelector("[data-fullscreen]")?.click();
      });
      window.__NUTBOOK_PRESENTATION__ = window.createNutbookPresentationBridge({
        pages: slides.map((slide) => ({
          id: slide.dataset.nutbookPageId,
          title: slide.dataset.title || "",
          kind: slide.dataset.slideKind || ""
        })),
        activePageId: () => slides[index]?.dataset.nutbookPageId || "",
        goTo(pageId) {
          const nextIndex = slides.findIndex((slide) => slide.dataset.nutbookPageId === pageId);
          if (nextIndex < 0) return false;
          show(nextIndex);
          return true;
        },
        subscribe(listener) {
          if (typeof listener !== "function") return () => {};
          subscribers.add(listener);
          return () => subscribers.delete(listener);
        },
        setManagedMode(enabled) {
