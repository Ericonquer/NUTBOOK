<!doctype html>
<html lang="zh-CN" data-nutbook-edit-contract="nutbook-html/v1" data-nutbook-artifact-kind="presentation">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>演示稿示例</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f9f9fb;
      --ink: #1a1c1d;
      --secondary: #4c4546;
      --line: #e2e2e4;
      --bar: #7e7576;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--paper); color: var(--ink); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { overflow: hidden; }
    .slide { display: none; width: 100vw; height: 100vh; padding: 8vh 8vw; align-items: center; justify-content: space-between; gap: 5vw; }
    .slide.active { display: flex; }
    .copy { max-width: 64vw; }
    h1 { margin: 0 0 .35em; font-size: clamp(32px, 6vw, 96px); font-weight: 700; letter-spacing: -.02em; line-height: 1.12; }
    p { margin: 0; font-size: clamp(16px, 2.35vw, 36px); line-height: 1.5; color: var(--secondary); }
    img { width: 25vw; max-height: 45vh; object-fit: contain; }
    .example-columns { display: flex; align-items: end; gap: 2vw; flex: 0 1 36vw; min-width: 0; margin: 0; padding: 0 1vw 2em; height: 38vh; background: linear-gradient(var(--line), var(--line)) bottom 2em center / 100% 1px no-repeat; }
    .example-columns > span { flex: 1; position: relative; border-radius: 4px 4px 0 0; background: var(--bar); }
    .example-columns > span:last-child { background: var(--ink); }
    .example-columns > span::after { content: attr(data-label); position: absolute; top: calc(100% + .6em); width: 100%; text-align: center; white-space: nowrap; color: var(--secondary); font-size: clamp(11px, 1.25vw, 22px); }
    .slide.active .rise { animation: rise .7s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: none; } }
    .page-count { position: fixed; right: 24px; bottom: 24px; color: var(--secondary); font-size: 14px; font-variant-numeric: tabular-nums; pointer-events: none; user-select: none; }
    .page-count::before { content: attr(data-page-count); }
    .page-count[hidden] { display: none; }
  </style>
</head>
<body>
  <section class="slide active" data-nutbook-page-id="opening">
    <div class="copy rise"><h1 data-id="opening-title" data-editable="text">演示稿标题</h1><p data-id="opening-copy" data-editable="text">简述核心观点</p></div>
    <img data-id="opening-image" data-editable="image" src="./presentation-mark.svg" alt="演示插图">
  </section>
  <section class="slide" data-nutbook-page-id="evidence">
    <div class="copy rise"><h1 data-id="evidence-title" data-editable="text">季度订单</h1><p data-id="evidence-copy" data-editable="text">三季度订单是第一季度的两倍。</p></div>
    <figure class="example-columns" role="img" data-nutbook-chart='{"kind":"bar","categories":["一季度","二季度","三季度"],"series":[{"name":"订单","values":[12,18,24]}]}'></figure>
  </section>
  <section class="slide" data-nutbook-page-id="finish">
    <div class="copy rise"><h1 data-id="finish-title" data-editable="text">结论</h1><p data-id="finish-copy" data-editable="text">让观众带走清晰的下一步</p></div>
  </section>
  <div class="page-count" role="status" aria-live="polite" data-page-count=""></div>
  <script type="application/json" id="nutbook-presentation-notes">{"version":1,"pages":{"opening":[{"type":"paragraph","runs":[{"text":"开场备注"}]}],"evidence":[{"type":"paragraph","runs":[{"text":"说明关键证据"}]}],"finish":[{"type":"paragraph","runs":[{"text":"结束语"}]}]}}</script>
  <script>
    document.querySelectorAll(".example-columns").forEach(chart => {
      const { categories, series: [series] } = JSON.parse(chart.dataset.nutbookChart);
      const max = Math.max(...series.values, 1);
      chart.setAttribute("aria-label", series.name + " · " + categories.map((label, index) => label + " " + series.values[index]).join("，"));
      chart.replaceChildren(...categories.map((label, index) => {
        const bar = document.createElement("span");
        bar.dataset.label = label;
        bar.style.height = (series.values[index] / max * 100) + "%";
        return bar;
      }));
    });
  </script>
  <script>
{{presentation_bridge_script}}
  </script>
  <script>
    (() => {
      const slides = [...document.querySelectorAll(".slide")];
      const subscribers = new Set();
      const pageCount = document.querySelector(".page-count");
      let index = 0;
      let managed = false;
      let editing = false;
      function updatePageCount() {
        pageCount.dataset.pageCount = `${index + 1} / ${slides.length}`;
        pageCount.setAttribute("aria-label", `第 ${index + 1} 页，共 ${slides.length} 页`);
      }
      updatePageCount();
      function goTo(id) {
        const next = slides.findIndex(slide => slide.dataset.nutbookPageId === id);
        if (next < 0) return false;
        if (next === index) return true;
        index = next;
        slides.forEach((slide, at) => slide.classList.toggle("active", at === index));
        updatePageCount();
        subscribers.forEach(listener => listener(id));
        return true;
      }
      window.__NUTBOOK_PRESENTATION__ = window.createNutbookPresentationBridge({
        pages: slides.map(slide => ({ id: slide.dataset.nutbookPageId, title: slide.querySelector("h1")?.textContent || "" })),
        activePageId: () => slides[index].dataset.nutbookPageId,
        goTo,
        subscribe(listener) { if (typeof listener !== "function") return () => {}; subscribers.add(listener); return () => subscribers.delete(listener); },
        setManagedMode(enabled) { managed = enabled; document.documentElement.dataset.nutbookManagedPresentation = String(enabled); pageCount.hidden = enabled || editing; return true; },
        setEditMode(enabled) { editing = enabled; pageCount.hidden = enabled || managed; return true; }
      });
      window.addEventListener("keydown", event => {
        if (managed || editing || event.defaultPrevented || event.isComposing || event.target?.closest?.("input,textarea,select,[contenteditable='true']")) return;
        const next = ["ArrowRight", "PageDown", " "].includes(event.key) ? index + 1 : ["ArrowLeft", "PageUp"].includes(event.key) ? index - 1 : null;
        if (next == null) return;
        event.preventDefault();
        goTo(slides[Math.max(0, Math.min(slides.length - 1, next))].dataset.nutbookPageId);
      });
    })();
  </script>
</body>
</html>
