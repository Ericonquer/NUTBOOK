<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nutbook HTML Edit Toolbar</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: min(252px, calc(100vw - 8px));
      height: 44px;
      padding: 0 8px 0 12px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.07);
      box-sizing: border-box;
      pointer-events: auto;
    }

    .status {
      min-width: 0;
      flex: 1 1 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      color: #6b6b6b;
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      letter-spacing: 0;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .status::before {
      content: "";
      flex: 0 0 auto;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #b8b8b8;
    }

    .status.dirty {
      color: #000000;
    }

    .status.dirty::before {
      background: #000000;
    }

    .actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    button {
      height: 30px;
      border: 0;
      border-radius: 8px;
      padding: 0 10px;
      background: #ededed;
      color: #000000;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      line-height: 30px;
      letter-spacing: 0;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover,
    button:focus-visible {
      background: #e2e2e2;
      outline: none;
    }

    button.primary {
      background: #000000;
      color: #fff;
    }

    button.primary:hover,
    button.primary:focus-visible {
      background: #252525;
    }
  </style>
</head>
<body>
  <div class="toolbar" role="toolbar" aria-label="HTML 编辑工具台">
    <div id="status" class="status" aria-live="polite">已保存</div>
    <div class="actions">
      <button id="saveButton" class="primary" type="button" aria-label="保存">保存</button>
      <button id="doneButton" type="button" aria-label="完成">完成</button>
    </div>
  </div>

  <script src="./i18n.js?v=20260525-update-check"></script>
  <script>
    const i18n = window.NutbookI18n;
    const t = (key, fallback) => i18n?.lookup(key) ?? fallback;
    const state = {
      itemId: null,
      dirty: false
    };
    const els = {
      status: document.getElementById("status"),
      saveButton: document.getElementById("saveButton"),
      doneButton: document.getElementById("doneButton")
    };

    function apply(next) {
      if (!next) return;
      if (Object.prototype.hasOwnProperty.call(next, "itemId")) state.itemId = next.itemId;
      if (Object.prototype.hasOwnProperty.call(next, "dirty")) state.dirty = Boolean(next.dirty);
      render();
    }

    function render() {
      const statusText = state.dirty ? t("htmlEdit.unsaved", "未保存") : t("htmlEdit.saved", "已保存");
      els.status.textContent = statusText;
      els.status.classList.toggle("dirty", state.dirty);
      const saveLabel = t("htmlEdit.save", "保存");
      const doneLabel = t("htmlEdit.done", "完成");
      els.saveButton.textContent = saveLabel;
      els.saveButton.setAttribute("aria-label", saveLabel);
      els.saveButton.setAttribute("title", saveLabel);
      els.doneButton.textContent = doneLabel;
      els.doneButton.setAttribute("aria-label", doneLabel);
      els.doneButton.setAttribute("title", doneLabel);
      i18n?.apply?.(document);
    }

    function emit(action) {
      const payload = { action };
      if (state.itemId != null) payload.itemId = state.itemId;
      const nextTitle = "__NUTBOOK_HTML_EDIT_TOOLBAR__:" + JSON.stringify(payload);
      document.title = "Nutbook HTML Edit Toolbar";
      setTimeout(function() {
        document.title = nextTitle;
      }, 16);
      setTimeout(function() {
        if (document.title === nextTitle) document.title = "Nutbook HTML Edit Toolbar";
      }, 96);
    }

    els.saveButton.addEventListener("click", function() {
      emit("save");
    });
    els.doneButton.addEventListener("click", function() {
      emit("done");
    });

    window.__NUTBOOK_HTML_EDIT_TOOLBAR_UPDATE__ = apply;

    apply(window.__NUTBOOK_HTML_EDIT_TOOLBAR__ || {});
    i18n?.observe?.();
  </script>
</body>
</html>
