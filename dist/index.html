          captureActiveMarkdownScroll();
          appState.homeTabOpen = true;
          appState.activeTabId = null;
          appState.isEditing = false;
          await scheduleRuntimeCleanupAfterTabSwitch(previousTabId, null);
          renderTabs();
          renderViewer();
        });

        els.tabsWrap.querySelector("[data-close-home-tab]")?.addEventListener("click", (event) => {
          event.stopPropagation();
          appState.homeTabOpen = false;
          if (appState.activeTabId === null) {
            appState.activeTabId = getOpenTabs()[0]?.id ?? null;
          }
          appState.isEditing = false;
          renderTabs();
          renderViewer();
        });

        els.tabsWrap.querySelectorAll("[data-tab-id]").forEach((node) => {
          node.addEventListener("click", async (event) => {
            if (event.target.matches("[data-close-tab]")) return;
            const tabId = Number(node.dataset.tabId);
            const previousTabId = appState.activeTabId;
            if (tabId === previousTabId) return;
            if (!(await confirmHtmlEditLeaveIfNeeded(previousTabId))) return;
            captureActiveMarkdownScroll();
            captureActiveMarkdownDraft();
            appState.activeTabId = tabId;
            appState.isEditing = getOpenTab(tabId)?.preview?.fileType === "markdown";
            appState.markdownEditMode = "rich";
            appState.markdownEditorShouldFocus = appState.isEditing;
            await scheduleRuntimeCleanupAfterTabSwitch(previousTabId, tabId);
            renderTabs();
            renderViewer();
            if (getOpenTab(tabId)?.preview?.fileType === "html-runtime") {
              focusMainWebviewSoon();
            }
          });
        });

        els.tabsWrap.querySelectorAll("[data-close-tab]").forEach((node) => {
          node.addEventListener("click", async (event) => {
            event.stopPropagation();
            const tabId = Number(node.dataset.closeTab);
            const closed = await closeOpenTab(tabId);
            if (!closed) return;
            appState.isEditing = getActiveTab()?.preview?.fileType === "markdown";
            if (!getActiveTab() && appState.homeTabOpen) {
              await loadItems();
            }
            renderTabs();
            renderViewer();
            if (getActiveTab()?.preview?.fileType === "html-runtime") {
              focusMainWebviewSoon();
            }
          });
        });
      }

      // A1.1 来源徽标：顺序固定为 自定义 → Project → Skill → 类型。
      // 每类来源只显示一个主名称徽标，其余同类显示独立不可收缩的 +N。
      // 非交互徽标：不使用 pointer 手型、不添加 tabindex、不伪装成按钮；
      // 完整来源名由卡片级 aria-label 承载（辅助技术），hover 由 title 显示。
      // 卡片级 aria-label：区分项目来源与 Skill 来源，列出全部完整名称。
      function itemSourceBadgesAria(item) {
        const customTags = (item.tags || []).map((tag) => tag.name).filter(Boolean);
        const projects = (item.sourceBadges || []).filter((badge) => badge.kind === "project");
        const skills = (item.sourceBadges || []).filter((badge) => badge.kind === "skill");
        const parts = [];
        if (customTags.length) parts.push(`自定义标签：${customTags.join("、")}`);
        if (projects.length) parts.push(`项目来源：${projects.map((badge) => badge.label).join("、")}`);
        if (skills.length) parts.push(`Skill 来源：${skills.map((badge) => badge.label).join("、")}`);
        return parts.join("；");
      }

      // PR C / C2：封面状态的可访问名称。本地降级（资源缺失/不合格）或在线
      // 失败时，卡片 aria-label 同步完整原因（"常态无永久错误，hover/focus 才
      // 可见警告"的视觉约定由 CSS 承担，可访问名称始终可用）。
      function coverWarningTextForItem(item) {
        const thumb = item?.thumbnail;
        if (!thumb) return "";
        if (thumb.renderKind === "markdown-image-cover" && thumb.status === "failed") {
          return thumb.errorMessage || t("markdown.coverAssetRejectedTitle");
        }
        if (thumb.renderKind === "markdown-remote-image-cover") {
          return t("status.coverRemoteLoading");
        }
        return "";
      }

      function thumbnailNode(item) {
        const pathMissing = isItemPathMissing(item);
        // 自定义标签压缩成 primary +N（与 Project/Skill 同模式）：只显示第一个主标签，
        // 其余数量折叠进不可收缩的 +N chip；tooltip 列出全部自定义标签完整名。
        const customTags = item.tags || [];
        const allCustomNames = customTags.map((tag) => tag.name).join("，");
        const customPrimary = customTags[0]
          ? `<span class="tag-chip"><span class="tag-chip-label">${escapeHtml(customTags[0].name)}</span><span class="chip-tooltip">${escapeHtml(allCustomNames)}</span></span>`
          : "";
        const customMore = customTags.length > 1
          ? `<span class="tag-chip tag-chip-more"><span class="chip-tooltip">${escapeHtml(allCustomNames)}</span>+${customTags.length - 1}</span>`
          : "";
        const projects = (item.sourceBadges || []).filter((badge) => badge.kind === "project");
        const skills = (item.sourceBadges || []).filter((badge) => badge.kind === "skill");
        // available=false：加 .source-badge--unavailable（中性降饱和 + 虚线边框），
        // 并带 aria-label 说明"来源不可用"，可访问名称仍保留完整来源名。
        const badgeClass = (badge, kindClass) => {
          const unavailable = badge.available === false;
          return `<span class="source-badge ${kindClass}${unavailable ? " source-badge--unavailable" : ""}" aria-label="${escapeAttribute(badge.label + (unavailable ? "（来源不可用）" : ""))}">`;
        };
        const projectPrimary = projects[0]
          ? `${badgeClass(projects[0], "source-badge-project")}<span class="source-badge-label">${escapeHtml(projects[0].label)}</span><span class="chip-tooltip">${escapeHtml(projects.map((p) => p.label).join("，"))}</span></span>`
          : "";
        const projectMore = projects.length > 1
          ? `<span class="source-badge source-badge-more"><span class="chip-tooltip">${escapeHtml(projects.map((p) => p.label).join("，"))}</span>+${projects.length - 1}</span>`
          : "";
        const skillPrimary = skills[0]
          ? `${badgeClass(skills[0], "source-badge-skill")}<span class="source-badge-label">${escapeHtml(skills[0].label)}</span><span class="chip-tooltip">${escapeHtml(skills.map((s) => s.label).join("，"))}</span></span>`
          : "";
        const skillMore = skills.length > 1
          ? `<span class="source-badge source-badge-more"><span class="chip-tooltip">${escapeHtml(skills.map((s) => s.label).join("，"))}</span>+${skills.length - 1}</span>`
          : "";
        const chips = [customPrimary, customMore, projectPrimary, projectMore, skillPrimary, skillMore]
          .filter(Boolean)
          .join("");
        // 无自定义标签时，让来源徽标整体靠右，与右下角类型徽标作为一个组对齐；
        // 有自定义标签时按"自定义 → Project → Skill → 类型"从左开始；
        // 无自定义时来源徽标作为一组靠右与类型徽标并齐；
        // 只有类型徽标（无来源徽标）时也右对齐，避免单 MD 标签左对齐。
        const hasSources = customPrimary || customMore || projectPrimary || projectMore || skillPrimary || skillMore;
        let rowClass = "thumb-chip-row";
        if (!hasSources) {
          rowClass = "thumb-chip-row thumb-chip-row--type-only";
        } else if (customTags.length === 0) {
          rowClass = "thumb-chip-row chip-row--align-end";
        }
        const typeChip = `<span class="thumb-badge thumb-badge-type">${escapeHtml(item.fileType === "html" ? "HTML" : "MD")}</span>`;
        const overlayRow = `<div class="${rowClass}">${chips}${typeChip}</div>`;
        const badge = `${overlayRow}`;
        const missingMask = pathMissing
          ? `<div class="thumb-missing-mask"><span class="thumb-missing-pill">文件路径失效</span></div>`
          : "";
        if (item.thumbnail?.path) {
          const thumb = item.thumbnail;
          const isRemote = thumb.renderKind === "markdown-remote-image-cover";
          const isDegradedLocal = thumb.renderKind === "markdown-image-cover" && thumb.status === "failed";
          // PR C / C2：在线封面 / 本地降级封面 —— 标题 SVG fallback 常显；
          // 远程图片仅在可见卡片 lazy 加载（no-referrer、异步解码），onload 后
          // 复核自然尺寸与 4:3..2:1 比例，合格才整体替换；加载前/离线/超时/
          // 失败/比例变化继续显示标题 SVG。警告常态隐藏，hover/focus 显示完整
          // 原因，accessible name 同步（卡片级 aria-label 由 renderItems 追加）。
          if (isRemote || isDegradedLocal) {
            const warningText = isDegradedLocal
              ? `${t("markdown.coverLocalDegradedPrefix")}${thumb.errorMessage || t("markdown.coverAssetRejectedTitle")}`
              : "";
            // accessible name 同步：记录不含警告的基础 aria（sourceAria 与
            // renderItems 同一语义），在线加载成功/失败时由控制器增删警告后缀。
            const coverSourceAria = itemSourceBadgesAria(item);
            const coverBaseAria = `${pathMissing ? `文件路径失效：${item.title || item.fileName}` : `打开 ${item.title || item.fileName}`}${coverSourceAria ? `，${coverSourceAria}` : ""}`;
            const remoteLive = isRemote && thumb.remoteCoverUrl
              ? `<img class="thumb thumb-remote-live" loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${escapeAttribute(thumb.remoteCoverUrl)}" data-item-id="${item.id}" data-cover-url="${escapeAttribute(thumb.remoteCoverUrl)}" alt="" aria-hidden="true" style="display:none" onload="NutbookCoverCard.remoteLoaded(this)" onerror="NutbookCoverCard.remoteFailed(this)" />`
              : "";
            const warning = warningText
              ? `<div class="thumb-cover-warning" role="note" aria-hidden="true">${escapeHtml(warningText)}</div>`
              : `<div class="thumb-cover-warning" role="note" aria-hidden="true"></div>`;
            return `
              <div class="thumb-wrap ${pathMissing ? "path-missing" : ""} thumb-cover-state" ${isRemote ? `data-remote-cover-card="${item.id}"` : ""} data-cover-aria-base="${escapeAttribute(coverBaseAria)}">
                <img class="thumb thumb-cover-fallback" src="${escapeAttribute(thumb.path)}" alt="" />
                ${remoteLive}
                ${warning}
                ${missingMask}
                ${badge}
              </div>
            `;
          }
          if (thumb.path.startsWith("data:image/svg+xml;base64,")) {
            const encoded = item.thumbnail.path.slice("data:image/svg+xml;base64,".length);
            let svgMarkup = "";
            try {
              svgMarkup = atob(encoded);
            } catch (_) {
              svgMarkup = "";
            }
            if (svgMarkup) {
              return `
                <div class="thumb-wrap ${pathMissing ? "path-missing" : ""}">
                  <div class="thumb thumb-inline" aria-hidden="true">${svgMarkup}</div>
                  ${missingMask}
                  ${badge}
                </div>
              `;
            }
          }
          return `
            <div class="thumb-wrap ${pathMissing ? "path-missing" : ""}">
              <img class="thumb" src="${escapeAttribute(item.thumbnail.path)}" alt="" />
              ${missingMask}
              ${badge}
            </div>
          `;
        }
        // B2 stale preview：durable save 且索引同步后、新 generation ready 前，
        // 仅在当前页面把旧图作为非持久视觉 preview 显示（遮罩 + 文案 + aria-busy）。
        // 生成明确失败（state=failed）或引擎不可用时切换为 placeholder，绝不把
        // stale 图冒充 ready 成品；stale preview 不写回 ready、不参与缓存命中。
        const stalePreview = appState.stalePreviewThumbnails.get(item.id);
        if (
          stalePreview &&
          stalePreview.state === "preview" &&
          stalePreview.thumbnail?.path &&
          canGenerateDocumentThumbnails()
        ) {
          const previewPath = stalePreview.thumbnail.path;
          let previewInner = "";
          if (previewPath.startsWith("data:image/svg+xml;base64,")) {
            const encoded = previewPath.slice("data:image/svg+xml;base64,".length);
            try {
              const svgMarkup = atob(encoded);
              if (svgMarkup) previewInner = svgMarkup;
            } catch (_) {
              previewInner = "";
            }
          } else {
            previewInner = `<img class="thumb" src="${escapeAttribute(previewPath)}" alt="" />`;
          }
          if (previewInner) {
            return `
              <div class="thumb-wrap thumb-refreshing ${pathMissing ? "path-missing" : ""}" aria-busy="true">
                <div class="thumb thumb-inline" aria-hidden="true">
                  ${previewInner}
                  <div class="thumb-refresh-mask" aria-hidden="true"><span class="thumb-refresh-pill">${t("status.thumbnailUpdating")}</span></div>
                </div>
                ${missingMask}
                ${badge}
              </div>
            `;
          }
        }
        if (item.fileType === "html") {
          return `
            <div class="thumb-wrap ${pathMissing ? "path-missing" : ""}">
              <div class="thumb thumb-inline" aria-hidden="true">
                <div class="html-thumb-card">
                  <div class="html-thumb-frame">
                    <span class="material-symbols-outlined html-thumb-icon">code</span>
                  </div>
                </div>
              </div>
              ${missingMask}
              ${badge}
            </div>
          `;
        }
        return `
          <div class="thumb-wrap ${pathMissing ? "path-missing" : ""}">
            <div class="thumb thumb-inline" aria-hidden="true">
              <div class="markdown-thumb-card">
                <div class="markdown-thumb-frame">
                  <span class="material-symbols-outlined markdown-thumb-icon">text_snippet</span>
                </div>
              </div>
            </div>
            ${missingMask}
            ${badge}
          </div>
        `;
      }

      function supportsGeneratedThumbnail(item) {
        return item.fileType === "html" || item.fileType === "markdown";
      }

      // B1 调度正确性（审查阻塞 3/4 修正）：
      // - 后端 CAS 保证非 discarded 响应即"提交时最新状态"；discarded 响应不得修改
      //   item.thumbnail；
      // - **只有 status=ready 且 render kind 非 placeholder 的响应才算成功应用**
      //   （审查阻塞 4）：后端返回的 status=failed placeholder（截图引擎失败）不是
      //   成功——调用方必须把它计入 failed，设置页绝不能显示"重建成功"；
      // - in-flight 期间 desired key 连续变化（R1→R2→R3→…）时，每次 discarded 后按
      //   响应 expectedKey 继续处理最新 generation，**不设固定次数上限**——连续超过
      //   5 次 revision 变化也必须最终收敛，不允许静默放弃后依赖"下次列表刷新"；
      // - 连续 discarded 使用 80–300ms 短退避，退避前后都检查 queue runId；
      // - 只有三种情况可以结束：ready 结果成功应用；当前 queue runId 已取消；明确的
      //   终止错误（failed placeholder / 无可补跑的 expectedKey / 后端异常）已记录。
      // - 调用方必须只把 { ok: true } 计入 completed；canceled / failed / terminal /
      //   error 不得计入 completed。pendingThumbnailIds 由调用方覆盖整个收敛过程。
      function applyGenerateThumbnailResult(item, result) {
        if (!result) return { applied: false, reason: "empty" };
        if (result.discarded === true) return { applied: false, reason: "discarded" };
        // 只有 ready 成图才算成功应用；failed（placeholder / 引擎不可用）是明确失败。
        const status = result.status ?? result.thumbnail?.status ?? null;
        const renderKind = result.renderKind ?? result.thumbnail?.renderKind ?? null;
        // PR C / C2：本地封面降级是合法当前状态——status=failed +
        // markdown-image-cover（含 fallback 标题 SVG path + 完整原因）→ 应用为
        // 降级投影：卡片回退标题 SVG、hover/focus 警告、accessible name 同步；
        // 资源恢复后由读取路径 stat 复核触发重新生成自动升级。
        if (status === "failed" && renderKind === "markdown-image-cover" && result.thumbnail?.path) {
          const expectedKey = result.expectedKey ?? result.desiredKey ?? null;
          if (expectedKey) item._thumbDesiredKey = expectedKey;
          item.thumbnail = normalizeThumbnailInfo({
            status: "failed",
            path: result.thumbnail.path || null,
            width: result.thumbnail.width || null,
            height: result.thumbnail.height || null,
            lastGeneratedAt: result.thumbnail.lastGeneratedAt || null,
            errorMessage: result.thumbnail.errorMessage || null,
            desiredKey: expectedKey || result.thumbnail.desiredKey || null,
            generation: result.generation ?? result.thumbnail.generation ?? null,
            renderKind: "markdown-image-cover",
            remoteCoverUrl: null
          });
          return { applied: true, reason: "degraded" };
        }
        // 在线封面不是本地 ready：后端返回独立 remote 状态与 fallback 路径，
        // 前端可见卡片再 lazy load URL。它是已应用的只读投影，不进入本地 CAS。
        if (
          status === "stale"
          && renderKind === "markdown-remote-image-cover"
          && result.thumbnail?.path
          && result.thumbnail?.remoteCoverUrl
        ) {
          const expectedKey = result.expectedKey ?? result.desiredKey ?? null;
          if (expectedKey) item._thumbDesiredKey = expectedKey;
          item.thumbnail = normalizeThumbnailInfo({
            status: "stale",
            path: result.thumbnail.path,
            width: result.thumbnail.width || null,
            height: result.thumbnail.height || null,
            lastGeneratedAt: result.thumbnail.lastGeneratedAt || null,
            errorMessage: null,
            desiredKey: expectedKey || result.thumbnail.desiredKey || null,
            generation: result.generation ?? result.thumbnail.generation ?? null,
            renderKind: "markdown-remote-image-cover",
            remoteCoverUrl: result.thumbnail.remoteCoverUrl
          });
          return { applied: true, reason: "remote" };
        }
        if (status !== "ready") {
          return { applied: false, reason: status === "failed" ? "failed" : "not-ready" };
        }
        if (renderKind === "placeholder") {
          return { applied: false, reason: "placeholder" };
        }
        const expectedKey = result.expectedKey ?? result.desiredKey ?? null;
        if (expectedKey) item._thumbDesiredKey = expectedKey;
        item.thumbnail = normalizeThumbnailInfo({
          status: result.status || result.thumbnail?.status || "ready",
          path: result.path || result.thumbnail?.path || null,
          width: result.width || result.thumbnail?.width || null,
          height: result.height || result.thumbnail?.height || null,
          lastGeneratedAt: result.lastGeneratedAt || result.thumbnail?.lastGeneratedAt || null,
          errorMessage: result.errorMessage || result.thumbnail?.errorMessage || null,
          desiredKey: expectedKey || result.thumbnail?.desiredKey || null,
          generation: result.generation ?? result.thumbnail?.generation ?? null,
          renderKind: result.renderKind || result.thumbnail?.renderKind || null,
          remoteCoverUrl: result.remoteCoverUrl || result.thumbnail?.remoteCoverUrl || null
        });
        return { applied: true, reason: "ready" };
      }

      async function generateThumbnailOnce(item, runId) {
        const queueActive = () => runId === undefined || runId === appState.thumbnailQueueRunId;
        let backoff = 80;
        for (;;) {
          if (!queueActive()) return { ok: false, reason: "canceled" };
          let result;
          try {
            result = await invoke("generate_thumbnail", { itemId: item.id });
          } catch (error) {
            console.error("generate_thumbnail failed for item", item.id, error);
            return { ok: false, reason: "error", error };
          }
          if (!queueActive()) return { ok: false, reason: "canceled" };
          const apply = applyGenerateThumbnailResult(item, result);
          if (apply.applied) return { ok: true, reason: "applied" };
          if (apply.reason === "discarded") {
            // discarded：按响应 expectedKey 继续收敛最新 generation（R3 之后的响应
            // 也绝不被忽略）。
            const retryKey = result?.expectedKey ?? result?.desiredKey ?? null;
            if (!retryKey) {
              console.error("generate_thumbnail discarded without expectedKey for item", item.id, result);
              return { ok: false, reason: "terminal" };
            }
            item._thumbDesiredKey = retryKey;
            await delay(backoff);
            backoff = Math.min(backoff * 2, 300);
            continue;
          }
          // failed / placeholder / not-ready / empty：明确的终止错误，不循环重试
          // （引擎失败重试也不会成功），已记录。
          if (apply.reason === "failed" || apply.reason === "placeholder") {
            console.error("generate_thumbnail reported failure for item", item.id, result);
          }
          return { ok: false, reason: apply.reason };
        }
      }

      async function waitForThumbnailSlot(itemId, runId) {
        // 手动重建接管自动队列时，旧 run 可能仍在一次 invoke / backoff 中并持有
        // pending slot。等待旧 owner 观察到 runId 变化并在 finally 释放；直接跳过会
        // 产生既未 completed 也未 failed 的漏项，直接并发则破坏 single-flight。
        let backoff = 40;
        while (appState.pendingThumbnailIds.has(itemId)) {
          if (runId !== appState.thumbnailQueueRunId) return false;
          await delay(backoff);
          backoff = Math.min(backoff * 2, 200);
        }
        return runId === appState.thumbnailQueueRunId;
      }

      // B2：HTML durable save 且索引同步成功后调用。保存流程不等待 Chromium：
      // 只把该 item 的旧缓存降级为会话内 stale preview，并为其排队当前
      // desired key/generation（fire-and-forget）。indexSynchronized=false 时不调用
      // 本函数——revision 不确定，禁止拿不确定 revision 排队截图；marker 重放后由
      // list 加载路径（thumbnail:null → ensureDocumentThumbnails）补排队。
      function queueThumbnailRefreshAfterHtmlSave(itemId, commitResult) {
        const numericId = Number(itemId);
        const existing = appState.items.find((candidate) => candidate.id === numericId);
        const oldThumbnail = existing?.thumbnail || null;
        if (oldThumbnail?.path) {
          appState.stalePreviewThumbnails.set(numericId, { thumbnail: oldThumbnail, state: "preview" });
        }
        // 未在可见列表（筛选/分页）时用合成 item 仍让后端排队生成；卡片不可见时
        // updateCardThumbnail 自然 no-op，回到主页后按 list 状态收敛。
        const item = existing || { id: numericId, fileType: "html", pathState: "valid", thumbnail: null };
        if (existing) {
          existing._thumbRefreshing = true;
          existing._thumbFailed = false;
          if (commitResult?.desiredKey) existing._thumbDesiredKey = commitResult.desiredKey;
          if (commitResult?.generation != null) existing._thumbGeneration = Number(commitResult.generation);
          existing.thumbnail = null;
          // 先把当前卡片立即切成 stale preview，再异步等待/截图；否则快速返回主页或
          // 慢截图期间 Map 虽已记录，真实 DOM 仍会继续显示无遮罩的旧 ready 图。
          updateCardThumbnail(existing);
        }
        ensureDocumentThumbnails([item], { quiet: true });
      }

      async function ensureDocumentThumbnails(items, options) {
        const quiet = Boolean(options?.quiet);
        // B4：按真实状态取需要生成的项（自动补缺，不重建已 ready 的官方封面）；
        // 引擎不可用时 HTML 项跳过，Markdown 默认封面仍排队生成（无引擎依赖）。
        const { targets, skippedHtml } = thumbnailAutoQueueTargets(items);
        if (!targets.length) {
          if (!quiet) {
            if (skippedHtml > 0) {
              // 需要重建的只有 HTML 且引擎不可用：明确提示"引擎不可用但 Markdown 仍可生成"，
              // 而不是笼统的"引擎未启用"。
              setStatus(t("status.thumbnailEngineUnavailableMarkdownOk"), "warn");
            } else if (thumbnailEngineNeedsAttention()) {
              setStatus(t("status.thumbnailEngineDisabled"), "warn");
            }
          }
          return;
        }

        const runId = ++appState.thumbnailQueueRunId;
        appState.thumbnailQueueActive = true;
        let completed = 0;
        let failed = 0;
        if (!quiet) setStatus(thumbnailProgressMessage(0, targets.length), "warn");

        for (const queuedItem of targets) {
          if (runId !== appState.thumbnailQueueRunId) break;
          const item = appState.items.find((candidate) => candidate.id === queuedItem.id) || queuedItem;
          if (!item) continue;

          // loadItems / 新 save 会用新 runId 接管队列。若旧 owner 尚在 invoke/backoff
          // 中持有该 item 的 slot，新 owner 必须等待 finally 释放后再接管；不能直接
          // continue，否则“保存 → 立即回主页”会产生永久漏项，直到用户再次刷新。
          if (!(await waitForThumbnailSlot(item.id, runId))) break;

          appState.pendingThumbnailIds.add(item.id);
          try {
            // Yield to the UI between browser captures so large first scans do not feel frozen.
            await delay(80);
            const outcome = await generateThumbnailOnce(item, runId);
            if (runId !== appState.thumbnailQueueRunId) break;
            if (!outcome.ok) {
              // canceled / terminal / error / failed 不得计入 completed。
              // failed（截图引擎失败）计入 failed，结束时不得显示"全部成功"。
              if (outcome.reason !== "canceled") {
                failed += 1;
                // 明确失败：停止 stale preview（旧图不再冒充 ready），
                // 单卡切换到 placeholder/retry 状态。
                item._thumbRefreshing = false;
                item._thumbFailed = true;
                const staleEntry = appState.stalePreviewThumbnails.get(item.id);
                if (staleEntry) staleEntry.state = "failed";
                updateCardThumbnail(item);
              }
              continue;
            }
            completed += 1;
            // ready 收敛：清 stale preview，单卡替换为新 generation（不整表重绘）。
            appState.stalePreviewThumbnails.delete(item.id);
            item._thumbRefreshing = false;
            item._thumbFailed = false;
            updateCardThumbnail(item);
            if (!quiet) setStatus(thumbnailProgressMessage(completed, targets.length), "warn");
          } catch (_) {
          } finally {
            appState.pendingThumbnailIds.delete(item.id);
          }
        }

        if (runId === appState.thumbnailQueueRunId) {
          appState.thumbnailQueueActive = false;
          if (quiet) {
            // 保存触发的单 item 队列不覆盖"已保存"ack；失败时给出缩略图专用文案，
            // 绝不用"保存失败"冒充，也不覆盖保存失败状态。
            if (failed > 0) setStatus(t("status.thumbnailRefreshFailedShort"), "warn");
          } else if (failed > 0) {
            // 有失败项：不得以"全部成功"收尾。
            setStatus(thumbnailProgressMessage(completed, targets.length), "warn");
          } else {
            setStatus(t("status.thumbnailRefreshComplete"), "ok");
          }
        }
      }

      // 把 thumbnailNode 返回的 HTML 字符串解析为真实 Element（template + Range），
      // 不允许直接用字符串调 replaceWith（会被当作 TextNode 插入）。
      function htmlStringToElement(html) {
        const template = document.createElement("template");
        template.innerHTML = html.trim();
        const node = template.content.firstElementChild;
        return node instanceof Element ? node : null;
      }

      // 缩略图完成后按 item 定位卡片，只替换该卡片的 thumb-wrap 内容（keyed 增量更新），
      // 避免整表 innerHTML 重建导致 tooltip 锚点断开、hover 状态丢失、滚动跳动。
      // 替换后必须验证 .thumb-wrap / 缩略图 / 徽标 / 类型标签结构完整；结构不完整时回退整表重建。
      function updateCardThumbnail(item) {
        // 检查视图：卡片 DOM 不存在；选中项的 HTML 预览随 ready/stale/failed 状态收敛。
        if (appState.homeLayout === "inspector") {
          if (item.id === appState.inspector.selectedItemId) {
            const selected = appState.items.find((entry) => entry.id === item.id);
            if (selected && selected.fileType !== "markdown") {
              renderInspectorHtmlPreview(selected);
            }
          }
          return;
        }
        const card = els.itemList?.querySelector(`[data-open-item="${item.id}"]`);
        if (!card) return;
        const wrap = card.querySelector(".thumb-wrap");
        if (!wrap) return;
        const freshEl = htmlStringToElement(thumbnailNode(item));
        if (!freshEl || !freshEl.classList.contains("thumb-wrap")) {
          // 解析失败或结构不符：回退整表重建，保证 DOM 一致
          renderItems();
          return;
        }
        const hasThumb = freshEl.querySelector(".thumb");
        const hasType = freshEl.querySelector(".thumb-badge-type");
        const hasChips = freshEl.querySelector(".source-badge, .tag-chip, .meta-chip");
        if (!hasThumb || !hasType) {
          renderItems();
          return;
        }
        wrap.replaceWith(freshEl);
        window.NutbookCoverCard?.observe?.(freshEl);
        // 更新卡片级 aria-label（来源徽标可能变化）
        const pathMissing = isItemPathMissing(item);
        const sourceAria = itemSourceBadgesAria(item);
        const baseAria = pathMissing
          ? `文件路径失效：${item.title || item.fileName}`
          : `打开 ${item.title || item.fileName}`;
        card.setAttribute("aria-label", sourceAria ? `${baseAria}，${sourceAria}` : baseAria);
        // 同步 render snapshot：item.thumbnail 已更新，立即重算指纹，
        // 否则下一次自动刷新时指纹对比旧快照会误判变化而整表重建。
        appState.lastItemsFingerprint = itemsFingerprint(appState.items);
      }

      // 列表内容指纹：覆盖所有影响卡片 DOM / 顺序 / aria 的字段。
      // id、顺序（数组天然保序）、fileName/title、pathState、favorite、thumbnail 全部字段、
      // tags 名称、sourceBadges 的 kind/sourceId/label/isOwner/available。
      // 数据没变就不重建 innerHTML，避免自动刷新/缩略图完成后全量重绘。
      function itemsFingerprint(items) {
        return JSON.stringify([appState.language, appState.altKeyPressed ? 1 : 0, items.map((item) => [
          item.id,
          item.fileName || "",
          item.title || "",
          item.pathState || "",
          item.isFavorite ? 1 : 0,
          item.thumbnail
            ? [item.thumbnail.path || "", item.thumbnail.status || "", item.thumbnail.width || "", item.thumbnail.height || "", item.thumbnail.lastGeneratedAt || "", item.thumbnail.errorMessage || "", item.thumbnail.renderKind || "", item.thumbnail.desiredKey || "", item.thumbnail.remoteCoverUrl || ""]
            : null,
          (item.tags || []).map((tag) => tag.name || ""),
          (item.sourceBadges || []).map((badge) => [badge.kind || "", badge.sourceId || "", badge.label || "", badge.isOwner ? 1 : 0, badge.available === false ? 0 : 1])
        ])]);
      }

      function renderItems() {
        // 检查视图接管列表渲染：同一份 appState.items（搜索/筛选/范围保持不变）。
        if (appState.homeLayout === "inspector") {
          renderInspectorItems();
          return;
        }
        const items = appState.items;
        els.listSummary.textContent = `${fileCountText(items.length)}${appState.activeTagFilterIds.length ? (appState.language === "en-US" ? ", with tag filter" : "，含标签筛选") : ""}`;

        // 列表内容指纹：数据没变就不重建 innerHTML（缩略图完成走 updateCardThumbnail 单卡 keyed 更新）。
        const fingerprint = itemsFingerprint(items);
        if (items.length && appState.lastItemsFingerprint === fingerprint && els.itemList.firstElementChild) {
          return;
        }
        appState.lastItemsFingerprint = fingerprint;
        // 列表全量重建前隐藏 tooltip：旧锚点 badge 将被销毁，不能残留旧卡 tooltip
        window.__nutbookChipTipController?.hide();

        if (!items.length) {
          appState.lastItemsFingerprint = "";
          if (appState.isBooting) {
            renderBootLoadingState();
            return;
          }
          const hasActiveSearch = Boolean(appState.appliedSearch);
          const emptyTitle = hasActiveSearch
            ? t("home.noSearchResults")
            : appState.browseMode === "starred" ? t("home.noStarred") : appState.browseMode === "recent" ? t("home.noRecent") : t("home.noFiles");
          const emptyBody = hasActiveSearch
            ? t("home.noSearchResultsHint")
            : appState.browseMode === "starred"
              ? t("home.starredHint")
              : appState.browseMode === "recent"
                ? t("home.recentHint")
                : t("home.emptyHint");
          const showAddButton =
            !hasActiveSearch &&
            appState.browseMode === "all" &&
            !getFileTypeFilter() &&
            !appState.activeTagFilterIds.length;
          els.itemList.classList.add("empty-mode");
          els.itemList.innerHTML = `
            <div class="empty-state">
              <div>
                <h2>${emptyTitle}</h2>
                <div>${emptyBody}</div>
                ${showAddButton ? `
                  <div class="button-row" style="justify-content:center; margin-top:14px;">
                    <button id="emptyStateOpenArtifactAccessButton" class="empty-state-action primary" type="button" aria-label="${escapeAttribute(t("settings.skills"))}" title="${escapeAttribute(t("settings.skills"))}">${t("settings.skills")}</button>
                    <button id="emptyStateAddFolderButton" class="empty-state-action" type="button" aria-label="${escapeAttribute(t("actions.addFolder"))}" title="${escapeAttribute(t("actions.addFolder"))}">${t("actions.addFolder")}</button>
                  </div>
                ` : ""}
              </div>
            </div>
          `;
          if (showAddButton) {
            document.getElementById("emptyStateOpenArtifactAccessButton")?.addEventListener("click", () => openSettingsTab("skills"));
            document.getElementById("emptyStateAddFolderButton")?.addEventListener("click", addFolderFromMenu);
          }
          return;
        }

        els.itemList.classList.remove("empty-mode");

        els.itemList.innerHTML = items
          .map(
            (item) => {
              const pathMissing = isItemPathMissing(item);
              const sourceAria = itemSourceBadgesAria(item);
              const baseAria = pathMissing
                ? `文件路径失效：${item.title || item.fileName}`
                : `打开 ${item.title || item.fileName}`;
              const coverWarning = coverWarningTextForItem(item);
              const ariaLabel = coverWarning
                ? `${baseAria}，${sourceAria ? `${sourceAria}，` : ""}${coverWarning}`
                : (sourceAria ? `${baseAria}，${sourceAria}` : baseAria);
              return `
              <article class="item-card ${pathMissing ? "path-missing" : ""}" data-open-item="${item.id}">
                <button class="card-remove" type="button" data-remove-item="${item.id}" aria-label="${escapeAttribute(t("actions.removeFromNutbook"))}">
                  <span style="font-size:18px; line-height:1; font-weight:500;">×</span>
                  <span class="card-action-tooltip">${appState.altKeyPressed ? t("actions.delete") : t("actions.remove")}</span>
                </button>
                <button class="card-favorite ${item.isFavorite ? "active" : ""}" type="button" data-toggle-favorite="${item.id}" aria-label="${escapeAttribute(t(item.isFavorite ? "actions.unfavoriteFile" : "actions.favoriteFile"))}">
                  <svg class="icon-svg" viewBox="0 0 20 20" aria-hidden="true">
                    <path class="star-icon-path" d="M10 2.7 12.1 7l4.7.7-3.4 3.3.8 4.7L10 13.5l-4.2 2.2.8-4.7L3.2 7.7 7.9 7 10 2.7Z"></path>
                  </svg>
                  <span class="card-action-tooltip">${t("actions.favorite")}</span>
                </button>
                <button class="item-card-open" type="button" data-open-trigger="${item.id}" aria-label="${escapeAttribute(ariaLabel)}">
                  ${thumbnailNode(item)}
                  <span class="item-main">
                    <span class="item-card-title">${escapeHtml(item.fileName)}</span>
                    ${appState.appliedSearch && Array.isArray(item.snippets) && item.snippets[0] ? `<span class="item-search-snippet" data-i18n-skip>${escapeHtml(item.snippets[0])}</span>` : ""}
                  </span>
                </button>
              </article>
            `;
            }
          )
          .join("");
        window.NutbookCoverCard?.observe?.(els.itemList);

        els.itemList.querySelectorAll("[data-open-trigger]").forEach((node) => {
          node.addEventListener("click", async () => {
            await openItem(Number(node.dataset.openTrigger));
          });
        });
        els.itemList.querySelectorAll("[data-toggle-favorite]").forEach((node) => {
          node.addEventListener("pointerdown", (event) => {
            event.stopPropagation();
          });
          node.addEventListener("click", async (event) => {
            event.stopPropagation();
            await toggleFavorite(Number(node.dataset.toggleFavorite));
          });
        });
        els.itemList.querySelectorAll("[data-remove-item]").forEach((node) => {
          node.addEventListener("pointerdown", (event) => {
            event.stopPropagation();
          });
          node.addEventListener("click", async (event) => {
            event.preventDefault();
            event.stopPropagation();
            await requestRemoveItemFromNutbook(Number(node.dataset.removeItem));
          });
        });

// A1.1 GUI 反馈：单个全局 chip-tooltip coordinator。
// - 保存并取消 requestAnimationFrame：每次 show 生成递增 token，rAF 回调校验 token，
//   hide 时取消挂起的 rAF，杜绝 mouseout 早于 rAF 时旧 tooltip 复活。
// - 锚点断开（列表重建/删除）后不复活：show/rAF 均检查 badge.isConnected。
// - mouseout / focusout / scroll / resize / window blur / document mouseleave 全部隐藏。
// - 上下翻转 + 四边 viewport clamp。
// - 卡片键盘 focus（role=button tabindex=0）时显示完整来源名，但 badge 本身不加 tab stop。
// per-badge 的 .chip-tooltip span 只作为文本源（CSS display:none）。
let chipTipController = window.__nutbookChipTipController;
if (!chipTipController) {
          chipTipController = {
            floatingTip: null,
            token: 0,
            pendingRaf: null,
            activeBadge: null,
            ensureTip() {
              if (this.floatingTip) return this.floatingTip;
              this.floatingTip = document.createElement("span");
              this.floatingTip.className = "chip-tooltip chip-tooltip--floating";
              this.floatingTip.setAttribute("aria-hidden", "true");
              document.body.appendChild(this.floatingTip);
              return this.floatingTip;
            },
            hide(forceToken) {
              if (forceToken !== undefined && forceToken !== this.token) return;
              this.token += 1;
              if (this.pendingRaf) {
                cancelAnimationFrame(this.pendingRaf);
                this.pendingRaf = null;
              }
              const tip = this.ensureTip();
              tip.style.opacity = "0";
              this.activeBadge = null;
            },
            show(anchor, text, options) {
              if (!anchor || !anchor.isConnected) return;
              const textValue = (text || "").trim();
              if (!textValue) return;
              // A1.3 用户反馈（hover tooltip 闪烁/延迟）：mouseover 委托在 badge 内部
              // 子元素间移动时 closest() 仍返回同一 badge，会反复调用 show()。
              // 同锚点 + 同文本 → 直接跳过（无论当前 opacity 是否已 1）：若等 opacity 变 1
              // 才跳过，第一次 rAF 尚未执行（opacity 仍 0）时第二次 show 会 token++ cancel rAF
              // 重排队，鼠标快速移动时 rAF 被反复取消 → tooltip 停在 opacity 0（闪烁/延迟）。
              // hide() 会把 activeBadge 置 null，故真正移出后重新进入会正常重新 show。
              if (this.activeBadge === anchor && this.floatingTip &&
                  this.floatingTip.textContent === textValue) return;
              const token = ++this.token;
              if (this.pendingRaf) {
                cancelAnimationFrame(this.pendingRaf);
                this.pendingRaf = null;
              }
              this.activeBadge = anchor;
              const tip = this.ensureTip();
              tip.textContent = textValue;
              const rect = anchor.getBoundingClientRect();
              tip.style.position = "fixed";
              tip.style.left = "0px";
              tip.style.top = "0px";
              tip.style.transform = "none";
              tip.style.opacity = "0";
              // A1.3 返工（Markdown toolbar 切割/路径栏遮挡）：toolbar 紧贴 viewer 顶部，
              // tooltip 向上弹会被路径栏遮挡且文本不完整显。Markdown toolbar 徽标传
              // preferBelow:true 强制向下；主页卡片继续走默认适应策略。
              const preferBelow = !!(options && options.preferBelow);
              this.pendingRaf = requestAnimationFrame(() => {
                this.pendingRaf = null;
                if (token !== this.token) return;
                // 锚点断开（列表重建/删除）后不得复活
                if (!anchor.isConnected) {
                  this.hide(token);
                  return;
                }
                const tr = tip.getBoundingClientRect();
                const tipW = tr.width;
                const tipH = tr.height;
                const gap = 6;
                const pad = 4;
                const vw = window.innerWidth;
                let top, transform;
                if (preferBelow) {
                  top = rect.bottom + gap;
                  transform = "translateX(-50%) translateY(0)";
                } else {
                  top = rect.top - gap;
                  transform = "translateX(-50%) translateY(-100%)";
                  if (rect.top - gap < tipH + pad) {
                    top = rect.bottom + gap;
                    transform = "translateX(-50%) translateY(0)";
                  }
                }
                // 水平 clamp：实测 tipW 必须完整落入 viewport
                let left = rect.left + rect.width / 2 - tipW / 2;
                if (left < pad) left = pad;
                if (left + tipW > vw - pad) left = vw - pad - tipW;
                if (left < rect.left) {
                  transform = transform.replace("translateX(-50%)", "translateX(0)");
                } else if (left + tipW > rect.right) {
                  transform = transform.replace("translateX(-50%)", "translateX(-100%)");
                }
                tip.style.left = `${left}px`;
                tip.style.top = `${top}px`;
                tip.style.transform = transform;
                tip.style.opacity = "1";
              });
            }
          };
          window.__nutbookChipTipController = chipTipController;
        }

        // PR C / C2：在线封面卡片的 lazy 加载 / 比例复核 / 失败与恢复控制器。
        // 远程 SVG 只能作为被动 <img>（禁止 fetch 后 inline）；no-referrer +
        // loading=lazy + 异步解码；onload 复核自然尺寸 4:3..2:1，合格才整体替换
        // 标题 SVG fallback；失败/离线/比例变化继续显示标题 SVG。URL 变化后旧
        // 异步结果（旧 DOM 元素）已被重渲染替换，此处再复核当前 item URL。
        window.NutbookCoverCard = {
          timeoutMs: 15000,
          observer: null,
          coverRatioOk(naturalWidth, naturalHeight) {
            if (!naturalWidth || !naturalHeight) return false;
            const ratio = naturalWidth / naturalHeight;
            return ratio >= 4 / 3 && ratio <= 2;
          },
          syncCoverCardAria(wrap, warning) {
            const card = wrap?.closest(".item-card");
            if (!card) return;
            const base = wrap.getAttribute("data-cover-aria-base") || "";
            card.setAttribute("aria-label", warning ? `${base}，${warning}` : base);
          },
          remoteLoaded(img) {
            const wrap = img.closest(".thumb-wrap");
            if (!wrap || !wrap.isConnected) return;
            const fallback = wrap.querySelector(".thumb-cover-fallback");
            const warning = wrap.querySelector(".thumb-cover-warning");
            const item = appState.items.find((entry) => entry.id === Number(img.dataset.itemId));
            const currentUrl = item?.thumbnail?.remoteCoverUrl || "";
            if (currentUrl && currentUrl !== img.dataset.coverUrl) return;
            if (this.coverRatioOk(img.naturalWidth, img.naturalHeight)) {
              img.dataset.coverFailed = "false";
              img.style.display = "block";
              img.setAttribute("aria-hidden", "false");
              if (fallback) fallback.style.display = "none";
              if (warning) warning.textContent = "";
              wrap.classList.remove("thumb-cover-warning-on");
              this.syncCoverCardAria(wrap, "");
            } else {
              img.dataset.coverFailed = "true";
              if (warning) warning.textContent = t("status.coverRemoteRatio");
              wrap.classList.add("thumb-cover-warning-on");
              this.syncCoverCardAria(wrap, t("status.coverRemoteRatio"));
            }
          },
          remoteFailed(img) {
            const wrap = img.closest(".thumb-wrap");
            if (!wrap || !wrap.isConnected) return;
            const warning = wrap.querySelector(".thumb-cover-warning");
            const reason = navigator.onLine === false
              ? t("status.coverRemoteOffline")
              : t("status.coverRemoteFailed");
            img.dataset.coverFailed = "true";
            if (warning) warning.textContent = reason;
            wrap.classList.add("thumb-cover-warning-on");
            this.syncCoverCardAria(wrap, reason);
          },
          remoteTimedOut(img) {
            const wrap = img.closest(".thumb-wrap");
            if (!wrap || !wrap.isConnected || img.style.display === "block") return;
            const warning = wrap.querySelector(".thumb-cover-warning");
            const reason = t("status.coverRemoteTimeout");
            img.dataset.coverFailed = "true";
            if (warning) warning.textContent = reason;
            wrap.classList.add("thumb-cover-warning-on");
            this.syncCoverCardAria(wrap, reason);
          },
          arm(img) {
            if (!img || img.dataset.coverArmed === "true") return;
            img.dataset.coverArmed = "true";
            window.setTimeout(() => {
              if (img.isConnected && img.style.display !== "block") {
                this.remoteTimedOut(img);
              }
            }, this.timeoutMs);
          },
          observe(root) {
            const images = root?.matches?.("img.thumb-remote-live")
              ? [root]
              : [...(root?.querySelectorAll?.("img.thumb-remote-live") || [])];
            if (!images.length) return;
            if (!("IntersectionObserver" in window)) {
              images.forEach((img) => this.arm(img));
              return;
            }
            if (!this.observer) {
              this.observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                  if (!entry.isIntersecting) return;
                  this.observer.unobserve(entry.target);
                  this.arm(entry.target);
                });
              }, { rootMargin: "160px" });
            }
            images.forEach((img) => this.observer.observe(img));
          },
          retry(img) {
            if (!img?.isConnected || img.dataset.coverFailed !== "true") return;
            const url = img.dataset.coverUrl || "";
            if (!url) return;
            img.dataset.coverFailed = "false";
            img.dataset.coverArmed = "false";
            img.removeAttribute("src");
            window.requestAnimationFrame(() => {
              if (!img.isConnected) return;
              img.src = url;
              this.arm(img);
            });
          }
        };
        window.addEventListener("online", () => {
          document.querySelectorAll("img.thumb-remote-live[data-cover-failed='true']")
            .forEach((img) => window.NutbookCoverCard.retry(img));
        });
        els.itemList.addEventListener("pointerover", (event) => {
          const img = event.target.closest?.(".thumb-wrap")?.querySelector?.("img.thumb-remote-live");
          window.NutbookCoverCard.retry(img);
        });
        els.itemList.addEventListener("focusin", (event) => {
          const img = event.target.closest?.(".item-card")?.querySelector?.("img.thumb-remote-live");
          window.NutbookCoverCard.retry(img);
        });
      // 复用同一套 chip-tooltip coordinator（全局单个 floating tip，A1.1 已验证）。
      // 卡片：mouseover 只显示首个 focus 的徽标（role=button 卡片 click 后会 focus，
      // 不能让 focus 触发卡片级组合 tooltip：A1.3 用户报「点击卡片顶部出现长 tooltip」）。
      // 键盘可访问性用 source-badge 自身 aria-label（已设）；不挂 focusin/focusout。
      function attachChipTooltipRoot(rootEl, options) {
        if (!rootEl || rootEl.dataset.chipTooltipWired === "true") return;
        rootEl.dataset.chipTooltipWired = "true";
        const tipController = () => window.__nutbookChipTipController;
        const chipSelector = ".source-badge, .tag-chip, .meta-chip";
        rootEl.addEventListener("mouseover", (event) => {
          const badge = event.target.closest(chipSelector);
          if (!badge) return;
          if (options.requireRow && !badge.closest(".thumb-chip-row")) return;
          const src = badge.querySelector(".chip-tooltip");
          if (!src) return;
          // A1.3 返工：breadcrumbTags 强制向下（路径栏遮挡上方）；itemList 走默认。
          tipController().show(badge, src.textContent, { preferBelow: !!options.preferBelow });
        });
        rootEl.addEventListener("mouseout", (event) => {
          const badge = event.target.closest(chipSelector);
          if (!badge) return;
          if (options.requireRow && !badge.closest(".thumb-chip-row")) return;
          // 移到兄弟徽标时不隐藏（让相邻 hover 顺滑）
          const to = event.relatedTarget;
          if (to && badge.contains(to)) return;
          tipController().hide();
        });
      }
      attachChipTooltipRoot(els.itemList, { requireRow: true });
      attachChipTooltipRoot(els.breadcrumbTags, { requireRow: false, preferBelow: true });
      attachChipTooltipRoot(els.inspectorDetails, { requireRow: false });

      // 全局隐藏（滚动 / resize / 窗口失焦 / 鼠标离开视口）与锚点脱离 DOM 兜底，只挂一次。
      if (!window.__nutbookChipTipGlobalWired) {
        window.__nutbookChipTipGlobalWired = true;
        const tipController = () => window.__nutbookChipTipController;
        const hideAll = () => tipController().hide();
        window.addEventListener("scroll", hideAll, { passive: true, capture: true });
        window.addEventListener("resize", hideAll, { passive: true });
        document.addEventListener("mouseleave", hideAll);
        document.addEventListener("blur", hideAll);
        // 列表/工具栏重建导致锚点 badge 脱离 DOM 时立即隐藏（不得残留旧 tooltip）
        const anchorObserver = new MutationObserver(() => {
          const ctrl = tipController();
          if (ctrl.activeBadge && !ctrl.activeBadge.isConnected) {
            ctrl.hide();
          }
        });
        anchorObserver.observe(els.itemList, { childList: true, subtree: true });
        if (els.breadcrumbTags) anchorObserver.observe(els.breadcrumbTags, { childList: true, subtree: true });
        if (els.inspectorDetails) anchorObserver.observe(els.inspectorDetails, { childList: true, subtree: true });
      }

      let primaryActionBusyItemId = null;

      function setPrimaryActionBusy(itemId, busy) {
        if (busy) {
          if (primaryActionBusyItemId != null) return false;
          primaryActionBusyItemId = itemId;
        } else if (primaryActionBusyItemId === itemId) {
          primaryActionBusyItemId = null;

      async function runPrimaryAction(itemId, action) {
        if (!setPrimaryActionBusy(itemId, true)) return false;
        try {
          return await action();
        } finally {
          setPrimaryActionBusy(itemId, false);
        }
      }

      async function runHtmlPrimaryAction(itemId) {
        return runPrimaryAction(itemId, async () => {
          if (appState.htmlEditSession?.itemId === itemId) {

      async function toggleActiveHtmlRuntimePresentationMode() {
        const tab = getActiveTab();
        if (!tab || tab.preview?.fileType !== "html-runtime") return;
        if (appState.htmlEditSession?.itemId === tab.id) {
          setStatus("编辑模式下不可进入演示全屏", "warn");
          return;
        }
        const nextEnabled = appState.runtimeFullscreenItemId !== tab.id;
        clearHostFocus();
        if (appState.isTauri) {
          try {
            await invoke("set_window_fullscreen_command", { fullscreen: nextEnabled });
            // Measure and attach only after the native window has adopted its
            // new fullscreen bounds. Doing this before the command resolves
            // leaves the host at a stale/zero-size rect on the next exit.
            setRuntimeFullscreenState(tab.id, nextEnabled);
            await refocusActiveRuntimeHost(tab.id);
            setStatus(nextEnabled ? t("status.presentationEntered") : t("status.presentationExited"), "ok");
          } catch (error) {
            setStatus(statusError("status.presentationSwitchFailedPrefix", error), "error");
          }
          return;
        }
        setRuntimeFullscreenState(tab.id, nextEnabled);
        setStatus(nextEnabled ? t("status.presentationEntered") : t("status.presentationExited"), "ok");
      }

      window.__NUTBOOK_HANDLE_HTML_RUNTIME_CONTROLS_ACTION__ = async (payload) => {
        const itemId = Number(payload?.itemId);
        const action = payload?.action;
        if (!itemId || !action) return;
        if (action === "toggle-favorite") {
          await toggleFavorite(itemId);
          if (appState.activeTabId === itemId && getActiveTab()?.preview?.fileType === "html-runtime") {
            scheduleRuntimeHostSync();
          }
          return;

        if (action === "request-remove") {
          await showHtmlRemoveConfirmOverlay(itemId);
          return;

        if (action === "edit") {
          if (appState.activeTabId !== itemId || getActiveTab()?.preview?.fileType !== "html-runtime") return;
          await runHtmlPrimaryAction(itemId);
          return;
        }
        if (action === "toggle-presentation") {
          appState.activeTabId = itemId;
          renderTabs();
          renderViewer();
          await toggleActiveHtmlRuntimePresentationMode();
          return;
        }
        if (action === "overlay-layout") {
          const expanded = Boolean(payload.expanded);
          const layoutMode = ["hover", "more", "tags", "badge-tip"].includes(payload.layoutMode)
            ? payload.layoutMode
            : "default";
          if (appState.runtimeControlsOverlayExpanded !== expanded || appState.runtimeControlsOverlayMode !== layoutMode) {
            appState.runtimeControlsOverlayExpanded = expanded;
            appState.runtimeControlsOverlayMode = layoutMode;
            scheduleRuntimeHostSync();
          }
          return;
        }
        if (action === "set-tag") {
          appState.activeTabId = itemId;
          await assignDocumentCustomTag(Number(payload.tagId));
          if (getActiveTab()?.preview?.fileType === "html-runtime") {
            scheduleRuntimeHostSync();

          return;
        }
        if (action === "clear-tag") {
          appState.activeTabId = itemId;
          await assignDocumentCustomTag(null);
          if (getActiveTab()?.preview?.fileType === "html-runtime") {
            scheduleRuntimeHostSync();
          }
          return;
        }
        if (action === "create-tag") {
          appState.activeTabId = itemId;
          await createAndAssignDocumentTag(payload.name ?? "");
          if (getActiveTab()?.preview?.fileType === "html-runtime") {
            scheduleRuntimeHostSync();
          }
        }

      function applyRuntimeFullscreenState() {
        const tab = getActiveTab();
        const activeRuntimeId = tab?.preview?.fileType === "html-runtime" ? tab.id : null;
        const enabled = appState.runtimeFullscreenItemId != null && appState.runtimeFullscreenItemId === activeRuntimeId;
        els.appShell.classList.toggle("runtime-focus-mode", enabled);

      function clearHostFocus() {
        try {
          const active = document.activeElement;
          if (active && typeof active.blur === "function") {
            active.blur();
          }
        } catch (_) {
        }
        try {
          const selection = window.getSelection?.();
          selection?.removeAllRanges?.();
        } catch (_) {
        }
      }

      async function releaseRuntimeShellState(options = {}) {
        const {
          itemId = null,
          clearFullscreen = true,
          clearActiveUrl = true,
          clearHost = true
        } = options;

        clearHostFocus();

        const shouldClearFullscreen =
          clearFullscreen &&
          appState.runtimeFullscreenItemId != null &&
          (itemId == null || appState.runtimeFullscreenItemId === itemId);

        if (shouldClearFullscreen) {
          appState.runtimeFullscreenItemId = null;
          applyRuntimeFullscreenState();
          if (appState.isTauri) {
            try {
              await invoke("set_window_fullscreen_command", { fullscreen: false });
            } catch (_) {
            }
          }
        }

        if (clearActiveUrl) {
          const activeTab = getActiveTab();
          if (!activeTab || itemId == null || activeTab.id === itemId) {
            appState.activeHtmlRuntimeUrl = null;
          }
        }

        if (clearHost && (itemId == null || appState.activeRuntimeHostId === itemId)) {
          appState.activeRuntimeHostId = null;
          appState.runtimeHostLastBoundsKey = null;
          cleanupRuntimeHostSync();
        }
      }

      async function waitForActiveRuntimeHostSync(itemId) {
        for (let frame = 0; frame < 24; frame += 1) {
          const tab = getActiveTab();
          if (tab?.id !== itemId || tab.preview?.fileType !== "html-runtime") return null;
          if (!appState.runtimeHostSyncInFlight && !appState.runtimeHostSyncFrame && !appState.runtimeHostSyncPending) return true;
          await new Promise((resolve) => requestAnimationFrame(resolve));
        }
        return false;
      }

      async function refocusActiveRuntimeHost(itemId) {
        if (!appState.isTauri || !itemId) return false;
        // Fullscreen reattaches the controls island asynchronously.  Focusing
        // before that work settles lets the late child attach steal keyboard
        // focus, so Arrow/Page keys never reach the HTML runtime.
        const syncSettled = await waitForActiveRuntimeHostSync(itemId);
        // A fullscreen resize can keep ResizeObserver work pending for more
        // than a frame budget. That is not a stale tab: still hand focus to
        // the current host, otherwise the second fullscreen run needs a click
        // before it can receive Arrow/F again.
        if (syncSettled === null) return false;
        const hostFullscreen = appState.runtimeFullscreenItemId === itemId;
        return invoke("focus_html_runtime_host_command", { itemId, hostFullscreen }).catch(() => false);
      }

      function forwardRuntimeShortcut(itemId, key, successMessage = null) {
        if (!appState.isTauri || !itemId) return Promise.resolve(false);

      function setRuntimeFullscreenState(itemId, enabled = null) {
        clearHostFocus();
        if (enabled === null) {
          appState.runtimeFullscreenItemId = appState.runtimeFullscreenItemId === itemId ? null : itemId;
        } else {
          appState.runtimeFullscreenItemId = enabled ? itemId : null;

        applyRuntimeFullscreenState();

      window.__NUTBOOK_SET_RUNTIME_FULLSCREEN__ = (itemId, enabled) => {
        setRuntimeFullscreenState(itemId, enabled);

        refocusActiveRuntimeHost(itemId).catch(() => {});
      };
      window.__NUTBOOK_EXIT_RUNTIME_FULLSCREEN__ = (source = "native") => {
        if (appState.runtimeFullscreenItemId == null) return false;
        const exitingRuntimeId = appState.runtimeFullscreenItemId;
        clearHostFocus();
        if (appState.isTauri) {
          invoke("set_window_fullscreen_command", { fullscreen: false })
            .then(() => {
              setRuntimeFullscreenState(exitingRuntimeId, false);
              refocusActiveRuntimeHost(exitingRuntimeId);

          setRuntimeFullscreenState(exitingRuntimeId, false);

      function renderViewer() {
        hideMarkdownLinkTooltip();
        const tab = getActiveTab();
        // 每次真正激活另一 Markdown surface 都推进 token。文件选择/复制 promise

          && tab.id !== appState.activeMarkdownEditorTabId

        syncShellMode();
        viewerToolbarState();
        if (tab?.preview?.fileType !== "html-runtime" && appState.runtimeFullscreenItemId != null) {
          appState.runtimeFullscreenItemId = null;

        if (tab.preview.fileType === "markdown-loading") {
          appState.isDocumentMoreMenuOpen = false;
          viewerToolbarState();
          renderDocumentMoreMenu();
          els.viewerBody.innerHTML = `
            <div class="empty-state">

        if (tab.preview.fileType === "markdown") {

          const sourceMode = appState.markdownEditMode === "source";
          const markdownContent = tab.draft ?? tab.preview.raw ?? "";
          const markdownShellTitle = markdownDocumentTitle(markdownContent, tab.item?.fileName || "Markdown");
          const markdownOutline = buildMarkdownOutline(markdownContent);
          tab.markdownOutlineSignature = markdownOutlineSignature(markdownOutline);
          const showMarkdownOutline = appState.markdownPreferences.outlineEnabled && markdownOutline.length > 0;
          const codeThemeClass = appState.markdownPreferences.codeBlockTheme === "light"
            ? "markdown-code-theme-light"

          const markdownScrollTop = markdownScrollForTab(tab);
          const outlineCollapsed = isMarkdownOutlineCollapsed(tab);
          els.viewerBody.innerHTML = `
            <div class="markdown-document-shell ${showMarkdownOutline ? "" : "no-outline"} ${outlineCollapsed ? "outline-collapsed" : ""}">
              ${showMarkdownOutline ? renderMarkdownOutline(markdownOutline, tab) : ""}
              <div class="markdown-document-main">
                <div class="content-card editing ${codeThemeClass} ${sourceMode ? "source-editing" : ""}">
                  <div class="content-head">
                    <div class="markdown-title-copy">
                      <textarea id="markdownTitleInput" class="content-title markdown-title-input" rows="1" aria-label="文档标题" autocomplete="off" spellcheck="false">${escapeHtml(markdownShellTitle)}</textarea>

                  ${!sourceMode
                    ? `<article class="markdown-preview">${tab.preview.html}</article><div id="milkdownEditorRoot" class="milkdown-editor-root"></div>`
                    : `<article class="markdown-preview">${tab.preview.html}</article>`}
                  ${sourceMode && appState.markdownEditorError
                    ? `<div class="markdown-editor-failure"><strong>Markdown 编辑器加载失败，已切换到源码编辑</strong>${escapeHtml(appState.markdownEditorError)}</div>`
                    : ""}

                    ? `<div class="editor-wrap"><textarea id="editorArea" class="textarea milkdown-source-fallback">${escapeHtml(tab.draft ?? tab.preview.raw)}</textarea></div>`

          const markdownCard = els.viewerBody.querySelector(".content-card");

          if (!sourceMode) {

          if (!hasPreservedMarkdownSession) {
            document.getElementById("milkdownEditorRoot")?.addEventListener("dblclick", () => {
              appState.markdownEditorShouldFocus = true;

            document.getElementById("milkdownEditorRoot")?.addEventListener("pointerdown", (event) => {

          }
          if (sourceMode) {
            updateMarkdownStatusHint(tab);
          }
          logMarkdownPerf("render-shell", markdownRenderStartedAt, tab.item?.fileName || "");
          renderDocumentMoreMenu();
          scheduleRuntimeHostSync();
          return;
        }

        if (tab.preview.fileType === "html-runtime") {
          appState.activeHtmlRuntimeUrl = tab.preview.runtimeUrl || null;
          els.viewerBody.innerHTML = `
            <section class="runtime-host-page">
              <aside id="sectionNavigationRail" class="section-navigation-rail" aria-label="页面导航"></aside>
              <aside id="presentationEditRail" class="presentation-edit-rail" aria-label="演示页面"></aside>

                <div id="runtimeHostMount" class="runtime-host-mount"></div>
              </section>

          `;
          const runtimeHostShell = document.getElementById("runtimeHostShell");
          runtimeHostShell?.addEventListener("pointerdown", () => {
            refocusActiveRuntimeHost(tab.id);
          });
          runtimeHostShell?.addEventListener("click", () => {
            refocusActiveRuntimeHost(tab.id);
          });
          renderDocumentMoreMenu();
          scheduleRuntimeHostSync();
          return;
        }

        const runtimeHtmlUrl = toLocalServerUrl(tab.preview.previewUrl || tab.preview.filePath);
        appState.activeHtmlRuntimeUrl = runtimeHtmlUrl;

        els.viewerBody.innerHTML = `
          <div class="html-stage">
            <iframe class="html-frame" src="${escapeAttribute(runtimeHtmlUrl)}" allow="fullscreen; autoplay; clipboard-read; clipboard-write" allowfullscreen tabindex="0"></iframe>
          </div>
        `;
        const htmlFrame = document.querySelector(".html-frame");
        if (htmlFrame) {
          htmlFrame.addEventListener("load", () => {
            try {
              htmlFrame.focus();
            } catch (_) {
            }
          });
          htmlFrame.addEventListener("click", () => {
            try {
              htmlFrame.focus();
            } catch (_) {
            }

          requestAnimationFrame(() => {
            try {
              htmlFrame.focus();
            } catch (_) {
            }
