      function handleDocumentMoreMenuKeydown(event) {
        const items = documentMoreMenuItems();
        if (event.key === "Escape") {
          event.preventDefault();
          closeDocumentMoreMenu({ restoreFocus: true });
          return;
        }
        if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key) || !items.length) return;
        event.preventDefault();
        const currentIndex = items.indexOf(document.activeElement);
        let nextIndex = currentIndex;
        if (event.key === "Home") nextIndex = 0;
        else if (event.key === "End") nextIndex = items.length - 1;
        else if (event.key === "ArrowDown") nextIndex = currentIndex < 0 ? 0 : (currentIndex + 1) % items.length;
        else nextIndex = currentIndex < 0 ? items.length - 1 : (currentIndex - 1 + items.length) % items.length;
        items[nextIndex]?.focus();
      }

      function groupedAgentScopesForSettings() {
        const groups = new Map();
        const summaries = appState.agentDiscoveryPayload?.artifactSummaries || [];
        (appState.agentDiscoveryPayload?.scopes || []).forEach((scope, index) => {
          const summary = summaries.find((entry) =>
            entry.adapterId === scope.adapterId && entry.externalScopeId === scope.externalScopeId
          );
          const key = scope.scopeKind === "task"
            ? `task:${scope.adapterId}:${scope.externalScopeId}`
            : `project:${scope.rootPath}`;
          const existing = groups.get(key);
          if (existing) {
            existing.scopes.push(scope);
            existing.scopeIndexes.push(index);
            existing.suggestedCount = Math.max(existing.suggestedCount, Number(summary?.suggestedCount || 0));
            existing.pendingCount = Math.max(existing.pendingCount, Number(summary?.pendingCount || 0));
            existing.excludedCount = Math.max(existing.excludedCount, Number(summary?.excludedCount || 0));
            existing.ignoredCount = Math.max(existing.ignoredCount, Number(summary?.ignoredCount || 0));
            existing.alreadyIndexedPaths = [...new Set([
              ...existing.alreadyIndexedPaths,
              ...(summary?.alreadyIndexedPaths || [])
            ])];
            existing.scanPartial ||= summary?.scanStatus === "partial";
            existing.scanIssue ||= summary?.scanIssue || "";
            if (String(scope.lastActivityAt) > String(existing.lastActivityAt)) {
              existing.lastActivityAt = scope.lastActivityAt;
            }
            return;
          }
          groups.set(key, {
            rootPath: scope.rootPath,
            displayName: scope.displayName,
            scopeKind: scope.scopeKind,
            lastActivityAt: scope.lastActivityAt,
            scopes: [scope],
            scopeIndexes: [index],
            suggestedCount: Number(summary?.suggestedCount || 0),
            pendingCount: Number(summary?.pendingCount || 0),
            excludedCount: Number(summary?.excludedCount || 0),
            ignoredCount: Number(summary?.ignoredCount || 0),
            alreadyIndexedPaths: [...(summary?.alreadyIndexedPaths || [])],
            scanPartial: summary?.scanStatus === "partial",
            scanIssue: summary?.scanIssue || ""
          });
        });
        return [...groups.values()].filter((group) =>
          group.scanPartial
          || group.suggestedCount > 0
          || group.pendingCount > 0
          || group.ignoredCount > 0
          || group.alreadyIndexedPaths.length > 0
        );
      }

      function agentProjectGroupKey(group) {
        return `${group.scopeKind}:${group.rootPath}`;
      }

      function isExcludedAgentProject(group) {
        return group.ignoredCount > 0
          && (group.suggestedCount + group.pendingCount) === 0
          && group.alreadyIndexedPaths.length === 0;
      }

      function filteredSortedAgentProjectGroups() {
        const keyword = appState.settingsProjectSearch.trim().toLowerCase();
        const groups = groupedAgentScopesForSettings().filter((group) => {
          if (!keyword) return true;
          return [group.displayName, group.rootPath, ...group.scopes.map((scope) => scope.adapterId)]
            .some((value) => String(value || "").toLowerCase().includes(keyword));
        });
        const byName = (left, right) => left.displayName.localeCompare(right.displayName, appState.language === "en-US" ? "en" : "zh-CN");
        let sorted;
        switch (appState.settingsProjectSort) {
          case "nameAsc":
            sorted = groups.sort(byName);
            break;
          case "suggestedDesc":
            sorted = groups.sort((left, right) => right.suggestedCount - left.suggestedCount || right.pendingCount - left.pendingCount || byName(left, right));
            break;
          case "recentFirst":
          default:
            sorted = groups.sort((left, right) => String(right.lastActivityAt || "").localeCompare(String(left.lastActivityAt || "")) || byName(left, right));
            break;
        }
        return [
          ...sorted.filter((group) => !isExcludedAgentProject(group)),
          ...sorted.filter(isExcludedAgentProject)
        ];
      }

      function discoveredProjectCount() {
        return new Set((appState.agentDiscoveryPayload?.scopes || []).map((scope) => `${scope.scopeKind}:${scope.rootPath}`)).size;
      }

      function connectedProjectCount() {
        return groupedAgentScopesForSettings()
          .filter((group) => group.alreadyIndexedPaths.length > 0)
          .length;
      }

      function excludedProjectCount() {
        return groupedAgentScopesForSettings()
          .filter(isExcludedAgentProject)
          .length;
      }

      function agentArtifactBadge(candidate, content) {
        const reasons = candidate?.reasons || [];
        const priority = [
          "nbskill_registered",
          "created_by_agent_tool",
          "mentioned_in_final_response",
          "explicit_export_event",
          "opened_from_agent_delivery",
          "inside_user_confirmed_output",
          "appeared_during_agent_run",
          "inside_provider_task_scope",
          "inside_project_root",
          "supported_extension_only"
        ];
        const reason = priority.find((key) => reasons.includes(key));
        if (!reason || reason === "supported_extension_only") return "";
        return content.badge[reason] || "";
      }

      function agentArtifactSkillName(candidate) {
        const evidence = (candidate?.evidence || []).find((entry) =>
          entry?.reason === "nbskill_registered"
          && (entry.skillDisplayName || entry.skillNormalizedName)
        );
        return evidence?.skillDisplayName || evidence?.skillNormalizedName || "";
      }

      function agentArtifactFileName(path) {
        const parts = String(path || "").split(/[\\/]/).filter(Boolean);
        return parts.pop() || String(path || "");
      }

      function renderAgentScopeInlineDetail(group, content) {
        const scopeKey = group.scopeIndexes.join(",");
        if (appState.agentDiscoveryLoadingScopeKey === scopeKey) {
          return `<div class="agent-scope-inline-detail"><div class="agent-inline-empty" role="status">${escapeHtml(content.loadingScope)}</div></div>`;
        }
        if (appState.expandedAgentScopeKey !== scopeKey) return "";
        if (appState.agentDiscoveryError) {
          return `<div class="agent-scope-inline-detail"><div class="agent-discovery-error" role="alert"><span>${escapeHtml(content.detailLoadFailed)}</span><button class="settings-inline-link" type="button" data-settings-agent-detail-retry="${scopeKey}">${escapeHtml(content.retryDetails)}</button></div></div>`;
        }
        const preview = appState.agentArtifactPreview;
        if (!preview) return "";
        const seen = new Set();
        const candidates = (preview.reviewCandidates || []).filter((candidate) => {
          const key = candidate.id || candidate.primaryPath;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
        const availableCandidateIds = new Set(candidates.map((candidate) => Number(candidate.id)).filter(Number.isInteger));
        appState.settingsArtifactCandidateSelection.forEach((candidateId) => {
          if (!availableCandidateIds.has(candidateId)) appState.settingsArtifactCandidateSelection.delete(candidateId);
        });
        const scanIncomplete = preview.project?.lastScanStatus === "partial" || group.scanPartial;
        const scanWarning = scanIncomplete
          ? `${content.scanIncomplete}${group.scanIssue ? ` (${group.scanIssue})` : ""}`
          : "";
        const renderCandidateRows = (groupCandidates) => groupCandidates.map((candidate) => {
          const fileName = agentArtifactFileName(candidate.primaryPath);
          const parentPath = String(candidate.primaryPath || "").slice(0, -fileName.length).replace(/[\\/]$/, "");
          const reasonLabel = agentArtifactSkillName(candidate) || agentArtifactBadge(candidate, content);
          const candidateId = Number(candidate.id);
          return `
            <div class="agent-inline-file">
              <input class="settings-agent-candidate-select" type="checkbox" data-settings-agent-candidate-select="${candidateId}" aria-label="${escapeAttribute(t("settings.selectArtifactFile").replace("{name}", fileName))}" ${appState.settingsArtifactCandidateSelection.has(candidateId) ? "checked" : ""} />
              <span class="agent-inline-file-copy">
                <span class="agent-inline-file-name">${escapeHtml(fileName)}</span>
                ${parentPath && parentPath !== group.rootPath ? `<span class="agent-inline-path">${escapeHtml(parentPath)}</span>` : ""}
              </span>
              ${reasonLabel ? `<span class="agent-reason-badge">${escapeHtml(reasonLabel)}</span>` : ""}
              <span class="agent-inline-actions">
                <button class="settings-inline-link" type="button" data-settings-agent-candidate="${candidate.id}" data-settings-agent-decision="accept" aria-label="${escapeAttribute(content.acceptFile)}">${escapeHtml(content.acceptFile)}</button>
                <button class="settings-inline-link" type="button" data-settings-agent-candidate="${candidate.id}" data-settings-agent-decision="ignore" aria-label="${escapeAttribute(content.ignoreFile)}">${escapeHtml(content.ignoreFile)}</button>
              </span>
            </div>
          `;
        }).join("");
        const renderCandidateGroup = (status, label) => {
          const groupCandidates = candidates.filter((candidate) => candidate.status === status);
          if (!groupCandidates.length) return "";
          const candidateIds = groupCandidates.map((candidate) => Number(candidate.id)).filter(Number.isInteger);
          const allSelected = candidateIds.length > 0 && candidateIds.every((candidateId) => appState.settingsArtifactCandidateSelection.has(candidateId));
          return `
            <section class="agent-detail-group" data-agent-detail-group="${scopeKey}:${status}">
              <div class="agent-detail-group-header">
                <label class="agent-detail-group-select">
                  <input class="settings-agent-candidate-select" type="checkbox" data-settings-agent-candidate-group="${status}" ${allSelected ? "checked" : ""} />
                  <span>${escapeHtml(label)}</span>
                </label>
                <span class="agent-detail-group-count">${escapeHtml(fileCountText(groupCandidates.length))}</span>
              </div>
              ${renderCandidateRows(groupCandidates)}
            </section>
          `;
        };
        const total = Number(preview.suggestedCount || 0) + Number(preview.pendingCount || 0);
        const remaining = Math.max(0, total - candidates.length);
        return `
          <div class="agent-scope-inline-detail">
            ${scanWarning ? `<div class="agent-inline-more" role="status">${escapeHtml(scanWarning)}</div>` : ""}
            <div class="agent-detail-list">
              ${renderCandidateGroup("suggested", content.suggested)}
              ${renderCandidateGroup("pending", content.pending)}
              ${candidates.length ? "" : `<div class="agent-inline-empty">${escapeHtml(content.emptyList)}</div>`}
              ${remaining ? `<div class="agent-inline-more">${escapeHtml(content.moreFiles.replace("{count}", remaining))}</div>` : ""}
            </div>
          </div>
        `;
      }

      function renderSettingsAgentProjectContent() {
        const content = currentAgentDiscoveryContent();
        if (appState.agentDiscoveryStep === "loading") {
          return `<div class="settings-empty" role="status">${escapeHtml(content.loading)}</div>`;
        }
        const installations = appState.agentDiscoveryPayload?.installations || [];
        const providerIssues = installations
          .filter((installation) => installation.status !== "ready")
          .map((installation) => `${installation.adapterId}${installation.cliVersion ? ` ${installation.cliVersion}` : ""}：${agentInstallationLabel(installation, content)}`);
        const issueMarkup = providerIssues.length
          ? `<div class="agent-discovery-notice" role="status">${escapeHtml(providerIssues.join("；"))}</div>`
          : "";
        const errorMarkup = appState.agentDiscoveryError && !appState.expandedAgentScopeKey
          ? `<div class="agent-discovery-error" role="alert">${escapeHtml(content.failed)}：${escapeHtml(appState.agentDiscoveryError)}</div>`
          : "";
        const groups = filteredSortedAgentProjectGroups();
        const excludedTotal = excludedProjectCount();
        if (!appState.expandedAgentScopeKey) appState.settingsArtifactCandidateSelection.clear();
        const availableKeys = new Set(groups.map(agentProjectGroupKey));
        appState.settingsProjectSelection.forEach((key) => {
          if (!availableKeys.has(key)) appState.settingsProjectSelection.delete(key);
        });
        const summaryMarkup = `
          <div class="settings-artifact-summary">
            <div class="muted">${escapeHtml(projectScanSummaryText(discoveredProjectCount(), connectedProjectCount(), excludedTotal))}</div>
            <div class="button-row">
              ${appState.settingsProjectFeedback ? `<span class="settings-inline-feedback" role="status">${escapeHtml(appState.settingsProjectFeedback)}</span>` : ""}
              <button id="settingsDiscoverAgentsButton" class="button button-primary button-small" type="button">${escapeHtml(t("actions.discoverProjects"))}</button>
              <button class="button button-secondary button-small" type="button" data-settings-connect-selected-projects="true" ${appState.settingsProjectSelection.size || appState.settingsArtifactCandidateSelection.size ? "" : "disabled"}>${escapeHtml(appState.settingsArtifactCandidateSelection.size
                ? t("actions.attachSelectedFiles").replace("{count}", appState.settingsArtifactCandidateSelection.size)
                : t("actions.attachSelected"))}</button>
              <button class="button button-ghost button-small" type="button" data-settings-exclude-selected-projects="true" ${appState.settingsProjectSelection.size || appState.settingsArtifactCandidateSelection.size ? "" : "disabled"}>${escapeHtml(appState.settingsArtifactCandidateSelection.size
                ? t("actions.excludeSelectedFiles").replace("{count}", appState.settingsArtifactCandidateSelection.size)
                : t("actions.excludeSelected"))}</button>
            </div>
          </div>
        `;
        if (!groups.length) {
          const emptyText = appState.agentDiscoveryPayload
            ? (appState.settingsProjectSearch.trim() ? t("settings.noProjectMatches") : content.noProjects)
            : t("settings.projectDiscoveryHint");
          return `${summaryMarkup}<div class="settings-list-viewport">${issueMarkup}${errorMarkup}<div class="settings-empty">${escapeHtml(emptyText)}</div></div>`;
        }
        const renderProjectRows = (projectGroups, excluded = false) => projectGroups.length
          ? projectGroups.map((group) => {
          const defaultConnectLabel = group.suggestedCount
            ? content.acceptSuggestedShort.replace("{count}", group.suggestedCount)
            : content.noSuggestionsShort;
          const pendingCount = group.suggestedCount + group.pendingCount;
          const scopeKey = group.scopeIndexes.join(",");
          const expanded = appState.expandedAgentScopeKey === scopeKey;
          const canSelect = !excluded && pendingCount > 0;
          const feedback = appState.agentDiscoveryFeedback?.scopeKey === scopeKey
            ? `<div class="agent-inline-feedback" role="status">${escapeHtml(appState.agentDiscoveryFeedback.message)}</div>`
            : "";
          return `
            <div class="settings-row settings-agent-scope-row">
              <div class="settings-row-copy">
                <div class="settings-row-copy-top">
                  ${canSelect ? `<input class="settings-agent-select" type="checkbox" data-settings-agent-select="${escapeAttribute(agentProjectGroupKey(group))}" aria-label="${escapeAttribute(t("settings.selectProject").replace("{name}", group.displayName))}" ${appState.settingsProjectSelection.has(agentProjectGroupKey(group)) ? "checked" : ""} />` : ""}
                  <div class="settings-row-title">${escapeHtml(group.displayName)}</div>
                </div>
                <div class="settings-row-meta settings-row-path">${escapeHtml(group.rootPath)}</div>
                <div class="settings-agent-project-summary">
                  ${excluded
                    ? `<span class="settings-agent-project-status">${escapeHtml(content.ignoredFiles.replace("{count}", group.ignoredCount))}</span>`
                    : `
                      ${group.suggestedCount
                        ? `<button class="settings-inline-link settings-agent-project-status" type="button" data-settings-agent-detail-target="suggested" data-settings-agent-details="${scopeKey}" aria-expanded="${expanded}">${escapeHtml(content.suggestedFiles.replace("{count}", group.suggestedCount))}</button>`
                        : `<span class="settings-agent-project-status">${escapeHtml(content.suggestedFiles.replace("{count}", 0))}</span>`}
                      ${group.pendingCount
                        ? `<button class="settings-inline-link" type="button" data-settings-agent-detail-target="pending" data-settings-agent-details="${scopeKey}" aria-expanded="${expanded}">${escapeHtml(content.pendingFiles.replace("{count}", group.pendingCount))}</button>`
                        : `<span>${escapeHtml(content.pendingFiles.replace("{count}", 0))}</span>`}
                      <span>${escapeHtml(content.connectedFiles.replace("{count}", group.alreadyIndexedPaths.length))}</span>
                      ${group.ignoredCount ? `<span>${escapeHtml(content.ignoredFiles.replace("{count}", group.ignoredCount))}</span>` : ""}
                      ${pendingCount ? `<button class="settings-inline-link" type="button" data-settings-agent-details="${scopeKey}" aria-expanded="${expanded}">${escapeHtml(expanded ? content.collapseScope : content.inspectScope)}</button>` : ""}
                    `}
                </div>
                ${feedback}
              </div>
              ${excluded ? `<div class="button-row">
                <button class="button button-secondary button-small settings-agent-scope-action" type="button" data-settings-restore-project="${escapeAttribute(group.rootPath)}">${escapeHtml(content.restoreProject)}</button>
              </div>` : (group.suggestedCount ? `<div class="button-row">
                <button class="button button-primary button-small settings-agent-scope-action" type="button" data-settings-agent-connect-suggested="${group.scopeIndexes.join(",")}" aria-label="${escapeAttribute(defaultConnectLabel)}" title="${escapeAttribute(defaultConnectLabel)}">${escapeHtml(defaultConnectLabel)}</button>
                ${group.ignoredCount ? `<button class="button button-secondary button-small settings-agent-scope-action" type="button" data-settings-restore-project="${escapeAttribute(group.rootPath)}">${escapeHtml(content.restoreProject)}</button>` : ""}
              </div>` : (group.ignoredCount ? `<div class="button-row">
                <button class="button button-secondary button-small settings-agent-scope-action" type="button" data-settings-restore-project="${escapeAttribute(group.rootPath)}">${escapeHtml(content.restoreProject)}</button>
              </div>` : ""))}
              ${excluded ? "" : renderAgentScopeInlineDetail(group, content)}
            </div>
          `;
        }).join("")
          : (excluded ? `<div class="settings-empty">${escapeHtml(content.noExcludedProjects)}</div>` : "");
        const activeGroups = groups.filter((group) => !isExcludedAgentProject(group));
        const excludedGroups = groups.filter(isExcludedAgentProject);
        const excludedMarkup = excludedGroups.length
          ? renderSettingsGroup({
              key: "projectExcluded",
              title: content.excludedProjects,
              count: countText(excludedTotal),
              bodyHtml: renderProjectRows(excludedGroups, true)
            })
          : "";
        return summaryMarkup
          + `<div class="settings-list-viewport">${issueMarkup}${errorMarkup}${renderProjectRows(activeGroups)}${excludedMarkup}</div>`;
      }

      function renderSettingsPanelPreservingProjectScroll(focusSelector = "") {
        const viewport = els.settingsAgentProjectList?.querySelector(".settings-list-viewport");
        appState.settingsProjectScrollTop = viewport?.scrollTop ?? appState.settingsProjectScrollTop;
        renderSettingsPanel();
        const nextViewport = els.settingsAgentProjectList?.querySelector(".settings-list-viewport");
        if (nextViewport) nextViewport.scrollTop = appState.settingsProjectScrollTop;
        if (focusSelector) els.settingsAgentProjectList?.querySelector(focusSelector)?.focus({ preventScroll: true });
      }

      function bindSettingsAgentProjectActions() {
        if (!els.settingsAgentProjectList) return;
        els.settingsAgentProjectList.querySelector("#settingsDiscoverAgentsButton")?.addEventListener("click", loadAgentProjectsInSettings);
        els.settingsAgentProjectList.querySelectorAll("[data-settings-agent-select]").forEach((checkbox) => {
          checkbox.addEventListener("change", () => {
            const key = checkbox.dataset.settingsAgentSelect;
            if (checkbox.checked) {
              appState.settingsArtifactCandidateSelection.clear();
              appState.settingsProjectSelection.add(key);
            }
            else appState.settingsProjectSelection.delete(key);
            renderSettingsPanelPreservingProjectScroll(`[data-settings-agent-select="${CSS.escape(key)}"]`);
          });
        });
        els.settingsAgentProjectList.querySelector("[data-settings-connect-selected-projects]")?.addEventListener("click", () => {
          if (appState.settingsArtifactCandidateSelection.size) acceptSelectedArtifactCandidates();
          else connectSelectedAgentProjects();
        });
        els.settingsAgentProjectList.querySelector("[data-settings-exclude-selected-projects]")?.addEventListener("click", () => {
          if (appState.settingsArtifactCandidateSelection.size) excludeSelectedArtifactCandidates();
          else excludeSelectedAgentProjects();
        });
        els.settingsAgentProjectList.querySelectorAll("[data-settings-agent-detail-retry]").forEach((button) => {
          button.addEventListener("click", () => {
            const indexes = String(button.dataset.settingsAgentDetailRetry || "")
              .split(",")
              .map(Number)
              .filter(Number.isInteger);
            appState.agentArtifactPreviewByScope.delete(button.dataset.settingsAgentDetailRetry);
            connectAgentScopesInSettings(indexes, false);
          });
        });
        els.settingsAgentProjectList.querySelectorAll("[data-settings-restore-project]").forEach((button) => {
          button.addEventListener("click", () => restoreExcludedAgentProject(button.dataset.settingsRestoreProject));
        });
        els.settingsAgentProjectList.querySelectorAll("[data-settings-agent-details]").forEach((button) => {
          button.addEventListener("click", () => {
            const indexes = String(button.dataset.settingsAgentDetails || "")
              .split(",")
              .map(Number)
              .filter(Number.isInteger);
            const target = button.dataset.settingsAgentDetailTarget;
            if (target) revealAgentDetailGroup(indexes, target).catch((error) => {
              appState.agentDiscoveryError = normalizeError(error);
              renderSettingsPanelPreservingProjectScroll();
            });
            else toggleAgentScopeDetails(indexes);
          });
        });
        els.settingsAgentProjectList.querySelectorAll("[data-settings-agent-candidate-select]").forEach((checkbox) => {
          checkbox.addEventListener("change", () => {
            const candidateId = Number(checkbox.dataset.settingsAgentCandidateSelect);
            appState.settingsProjectSelection.clear();
            if (checkbox.checked) appState.settingsArtifactCandidateSelection.add(candidateId);
            else appState.settingsArtifactCandidateSelection.delete(candidateId);
            renderSettingsPanelPreservingProjectScroll(`[data-settings-agent-candidate-select="${candidateId}"]`);
          });
        });
        els.settingsAgentProjectList.querySelectorAll("[data-settings-agent-candidate-group]").forEach((checkbox) => {
          checkbox.addEventListener("change", () => {
            const status = checkbox.dataset.settingsAgentCandidateGroup;
            const candidateIds = (appState.agentArtifactPreview?.reviewCandidates || [])
              .filter((candidate) => candidate.status === status)
              .map((candidate) => Number(candidate.id))
              .filter(Number.isInteger);
            appState.settingsProjectSelection.clear();
            candidateIds.forEach((candidateId) => {
              if (checkbox.checked) appState.settingsArtifactCandidateSelection.add(candidateId);
              else appState.settingsArtifactCandidateSelection.delete(candidateId);
            });
            renderSettingsPanelPreservingProjectScroll(`[data-settings-agent-candidate-group="${CSS.escape(status)}"]`);
          });
        });
        els.settingsAgentProjectList.querySelectorAll("[data-settings-agent-connect-suggested]").forEach((button) => {
          button.addEventListener("click", () => {
            const indexes = String(button.dataset.settingsAgentConnectSuggested || "")
              .split(",")
              .map(Number)
              .filter(Number.isInteger);
            connectAgentScopesInSettings(indexes, true);
          });
        });
        els.settingsAgentProjectList.querySelectorAll("[data-settings-agent-candidate]").forEach((button) => {
          button.addEventListener("click", () => decideSingleArtifactInSettings(Number(button.dataset.settingsAgentCandidate), button.dataset.settingsAgentDecision));
        });
      }

      let settingsSectionSwitchesBound = false;
      let settingsSearchFieldsBound = false;
      const settingsSearchCollapseTimers = new WeakMap();

      function setSettingsSearchExpanded(field, expanded) {
        if (!field) return;
        const pending = settingsSearchCollapseTimers.get(field);
        if (pending) {
          clearTimeout(pending);
          settingsSearchCollapseTimers.delete(field);
        }
        field.classList.toggle("is-expanded", expanded);
      }

      function scheduleSettingsSearchCollapse(field) {
        if (!field) return;
        const pending = settingsSearchCollapseTimers.get(field);
        if (pending) clearTimeout(pending);
        const timer = window.setTimeout(() => {
          settingsSearchCollapseTimers.delete(field);
          const input = field.querySelector("input");
          if (input?.value || field.matches(":hover") || field.contains(document.activeElement)) return;
          field.classList.remove("is-expanded");
        }, 1200);
        settingsSearchCollapseTimers.set(field, timer);
      }

      function bindSettingsSearchFieldsOnce() {
        if (settingsSearchFieldsBound) return;
        settingsSearchFieldsBound = true;
        document.querySelectorAll("[data-settings-search-field]").forEach((field) => {
          const input = field.querySelector("input");
          field.addEventListener("pointerenter", () => setSettingsSearchExpanded(field, true));
          field.addEventListener("pointerleave", () => scheduleSettingsSearchCollapse(field));
          field.addEventListener("click", () => {
            setSettingsSearchExpanded(field, true);
            input?.focus({ preventScroll: true });
          });
          input?.addEventListener("focus", () => setSettingsSearchExpanded(field, true));
          input?.addEventListener("blur", () => scheduleSettingsSearchCollapse(field));
          input?.addEventListener("keydown", (event) => {
            const popup = els.settingsSearchSuggestionPopup;
            if ((event.key === "ArrowDown" || event.key === "ArrowUp") && popup?.classList.contains("open")) {
              event.preventDefault();
              const options = [...popup.querySelectorAll("[data-settings-search-suggestion]")];
              const current = options.findIndex((option) => option.classList.contains("active"));
              const next = (current + (event.key === "ArrowDown" ? 1 : -1) + options.length) % options.length;
              options.forEach((option, index) => option.classList.toggle("active", index === next));
              return;
            }
            if (event.key === "Enter" && popup?.classList.contains("open")) {
              const active = popup.querySelector("[data-settings-search-suggestion].active") || popup.querySelector("[data-settings-search-suggestion]");
              if (active) { event.preventDefault(); active.click(); return; }
            }
            if (event.key !== "Escape" || input.value) return;
            event.preventDefault();
            event.stopPropagation();
            input.blur();
            field.classList.remove("is-expanded");
          });
        });
      }

      function showSettingsSearchSuggestions(input) {
        const popup = els.settingsSearchSuggestionPopup;
        const kind = input?.dataset.settingsSuggestionKind;
        const query = String(input?.value || "").trim().toLowerCase();
        if (!popup || !kind || !query || document.activeElement !== input) { popup?.classList.remove("open"); return; }
        const candidates = kind === "source"
          ? appState.libraries.map((library) => ({ label: library.name || library.rootPath, sublabel: library.rootPath }))
          : kind === "project"
            ? groupedAgentScopesForSettings().map((group) => ({ label: group.displayName, sublabel: group.rootPath }))
            : appState.discoveredArtifactSkills.map((skill) => ({ label: skill.name, sublabel: skill.outputPath || skill.manifestPath || "" }));
        const values = candidates.filter((item) => `${item.label}\n${item.sublabel}`.toLowerCase().includes(query)).slice(0, 8);
        if (!values.length) { popup.classList.remove("open"); return; }
        popup.innerHTML = values.map((item, index) => `<div class="recent-search-option ${index === 0 ? "active" : ""}" role="option" data-settings-search-suggestion="${index}" data-settings-search-value="${escapeAttribute(item.label)}"><span class="recent-search-text">${escapeHtml(item.label)}</span>${item.sublabel ? `<span class="muted">${escapeHtml(item.sublabel)}</span>` : ""}</div>`).join("");
        popup.querySelectorAll("[data-settings-search-suggestion]").forEach((node) => node.addEventListener("click", () => {
          input.value = node.dataset.settingsSearchValue || "";
          input.dispatchEvent(new Event("input", { bubbles: true }));
          popup.classList.remove("open");
          input.focus();
        }));
        positionRecentSearchPopup(input, popup);
        popup.classList.add("open");
      }

      function bindSettingsSectionSwitchesOnce() {
        if (settingsSectionSwitchesBound || !els.settingsScrim) return;
        settingsSectionSwitchesBound = true;
        els.settingsScrim.addEventListener("focusin", (event) => {
          const tab = event.target.closest?.('[role="tab"]');
          if (tab?.matches("[data-settings-artifact-section]")) {
            appState.settingsKeyboardTablist = "artifact";
            return;
          }
          if (tab?.matches("[data-settings-library-section]")) {
            appState.settingsKeyboardTablist = "library";
            return;
          }
          if (tab?.matches("[data-settings-tab]")) {
            appState.settingsKeyboardTablist = "settings";
            return;
          }
          if (event.target.closest?.("input, textarea, select, button, a, [contenteditable='true']")) {
            appState.settingsKeyboardTablist = "";
          }
        });
        els.settingsScrim.addEventListener("click", (event) => {
          if (event.target.closest("[data-settings-tab]")) {
            appState.settingsKeyboardTablist = "settings";
            return;
          }
          const artifactButton = event.target.closest("[data-settings-artifact-section]");
          if (artifactButton) {
            appState.settingsKeyboardTablist = "artifact";
            appState.settingsArtifactSection = artifactButton.dataset.settingsArtifactSection || "projects";
            renderSettingsPanel();
            artifactButton.focus();
            if (appState.settingsArtifactSection === "projects") {
              restoreCachedAgentProjectsInSettings().catch(() => {});
            }
            return;
          }
          const libraryButton = event.target.closest("[data-settings-library-section]");
          if (libraryButton) {
            appState.settingsKeyboardTablist = "library";
            appState.settingsLibrarySection = libraryButton.dataset.settingsLibrarySection || "folders";
            renderSettingsPanel();
            libraryButton.focus();
            return;
          }
          if (event.target.closest("input, textarea, select, button, a, [contenteditable='true']")) {
            appState.settingsKeyboardTablist = "";
          }
        });
      }

      function renderSettingsPanel() {
        els.settingsScrim.classList.toggle("open", appState.isSettingsOpen);
        els.settingsScrim.setAttribute("aria-hidden", appState.isSettingsOpen ? "false" : "true");
        if (!appState.isSettingsOpen) return;
        bindSettingsSectionSwitchesOnce();
        bindSettingsSearchFieldsOnce();
        renderNbskillAgentToolbar();
        if (els.settingsDiscoverAgentsButton) {
          const discoverProjectsLabel = t("actions.discoverProjects");
          els.settingsDiscoverAgentsButton.textContent = discoverProjectsLabel;
          els.settingsDiscoverAgentsButton.setAttribute("aria-label", discoverProjectsLabel);
          els.settingsDiscoverAgentsButton.title = discoverProjectsLabel;
        }
        els.settingsSkillsSection.hidden = appState.settingsTab !== "skills";
        els.settingsLibrariesSection.hidden = appState.settingsTab !== "libraries";
        els.settingsTagsSection.hidden = appState.settingsTab !== "tags";
        els.settingsPreferencesSection.hidden = appState.settingsTab !== "preferences";
        els.settingsThumbnailsSection.hidden = appState.settingsTab !== "thumbnails";
        maybeCheckUpdatesForPreferences();
        if (els.settingsSourceSearchInput) {
          els.settingsSourceSearchInput.value = appState.settingsSourceSearch;
          els.settingsSourceSearchInput.closest("[data-settings-search-field]")?.setAttribute("data-has-value", appState.settingsSourceSearch ? "true" : "false");
        }
        if (els.settingsProjectSearchInput) {
          els.settingsProjectSearchInput.value = appState.settingsProjectSearch;
          els.settingsProjectSearchInput.closest("[data-settings-search-field]")?.setAttribute("data-has-value", appState.settingsProjectSearch ? "true" : "false");
        }
        if (els.settingsSkillSearchInput) {
          els.settingsSkillSearchInput.value = appState.settingsSkillSearch;
          els.settingsSkillSearchInput.closest("[data-settings-search-field]")?.setAttribute("data-has-value", appState.settingsSkillSearch ? "true" : "false");
        }
        if (els.settingsProjectSortButton) els.settingsProjectSortButton.dataset.tooltip = t("settings.projectSortLabel");
        if (els.settingsSkillSortButton) els.settingsSkillSortButton.dataset.tooltip = t("settings.skillSortLabel");
        renderSettingsSourceSortMenu();
        renderSettingsArtifactSortMenus();
        document.querySelectorAll("[data-settings-tab]").forEach((node) => {
          const selected = node.dataset.settingsTab === appState.settingsTab;
          node.classList.toggle("active", selected);
          node.setAttribute("aria-selected", selected ? "true" : "false");
          node.tabIndex = selected ? 0 : -1;
        });
        document.querySelectorAll("[data-settings-artifact-section]").forEach((node) => {
          const selected = node.dataset.settingsArtifactSection === appState.settingsArtifactSection;
          node.classList.toggle("active", selected);
          node.setAttribute("aria-selected", selected ? "true" : "false");
          node.tabIndex = selected ? 0 : -1;
        });
        document.getElementById("settingsProjectArtifactsSubsection").hidden = appState.settingsArtifactSection !== "projects";
        document.getElementById("settingsSkillArtifactsSubsection").hidden = appState.settingsArtifactSection !== "skills";
        document.querySelectorAll("[data-settings-library-section]").forEach((node) => {
          const selected = node.dataset.settingsLibrarySection === appState.settingsLibrarySection;
          node.classList.toggle("active", selected);
          node.setAttribute("aria-selected", selected ? "true" : "false");
          node.tabIndex = selected ? 0 : -1;
        });

        if (els.settingsAgentProjectList) {
          const previousProjectViewport = els.settingsAgentProjectList.querySelector(".settings-list-viewport");
          if (previousProjectViewport) appState.settingsProjectScrollTop = previousProjectViewport.scrollTop;
          els.settingsAgentProjectList.innerHTML = renderSettingsAgentProjectContent();
          bindSettingsAgentProjectActions();
          const nextProjectViewport = els.settingsAgentProjectList.querySelector(".settings-list-viewport");
          if (nextProjectViewport) nextProjectViewport.scrollTop = appState.settingsProjectScrollTop;
        }

        const sourceKeyword = appState.settingsSourceSearch.trim().toLowerCase();
        const filteredLibraries = [...appState.libraries]
          .filter((library) => {
            if (!sourceKeyword) return true;
            return `${library.name}\n${library.rootPath}`.toLowerCase().includes(sourceKeyword);
          })
          .sort(sourceSortComparator(appState.settingsSourceSort));
        const folderLibraries = filteredLibraries.filter((library) => library.sourceKind === "folder");
        const fileLibraries = filteredLibraries.filter((library) => library.sourceKind === "file");
        const projectLibraries = filteredLibraries.filter((library) => library.sourceKind === "agent_project");
        const filteredIgnoredItems = [...appState.ignoredItems]
          .filter((item) => {
            if (!sourceKeyword) return true;
            return `${item.fileName}\n${item.filePath}\n${item.libraryName}`.toLowerCase().includes(sourceKeyword);
          })
          .sort((left, right) => String(right.createdAt || "").localeCompare(String(left.createdAt || "")));
        const skillKeyword = appState.settingsSkillSearch.trim().toLowerCase();
        const filteredSkills = [...appState.discoveredArtifactSkills]
          .filter((skill) => {
            if (!skillKeyword) return true;
            return `${skill.name}\n${skill.outputPath || ""}\n${skill.manifestPath || ""}\n${skill.status || ""}`.toLowerCase().includes(skillKeyword);
          })
          .sort((left, right) => {
            const byName = left.name.localeCompare(right.name, appState.language === "en-US" ? "en" : "zh-CN");
            if (appState.settingsSkillSort === "statusThenName") {
              const statusRank = { ready: 0, connected: 1, manual: 2, excluded: 3 };
              const leftRank = statusRank[left.status] ?? 9;
              const rightRank = statusRank[right.status] ?? 9;
              return leftRank - rightRank || byName;
            }
            if (appState.settingsSkillSort === "pathAsc") {
              return String(left.outputPath || "").toLowerCase().localeCompare(String(right.outputPath || "").toLowerCase());
            }
            return byName;
          });
        appState.settingsSkillSelection.forEach((normalizedName) => {
          if (!filteredSkills.some((skill) => skill.normalizedName === normalizedName && (skill.status === "ready" || skill.status === "manual"))) {
            appState.settingsSkillSelection.delete(normalizedName);
          }
        });

        const renderLibraryRows = (libraries) => libraries.length
          ? libraries.map((library) => `
              <div class="settings-row">
                <div class="settings-row-copy">
                  <div class="settings-row-copy-top">
                    <div class="settings-row-title">${escapeHtml(library.name)}</div>
                    <span class="source-kind-badge">${library.sourceKind === "agent_project" ? t("settings.sourceProjects") : (library.sourceKind === "file" ? t("settings.singleFile") : t("settings.folder"))}</span>
                    ${library.skillBinding ? `<span class="source-kind-badge">${escapeHtml(library.skillBinding.displayName)}</span>` : ""}
                    ${library.pathState === "missing" ? `<span class="source-kind-badge">${t("settings.pathMissing")}</span>` : ""}
                  </div>
                  <div class="settings-row-meta settings-row-path">${escapeHtml(library.rootPath)}</div>
                </div>
                <div class="button-row">
                  ${library.sourceKind === "agent_project"
                    ? `<button class="button button-secondary" type="button" data-settings-open-artifact-access="projects">${t("actions.viewArtifactAccess")}</button>`
                    : `<button class="button button-secondary" type="button" data-settings-scan-library="${library.id}">${library.pathState === "missing" ? t("actions.repairPath") : (library.sourceKind === "file" ? t("actions.index") : t("actions.scan"))}</button>`}
                  <button class="button button-ghost" type="button" data-settings-delete-library="${library.id}">${t("actions.remove")}</button>
                </div>
              </div>
            `).join("")
          : `<div class="settings-empty">${t("settings.noGroupContent")}</div>`;

        const libraryGroups = {
          folders: {
            title: t("settings.sourceFolders"),
            bodyHtml: `
              <div class="settings-header">
                <div class="muted">${t("settings.sourceFoldersDescription")}</div>
                <div class="button-row">
                  <button class="button button-primary button-small settings-library-primary-action" type="button" data-settings-add-folder="true">${t("actions.addFolder")}</button>
                </div>
              </div>
              <div class="settings-list-viewport">${renderLibraryRows(folderLibraries)}</div>
            `
          },
          files: {
            title: t("settings.sourceFiles"),
            bodyHtml: `
              <div class="settings-header">
                <div class="muted">${t("settings.sourceFilesDescription")}</div>
                <div class="button-row">
                  <button class="button button-primary button-small settings-library-primary-action" type="button" data-settings-add-file="true">${t("actions.addSingleFile")}</button>
                </div>
              </div>
              <div class="settings-list-viewport">${renderLibraryRows(fileLibraries)}</div>
            `
          },
          projects: {
            title: t("settings.sourceProjects"),
            bodyHtml: `
              <div class="settings-header">
                <div class="muted">${t("settings.sourceProjectsDescription")}</div>
                <div class="button-row">
                  <button class="button button-primary button-small settings-library-primary-action" type="button" data-settings-open-artifact-access="projects">${t("actions.addProject")}</button>
                </div>
              </div>
              <div class="settings-list-viewport">${renderLibraryRows(projectLibraries)}</div>
            `
          }
        };
        const activeLibraryGroup = libraryGroups[appState.settingsLibrarySection] || libraryGroups.folders;
        els.settingsLibrarySectionTitle.textContent = activeLibraryGroup.title;
        els.settingsLibraryList.innerHTML = activeLibraryGroup.bodyHtml;

        const ignoredBody = filteredIgnoredItems.length
          ? `
              <div class="settings-header">
                <div class="muted">${t("settings.ignoredDescription")}</div>
                <div class="button-row">
                  <button class="button button-primary button-small settings-library-primary-action" type="button" data-settings-restore-selected="true" ${appState.settingsIgnoredSelection.size === 0 ? "disabled" : ""}>${t("actions.restoreSelected")}</button>
                </div>

        const runtimeScrollbarGutter = 14;
        const right = Math.round(viewer
          ? viewer.right - runtimeScrollbarGutter
          : (toolbar?.right || window.innerWidth));
        const width = Math.max(300, Math.min(560, right - 24));
        // The native child must include the transient tooltip below the panel,
        // otherwise WebKit clips it even when the HTML itself overflows.
        const hasHistory = readHtmlFindHistory().length > 0;
        return { x: Math.max(12, Math.round(right - width)), y: Math.max(8, Math.round((toolbar?.bottom || 0) + 8)), width, height: appState.htmlFind.replaceExpanded ? (hasHistory ? 148 : 112) : (hasHistory ? 112 : 76) };

      const HTML_FIND_HISTORY_KEY = "nutbook.markdownFindHistory.v1";

        } catch (_) { return []; }
      }

      function recordHtmlFindHistory(value) {
        const query = String(value || "").trim();

        try {
          const next = [query, ...readHtmlFindHistory().filter((item) => item.toLocaleLowerCase() !== query.toLocaleLowerCase())].slice(0, 3);

      function htmlFindContentKey(payload) {

      function queueActiveHtmlFindSurfaceSync({ attach = false } = {}) {
        const itemId = appState.htmlFind.itemId;
        const epoch = appState.htmlFindOverlayEpoch;
        if (!itemId) return Promise.resolve(false);
        const run = async () => {
          if (appState.htmlFindOverlayEpoch !== epoch || appState.htmlFind.itemId !== itemId) {
            return false;
          }
          const payload = activeHtmlFindContentPayload();
          if (!payload || payload.itemId !== itemId) {
            return false;
          }
          const contentKey = htmlFindContentKey(payload);
          if (!attach && appState.htmlFindOverlayLastContentKey === contentKey) return true;
          const bounds = attach ? htmlFindOverlayBounds() : null;
          const result = await invoke(
            attach ? "attach_html_find_overlay_command" : "update_html_find_overlay_command",
            attach ? { ...payload, bounds } : payload
          );
          if (appState.htmlFindOverlayEpoch !== epoch || appState.htmlFind.itemId !== itemId || getActiveTab()?.id !== itemId) {
            if (attach) await invoke("set_html_find_overlay_visibility_command", { itemId, visible: false }).catch(() => false);
            return false;
          }
          if (result === false) return false;
          appState.htmlFindOverlayLastContentKey = contentKey;
          if (attach) appState.htmlFindOverlayLastBoundsKey = JSON.stringify(bounds);
          return true;
        };
        const queued = appState.htmlFindOverlaySyncLane.then(run, run);
        appState.htmlFindOverlaySyncLane = queued.catch(() => false);
        return queued;
      }

      window.__NUTBOOK_HANDLE_HTML_FIND_ACTION__ = async (payload) => {
        const tab = getActiveTab();
        if (!payload || tab?.id !== payload.itemId || tab.preview?.fileType !== "html-runtime" || appState.htmlFind.itemId !== payload.itemId) return;

        appState.htmlFind.itemId = payload.itemId;
        appState.htmlFind.query = String(payload.query || "");
        appState.htmlFind.caseSensitive = Boolean(payload.caseSensitive);
        appState.htmlFind.replaceExpanded = Boolean(payload.replaceExpanded);
        if (payload.action === "layout") {
          appState.htmlFindOverlayLastBoundsKey = null;
          await updateActiveHtmlFindContent();
          await syncActiveHtmlFindLayoutBounds(tab);
          return;
        }
        const query = appState.htmlFind.query;
        const canReplace = appState.htmlEditSession?.itemId === tab.id;
        if (query && ["query", "next", "prev", "replace", "replace_all"].includes(payload.action)) {
          const backwards = payload.action === "prev";
          const action = payload.action;
          const replacement = String(payload.replacement || "");
          const script = `;(()=>{const q=${JSON.stringify(query)}, cs=${Boolean(payload.caseSensitive)}, action=${JSON.stringify(action)}, replacement=${JSON.stringify(replacement)}, itemId=${tab.id};let style=document.getElementById('nutbook-html-find-selection');if(!style){style=document.createElement('style');style.id='nutbook-html-find-selection';style.textContent='::selection{background:rgba(255,159,67,.68)!important;color:inherit!important}::-moz-selection{background:rgba(255,159,67,.68)!important;color:inherit!important}';document.head.append(style);}const text=String(document.body?.innerText||"");const source=cs?text:text.toLocaleLowerCase();const needle=cs?q:q.toLocaleLowerCase();let total=0,at=0;while(needle&&(at=source.indexOf(needle,at))>=0){total++;at+=Math.max(1,needle.length);}let changed=0,deferred=false;const report=(current=1)=>{document.title='__NUTBOOK_HTML_FIND_RESULT__:'+JSON.stringify({itemId,total,changed,current});};const revealSelection=()=>{const selection=window.getSelection?.();if(!selection?.rangeCount)return;const node=selection.getRangeAt(0).commonAncestorContainer;const anchor=node?.nodeType===Node.ELEMENT_NODE?node:node?.parentElement;anchor?.scrollIntoView?.({block:'nearest',inline:'nearest'});};const find=()=>{if(['query','next','prev'].includes(action)){const handled=window.__NUTBOOK_FIND_ACROSS_PRESENTATION_PAGES__?.({query:q,caseSensitive:cs,backwards:${backwards},action,done:report});if(handled){deferred=true;return false;}}const matched=window.find(q,cs,${backwards},true,false,false,false);if(matched)revealSelection();return matched;};if(action==='replace'&&window.__NUTBOOK_HTML_EDIT__?.isEditing?.()&&find()){changed=document.execCommand('insertText',false,replacement)?1:0;}else if(action==='replace_all'&&window.__NUTBOOK_HTML_EDIT__?.isEditing?.()){for(let i=0;i<1000&&find();i++){if(!document.execCommand('insertText',false,replacement))break;changed++;}}else{find();}if(!deferred)report();})();`;
          await invoke("eval_html_runtime_script_command", { itemId: tab.id, script });

      window.__NUTBOOK_HANDLE_HTML_FIND_RESULT__ = (payload) => {
        if (!payload || appState.htmlFind.itemId !== payload.itemId) return;
        const total = Number(payload.total || 0);
        const current = Math.max(1, Math.min(total || 1, Number(payload.current || 1)));
        appState.htmlFind.count = total ? `${current}/${total}` : "0/0";
        updateActiveHtmlFindContent().catch(() => {});

      function getOpenTabs() {
        return [...appState.tabs, ...appState.runtimeSessions];

      function getOpenTab(tabId) {
        return getOpenTabs().find((tab) => tab.id === tabId) || null;

      function nextRuntimeNavigationEpoch() {
        appState.runtimeNavigationEpoch += 1;
        return appState.runtimeNavigationEpoch;
      }

      function isRuntimeNavigationCurrent(epoch) {
        return epoch === appState.runtimeNavigationEpoch;
      }

      async function convergeInactiveRuntimeSurfaces(nextTabId, navigationEpoch) {
        const nextTab = getOpenTab(nextTabId);
        const keepItemId = nextTab?.preview?.fileType === "html-runtime" ? nextTab.id : null;
        const staleItemIds = appState.runtimeSessions
          .map((session) => session.id)
          .filter((itemId) => itemId !== keepItemId);
        for (const itemId of staleItemIds) {
          if (!isRuntimeNavigationCurrent(navigationEpoch)) return false;
          const token = nextRuntimeSurfaceToken(itemId);
          await syncHtmlEditReadonlyPatchSurfaceToken(itemId, token).catch(() => {});
          if (!isRuntimeNavigationCurrent(navigationEpoch)) return false;
          await hideRuntimeSessionSurfaces(itemId, {
            force: true,
            token,
            navigationEpoch,
            keepItemId
          });
          if (!isRuntimeNavigationCurrent(navigationEpoch)) return false;
        }
        if (appState.activeRuntimeHostId !== keepItemId) {
          appState.activeRuntimeHostId = null;
          appState.runtimeHostLastBoundsKey = null;
        }
        return true;
      }

      async function scheduleRuntimeCleanupAfterTabSwitch(previousTabId, nextTabId = null) {
        const navigationEpoch = nextRuntimeNavigationEpoch();
        const previousTab = getOpenTab(previousTabId);
        if (previousTab?.preview?.fileType === "html-runtime") {
          await cancelHtmlRemoveConfirmOverlay(previousTabId, { restore: false }).catch(() => {});
        }
        if (!isRuntimeNavigationCurrent(navigationEpoch)) return false;
        appState.runtimeControlsOverlayExpanded = false;
        appState.runtimeControlsOverlayMode = "default";
        cleanupRuntimeHostSync();
        return convergeInactiveRuntimeSurfaces(nextTabId, navigationEpoch);
      }

      async function isOpenTabSourceMissing(tab) {
        if (!tab?.id || !appState.isTauri) return false;
        try {
          await maybeSyncFilesystemState(true);
          const detail = normalizeItemDetail(await invoke("get_item_detail", { itemId: tab.id }));
          return isItemPathMissing(detail) || isLibraryPathMissing(detail.libraryId);
        } catch (error) {
          return isMissingIndexedItemError(error);
        }
      }

      async function closeOpenTab(tabId) {
        if (appState.htmlEditSession?.itemId === tabId) {
          const canLeaveHtmlEdit = await confirmHtmlEditLeaveIfNeeded(tabId);
          if (!canLeaveHtmlEdit) return false;
        }
        captureActiveMarkdownScroll();
        if (appState.htmlRemoveConfirmItemId === tabId) {
          await cancelHtmlRemoveConfirmOverlay(tabId, { restore: false });
        }
        invalidateItemOpenToken(tabId);
        const tab = getOpenTab(tabId);
        let sourcePathMissing = false;
        const isClosingActiveTab = appState.activeTabId === tabId;
        const remainingTabsAfterClose = getOpenTabs().filter((entry) => entry.id !== tabId);
        const nextActiveTabId = isClosingActiveTab
          ? (remainingTabsAfterClose[remainingTabsAfterClose.length - 1]?.id ?? null)
          : appState.activeTabId;
        if (tab?.preview?.fileType === "markdown") {
          if (tab.id === appState.activeTabId || tab.id === appState.activeMarkdownEditorTabId) {
            // 关闭前收敛标题输入框未提交的值（P0 统一收敛）。标题输入框只属于
            // 当前显示 tab；composition 未结束时不得强制提交，阻止关闭。
            if (tab.id === appState.activeTabId && !convergePendingMarkdownTitle(tab)) {
              setStatus("标题输入法组合中，无法关闭；请先确认输入", "warn");
              return false;
            }
            captureActiveMarkdownDraft();
          }
          sourcePathMissing = await isOpenTabSourceMissing(tab);
          if (sourcePathMissing) {
            tab.isDirty = false;
            tab.draft = tab.markdownBaseline ?? tab.preview.raw ?? "";
          } else if (isMarkdownTabDirty(tab)) {
            const fileName = tab.item?.fileName || tab.preview?.title || "Markdown";
            const closeChoice = await confirmMarkdownUnsavedClose(fileName);
            if (closeChoice === "continue") return false;
            if (closeChoice === "save") {
              const saved = await saveMarkdownTab(tab, { renderAfter: false });
              if (!saved) return false;
            } else {
              tab.draft = tab.markdownBaseline ?? tab.preview.raw ?? "";
              tab.isDirty = false;
            }
          }
          // 先使会话失效，再销毁编辑器。若文件选择/复制 promise 随后才返回，
          // insertMarkdownCoverAssetForTab 会识别 closed 并释放对应 staged lease，
          // 不会把晚到结果插回已关闭的 tab。
          tab.closed = true;
          destroyMarkdownEditorSession(tab.id);
          // PR C / C2：关闭/放弃时释放本次会话的 staged cover lease。只清理
          // "本会话新建、磁盘 baseline 未引用、当前 draft 未引用"的 staged 文件；
          // 已保存（draft 含封面）或正文仍引用的图片保留。fire-and-forget。
          releaseMarkdownCoverLeaseForTab(tab, tab.coverOperationGeneration, { quiet: true });
          if (isClosingActiveTab) {
            appState.activeTabId = nextActiveTabId;
          }
        }
        if (tab?.preview?.fileType === "html-runtime") {
          if (isClosingActiveTab) {
            appState.activeTabId = nextActiveTabId;
          }
          cleanupRuntimeHostSync();
          const closingSurfaceToken = nextRuntimeSurfaceToken(tabId);
          await syncHtmlEditReadonlyPatchSurfaceToken(tabId, closingSurfaceToken).catch(() => {});
          await hideRuntimeSessionSurfaces(tabId, { force: true });
          await releaseRuntimeShellState({ itemId: tabId });
          await hideRuntimeSessionSurfaces(tabId, { force: true });
          try {
            await invoke("close_html_window", { itemId: tabId });
          } catch (error) {
            setStatus(`关闭 HTML Runtime 失败：${normalizeError(error)}`, "error");
          }
          appState.runtimeHiddenSurfaceIds.delete(tabId);
          appState.runtimeViewStateSurfaceTokens.delete(tabId);
          appState.runtimeSessions = appState.runtimeSessions.filter((session) => session.id !== tabId);
        } else {
          appState.tabs = appState.tabs.filter((tab) => tab.id !== tabId);
        }
        appState.markdownScrollByTab.delete(tabId);
        appState.markdownOutlineCollapsedByTab.delete(tabId);

        if (isClosingActiveTab) {
          appState.activeTabId = nextActiveTabId;
        }

        const nextActiveTab = getActiveTab();
        if (nextActiveTab?.preview?.fileType === "html-runtime") {
          appState.runtimeControlsOverlayExpanded = false;
          appState.runtimeControlsOverlayMode = "default";
        } else {
          hideInactiveRuntimeHosts().catch(() => {});
        }

        if (!getActiveTab()) {
          await releaseRuntimeShellState({ itemId: null });
        }
        if (tab?.preview?.fileType === "markdown" && sourcePathMissing) {
          setStatus(`“${tab.item?.fileName || tab.preview?.title || "Markdown"}”的路径已失效，已关闭本地标签页。`, "warn");
        }
        return true;
      }
