      function searchPlaceholderValues() {
        const languages = Object.keys(i18n?.translations || {});
        return new Set(languages.map((language) => i18n?.lookup?.("home.searchPlaceholder", language)).filter(Boolean));
      }

      function normalizeSearchKeyword(value) {
        const keyword = String(value || "").trim();
        if (!keyword) return "";
        return searchPlaceholderValues().has(keyword) ? "" : keyword;
      }

      function clearPollutedSearchValues() {
        const placeholders = searchPlaceholderValues();
        [els.searchInput].forEach((input) => {
          if (input && placeholders.has(String(input.value || "").trim())) {
            input.value = "";
          }
        });
      }

      // ===== A2 最近搜索：本地历史存储 + 共享 popup coordinator =====
      // 历史是用户数据：只存本机 localStorage，词条用 escape helper 渲染并整体
      // data-i18n-skip，绝不进入 i18n 翻译；读写都防御性捕获异常。
      const RECENT_SEARCHES_KEY = "nutbook.recentSearches.v1";
      const RECENT_SEARCHES_MAX = 3;
      const RECENT_SEARCH_MAX_LENGTH = 200;

      function readRecentSearches() {
        try {
          const raw = window.localStorage?.getItem(RECENT_SEARCHES_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed
            .filter((item) => typeof item === "string" && item.trim().length > 0 && item.length <= RECENT_SEARCH_MAX_LENGTH)
            .slice(0, RECENT_SEARCHES_MAX);
        } catch (_) {
          return [];
        }
      }

      function writeRecentSearches(items) {
        try {
          const normalized = items
            .filter((item) => typeof item === "string" && item.trim().length > 0 && item.length <= RECENT_SEARCH_MAX_LENGTH)
            .slice(0, RECENT_SEARCHES_MAX);
          const storage = window.localStorage;
          if (!storage) return;
          if (normalized.length) {
            storage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(normalized));
          } else {
            storage.removeItem(RECENT_SEARCHES_KEY);
          }
        } catch (_) {
          // 历史只是本地偏好：读写失败静默降级，搜索主链路不受影响。
        }
      }

      function recordRecentSearch(query) {
        const keyword = normalizeSearchKeyword(query);
        if (!keyword) return;
        const current = readRecentSearches();
        // 大小写不敏感去重，保留最新一次的显示文本，最新在前，最多三条。
        const deduped = current.filter((item) => item.toLowerCase() !== keyword.toLowerCase());
        deduped.unshift(keyword);
        writeRecentSearches(deduped);
      }

      // 两个搜索框共享一个 coordinator 与 active anchor；popup 是单个 fixed 元素。
      let recentSearchAnchor = null;
      let recentSearchActiveIndex = -1;

      function isRecentSearchPopupOpen() {
        return Boolean(els.recentSearchPopup?.classList.contains("open"));
      }

      function renderRecentSearchPopup() {
        const popup = els.recentSearchPopup;
        if (!popup) return;
        popup.dataset.searchMode = "history";
        const items = readRecentSearches();
        if (!items.length) {
          closeRecentSearchPopup();
          return;
        }
        popup.setAttribute("aria-label", t("home.recentSearches"));
        popup.innerHTML = items.map((item, index) => `
          <div class="recent-search-option ${index === recentSearchActiveIndex ? "active" : ""}" role="option" id="recent-search-option-${index}" aria-selected="${index === recentSearchActiveIndex}" data-recent-index="${index}">
            <span class="recent-search-text">${escapeHtml(item)}</span>
            <button type="button" class="recent-search-remove" tabindex="-1" data-recent-index="${index}" aria-label="${escapeAttribute(formatTranslation("home.removeRecentSearch", { word: item }))}">×</button>
          </div>
        `).join("");
        popup.querySelectorAll(".recent-search-remove").forEach((node) => {
          node.addEventListener("pointerdown", (event) => {
            // 阻止默认行为：不让输入框 blur，也不触发 outside-click 关闭；click 阶段才删除。
            event.preventDefault();
          });
          node.addEventListener("click", (event) => {
            event.stopPropagation();
            removeRecentSearchItem(Number(node.dataset.recentIndex));
          });
        });
      }

      function positionRecentSearchPopup(anchor, popup = els.recentSearchPopup) {
        if (!popup) return;
        const pad = 8;
        const popupWidth = Math.min(Math.max(anchor.offsetWidth, 232), window.innerWidth - pad * 2);
        const rect = anchor.getBoundingClientRect();
        const left = Math.max(pad, Math.min(rect.left, window.innerWidth - pad - popupWidth));
        popup.style.width = `${popupWidth}px`;
        popup.style.left = `${left}px`;
        popup.style.top = `${rect.bottom + 6}px`;
      }

      function openRecentSearchPopup(anchor) {
        const popup = els.recentSearchPopup;
        if (!popup || !anchor) return;
        // 只在主页 home-mode、输入为空且 focus 时显示；文档模式绝不渲染普通 DOM popup。
        if (!els.mainShell.classList.contains("home-mode")) return;
        if (document.activeElement !== anchor) return;
        if (String(anchor.value || "").trim()) return;
        const items = readRecentSearches();
        if (!items.length) return;
        recentSearchAnchor = anchor;
        if (recentSearchActiveIndex < 0 || recentSearchActiveIndex >= items.length) {
          recentSearchActiveIndex = 0;
        }
        renderRecentSearchPopup();
        positionRecentSearchPopup(anchor);
        popup.classList.add("open");
        anchor.setAttribute("aria-expanded", "true");
        anchor.setAttribute("aria-activedescendant", `recent-search-option-${recentSearchActiveIndex}`);
      }

      function closeRecentSearchPopup(options = {}) {
        const popup = els.recentSearchPopup;
        if (!popup) return;
        ++appState.searchSuggestionEpoch;
        appState.searchSuggestions = [];
        appState.searchSuggestionActiveIndex = -1;
        const wasOpen = isRecentSearchPopupOpen();
        const anchor = recentSearchAnchor;
        popup.classList.remove("open");
        delete popup.dataset.searchMode;
        popup.innerHTML = "";
        recentSearchAnchor = null;
        recentSearchActiveIndex = -1;
        [els.searchInput].forEach((input) => {
          if (!input) return;
          input.setAttribute("aria-expanded", "false");
          input.removeAttribute("aria-activedescendant");
        });
        // 焦点回归：Escape 后回到触发搜索的输入框（键盘路径焦点本就在输入框，
        // 兜底处理焦点可能已被移走的情形）。
        if (options.refocus && anchor && isElementVisible(anchor)) {
          anchor.focus();
        }
        return wasOpen;
      }

      function isElementVisible(element) {
        return Boolean(element && element.offsetParent !== null);
      }

      function moveRecentSearchActive(delta) {
        const items = readRecentSearches();
        if (!items.length) return;
        const next = recentSearchActiveIndex + delta;
        if (next < 0 || next >= items.length) return;
        recentSearchActiveIndex = next;
        renderRecentSearchPopup();
        const anchor = recentSearchAnchor;
        if (anchor) {
          anchor.setAttribute("aria-activedescendant", `recent-search-option-${next}`);
        }
      }

      function activeRecentSearchItem() {
        const items = readRecentSearches();
        if (recentSearchActiveIndex < 0 || recentSearchActiveIndex >= items.length) return null;
        return items[recentSearchActiveIndex];
      }

      function applyRecentSearchItem(index) {
        const items = readRecentSearches();
        const item = items[index];
        if (item == null) return;
        appState.searchDraft = item;
        syncSearchInputs(item);
        closeRecentSearchPopup();
        // 历史点击不重排历史：只在 Enter 写历史（recordHistory=false）。
        executeSearch(item, { recordHistory: false });
      }

      function removeRecentSearchItem(index) {
        const items = readRecentSearches();
        if (index < 0 || index >= items.length) return;
        items.splice(index, 1);
        writeRecentSearches(items);
        // 删除不执行搜索、不关闭列表；活动项随索引回收。
        if (recentSearchActiveIndex > index) recentSearchActiveIndex -= 1;
        if (recentSearchActiveIndex >= items.length) recentSearchActiveIndex = items.length - 1;
        if (!items.length) {
          closeRecentSearchPopup();
          return;
        }
        renderRecentSearchPopup();
        positionRecentSearchPopup(recentSearchAnchor);
      }

      function handleRecentSearchOutsidePointerDown(event) {
        if (!isRecentSearchPopupOpen()) return;
        const target = event.target;
        if (els.recentSearchPopup?.contains(target)) return;
        if (recentSearchAnchor && target === recentSearchAnchor) return;
        closeRecentSearchPopup();
      }

      function getFileTypeFilter() {
        const value = els.fileTypeSelect?.value || "";
        if (value === "markdown" || value === "html") return value;
        if (els.fileTypeSelect && value) {
          els.fileTypeSelect.value = "";
        }
        return "";
      }

      function syncSearchInputs(value) {
        if (els.searchInput && els.searchInput.value !== value) els.searchInput.value = value;
        els.searchInput?.closest(".topbar-search-field")?.setAttribute("data-has-value", value ? "true" : "false");
      }

      function sortItemsInPlace(items) {
        const config = currentSortConfig();
        if (config.clientKey !== "tags") return items;
        return [...items].sort((left, right) => {
          const leftKey = (left.tags?.[0]?.name || "").toLowerCase();
          const rightKey = (right.tags?.[0]?.name || "").toLowerCase();
          if (!leftKey && !rightKey) return 0;
          if (!leftKey) return 1;
          if (!rightKey) return -1;
          return leftKey.localeCompare(rightKey, "zh-CN");
        });
      }

      function updateMarkdownPreference(key, value) {
        appState.markdownPreferences = {
          ...appState.markdownPreferences,
          [key]: value
        };
        if (key === "tableToolsEnabled") {
          for (const session of appState.markdownEditorSessions.values()) {
            session.editor.setTableToolsEnabled?.(value);
          }
        }
        saveMarkdownPreferences(appState.markdownPreferences);
        renderSettingsPanel();
        renderViewerPreservingMarkdownScroll();
        setStatus(t("status.preferencesSaved"), "ok");
      }

      function normalizeUpdateSettings(value = {}) {
        return {
          autoCheckEnabled: value.autoCheckEnabled !== false,
          lastCheckedAt: value.lastCheckedAt || null,
          lastKnownLatestVersion: value.lastKnownLatestVersion || null,
          lastKnownReleaseUrl: value.lastKnownReleaseUrl || null
        };
      }

      function mockUpdateEnabled() {
        return new URLSearchParams(window.location.search).get("mockUpdate") === "1";
      }

      function readmeDemoEnabled() {
        return new URLSearchParams(window.location.search).get("readmeDemo") === "1";
      }

      function normalizeUpdateStatus(value = {}) {
        return {
          currentVersion: value.currentVersion || appState.updateStatus?.currentVersion || "0.9.0",
          latestVersion: value.latestVersion || null,
          releaseUrl: value.releaseUrl || null,
          hasUpdate: Boolean(value.hasUpdate),
          checkedAt: value.checkedAt || null,
          status: value.status || "idle",
          error: value.error || null,
          candidate: value.candidate && value.candidate.tag && value.candidate.assetKey
            ? {
                tag: value.candidate.tag,
                assetKey: value.candidate.assetKey,
                name: value.candidate.name || "",
                size: Number(value.candidate.size) || 0
              }
            : null
        };
      }

      function updateCheckDue() {
        if (!appState.updateSettings.autoCheckEnabled) return false;
        const last = Date.parse(appState.updateSettings.lastCheckedAt || "");
        if (!Number.isFinite(last)) return true;
        return Date.now() - last >= 24 * 60 * 60 * 1000;
      }

      function mergeUpdateResultIntoSettings(result) {
        if (!result) return;
        appState.updateSettings = {
          ...appState.updateSettings,
          lastCheckedAt: result.checkedAt || appState.updateSettings.lastCheckedAt,
          lastKnownLatestVersion: result.latestVersion || appState.updateSettings.lastKnownLatestVersion,
          lastKnownReleaseUrl: result.releaseUrl || appState.updateSettings.lastKnownReleaseUrl
        };
      }

      function updateStatusMessage() {
        if (appState.updateCheckInFlight) return t("settings.updateChecking");
        const status = appState.updateStatus?.status;
        if (status === "available") {
          return t("settings.updateAvailable");
        }
        if (status === "current") return t("settings.updateCurrent");
        if (status === "disabled") return t("settings.updateDisabled");
        if (status === "error") return `${t("settings.updateFailedPrefix")}${appState.updateStatus.error || t("settings.updateNetworkUnavailable")}`;
        if (status === "unavailable") return appState.updateStatus.error || t("settings.updateUnavailable");
        return appState.updateSettings.lastCheckedAt ? t("settings.updateChecked") : t("settings.updateNotChecked");
      }

      function formatUpdateCheckedAt(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        const numeric = /^\d+$/.test(raw) ? Number(raw) : null;
        const date = numeric != null
          ? new Date(raw.length >= 13 ? numeric : numeric * 1000)
          : new Date(raw);
        if (!Number.isFinite(date.getTime())) return raw;
        return new Intl.DateTimeFormat(currentLanguage(), {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(date);
      }

      function latestVersionHtml() {
        const version = appState.updateStatus.latestVersion || appState.updateSettings.lastKnownLatestVersion;
        if (!version) return "";
        return ` · ${t("settings.updateLatestVersion")} <button class="settings-inline-link" type="button" data-update-open-dialog="true" title="${t("settings.openUpdatePanel")}">${escapeHtml(version)}</button>`;
      }

      function lastUpdateCheckedHtml() {
        const checkedAt = formatUpdateCheckedAt(appState.updateSettings.lastCheckedAt);
        return checkedAt ? ` · ${t("settings.updateLastChecked")} ${escapeHtml(checkedAt)}` : "";
      }

      function updateStatusInlineHtml() {
        const message = appState.updateCheckFeedback || updateStatusMessage();
        return message ? ` · ${escapeHtml(message)}` : "";
      }

      function renderUpdateBadge() {
        if (!els.updateBadge) return;
        const shouldShow = Boolean(appState.updateStatus?.hasUpdate && appState.updateStatus?.releaseUrl);
        els.updateBadge.hidden = !shouldShow;
        els.updateBadge.title = shouldShow
          ? t("settings.openUpdatePanel")
          : "";
      }

      function formatUpdateBytes(value) {
        const bytes = Number(value) || 0;
        if (bytes < 1024 * 1024) return `${Math.max(0, Math.round(bytes / 1024))} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function updateDialogIsOpen() {
        return appState.isUpdateDialogOpen || (appState.isSettingsOverlay && appState.settingsOverlayMode === "update");
      }

      function renderUpdateDialog() {
        const isOpen = updateDialogIsOpen();
        els.updateScrim?.classList.toggle("open", isOpen);
        els.updateScrim?.setAttribute("aria-hidden", isOpen ? "false" : "true");
        if (!isOpen || !els.updateModal) return;

        const update = appState.updateStatus || {};
        const candidate = update.candidate;
        const downloading = appState.updateDownload.inProgress;
        const latestVersion = update.latestVersion || appState.updateSettings.lastKnownLatestVersion;
        let title = t("settings.updateChecking");
        let description = t("settings.updateChecking");
        let status = "";
        let statusRole = "status";
        let primary = "";

        if (appState.updateCheckInFlight) {
          status = t("settings.updateChecking");
        } else if (update.status === "available") {
          title = t("settings.updateReadyTitle");
          description = formatTranslation("settings.updateDialogAvailableDescription", { version: latestVersion || "" });
          if (candidate) {
            if (downloading) {
              status = appState.updateDownload.totalBytes
                ? `${formatUpdateBytes(appState.updateDownload.downloadedBytes)} / ${formatUpdateBytes(appState.updateDownload.totalBytes)}`
                : t("settings.updateDownloading");
            } else if (appState.updateDownload.error) {
              status = `${t("settings.updateInstallFailedPrefix")}${appState.updateDownload.error}`;
              statusRole = "alert";
            } else {
              status = appState.updateCheckFeedback === t("settings.updateInstallOpened")
                ? appState.updateCheckFeedback
                : candidate.name;
            }
            primary = `<button class="button button-primary" type="button" data-update-download-install="true" ${downloading ? "disabled" : ""}>${escapeHtml(downloading ? t("settings.updateDownloading") : t("settings.downloadAndInstall"))}</button>`;
          } else {
            status = update.error || t("settings.updateUnsupportedDevice");
            statusRole = "alert";
          }
        } else if (update.status === "current") {
          title = t("settings.updateDialogCurrentTitle");
          description = t("settings.updateCurrent");
        } else if (update.status === "error" || update.status === "unavailable") {
          title = t("settings.updateDialogUnavailableTitle");
          description = update.error || t("settings.updateUnavailable");
          statusRole = "alert";
        }

        els.updateModal.innerHTML = `
          <h2 id="updateModalTitle" class="update-modal-title">${escapeHtml(title)}</h2>
          <p class="update-modal-copy">${escapeHtml(description)}</p>
          <div class="update-modal-status" role="${statusRole}">${escapeHtml(status)}</div>
          ${downloading ? `<progress class="update-modal-progress" max="${appState.updateDownload.totalBytes || ""}" value="${appState.updateDownload.totalBytes ? appState.updateDownload.downloadedBytes : ""}"></progress>` : ""}
          <div class="update-modal-actions">
            ${update.releaseUrl ? `<button class="button button-secondary" type="button" data-update-open-release="true">${escapeHtml(t("settings.openRelease"))}</button>` : ""}
            <button class="button button-secondary" type="button" data-update-close="true">${escapeHtml(t("settings.updateLater"))}</button>
            ${primary}
          </div>
        `;
        els.updateModal.querySelector("[data-update-download-install]")?.addEventListener("click", downloadAndInstallUpdate);
        els.updateModal.querySelector("[data-update-open-release]")?.addEventListener("click", openUpdateRelease);
        els.updateModal.querySelector("[data-update-close]")?.addEventListener("click", closeUpdateDialog);
      }

      function closeUpdateDialog() {
        if (appState.isSettingsOverlay && appState.settingsOverlayMode === "update") {
          closeSettingsOverlay();
          return;
        }
        appState.isUpdateDialogOpen = false;
        renderUpdateDialog();
      }

      async function openUpdateDialog() {
        if (appState.isTauri && !appState.isSettingsOverlay) {
          await openSettingsOverlay("preferences", "update");
          return;
        }
        appState.isUpdateDialogOpen = true;
        renderUpdateDialog();
        await loadUpdateSettings();
        await checkForUpdates({ manual: true, force: true });
      }

      async function ensureUpdateDownloadProgressListener() {
        if (appState.updateDownloadProgressListening || typeof listenRaw !== "function") return;
        appState.updateDownloadProgressListening = true;
        try {
          await listenRaw("update-download-progress", (event) => {
            const progress = event?.payload || {};
            const candidate = appState.updateStatus?.candidate;
            if (!appState.updateDownload.inProgress || !candidate || progress.tag !== candidate.tag || progress.assetKey !== candidate.assetKey) return;
            appState.updateDownload.downloadedBytes = Number(progress.downloadedBytes) || 0;
            appState.updateDownload.totalBytes = Number.isFinite(Number(progress.totalBytes)) ? Number(progress.totalBytes) : null;
            renderSettingsPanel();
            renderUpdateDialog();
          });
        } catch (_) {
          appState.updateDownloadProgressListening = false;
        }
      }

      async function downloadAndInstallUpdate() {
        const candidate = appState.updateStatus?.candidate;
        if (!candidate || appState.updateDownload.inProgress) return;
        appState.updateDownload = { inProgress: true, downloadedBytes: 0, totalBytes: candidate.size || null, error: "" };
        await ensureUpdateDownloadProgressListener();
        renderSettingsPanel();
        renderUpdateDialog();
        try {
          await invoke("download_and_install_update", { payload: { tag: candidate.tag, assetKey: candidate.assetKey } });
          appState.updateDownload.inProgress = false;
          appState.updateCheckFeedback = t("settings.updateInstallOpened");
          setStatus(t("settings.updateInstallOpened"), "ok");
        } catch (error) {
          appState.updateDownload.inProgress = false;
          appState.updateDownload.error = normalizeError(error);
          appState.updateCheckFeedback = `${t("settings.updateInstallFailedPrefix")}${appState.updateDownload.error}`;
        }
        renderSettingsPanel();
        renderUpdateDialog();
      }

      async function loadUpdateSettings() {
        try {
          appState.updateSettings = normalizeUpdateSettings(await invoke("get_update_settings"));
        } catch (error) {
          appState.updateCheckFeedback = `${t("settings.updateSettingsLoadFailedPrefix")}${normalizeError(error)}`;
        }
        renderSettingsPanel();
        renderUpdateBadge();
        renderUpdateDialog();
      }

      async function setAutoCheckUpdatesEnabled(enabled) {
        try {
          appState.updateSettings = normalizeUpdateSettings(
            await invoke("set_auto_check_updates_enabled", { enabled })
          );
          if (!enabled) {
            appState.updateStatus = {
              ...appState.updateStatus,
              hasUpdate: false,
              status: "disabled"
            };
          }
          appState.updateCheckFeedback = t("settings.updateSettingsSaved");
          renderSettingsPanel();
          renderUpdateBadge();
          renderUpdateDialog();
        } catch (error) {
          appState.updateCheckFeedback = `${t("settings.updateSettingsSaveFailedPrefix")}${normalizeError(error)}`;
          renderSettingsPanel();
          renderUpdateDialog();
        }
      }

      async function checkForUpdates(options = {}) {
        if (appState.updateCheckInFlight) return appState.updateStatus;
        const manual = Boolean(options.manual);
        appState.updateCheckInFlight = true;
        appState.updateCheckFeedback = manual ? t("settings.updateChecking") : "";
        renderSettingsPanel();
        renderUpdateDialog();
        try {
          const result = normalizeUpdateStatus(await invoke("check_for_updates", {
            force: Boolean(options.force || manual),
            checkedAt: new Date().toISOString()
          }));
          appState.updateStatus = result;
          mergeUpdateResultIntoSettings(result);
          appState.updateCheckFeedback = manual ? updateStatusMessage() : "";
          renderUpdateBadge();
          renderUpdateDialog();
          return result;
        } catch (error) {
          appState.updateStatus = normalizeUpdateStatus({
            ...appState.updateStatus,
            status: "error",
            error: normalizeError(error)
          });
          appState.updateCheckFeedback = manual ? updateStatusMessage() : "";
          return appState.updateStatus;
        } finally {
          appState.updateCheckInFlight = false;
          renderSettingsPanel();
          renderUpdateBadge();
          renderUpdateDialog();
        }
      }

      function scheduleAutomaticUpdateCheck() {
        if (mockUpdateEnabled()) {
          window.setTimeout(() => {
            checkForUpdates({ manual: false, force: true }).catch(() => {});
          }, 600);
          return;
        }
        if (!appState.isTauri || !updateCheckDue()) return;
        window.setTimeout(() => {
          if (updateCheckDue()) {
            checkForUpdates({ manual: false, force: false }).catch(() => {});
          }
        }, 3500);
      }

      function maybeCheckUpdatesForPreferences() {
        if (appState.settingsTab !== "preferences") return;
        if (appState.updatePreferenceAutoCheckStarted || appState.updateCheckInFlight) return;
        appState.updatePreferenceAutoCheckStarted = true;
        window.setTimeout(() => {
          checkForUpdates({ manual: false, force: true }).catch(() => {});
        }, 80);
      }

      async function openUpdateRelease() {
        const url = appState.updateStatus?.releaseUrl || appState.updateSettings?.lastKnownReleaseUrl;
        if (!url) return;
        try {
          await openExternalMarkdownLink(url);
        } catch (error) {
          setStatus(`${t("settings.openReleaseFailedPrefix")}${normalizeError(error)}`, "error");
        }
      }

      async function updateInterfaceLanguage(language, { propagateToMain = true } = {}) {
        captureActiveMarkdownDraft();
        const activeTabBeforeLanguageChange = getActiveTab();
        appState.language = i18n?.setLanguage?.(language) ?? language;
        if (appState.isSettingsOverlay && propagateToMain) {
          document.title = "__NUTBOOK_SETTINGS_OVERLAY__:" + JSON.stringify({
            action: "language-change",
            language: appState.language
          });
        }
        // The Settings overlay reuses index.html, but it has no document
        // runtime to rebuild.  Running the main-window language path here
        // tears down editor sessions, reloads data, and can stall this native
        // child for seconds.  Refresh only the overlay's own rendered shell;
        // the title bridge updates the main WebView independently.
        if (appState.isSettingsOverlay) {
          if (els.settingsScrim?.classList.contains("open")) renderSettingsPanel();
          renderAboutPanel();
          renderSettingsMenu();
          renderSortMenu();
          renderDocumentMoreMenu();
          setStatus(t("status.languageUpdated"), "ok");
          return;
        }
        clearPollutedSearchValues();
        getFileTypeFilter();
        destroyAllMarkdownEditorSessions();
        // 检查视图的标题壳/状态文案是渲染期产物：语言切换后销毁重读，
        // 避免残留旧语言文案（正文 snapshot 会随 revalidate 自动重挂）。
        if (appState.homeLayout === "inspector") {
          destroyMarkdownInspector();
        }
        if (els.settingsScrim?.classList.contains("open")) {
          renderSettingsPanel();
        }
        renderAboutPanel();
        renderSettingsMenu();
        renderSortMenu();
        renderDocumentMoreMenu();
        if (activeTabBeforeLanguageChange) {
          renderNavState();
          renderTabs();
        } else {
          renderNavState();
          await loadItems();
          renderTabs();
        }
        renderViewerPreservingMarkdownScroll();
        setStatus(t("status.languageUpdated"), "ok");
      }

      function renderSettingsMenu() {
        const items = [
          { tab: "skills", label: t("settings.skills"), icon: SETTINGS_ICON_SVG.artifactAccess },
          { tab: "libraries", label: t("settings.libraries"), icon: SETTINGS_ICON_SVG.fileManagement },
          { tab: "tags", label: t("settings.tags"), icon: SETTINGS_ICON_SVG.tagManagement },
          { tab: "preferences", label: t("settings.preferences"), icon: SETTINGS_ICON_SVG.preferences },
          { tab: "thumbnails", label: t("settings.thumbnails"), icon: SETTINGS_ICON_SVG.thumbnails }
        ];
        els.settingsMenu.innerHTML = items.map((item) => `
          <button class="popover-option menu-option" type="button" data-open-settings-tab="${item.tab}">
            <span class="menu-option-icon" aria-hidden="true">${item.icon}</span>
            <span class="menu-option-label">${item.label}</span>
          </button>
        `).join("");
        els.settingsMenu.classList.toggle("open", appState.isSettingsMenuOpen);
        els.settingsMenu.setAttribute("aria-hidden", appState.isSettingsMenuOpen ? "false" : "true");
        els.settingsMenu.querySelectorAll("[data-open-settings-tab]").forEach((node) => {
          node.addEventListener("click", () => {
            openSettingsTab(node.dataset.openSettingsTab);
          });
        });
      }

      function focusSelectedSettingsTab() {
        requestAnimationFrame(() => {
          const tab = document.querySelector('[data-settings-tab][aria-selected="true"]');
          if (!tab) return;
          tab.dataset.programmaticFocus = "true";
          tab.addEventListener("blur", () => {
            delete tab.dataset.programmaticFocus;
          }, { once: true });
          tab.focus({ preventScroll: true });
        });
      }

      function renderThumbnailEngineAlert() {
        if (!els.thumbnailEngineAlertButton) return;
        els.thumbnailEngineAlertButton.classList.toggle("visible", thumbnailEngineNeedsAttention());
      }

      function openSettingsTab(tab) {
        if (!appState.isSettingsOpen) {
          appState.settingsReturnFocus = document.activeElement;
        }
        appState.settingsTab = tab;
        if (tab === "preferences") {
          appState.updatePreferenceAutoCheckStarted = false;
        }
        appState.isSettingsMenuOpen = false;
        appState.isSettingsOpen = true;
        renderSettingsMenu();
        renderSettingsPanel();
        focusSelectedSettingsTab();
        if (tab === "skills") {

      function currentNbskillStatusContent() {
        return NBSKILL_STATUS_CONTENT[appState.language] || NBSKILL_STATUS_CONTENT["zh-CN"];
      }

      function formatNbskillText(template, values = {}) {
        return Object.entries(values).reduce(
          (text, [key, value]) => text.replaceAll(`{${key}}`, String(value ?? "")),
          template
        );
      }

      function nbskillStatusDetail(status) {
        const content = currentNbskillStatusContent();
        if (!status) return content.loading;
        if (status.packageStatus === "compatible" && status.runtimeStatus === "verified") {
          return formatNbskillText(content.compatibleVerified, { version: status.installedVersion || status.expectedVersion });
        }
        if (status.packageStatus === "compatible") return content.compatibleUnverified;
        if (status.packageStatus === "outdated") {
          return formatNbskillText(content.outdated, {
            installed: status.installedVersion || "?",
            expected: status.expectedVersion
          });
        }
        return content[status.packageStatus] || status.detail || content.corrupt;
      }

      function isNbskillHealthy(status) {
        return Boolean(status?.agentDetected && status.packageStatus === "compatible" && status.runtimeStatus === "verified" && status.cliStatus === "compatible");
      }

      function isNbskillEnableCandidate(status) {
        return Boolean(status?.agentDetected && status.packageStatus === "missing");
      }

      function isNbskillRepairable(status) {
        return Boolean(status?.agentDetected
          && status.packageStatus !== "missing"
          && status.packageStatus !== "newer_unverified"
          && (status.packageStatus !== "compatible"
            || status.runtimeStatus !== "verified"
            || (status.cliStatus !== "compatible" && status.cliStatus !== "newer_unverified")));
      }

      function nbskillSelectionOptions(operation, statuses, selectedAgentId) {
        const english = appState.language === "en-US";
        return statuses.filter((status) => operation === "manage" ? status.packageStatus !== "missing" : status.agentDetected).map((status) => {
          const healthy = isNbskillHealthy(status);
          const newer = status.packageStatus === "newer_unverified";
          const installed = status.packageStatus !== "missing";
          const selectable = operation === "manage" ? installed : operation === "enable" ? isNbskillEnableCandidate(status) : isNbskillRepairable(status);
          const detail = operation === "manage"
            ? (english ? (installed ? "Remove only if it is verified as Nutbook-owned; modified packages are backed up." : "No installed integration to manage.") : (installed ? "仅在验证为 Nutbook 所属后移除；修改过的包会备份。" : "没有可管理的已安装集成。"))
            : newer
              ? (english ? "Newer version detected; Nutbook will not change it." : "检测到较新版本；Nutbook 不会修改它。")
              : healthy
                ? (english ? "Healthy; no change is needed." : "状态健康，无需修改。")
                : operation === "enable" && installed
                  ? (english ? "Installed but unhealthy; use Repair instead." : "已安装但状态异常；请使用修复。")
                  : operation === "repair" && !installed
                    ? (english ? "Not installed; use Enable instead." : "尚未安装；请使用启用。")
                : nbskillStatusDetail(status);
          return {
            id: status.agentId,
            label: status.displayName,
            detail,
            checked: selectable && status.agentId === selectedAgentId,
            disabled: !selectable,
            contextual: status.agentId === selectedAgentId,
            secondary: selectable && status.agentId !== selectedAgentId
          };
        });
      }

      function renderNbskillAgentToolbar() {
        if (!els.settingsNbskillAgentStrip) return;
        const content = currentNbskillStatusContent();
        const fallbackAgents = [
          { agentId: "openclaw", displayName: "OpenClaw", packageStatus: "missing", runtimeStatus: "unverified" },
          { agentId: "hermes", displayName: "Hermes", packageStatus: "missing", runtimeStatus: "unverified" },
          { agentId: "claude-code", displayName: "Claude Code", packageStatus: "missing", runtimeStatus: "unverified" },
          { agentId: "codex", displayName: "Codex", packageStatus: "missing", runtimeStatus: "unverified" },
          { agentId: "workbuddy", displayName: "WorkBuddy", packageStatus: "missing", runtimeStatus: "unverified" }
        ];
        const statuses = appState.nbskillAgentStatuses.length ? appState.nbskillAgentStatuses : fallbackAgents;
        if (!statuses.some((status) => status.agentId === appState.selectedNbskillAgentId)) {
          appState.selectedNbskillAgentId = statuses[0]?.agentId || "codex";
        }
        els.settingsNbskillAgentStrip.innerHTML = statuses.map((status) => {
          const selected = status.agentId === appState.selectedNbskillAgentId;
          const healthy = isNbskillHealthy(status);
          const healthReason = status.agentDetected
            ? (status.cliStatus === "compatible"
              ? (appState.language === "en-US" ? "Agent runtime is not fully verified" : "Agent 运行环境未完全验证")
              : status.cliStatus === "newer_unverified"
                ? content.cliNewerUnverified
                : (appState.language === "en-US" ? "Nutbook CLI is unavailable, outdated, or invalid" : "Nutbook CLI 不可用、过旧或无效"))
            : (appState.language === "en-US" ? "Agent was not reliably detected" : "未可靠检测到 Agent");
          const detail = `${status.displayName}：${healthy ? nbskillStatusDetail(status) : `${nbskillStatusDetail(status)}；${healthReason}`}${appState.nbskillStatusesStale ? `；${content.stale}` : ""}`;
          return `<button
            class="nbskill-agent-button ${healthy ? "compatible runtime-verified" : ""} ${appState.nbskillStatusesStale ? "stale" : ""} ${selected ? "selected" : ""}"
            type="button"
            role="radio"
            aria-checked="${selected}"
            tabindex="${selected ? "0" : "-1"}"
            aria-label="${escapeAttribute(detail)}"
            data-tooltip="${escapeAttribute(detail)}"
            data-nbskill-agent-id="${escapeAttribute(status.agentId)}"
          ><img src="${escapeAttribute(NBSKILL_AGENT_ICONS[status.agentId])}" alt="" /></button>`;
        }).join("");
        els.settingsNbskillAgentStrip.querySelectorAll("[data-nbskill-agent-id]").forEach((button) => {
          button.addEventListener("click", () => {
            appState.selectedNbskillAgentId = button.dataset.nbskillAgentId;
            appState.nbskillInstallFeedback = "";
            renderNbskillAgentToolbar();
          });
          button.addEventListener("keydown", (event) => {
            if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) return;
            event.preventDefault();
            const direction = event.key === "ArrowLeft" || event.key === "ArrowUp" ? -1 : 1;
            const currentIndex = statuses.findIndex((status) => status.agentId === button.dataset.nbskillAgentId);
            const next = statuses[(currentIndex + direction + statuses.length) % statuses.length];
            appState.selectedNbskillAgentId = next.agentId;
            appState.nbskillInstallFeedback = "";
            renderNbskillAgentToolbar();
            els.settingsNbskillAgentStrip.querySelector(`[data-nbskill-agent-id="${next.agentId}"]`)?.focus();
          });
        });
        const selected = statuses.find((status) => status.agentId === appState.selectedNbskillAgentId);
        if (els.settingsNbskillEnhancementHint) {
          const hasHealthyIntegration = statuses.some(isNbskillHealthy);
          const enhancementHint = hasHealthyIntegration
            ? t("settings.agentIntegrationGuideTooltip")
            : t("settings.agentIntegrationIntroTooltip");
          els.settingsNbskillEnhancementHint.hidden = false;
          els.settingsNbskillEnhancementHint.textContent = hasHealthyIntegration ? "?" : "!";
          els.settingsNbskillEnhancementHint.dataset.helpMode = hasHealthyIntegration ? "guide" : "intro";
          els.settingsNbskillEnhancementHint.setAttribute("aria-label", enhancementHint);
          els.settingsNbskillEnhancementHint.dataset.tooltip = enhancementHint;
        }
        if (els.settingsRefreshNbskillStatusButton) {
          const hasEnableCandidates = statuses.some(isNbskillEnableCandidate);
          const hasManageCandidates = statuses.some((status) => status.packageStatus !== "missing");
          const selectedHasIntegration = Boolean(selected && selected.packageStatus !== "missing");
          const primaryMode = selectedHasIntegration ? "manage" : "enable";
          const label = primaryMode === "manage" ? (appState.language === "en-US" ? "Manage Agent Integrations" : "管理 Agent 集成") : (appState.language === "en-US" ? "Enable Agent Integrations" : "启用 Agent 集成");
          els.settingsRefreshNbskillStatusButton.setAttribute("aria-label", label);
          els.settingsRefreshNbskillStatusButton.dataset.tooltip = label;
          els.settingsRefreshNbskillStatusButton.dataset.nbskillPrimaryMode = primaryMode;
          els.settingsRefreshNbskillStatusButton.disabled = appState.nbskillStatusLoading || (primaryMode === "manage" ? !hasManageCandidates : !hasEnableCandidates);
          const primaryIcon = els.settingsRefreshNbskillStatusButton.querySelector("svg");
          if (primaryIcon) primaryIcon.innerHTML = primaryMode === "enable"
            ? '<circle cx="10" cy="10" r="6.5"/><path d="M10 6.7v6.6M6.7 10h6.6"/>'
            : '<path d="M4 5h12M4 10h12M4 15h12"/><circle cx="7" cy="5" r="1.4"/><circle cx="13" cy="10" r="1.4"/><circle cx="9" cy="15" r="1.4"/>';
        }
        if (els.settingsCopyNbskillPromptButton) {
          const hasRepairable = statuses.some(isNbskillRepairable);
          const hasHealthyIntegration = statuses.some(isNbskillHealthy);
          const hasUnverifiedIntegration = statuses.some((status) => status.packageStatus !== "missing" && !isNbskillHealthy(status));
          const repairLabel = appState.nbskillStatusLoading
            ? content.loading
            : hasRepairable
              ? (appState.language === "en-US" ? "Repair Agent Integrations" : "修复 Agent 集成")
              : appState.nbskillStatusesStale
                ? (appState.language === "en-US" ? "Status may be outdated; detect again" : "检测结果可能已过期，请重新检测")
                : hasUnverifiedIntegration
                  ? (appState.language === "en-US" ? "An unverified integration cannot be repaired automatically" : "存在无法自动修复的未验证集成")
                  : hasHealthyIntegration
                    ? (appState.language === "en-US" ? "Connected integrations are healthy" : "当前接入正常")
                    : (appState.language === "en-US" ? "No Agent integration needs repair" : "当前没有需要修复的 Agent 集成");
          els.settingsCopyNbskillPromptButton.setAttribute("aria-label", repairLabel);
          els.settingsCopyNbskillPromptButton.dataset.tooltip = repairLabel;
          els.settingsCopyNbskillPromptButton.disabled = appState.nbskillStatusLoading || !hasRepairable;
        }
        if (els.settingsNbskillInstallFeedback) {
          els.settingsNbskillInstallFeedback.textContent = appState.nbskillInstallFeedback || (appState.nbskillStatusLoading ? content.loading : "");
        }
      }

      async function fetchNbskillAgentStatuses() {
        const statuses = await invoke("get_nbskill_agent_status");
        if (!Array.isArray(statuses) || statuses.length !== 5) throw new Error("invalid Agent status response");
        appState.nbskillAgentStatuses = statuses;
        appState.nbskillStatusesStale = false;
      }

      async function loadNbskillAgentStatuses() {
        if (appState.nbskillStatusLoading) return;
        appState.nbskillStatusLoading = true;
        appState.nbskillInstallFeedback = "";
        renderNbskillAgentToolbar();
        try {
          await fetchNbskillAgentStatuses();
          if (!appState.nbskillInitialHealthObserved) {
            appState.nbskillInitialHealthObserved = true;
            if (appState.nbskillAgentStatuses.some(isNbskillHealthy)) rememberAgentIntegrationGuideShown();
          }
        } catch (error) {
          appState.nbskillStatusesStale = appState.nbskillAgentStatuses.length > 0;
          appState.nbskillInstallFeedback = currentNbskillStatusContent().loadFailed;
        } finally {
          appState.nbskillStatusLoading = false;
          renderNbskillAgentToolbar();
        }
      }

      async function runAgentIntegrationAction(action) {
        const statuses = appState.nbskillAgentStatuses;
        const selected = statuses.find((status) => status.agentId === appState.selectedNbskillAgentId);
        const operation = action === "repair" ? "repair" : selected?.packageStatus !== "missing" ? "manage" : "enable";
        const options = nbskillSelectionOptions(operation, statuses, appState.selectedNbskillAgentId);
        if (!options.some((option) => !option.disabled)) {
          appState.nbskillInstallFeedback = appState.language === "en-US" ? "No reliably detected Agent integration can be changed." : "没有可安全修改的已检测 Agent 集成。";
          renderNbskillAgentToolbar();
          return;
        }
        const english = appState.language === "en-US";
        const scope = await appConfirmSelection({
          title: operation === "manage" ? (english ? "Manage Agent integrations" : "管理 Agent 集成") : operation === "repair" ? (english ? "Choose Agent integrations to repair" : "选择要修复的 Agent 集成") : (english ? "Choose Agent integrations to enable" : "选择要启用的 Agent 集成"),
          message: operation === "manage"
            ? (english ? "Select the Nutbook integrations you want to remove. Removal never deletes Agent files outside the verified nbskill package." : "勾选要移除的 Nutbook 集成。移除不会删除已验证 nbskill 包之外的 Agent 文件。")
            : operation === "repair"
              ? (english ? "Choose detected unhealthy integrations. Nutbook also verifies and repairs the shared CLI; healthy and newer packages are not changed." : "选择已检测到的异常集成。Nutbook 也会校验并修复共享 CLI；健康或较新版本不会被修改。")
              : (english ? "Choose detected Agents to enable. Nutbook also verifies the shared CLI; healthy and newer packages will not be reinstalled or downgraded." : "选择要启用的已检测 Agent。Nutbook 也会校验共享 CLI；健康或较新版本不会被重装或降级。"),
          options,
          confirmText: operation === "manage" ? (english ? "Remove selected" : "移除已选") : operation === "repair" ? (english ? "Repair selected" : "修复已选") : (english ? "Enable selected" : "启用已选"),
          danger: operation === "manage"
        });
        if (!scope?.length) return;
        appState.nbskillStatusLoading = true;
        appState.nbskillInstallFeedback = "";
        const healthyBefore = new Set(statuses.filter(isNbskillHealthy).map((status) => status.agentId));
        renderNbskillAgentToolbar();
        let shouldShowFirstSuccessGuide = false;
        try {
          const command = operation === "manage" ? "remove_nbskill_agents" : operation === "repair" ? "repair_nbskill_agents" : "install_nbskill_agents";
          const results = await invoke(command, { payload: { agentIds: scope } });
          appState.nbskillInstallFeedback = results.map((result) => `${result.agentId}: ${result.status}${result.detail ? ` (${result.detail})` : ""}`).join(" · ");
          await fetchNbskillAgentStatuses();
          shouldShowFirstSuccessGuide = operation === "enable"
            && !agentIntegrationGuideWasShown()
            && appState.nbskillAgentStatuses.some((status) => scope.includes(status.agentId) && isNbskillHealthy(status) && !healthyBefore.has(status.agentId));
        } catch (error) {
          appState.nbskillInstallFeedback = formatNbskillText(currentNbskillStatusContent().actionFailed, { error: normalizeError(error) });
        } finally {
          appState.nbskillStatusLoading = false;
          renderNbskillAgentToolbar();
        }
        if (shouldShowFirstSuccessGuide) {
          rememberAgentIntegrationGuideShown();
          showAgentIntegrationHelp("guide", { firstSuccess: true });
        }
      }

      function agentInstallationLabel(installation, content) {
        if (installation?.status === "ready") return content.ready;
        if (installation?.status === "not-found") return content.notFound;
        if (installation?.status === "unsupported") return content.unsupported;
        return content.unavailable;
      }

      async function restoreCachedAgentProjectsInSettings() {
        if (appState.agentDiscoveryCacheLoaded || appState.agentDiscoveryCacheLoading) return;
        appState.agentDiscoveryCacheLoading = true;
        try {
          const cachedPayload = await invoke("get_cached_agent_projects");
          if (cachedPayload) {
            appState.agentDiscoveryPayload = cachedPayload;
            appState.agentDiscoveryStep = "results";
          }
          appState.agentDiscoveryCacheLoaded = true;
        } catch (error) {
          appState.agentDiscoveryError = normalizeError(error);
        } finally {
          appState.agentDiscoveryCacheLoading = false;
          renderSettingsPanel();
        }
      }

      async function loadAgentProjectsInSettings() {
        appState.settingsProjectFeedback = "";
        appState.settingsArtifactCandidateSelection.clear();
        appState.settingsProjectScrollTop = 0;
        appState.settingsArtifactView = "list";
        appState.agentArtifactPreview = null;
        appState.agentArtifactPreviewByScope.clear();
        appState.expandedAgentScopeKey = "";
        appState.agentDiscoveryLoadingScopeKey = "";
        appState.agentDiscoveryFeedback = null;
        appState.agentDiscoveryStep = "loading";
        appState.agentDiscoveryError = "";
        const previousPayload = appState.agentDiscoveryPayload;
        renderSettingsPanel();
        try {
          appState.agentDiscoveryPayload = await invoke("discover_agent_projects");
          appState.agentDiscoveryCacheLoaded = true;
        } catch (error) {
          appState.agentDiscoveryPayload = previousPayload;
          appState.agentDiscoveryError = normalizeError(error);
        }
        appState.agentDiscoveryStep = "results";
        renderSettingsPanel();
      }

      async function connectAgentScopesInSettings(scopeIndexes, acceptSuggestedImmediately = false) {
        const scopeKey = (scopeIndexes || []).join(",");
        const scopes = (scopeIndexes || [])
          .map((scopeIndex) => appState.agentDiscoveryPayload?.scopes?.[scopeIndex])
          .filter(Boolean);
        if (!scopes.length) return;
        appState.agentDiscoveryLoadingScopeKey = scopeKey;
        appState.agentDiscoveryFeedback = null;
        if (!acceptSuggestedImmediately) appState.expandedAgentScopeKey = scopeKey;
        appState.agentDiscoveryError = "";
        renderSettingsPanel();
        try {
          let connected = null;
          let preview = acceptSuggestedImmediately
            ? null
            : await invoke("preview_agent_project_artifacts_by_root", {
                rootPath: scopes[0].rootPath
              });
          const loadedFromExistingSource = Boolean(preview);
          if (!preview) {
            for (const scope of scopes) {
              connected = await invoke("connect_agent_project", {
                adapterId: scope.adapterId,
                adapterProfile: scope.adapterProfile,
                externalScopeId: scope.externalScopeId,
                scopeKind: scope.scopeKind,
                capability: scope.capability,
                rootPath: scope.rootPath,
                displayName: scope.displayName
              });
            }
            preview = await invoke("preview_agent_project_artifacts", {
              projectLibraryId: connected.libraryId
            });
          }
          appState.agentArtifactPreview = preview;
          appState.agentArtifactPreviewByScope.set(scopeKey, appState.agentArtifactPreview);
          syncAgentScopeSummariesFromPreview(scopeIndexes, appState.agentArtifactPreview);
          const batchKeys = (appState.agentArtifactPreview.groups || [])
            .filter((group) => group.status === "suggested")
            .map((group) => group.batchKey);
          if (acceptSuggestedImmediately && batchKeys.length) {
            appState.agentDiscoveryActionResult = await invoke("accept_agent_artifact_groups", {
              projectLibraryId: appState.agentArtifactPreview.project.libraryId,
              batchKeys
            });
            appState.agentArtifactPreviewByScope.delete(scopeKey);
            appState.agentDiscoveryFeedback = {
              scopeKey,
              message: currentAgentDiscoveryContent().accepted.replace("{count}", appState.agentDiscoveryActionResult.accepted.length)
            };
          }
          if (!loadedFromExistingSource || acceptSuggestedImmediately) {
            await loadLibraries();
            await loadItems();
            appState.agentDiscoveryPayload = await invoke("discover_agent_projects");
          }
        } catch (error) {
          appState.agentDiscoveryError = normalizeError(error);
          console.warn("[agent-artifacts] project detail load failed", error);
        }
        appState.agentDiscoveryLoadingScopeKey = "";
        appState.agentDiscoveryStep = "results";
        renderSettingsPanel();
      }

      function syncAgentScopeSummariesFromPreview(scopeIndexes, preview) {
        const summaries = appState.agentDiscoveryPayload?.artifactSummaries;
        const scopes = appState.agentDiscoveryPayload?.scopes;
        if (!Array.isArray(summaries) || !Array.isArray(scopes) || !preview) return;
        for (const scopeIndex of scopeIndexes || []) {
          const scope = scopes[scopeIndex];
          if (!scope) continue;
          const summary = summaries.find((entry) =>
            entry.adapterId === scope.adapterId && entry.externalScopeId === scope.externalScopeId
          );
          if (!summary) continue;
          summary.suggestedCount = Number(preview.suggestedCount || 0);
          summary.pendingCount = Number(preview.pendingCount || 0);
          summary.excludedCount = Number(preview.excludedCount || 0);
        }
      }

      function incrementAgentScopeIgnoredCount(scopeIndexes, count) {
        const summaries = appState.agentDiscoveryPayload?.artifactSummaries;
        const scopes = appState.agentDiscoveryPayload?.scopes;
        if (!Array.isArray(summaries) || !Array.isArray(scopes) || !count) return;
        for (const scopeIndex of scopeIndexes || []) {
          const scope = scopes[scopeIndex];
          if (!scope) continue;
          const summary = summaries.find((entry) =>
            entry.adapterId === scope.adapterId && entry.externalScopeId === scope.externalScopeId
          );
          if (summary) summary.ignoredCount = Number(summary.ignoredCount || 0) + Number(count || 0);
        }
      }

      function syncExcludedAgentProjectGroup(group, excludedCount) {
        const summaries = appState.agentDiscoveryPayload?.artifactSummaries;
        if (!Array.isArray(summaries)) return;
        for (const scope of group.scopes || []) {
          const summary = summaries.find((entry) =>
            entry.adapterId === scope.adapterId && entry.externalScopeId === scope.externalScopeId
          );
          if (!summary) continue;
          summary.suggestedCount = 0;
          summary.pendingCount = 0;
          summary.ignoredCount = Number(summary.ignoredCount || 0) + Number(excludedCount || 0);
        }
      }

      function toggleAgentScopeDetails(scopeIndexes) {
        const scopeKey = (scopeIndexes || []).join(",");
        if (!scopeKey) return;
        if (appState.expandedAgentScopeKey === scopeKey) {
          appState.expandedAgentScopeKey = "";
          appState.agentArtifactPreview = null;
          appState.settingsArtifactCandidateSelection.clear();
          appState.agentDiscoveryError = "";
          renderSettingsPanel();
          return;
        }
        const cachedPreview = appState.agentArtifactPreviewByScope.get(scopeKey);
        if (cachedPreview) {
          appState.expandedAgentScopeKey = scopeKey;
          appState.agentArtifactPreview = cachedPreview;
          appState.agentDiscoveryError = "";
          renderSettingsPanel();
          return;
        }
        connectAgentScopesInSettings(scopeIndexes, false);
      }

      function scrollToAgentDetailGroup(scopeKey, status) {
        if (!scopeKey || !status) return;
        window.requestAnimationFrame(() => {
          const target = els.settingsAgentProjectList?.querySelector(`[data-agent-detail-group="${scopeKey}:${status}"]`);
          const viewport = els.settingsAgentProjectList?.querySelector(".settings-list-viewport");
          if (!target || !viewport) return;
          const targetRect = target.getBoundingClientRect();
          const viewportRect = viewport.getBoundingClientRect();
          const nextTop = viewport.scrollTop + targetRect.top - viewportRect.top - 8;
          viewport.scrollTo({ top: Math.max(0, nextTop), behavior: "smooth" });
        });
      }

      async function revealAgentDetailGroup(scopeIndexes, status) {
        const scopeKey = (scopeIndexes || []).join(",");
        if (!scopeKey) return;
        if (appState.expandedAgentScopeKey !== scopeKey || !appState.agentArtifactPreview) {
          appState.settingsArtifactCandidateSelection.clear();
          const cachedPreview = appState.agentArtifactPreviewByScope.get(scopeKey);
          if (cachedPreview) {
            appState.expandedAgentScopeKey = scopeKey;
            appState.agentArtifactPreview = cachedPreview;
            appState.agentDiscoveryError = "";
            renderSettingsPanel();
          } else {
            await connectAgentScopesInSettings(scopeIndexes, false);
          }
        }
        scrollToAgentDetailGroup(scopeKey, status);
      }

      async function decideSingleArtifactInSettings(candidateId, action) {
        const projectLibraryId = appState.agentArtifactPreview?.project?.libraryId;
        if (!projectLibraryId) return;
        try {
          appState.settingsArtifactCandidateSelection.delete(candidateId);
          if (action === "accept") {
            await invoke("accept_agent_artifact", {
              projectLibraryId,
              candidateId
            });
          } else {
            await invoke("ignore_agent_artifact", {
              projectLibraryId,
              candidateId
            });
          }
          appState.agentArtifactPreview = await invoke("preview_agent_project_artifacts", {
            projectLibraryId
          });
          if (appState.expandedAgentScopeKey) {
            appState.agentArtifactPreviewByScope.set(
              appState.expandedAgentScopeKey,
              appState.agentArtifactPreview
            );
          }
          await loadLibraries();
          await loadItems();
          appState.agentDiscoveryPayload = await invoke("discover_agent_projects");
        } catch (error) {
          appState.agentDiscoveryError = normalizeError(error);
        }
        renderSettingsPanel();
      }

      async function acceptSelectedArtifactCandidates() {
        const candidateIds = [...appState.settingsArtifactCandidateSelection];
        const projectLibraryId = appState.agentArtifactPreview?.project?.libraryId;
        if (!projectLibraryId || !candidateIds.length) return;
        appState.settingsProjectFeedback = t("status.artifactFilesBulkConnecting");
        renderSettingsPanelPreservingProjectScroll();
        try {
          const result = await invoke("accept_agent_artifacts", {
            projectLibraryId,
            candidateIds
          });
          appState.settingsArtifactCandidateSelection.clear();
          appState.agentArtifactPreview = await invoke("preview_agent_project_artifacts", {
            projectLibraryId
          });
          if (appState.expandedAgentScopeKey) {
            appState.agentArtifactPreviewByScope.set(appState.expandedAgentScopeKey, appState.agentArtifactPreview);
          }
          await loadLibraries();
          await loadItems();
          appState.agentDiscoveryPayload = await invoke("discover_agent_projects");
          appState.settingsProjectFeedback = "";
          setStatus(currentAgentDiscoveryContent().accepted.replace("{count}", result.accepted.length), "ok");
        } catch (error) {
          appState.settingsProjectFeedback = "";
          setStatus(statusError("status.projectsBulkConnectFailedPrefix", error), "error");
        }
        renderSettingsPanelPreservingProjectScroll();
      }

      async function excludeSelectedArtifactCandidates() {
        const candidateIds = [...appState.settingsArtifactCandidateSelection];
        const projectLibraryId = appState.agentArtifactPreview?.project?.libraryId;
        if (!projectLibraryId || !candidateIds.length) return;
        const confirmed = await appConfirm({
          title: t("settings.excludeFilesTitle"),
          message: t("settings.excludeFilesMessage").replace("{count}", candidateIds.length),
          confirmText: t("settings.excludeFilesConfirm")
        });
        if (!confirmed) return;
        appState.settingsProjectFeedback = t("status.artifactFilesBulkExcluding");
        renderSettingsPanelPreservingProjectScroll();
        try {
          const excludedCount = Number(await invoke("ignore_agent_artifacts", {
            projectLibraryId,
            candidateIds
          }) || 0);
          appState.settingsArtifactCandidateSelection.clear();
          appState.agentArtifactPreview = await invoke("preview_agent_project_artifacts", {
            projectLibraryId
          });
          if (appState.expandedAgentScopeKey) {
            appState.agentArtifactPreviewByScope.set(appState.expandedAgentScopeKey, appState.agentArtifactPreview);
            const scopeIndexes = appState.expandedAgentScopeKey.split(",").map(Number).filter(Number.isInteger);
            syncAgentScopeSummariesFromPreview(scopeIndexes, appState.agentArtifactPreview);
            incrementAgentScopeIgnoredCount(scopeIndexes, excludedCount);
          }
          appState.settingsProjectFeedback = "";
          setStatus(t("status.artifactFilesBulkExcluded").replace("{count}", excludedCount), "ok");
        } catch (error) {
          appState.settingsProjectFeedback = "";
          setStatus(statusError("status.artifactFilesBulkExcludeFailedPrefix", error), "error");
        }
        renderSettingsPanelPreservingProjectScroll();
      }

      async function previewAgentGroupForBatch(group) {
        const existingPreview = await invoke("preview_agent_project_artifacts_by_root", {
          rootPath: group.rootPath
        });
        if (existingPreview) return existingPreview;
        let connected = null;
        for (const scope of group.scopes) {
          connected = await invoke("connect_agent_project", {
            adapterId: scope.adapterId,
            adapterProfile: scope.adapterProfile,
            externalScopeId: scope.externalScopeId,
            scopeKind: scope.scopeKind,
            capability: scope.capability,
            rootPath: scope.rootPath,
            displayName: scope.displayName
          });
        }
        if (!connected?.libraryId) return null;
        return invoke("preview_agent_project_artifacts", { projectLibraryId: connected.libraryId });
      }

      async function connectSelectedAgentProjects() {
        const selected = filteredSortedAgentProjectGroups().filter((group) => appState.settingsProjectSelection.has(agentProjectGroupKey(group)));
        if (!selected.length) return;
        appState.settingsProjectFeedback = t("status.projectsBulkConnecting");
        renderSettingsPanel();
        let acceptedCount = 0;
        try {
          for (const group of selected) {
            const preview = await previewAgentGroupForBatch(group);
            if (!preview) continue;
            const batchKeys = (preview.groups || []).filter((entry) => entry.status === "suggested").map((entry) => entry.batchKey);
            if (!batchKeys.length) continue;
            const result = await invoke("accept_agent_artifact_groups", {
              projectLibraryId: preview.project.libraryId,
              batchKeys
            });
            acceptedCount += (result.accepted || []).length;
          }
          appState.settingsProjectSelection.clear();
          await loadLibraries();
          await loadItems();
          appState.agentDiscoveryPayload = await invoke("discover_agent_projects");
          appState.settingsProjectFeedback = "";
          setStatus(t("status.projectsBulkConnected").replace("{count}", acceptedCount), "ok");
        } catch (error) {
          appState.settingsProjectFeedback = "";
          setStatus(statusError("status.projectsBulkConnectFailedPrefix", error), "error");
        }
        renderSettingsPanel();
      }

      async function excludeSelectedAgentProjects() {
        const selected = filteredSortedAgentProjectGroups().filter((group) => appState.settingsProjectSelection.has(agentProjectGroupKey(group)));
        if (!selected.length) return;
        const confirmed = await appConfirm({
          title: t("settings.excludeProjectsTitle"),
          message: t("settings.excludeProjectsMessage").replace("{count}", selected.length),
          confirmText: t("settings.excludeProjectsConfirm")
        });
        if (!confirmed) return;
        appState.settingsProjectFeedback = t("status.projectsBulkExcluding");
        renderSettingsPanel();
        let excludedFileCount = 0;
        try {
          for (const group of selected) {
            const preview = await previewAgentGroupForBatch(group);
            if (!preview) continue;
            const groupExcludedFileCount = Number(await invoke("exclude_agent_project_candidates", {
              projectLibraryId: preview.project.libraryId
            }) || 0);
            excludedFileCount += groupExcludedFileCount;
            syncExcludedAgentProjectGroup(group, groupExcludedFileCount);
            appState.settingsProjectSelection.delete(agentProjectGroupKey(group));
          }
          appState.settingsProjectFeedback = "";
          setStatus(t("status.projectsBulkExcluded")
            .replace("{projects}", selected.length)
            .replace("{files}", excludedFileCount), "ok");
          renderSettingsPanelPreservingProjectScroll();
          await loadLibraries();
          appState.agentDiscoveryPayload = await invoke("discover_agent_projects");
        } catch (error) {
          appState.settingsProjectFeedback = "";
          setStatus(statusError("status.projectsBulkExcludeFailedPrefix", error), "error");
        }
        renderSettingsPanel();
      }

      async function restoreExcludedAgentProject(rootPath) {
        const group = groupedAgentScopesForSettings().find((entry) => entry.rootPath === rootPath);
        if (!group) {
          setStatus(t("status.projectRestoreFailedPrefix") + t("settings.projectSourceMissing"), "error");
          return;
        }
        appState.settingsProjectFeedback = t("status.projectRestoring");
        renderSettingsPanel();
        try {
          const preview = await previewAgentGroupForBatch(group);
          if (!preview?.project?.libraryId) throw new Error(t("settings.projectSourceMissing"));
          const restoredCount = Number(await invoke("restore_excluded_agent_project_candidates", {
            projectLibraryId: preview.project.libraryId
          }) || 0);
          await loadLibraries();
          appState.agentDiscoveryPayload = await invoke("discover_agent_projects");
          appState.settingsProjectFeedback = "";
          setStatus(t("status.projectRestored").replace("{count}", restoredCount), "ok");
        } catch (error) {
          appState.settingsProjectFeedback = "";
          setStatus(statusError("status.projectRestoreFailedPrefix", error), "error");
        }
        renderSettingsPanel();
      }

      async function openSettingsOverlay(tab = "skills", mode = "menu") {
        if (!appState.isTauri) {
          openSettingsTab(tab);
          return;
        }
        const isMenuMode = mode === "menu";
        await invoke("attach_settings_overlay_command", {
          bounds: isMenuMode
            ? {
                x: 76,
                y: Math.max(0, window.innerHeight - 238),
                width: 220,
                height: 220
              }
            : {
                x: 0,
                y: 0,
                width: Math.max(1, window.innerWidth),
                height: Math.max(1, window.innerHeight)
              },
          tab,
          mode
        });
      }

      function closeSettingsOverlay() {
        cancelHostSettingsOverlayClose();
        appState.settingsArtifactView = "list";
        appState.agentArtifactPreview = null;
        document.title = "__NUTBOOK_SETTINGS_OVERLAY__:close";
      }

      async function openSettingsPanelFromOverlay(tab = "skills") {
        if (!appState.isSettingsOpen) {
          appState.settingsReturnFocus = document.activeElement;
        }
        appState.settingsOverlayMode = "panel";
        appState.settingsTab = tab;
        appState.isSettingsOpen = false;

      function sourceSortComparator(sortMode) {
        const byName = (left, right) => left.name.localeCompare(right.name, "zh-CN");
        const byPath = (left, right) => left.rootPath.localeCompare(right.rootPath, "zh-CN");
        const byCreatedDesc = (left, right) =>
          String(right.createdAt || "").localeCompare(String(left.createdAt || ""));
        switch (sortMode) {
          case "pathAsc":
            return byPath;
          case "kindThenName":
            return (left, right) => {
              if (left.sourceKind !== right.sourceKind) {
                return left.sourceKind === "folder" ? -1 : 1;
              }
              return byName(left, right);
            };
          case "recentFirst":
            return (left, right) => {
              const diff = byCreatedDesc(left, right);
              return diff || byName(left, right);
            };
          case "nameAsc":
          default:
            return byName;
        }
      }
