              ${appState.settingsSkillRefreshFeedback ? `<span class="settings-inline-feedback">${escapeHtml(appState.settingsSkillRefreshFeedback)}</span>` : ""}
              <button class="button button-secondary button-small" type="button" data-settings-refresh-skills="true">${t("actions.refresh")}</button>
              <button class="button button-ghost button-small" type="button" data-settings-exclude-selected-skills="true" ${appState.settingsSkillSelection.size === 0 ? "disabled" : ""}>${t("actions.excludeSelected")}</button>
            </div>

          ${renderSettingsGroup({
            key: "skillReady",
            title: "已接入 / 可接入",
            count: countText(connectedOrReadySkills.length),
            bodyHtml: renderSkillRows(connectedOrReadySkills, {
              allowSelection: true,
              emptyLabel: t("settings.noSkillReady")
            })
          })}
          ${renderSettingsGroup({
            key: "skillManual",
            title: "待手动接入",
            count: countText(manualSkills.length),
            bodyHtml: renderSkillRows(manualSkills, {
              allowSelection: true,
              emptyLabel: t("settings.noSkillManual")
            })
          })}
          ${renderSettingsGroup({
            key: "skillExcluded",
            title: "已排除",
            count: countText(excludedSkills.length),
            bodyHtml: renderSkillRows(excludedSkills, { allowRestore: true, emptyLabel: t("settings.noSkillExcluded") })
          })}
        `;

        els.settingsTagList.innerHTML = appState.tags.length
          ? `<div class="settings-tag-cloud">
              ${appState.tags.map((tag) => `
                <div class="settings-tag-pill">
                  <div class="settings-row-title">${escapeHtml(tag.name)}</div>
                  <button class="settings-tag-remove" type="button" data-settings-delete-tag="${tag.id}" aria-label="删除标签">×</button>
                </div>
              `).join("")}
            </div>`
          : `<div class="settings-empty">${t("settings.noLabels")}</div>`;

        els.settingsPreferenceList.innerHTML = `
          <div class="preference-row">
            <div class="preference-copy">
              <div class="preference-title">${t("language.label")}</div>

      async function invoke(command, args = {}) {
        if (!invokeRaw) {
          return invokeMock(command, args);
        }

        let lastError;
        for (const variant of commandVariants(command, args)) {
          try {
            return await invokeRaw(command, variant);
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError;
      }

        if (previousTab?.preview?.fileType !== "html-runtime") return;

        if (!tab?.id || !appState.isTauri) return false;
        try {
          await maybeSyncFilesystemState(true);
          const detail = normalizeItemDetail(await invoke("get_item_detail", { itemId: tab.id }));
          return isItemPathMissing(detail) || isLibraryPathMissing(detail.libraryId);
        } catch (error) {
          return isMissingIndexedItemError(error);
        }

        invalidateItemOpenToken(tabId);
        const tab = getOpenTab(tabId);
        let sourcePathMissing = false;
        const isClosingActiveTab = appState.activeTabId === tabId;
        const remainingTabsAfterClose = getOpenTabs().filter((entry) => entry.id !== tabId);
        const nextActiveTabId = isClosingActiveTab
          ? (remainingTabsAfterClose[remainingTabsAfterClose.length - 1]?.id ?? null)
          : appState.activeTabId;
        if (tab?.preview?.fileType === "markdown") {
          if (tab.id === appState.activeTabId || tab.id === appState.activeMarkdownEditorTabId) {
            captureActiveMarkdownDraft();
          }
          sourcePathMissing = await isOpenTabSourceMissing(tab);
          if (sourcePathMissing) {
            tab.isDirty = false;
            tab.draft = tab.markdownBaseline ?? tab.preview.raw ?? "";
          } else if (isMarkdownTabDirty(tab)) {
            const fileName = tab.item?.fileName || tab.preview?.title || "Markdown";
            const shouldSave = await appConfirm({
              title: t("markdown.unsavedCloseTitle"),
              message: formatTranslation("markdown.unsavedCloseMessage", { fileName }),
              confirmText: t("actions.save"),
              cancelText: t("markdown.discardChanges")
            });
            if (shouldSave) {
              const saved = await saveMarkdownTab(tab, { renderAfter: false });
              if (!saved) return;
            } else {
              tab.draft = tab.markdownBaseline ?? tab.preview.raw ?? "";
              tab.isDirty = false;
            }
          }
          if (isClosingActiveTab) {
            appState.activeTabId = nextActiveTabId;
          }
          if (tab.id === appState.activeTabId) {
            cleanupMarkdownEditor();
          } else if (tab.id === appState.activeMarkdownEditorTabId) {
            cleanupMarkdownEditor();
          }
        }
        if (tab?.preview?.fileType === "html-runtime") {
          if (isClosingActiveTab) {
            appState.activeTabId = nextActiveTabId;
          }
          cleanupRuntimeHostSync();
          cancelPendingRuntimeSurfaceHide(tabId);
          nextRuntimeSurfaceToken(tabId);
          await hideRuntimeSessionSurfaces(tabId, { force: true });
          await releaseRuntimeShellState({ itemId: tabId });
          await hideRuntimeSessionSurfaces(tabId, { force: true });
          try {
            await invoke("close_html_window", { itemId: tabId });
          } catch (error) {
            setStatus(`关闭 HTML Runtime 失败：${normalizeError(error)}`, "error");
          }
          cancelPendingRuntimeSurfaceHide(tabId);
          appState.runtimeSurfaceTokens.delete(tabId);
          appState.runtimeSessions = appState.runtimeSessions.filter((session) => session.id !== tabId);
        } else {
          appState.tabs = appState.tabs.filter((tab) => tab.id !== tabId);
        }
        appState.markdownScrollByTab.delete(tabId);
        appState.markdownOutlineCollapsedByTab.delete(tabId);

        if (isClosingActiveTab) {
          appState.activeTabId = nextActiveTabId;
        }

        const nextActiveTab = getActiveTab();
        if (nextActiveTab?.preview?.fileType === "html-runtime") {
          appState.runtimeControlsOverlayExpanded = false;
          appState.runtimeControlsOverlayMode = "default";
        } else {
          hideInactiveRuntimeHosts().catch(() => {});
        }

        if (!getActiveTab()) {
          await releaseRuntimeShellState({ itemId: null });
        }
        if (tab?.preview?.fileType === "markdown" && sourcePathMissing) {
          setStatus(`“${tab.item?.fileName || tab.preview?.title || "Markdown"}”的路径已失效，已关闭本地标签页。`, "warn");
        }
      }

      function thumbnailNode(item) {
        const skillBinding = resolveItemSkillBinding(item);
        const pathMissing = isItemPathMissing(item);
        const primaryCustomTag = item.tags?.[0];
        const chips = [
          primaryCustomTag ? `<span class="tag-chip">${escapeHtml(primaryCustomTag.name)}</span>` : "",
          skillBinding ? `<span class="meta-chip">${escapeHtml(skillBinding.displayName)}</span>` : ""
        ]
          .filter(Boolean)
          .join("");
        const overlayRow = chips ? `<div class="thumb-chip-row">${chips}</div>` : "";
        const badge = `${overlayRow}<span class="thumb-badge thumb-badge-type">${escapeHtml(item.fileType === "html" ? "HTML" : "MD")}</span>`;
        const missingMask = pathMissing
          ? `<div class="thumb-missing-mask"><span class="thumb-missing-pill">文件路径失效</span></div>`
          : "";
        if (item.thumbnail?.path) {
          if (item.thumbnail.path.startsWith("data:image/svg+xml;base64,")) {
            const encoded = item.thumbnail.path.slice("data:image/svg+xml;base64,".length);
            let svgMarkup = "";
            try {
              svgMarkup = atob(encoded);
            } catch (_) {
              svgMarkup = "";
            }
            if (svgMarkup) {
              return `
                <div class="thumb-wrap ${pathMissing ? "path-missing" : ""}">
                  <div class="thumb thumb-inline" aria-hidden="true">${svgMarkup}</div>
                  ${missingMask}
                  ${badge}
                </div>
              `;
            }
          }
          return `
            <div class="thumb-wrap ${pathMissing ? "path-missing" : ""}">
              <img class="thumb" src="${escapeAttribute(item.thumbnail.path)}" alt="" />
              ${missingMask}
              ${badge}
            </div>
          `;
        }
        if (item.fileType === "html") {
          return `
            <div class="thumb-wrap ${pathMissing ? "path-missing" : ""}">
              <div class="thumb thumb-inline" aria-hidden="true">
                <div class="html-thumb-card">
                  <div class="html-thumb-frame">
                    <span class="material-symbols-outlined html-thumb-icon">code</span>
                  </div>
                </div>
              </div>
              ${missingMask}
              ${badge}
            </div>
          `;
        }
        return `
          <div class="thumb-wrap ${pathMissing ? "path-missing" : ""}">
            <div class="thumb thumb-inline" aria-hidden="true">
              <div class="markdown-thumb-card">
                <div class="markdown-thumb-frame">
                  <span class="material-symbols-outlined markdown-thumb-icon">text_snippet</span>
                </div>
              </div>
            </div>
            ${missingMask}
            ${badge}
          </div>
        `;
      }

      function supportsGeneratedThumbnail(item) {
        return item.fileType === "html" || item.fileType === "markdown";

      async function ensureDocumentThumbnails(items) {
        if (!canGenerateDocumentThumbnails()) {
          if (thumbnailEngineNeedsAttention()) {
            setStatus(t("status.thumbnailEngineDisabled"), "warn");
          }
          return;
        }
        const targets = items.filter((item) =>
          supportsGeneratedThumbnail(item) &&
          !isItemPathMissing(item) &&
          !appState.pendingThumbnailIds.has(item.id) &&
          (!item.thumbnail?.path || item.thumbnail.path.startsWith("data:image/svg+xml"))
        );
        if (!targets.length) return;

        const runId = ++appState.thumbnailQueueRunId;
        appState.thumbnailQueueActive = true;
        let completed = 0;
        setStatus(thumbnailProgressMessage(0, targets.length), "warn");

        for (const queuedItem of targets) {
          if (runId !== appState.thumbnailQueueRunId) break;
          const item = appState.items.find((candidate) => candidate.id === queuedItem.id);
          if (!item || appState.pendingThumbnailIds.has(item.id)) continue;

          appState.pendingThumbnailIds.add(item.id);
          try {
            // Yield to the UI between browser captures so large first scans do not feel frozen.
            await delay(80);
            const result = await invoke("generate_thumbnail", { itemId: item.id });
            if (runId !== appState.thumbnailQueueRunId) break;
            item.thumbnail = normalizeThumbnailInfo({
              status: result.status || result.thumbnail?.status || "ready",
              path: result.path || result.thumbnail?.path || null,
              width: result.width || result.thumbnail?.width || null,
              height: result.height || result.thumbnail?.height || null,
              lastGeneratedAt: result.lastGeneratedAt || result.thumbnail?.lastGeneratedAt || null,
              errorMessage: result.errorMessage || result.thumbnail?.errorMessage || null
            });
            completed += 1;
            renderItems();
            setStatus(thumbnailProgressMessage(completed, targets.length), "warn");
          } catch (_) {
          } finally {
            appState.pendingThumbnailIds.delete(item.id);
          }
        }

        if (runId === appState.thumbnailQueueRunId) {
          appState.thumbnailQueueActive = false;
          setStatus(t("status.thumbnailRefreshComplete"), "ok");
        }
      }

      async function toggleActiveHtmlRuntimePresentationMode() {
        const tab = getActiveTab();
        if (!tab || tab.preview?.fileType !== "html-runtime") return;
        const nextEnabled = appState.runtimeFullscreenItemId !== tab.id;
        clearHostFocus();
        setRuntimeFullscreenState(tab.id, nextEnabled);
        if (appState.isTauri) {
          try {
            await invoke("set_window_fullscreen_command", { fullscreen: nextEnabled });
            setStatus(nextEnabled ? t("status.presentationEntered") : t("status.presentationExited"), "ok");
          } catch (error) {
            setStatus(statusError("status.presentationSwitchFailedPrefix", error), "error");
          } finally {
            refocusActiveRuntimeHost(tab.id);
          }
          return;
        }
        setStatus(nextEnabled ? t("status.presentationEntered") : t("status.presentationExited"), "ok");
      }

      window.__NUTBOOK_HANDLE_HTML_RUNTIME_CONTROLS_ACTION__ = async (payload) => {
        const itemId = Number(payload?.itemId);
        const action = payload?.action;
        if (!itemId || !action) return;
        if (action === "toggle-favorite") {
          await toggleFavorite(itemId);
          if (appState.activeTabId === itemId && getActiveTab()?.preview?.fileType === "html-runtime") {
            scheduleRuntimeHostSync();
          }
          return;
        }
        if (action === "remove") {
          await removeItemFromNutbook(itemId);
          return;
        }

        const actionRight = actionsRect?.right || toolbarRect?.right || (fallbackBounds.x + fallbackBounds.width);
        const actionWidth = Math.max(actionsRect?.width || 96, 96);

        const skillTagWidth = runtimeControlsTagWidth(tab.item?.skillBinding?.displayName, 0);
        const typeTagWidth = runtimeControlsTagWidth("HTML", 50);
        const visibleTagCount = 1 + (skillTagWidth ? 1 : 0) + 1;
        const tagGaps = Math.max(0, visibleTagCount - 1) * 6;
        const islandGap = 8;
        const islandPadding = 2;
        const baseWidth = Math.ceil(customTagWidth + skillTagWidth + typeTagWidth + tagGaps + islandGap + actionWidth + islandPadding);
        const width = appState.runtimeControlsOverlayMode === "tags"
          ? Math.max(baseWidth, 300)
          : baseWidth;
        const right = Math.round(actionRight);
        return {
          x: Math.round(Math.max(0, right - width)),

          width: Math.max(width, 176),

        const mount = document.getElementById("runtimeHostMount");
        if (!mount) return;
        let bounds = runtimeHostBounds(mount);
        if (bounds.width < 40 || bounds.height < 40) return;
        const toolbarRect = els.documentToolbar?.getBoundingClientRect();
        if (toolbarRect && toolbarRect.height > 0 && bounds.y < Math.round(toolbarRect.bottom) - 1) {
          const safeTop = Math.round(toolbarRect.bottom);
          const delta = safeTop - bounds.y;
          bounds = {
            ...bounds,
            y: safeTop,
            height: Math.max(40, bounds.height - delta)
          };
        }
        const boundsKey = `${tab.id}:${bounds.x}:${bounds.y}:${bounds.width}:${bounds.height}`;
        const controlsBounds = runtimeControlsOverlayBounds(tab, toolbarRect, bounds);

        await hideInactiveRuntimeHosts(tab.id, { invalidate: false });
        if (!isRuntimeHostSyncCurrent(runId, tab.id)) return;
        if (appState.activeRuntimeHostId !== tab.id || appState.runtimeHostLastBoundsKey !== boundsKey) {
          await invoke("attach_html_runtime_host_command", {
            itemId: tab.id,
            bounds
          });
          if (await hideStaleRuntimeHostSync(runId, tab.id)) return;
          appState.runtimeHostLastBoundsKey = boundsKey;
        }
        appState.activeRuntimeHostId = tab.id;
        applyHtmlEditPatchToRuntime(tab.id).catch(() => {});

        if (appState.runtimeFullscreenItemId === tab.id) {
          await invoke("attach_html_runtime_controls_overlay_command", {
            itemId: tab.id,
            bounds: runtimeFullscreenHintOverlayBounds(bounds),
            isFavorite: Boolean(tab.item?.isFavorite),
            isFullscreen: true,
            customTag: Array.isArray(tab.item?.tags) ? (tab.item.tags[0] ?? null) : null,
            availableTags: appState.tags,
            skillTag: tab.item?.skillBinding?.displayName ?? null,
            typeTag: "HTML"
          });
          if (await hideStaleRuntimeHostSync(runId, tab.id)) return;
          await setRuntimeControlsOverlayVisibility(tab.id, true);
          if (await hideStaleRuntimeHostSync(runId, tab.id)) return;
          if (!appState.runtimeHostResizeObserver) {
            appState.runtimeHostResizeObserver = new ResizeObserver(() => {
              scheduleRuntimeHostSync();
            });
          }
          appState.runtimeHostResizeObserver.disconnect();
          appState.runtimeHostResizeObserver.observe(mount);
          return;
        }

        if (!isRuntimeHostSyncCurrent(runId, tab.id)) return;
        await invoke("attach_html_runtime_controls_overlay_command", {
          itemId: tab.id,
          bounds: controlsBounds,
          isFavorite: Boolean(tab.item?.isFavorite),
          isFullscreen: appState.runtimeFullscreenItemId === tab.id,
          customTag: Array.isArray(tab.item?.tags) ? (tab.item.tags[0] ?? null) : null,
          availableTags: appState.tags,
          skillTag: tab.item?.skillBinding?.displayName ?? null,
          typeTag: "HTML"
        });
        if (await hideStaleRuntimeHostSync(runId, tab.id)) return;
        await setRuntimeControlsOverlayVisibility(tab.id, true);
        if (await hideStaleRuntimeHostSync(runId, tab.id)) return;

        if (!appState.runtimeHostResizeObserver) {
          appState.runtimeHostResizeObserver = new ResizeObserver(() => {
            scheduleRuntimeHostSync();
          });
        }
        appState.runtimeHostResizeObserver.disconnect();
        appState.runtimeHostResizeObserver.observe(mount);
      }

      function scheduleRuntimeHostSync() {
        if (appState.runtimeSurfacesSuspended) return;
        if (appState.runtimeHostSyncInFlight) {
          appState.runtimeHostSyncPending = true;
          return;
        }
        if (appState.runtimeHostSyncFrame) {
          cancelAnimationFrame(appState.runtimeHostSyncFrame);
        }
        const runId = ++appState.runtimeHostSyncRunId;
        appState.runtimeHostSyncFrame = requestAnimationFrame(() => {
          appState.runtimeHostSyncFrame = null;
          runRuntimeHostSync(runId);
        });
      }

      async function runRuntimeHostSync(runId) {
        if (appState.runtimeHostSyncInFlight) {
          appState.runtimeHostSyncPending = true;
          return;
        }
        appState.runtimeHostSyncInFlight = true;
        try {
          await syncActiveRuntimeHost(runId);
        } catch (_) {
        } finally {
          appState.runtimeHostSyncInFlight = false;
          if (appState.runtimeHostSyncPending) {
            appState.runtimeHostSyncPending = false;
            scheduleRuntimeHostSync();
          }
        }
      }

      async function maybeSyncFilesystemState(force = false) {
        if (!appState.isTauri) return null;
        const now = Date.now();
        if (!force && appState.filesystemSyncInFlight) {
          return appState.filesystemSyncInFlight;
        }
        if (!force && now - appState.lastFilesystemSyncAt < 5000) {
          return null;
        }
        const task = invoke("sync_filesystem_state")
          .then(async (result) => {
            appState.lastFilesystemSyncAt = Date.now();
            const missing = Number(result?.missingItemsMarkedMissing ?? 0);
            const restored = Number(result?.restoredItemsMarkedValid ?? 0);
            const purged = Number(result?.missingIgnoredItemsPurged ?? 0);
            const missingSources = Number(result?.missingLibrariesMarkedMissing ?? 0);
            const restoredSources = Number(result?.restoredLibrariesMarkedValid ?? 0);
            if (missingSources > 0 || restoredSources > 0) {
              await refreshLibrariesAfterFilesystemSync();
            }
            if (missing > 0 || restored > 0 || purged > 0 || missingSources > 0 || restoredSources > 0) {
              const sourceText = missingSources > 0
                ? `${t("status.filesystemSyncedSourcePrefix")}${missingSources}${t("status.filesystemSyncedSourceSuffix")}`
                : "";
              const restoredText = restored > 0 || restoredSources > 0
                ? `，恢复 ${restored + restoredSources} 条路径`
                : "";
              setStatus(`${t("status.filesystemSyncedPrefix")}${missing}${t("status.filesystemSyncedMiddle")}${purged}${t("status.filesystemSyncedSuffix")}${sourceText}${restoredText}`, "ok");
            }
            return result;
          })
          .catch((error) => {
            setStatus(statusError("status.filesystemSyncFailedPrefix", error), "warn");
            return null;
          })
          .finally(() => {
            appState.filesystemSyncInFlight = null;
          });

        appState.filesystemSyncInFlight = task;
        return task;
      }

          await maybeSyncFilesystemState(true);

          if (isItemPathMissing(detail) || isLibraryPathMissing(detail.libraryId)) {
            await refreshInvalidIndexedItemState(itemId, item || detail, options);
            return false;
          }
          return true;
        } catch (error) {
          if (isMissingIndexedItemError(error)) {
            await refreshInvalidIndexedItemState(itemId, item, options);
            return false;
          }
          throw error;
        }

      async function rebuildThumbnailsForItems(items) {
        if (!canGenerateDocumentThumbnails()) {
          setStatus(t("status.thumbnailEngineDisabled"), "warn");
          openSettingsTab("thumbnails");
          return;
        }
        const thumbnailItems = items.filter(supportsGeneratedThumbnail);
        if (!thumbnailItems.length) {
          setStatus(t("status.thumbnailNoDocuments"), "warn");
          return;
        }

        let completed = 0;
        setStatus(thumbnailProgressMessage(0, thumbnailItems.length, t("status.thumbnailRebuildMode")), "warn");
        for (const item of thumbnailItems) {
          try {
            await delay(80);
            const result = await invoke("generate_thumbnail", { itemId: item.id });
            item.thumbnail = normalizeThumbnailInfo({
              status: result.status || result.thumbnail?.status || "ready",
              path: result.path || result.thumbnail?.path || null,
              width: result.width || result.thumbnail?.width || null,
              height: result.height || result.thumbnail?.height || null,
              lastGeneratedAt: result.lastGeneratedAt || result.thumbnail?.lastGeneratedAt || null,
              errorMessage: result.errorMessage || result.thumbnail?.errorMessage || null
            });
            completed += 1;
            setStatus(thumbnailProgressMessage(completed, thumbnailItems.length, t("status.thumbnailRebuildMode")), "warn");
            renderItems();
          } catch (_) {
          }
        }

        renderItems();
        renderSettingsPanel();
      }

      async function openHtmlRuntimeSession(detail, item, openToken) {
        captureActiveMarkdownScroll();
        captureActiveMarkdownDraft();
        const session = await invoke("open_html_window", { itemId: detail.id });
        if (!isCurrentItemOpenToken(detail.id, openToken)) {
          try {
            await invoke("close_html_window", { itemId: detail.id });
          } catch (_) {
          }
          return;
        }
        const tabItem = item || normalizeItemSummary(detail);
        const existing = appState.runtimeSessions.find((tab) => tab.id === detail.id);
        const preview = {
          fileType: "html-runtime",
          itemId: detail.id,
          title: session.title || detail.fileName || item?.fileName,
          runtimeUrl: session.runtimeUrl,
          label: session.label,
          detached: session.detached !== false
        };

        if (existing) {
          existing.item = tabItem;
          existing.detail = detail;
          existing.preview = preview;
        } else {
          appState.runtimeSessions.push({
            id: detail.id,
            item: tabItem,
            detail,
            preview,
            draft: ""
          });
        }

        appState.activeTabId = detail.id;
        appState.runtimePatchAppliedKeys.delete(detail.id);
        appState.activeHtmlRuntimeUrl = null;
        appState.isEditing = false;
        appState.markdownEditMode = "rich";
        appState.markdownEditorError = "";
        cleanupMarkdownEditor();
        setSidebarCollapsed(true);
        renderTabs();
        renderViewer();
        focusMainWebviewSoon();
        await loadItems();
        setStatus(`已打开 HTML Runtime：${detail.fileName || item?.fileName}`, "ok");

      async function openMarkdownContentTab(itemId, item, detail, openToken) {
        captureActiveMarkdownScroll();
        captureActiveMarkdownDraft();
        const preview = normalizePreview(await invoke("get_item_preview", { itemId }));
        if (!isCurrentItemOpenToken(itemId, openToken)) return;
        const tabItem = item || normalizeItemSummary(detail);
        const existing = appState.tabs.find((tab) => tab.id === itemId);

        if (existing) {
          const keepDraft = isMarkdownTabDirty(existing);
          existing.item = tabItem;
          existing.detail = detail;
          existing.preview = preview;
          existing.draft = keepDraft ? existing.draft : (preview.raw || "");
          existing.isDirty = keepDraft;
        } else {
          appState.tabs.push({
            id: itemId,
            item: tabItem,
            detail,
            preview,
            draft: preview.raw || "",
            isDirty: false
          });
        }

        appState.activeTabId = itemId;
        setSidebarCollapsed(true);
        appState.isEditing = true;
        appState.markdownEditMode = "rich";
        appState.markdownEditorError = "";
        cleanupMarkdownEditor();
        renderTabs();
        renderViewer();
        await loadItems();
      }

      function openMarkdownLoadingTab(itemId, item) {
        const existing = appState.tabs.find((tab) => tab.id === itemId);
        if (existing?.preview?.fileType === "markdown") {
          appState.activeTabId = itemId;
          renderTabs();
          renderViewer();
          return;
        }

        const loadingPreview = {
          fileType: "markdown-loading",
          itemId,
          title: item?.fileName || "Markdown",
          raw: "",
          html: "",
          editable: false
        };

        if (existing) {
          existing.item = item || existing.item;
          existing.preview = loadingPreview;
        } else {
          appState.tabs.push({
            id: itemId,
            item,
            detail: null,
            preview: loadingPreview,
            draft: "",
            isDirty: false
          });
        }

        appState.activeTabId = itemId;
        setSidebarCollapsed(true);
        appState.isEditing = false;
        appState.markdownEditMode = "rich";
        appState.markdownEditorError = "";
        cleanupMarkdownEditor();
        renderTabs();
        renderViewer();

      async function openArtifactRuntime(itemId, item, detail, openToken) {
        if (artifactRuntimeType(detail) === "html-runtime") {
          await openHtmlRuntimeSession(detail, item, openToken);
          return;
        }

        await openMarkdownContentTab(itemId, item, detail, openToken);
      }

      async function openItem(itemId) {
        const previousTabId = appState.activeTabId;
        if (previousTabId !== itemId && !(await confirmHtmlEditLeaveIfNeeded(previousTabId))) return;
        const openToken = nextItemOpenToken(itemId);
        try {
          const item = appState.items.find((entry) => entry.id === itemId);
          if (!(await ensureItemStillAvailable(itemId, item))) {
            return;
          }
          if (!isCurrentItemOpenToken(itemId, openToken)) return;
          if (item?.fileType === "markdown") {
            openMarkdownLoadingTab(itemId, item);
          }
          if (!isCurrentItemOpenToken(itemId, openToken)) return;
          try {
            await invoke("mark_item_opened", { itemId });
          } catch (_) {
          }
          if (!isCurrentItemOpenToken(itemId, openToken)) return;
          const detail = normalizeItemDetail(await invoke("get_item_detail", { itemId }));
          if (!isCurrentItemOpenToken(itemId, openToken)) return;

          await openArtifactRuntime(itemId, item, detail, openToken);
        } catch (error) {
          if (!isCurrentItemOpenToken(itemId, openToken)) return;
          const loadingTab = getOpenTab(itemId);
          if (loadingTab?.preview?.fileType === "markdown-loading") {
            appState.tabs = appState.tabs.filter((tab) => tab.id !== itemId);
            if (appState.activeTabId === itemId) {
              appState.activeTabId = getOpenTabs()[getOpenTabs().length - 1]?.id ?? null;
            }
            renderTabs();
            renderViewer();
          }
          if (isMissingIndexedItemError(error)) {
            const item = appState.items.find((entry) => entry.id === itemId) || getOpenTab(itemId)?.item;
            await refreshInvalidIndexedItemState(itemId, item);
            return;
          }
          setStatus(statusError("status.openFileFailedPrefix", error), "error");
        }
      }

        const item = appState.items.find((entry) => entry.id === itemId);
        const tab = getOpenTab(itemId);
        const previous = Boolean(item?.isFavorite ?? tab?.item?.isFavorite);
        const next = !previous;
        try {
          if (item) item.isFavorite = next;
          if (tab?.item) tab.item.isFavorite = next;
          renderItems();
          viewerToolbarState();
          setStatus(next ? t("status.favoriteAdded") : t("status.favoriteRemoved"), "ok");
          await invoke("toggle_item_favorite", { itemId, isFavorite: next });
          if (getActiveTab()?.id === itemId) {
            viewerToolbarState();
          }
          setStatus(next ? t("status.favoriteAdded") : t("status.favoriteRemoved"), "ok");
        } catch (error) {
          if (item) item.isFavorite = previous;
          if (tab?.item) tab.item.isFavorite = previous;
          renderItems();
          viewerToolbarState();
          setStatus(statusError("status.favoriteFailedPrefix", error), "error");
        }

      async function addLibrary(sourceKind = "folder") {
        const rootPath = els.libraryPath.value.trim();
        if (!rootPath) {
          setStatus(sourceKind === "file" ? t("status.chooseFileFirst") : t("status.fillFolderFirst"), "warn");
          return null;

      window.addEventListener("keydown", (event) => {
        if (event.isComposing || event.key === "Process") return;
        const tab = getActiveTab();
        const isMarkdownEditorKeyEvent = Boolean(event.target?.closest?.(".milkdown-editor-root .ProseMirror"));
        if ((event.metaKey || event.ctrlKey) && !event.altKey && event.key.toLowerCase() === "s") {
          if (tab?.preview?.fileType === "markdown") {
            event.preventDefault();
            saveActiveMarkdown();
            return;
          }
        }
        if (isMarkdownEditorKeyEvent) return;
        appState.altKeyPressed = event.altKey;
        viewerToolbarState();
        if (appState.homeTabOpen && !getActiveTab()) {
          renderItems();
        }
        if ((event.key === "x" || event.key === "X") && event.altKey && !event.metaKey && !event.ctrlKey) {
          const tag = document.activeElement?.tagName;
          if (tag !== "INPUT" && tag !== "TEXTAREA") {
            event.preventDefault();
            moveActiveItemToTrash().catch(() => {});
            return;
          }
        }
        if (event.key === "Escape" && appState.runtimeFullscreenItemId != null) {
          event.preventDefault();
          const exitingRuntimeId = appState.runtimeFullscreenItemId;
          clearHostFocus();
          appState.runtimeFullscreenItemId = null;
          applyRuntimeFullscreenState();
          scheduleRuntimeHostSync();
          if (appState.isTauri) {
            invoke("set_window_fullscreen_command", { fullscreen: false })
              .finally(() => {
                refocusActiveRuntimeHost(exitingRuntimeId);
              });
          }
          return;
        }
        if (!tab || (tab.preview?.fileType !== "html" && tab.preview?.fileType !== "html-runtime")) return;
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        if (tab.preview?.fileType === "html-runtime" && appState.htmlEditSession?.itemId === tab.id) {
          return;
        }
        if (tab.preview?.fileType === "html-runtime") {
          if (HOST_FORWARDED_RUNTIME_KEYS.has(event.key) || (event.code === "Space" && event.key === " ")) {
            event.preventDefault();
            forwardRuntimeShortcut(tab.id, event.key);
            return;
          }

          if (event.key === "f" || event.key === "F") {
            event.preventDefault();
            clearHostFocus();
            const nextEnabled = appState.runtimeFullscreenItemId !== tab.id;
            setRuntimeFullscreenState(tab.id, nextEnabled);
            if (appState.isTauri) {
              invoke("set_window_fullscreen_command", { fullscreen: nextEnabled })
                .then(() => setStatus(nextEnabled ? t("status.hostFullscreenEntered") : t("status.hostFullscreenExited"), "ok"))
                .catch(() => setStatus(t("status.hostFullscreenFailed"), "error"))
                .finally(() => {
                  refocusActiveRuntimeHost(tab.id);
                });
            }
            return;
          }

          if (event.key === "s" || event.key === "S") {
            event.preventDefault();
            clearHostFocus();
            if (appState.isTauri) {
              forwardRuntimeShortcut(tab.id, "s", "宿主已转发 S 命令");
            } else {
              const popup = window.open(appState.activeHtmlRuntimeUrl, "nutbook-html-preview", "width=1280,height=820");
              setStatus(popup ? "宿主已处理 S 弹窗" : "宿主 S 弹窗失败", popup ? "ok" : "error");
            }
            return;
          }
        }
        const tag = document.activeElement?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;

        if (event.key === "f" || event.key === "F") {
          const frame = document.querySelector(".html-frame");
          if (frame?.requestFullscreen) {
            event.preventDefault();
            frame.requestFullscreen()
              .then(() => setStatus(t("status.hostFullscreenEntered"), "ok"))

          }
        }

        if (event.key === "s" || event.key === "S") {
          if (appState.activeHtmlRuntimeUrl) {
            event.preventDefault();
            const popup = window.open(appState.activeHtmlRuntimeUrl, "nutbook-html-preview", "width=1280,height=820");

      async function saveMarkdownTab(tab, { renderAfter = true } = {}) {
        if (!tab || tab.preview?.fileType !== "markdown") return false;

        const content = markdownContentForTab(tab);
        tab.draft = content;

        try {
          setStatus(t("markdown.saving"), "warn");
          const expectedFileHash = tab.detail.fileHash || await sha256Hex(tab.preview.raw || "");
          await invoke("save_markdown_content", {
            itemId: tab.id,
            content,
            expectedFileHash,
            expectedModifiedAt: tab.detail.modifiedAt || tab.item.modifiedAt
          });

          const [freshDetailRaw, freshPreviewRaw] = await Promise.all([
            invoke("get_item_detail", { itemId: tab.id }),
            invoke("get_item_preview", { itemId: tab.id })
          ]);
          const freshDetail = normalizeItemDetail(freshDetailRaw);
          const freshPreview = normalizePreview(freshPreviewRaw);

          tab.detail = freshDetail;
          tab.preview = freshPreview;
          tab.draft = freshPreview?.raw || content;
          tab.markdownBaseline = tab.draft;
          tab.isDirty = false;
          tab.item = normalizeItemSummary(freshDetail);
          await loadItems();
          const refreshedListItem = appState.items.find((entry) => entry.id === tab.id);
          if (refreshedListItem) {
            tab.item = refreshedListItem;
          }
          if (renderAfter) {
            renderTabs();
            renderViewer();
          }
          setStatus(markdownSavedStatus(tab.item.fileName), "ok");
          showToast("保存成功");
          return true;
        } catch (error) {
          setStatus(`保存失败：${normalizeError(error)}`, "error");
          showToast("保存失败");
          return false;
        }
      }

      function deriveRootPathFromFiles(files) {
        const [first] = files;
        if (!first) return null;
        const absolutePath = first.path || first.webkitRelativePath || "";
        const relativePath = first.webkitRelativePath || "";
        if (absolutePath && relativePath && absolutePath.endsWith(relativePath)) {
          return absolutePath.slice(0, absolutePath.length - relativePath.length).replace(/\/$/, "");
        }
        if (absolutePath && !relativePath) {
          return absolutePath.replace(/\/[^/]+$/, "");
        }
        return null;
      }

      function parentDirectoryOf(path) {
        if (!path || !path.includes("/")) return null;
        return path.replace(/\/[^/]+$/, "") || "/";
      }

      }

      function setupWindowDragRegions() {
        if (!appState.isTauri) return;
        document.querySelectorAll("[data-tauri-drag-region]").forEach((node) => {
          node.addEventListener("pointerdown", (event) => {
            if (event.button !== 0) return;
            if (event.target.closest("button, input, textarea, select, a, [role='button'], [data-tab-id], [data-home-tab]")) return;
            invoke("start_window_drag_command").catch(() => {});
          });
        });
      }

      async function handleBrowseModeChange(mode, options = {}) {
        if (options.confirmHtmlEdit !== false) {
          const previousTabId = appState.activeTabId;
          if (!(await confirmHtmlEditLeaveIfNeeded(previousTabId))) return false;
        }
        appState.browseMode = mode;
        if (mode === "all") {
          appState.activeTagFilterIds = [];
          els.fileTypeSelect.value = "";
        } else if (mode === "recent") {
          appState.activeTagFilterIds = [];
          els.fileTypeSelect.value = "";
        } else if (mode === "starred") {
          appState.activeTagFilterIds = [];
          els.fileTypeSelect.value = "";
        }
        renderNavState();
        await loadItems();
        setStatus(mode === "all" ? t("status.browseAll") : mode === "recent" ? t("status.browseRecent") : t("status.browseStarred"), "ok");
        return true;
      }

      async function showAllFilesHome(options = {}) {
        const previousTabId = appState.activeTabId;
        if (options.confirmHtmlEdit !== false && !(await confirmHtmlEditLeaveIfNeeded(previousTabId))) return;
        const reload = options.reload !== false;
        const updateStatus = options.updateStatus !== false;
        appState.homeTabOpen = true;
        appState.activeTabId = null;
        appState.isEditing = false;
        appState.browseMode = "all";
        appState.activeTagFilterIds = [];
        els.fileTypeSelect.value = "";
        syncSearchInputs("");
        renderNavState();
        if (reload) {
          await loadItems();
        }
        renderTabs();
        renderViewer();
        if (updateStatus) {
          setStatus(t("status.browseAll"), "ok");
        }
      }

      async function handleTypeFilterChange(type) {
        els.fileTypeSelect.value = els.fileTypeSelect.value === type ? "" : type;
        renderNavState();
        await loadItems();
        setStatus(els.fileTypeSelect.value ? statusWithValue("status.typeFilterPrefix", els.fileTypeSelect.value) : t("status.typeFilterCleared"), "ok");
      }

      function handleNativeEditHistory(action) {
        const active = document.activeElement;
        const tag = active?.tagName;
        const isFormField = tag === "INPUT" || tag === "TEXTAREA" || active?.isContentEditable;
        const tab = getActiveTab();
        if (tab?.preview?.fileType === "markdown" && appState.activeMarkdownEditor) {
          const handled = action === "redo"
            ? appState.activeMarkdownEditor.redo?.()
            : appState.activeMarkdownEditor.undo?.();
          if (handled) return true;
        }
        if (isFormField) {
          try {
            return document.execCommand(action === "redo" ? "redo" : "undo");
          } catch (_) {
            return false;
          }
        }
        return false;
      }

      async function handleNativeMenuAction(action) {
        try {
          if (action === "undo" || action === "redo") {
            if (!handleNativeEditHistory(action)) {
              setStatus(action === "undo" ? "当前没有可撤销的编辑" : "当前没有可重做的编辑", "warn");
            }
            return;
          }
          if (action === "add-folder") {
            await addFolderFromMenu();
            return;
          }
          if (action === "add-file") {
            await addSingleFileFromMenu();
            return;
          }
          if (action === "scan-skills") {
            openSettingsTab("skills");
            await loadDiscoveredArtifactSkills();
            setStatus("已打开 Skill 产物扫描", "ok");
            return;
          }
          if (action === "rescan-library") {
            if (!appState.activeLibraryId) {
              setStatus("当前没有选中的资料库", "warn");
              return;
            }
            await scanLibrary();
            return;
          }
          if (action === "toggle-sidebar") {
            setSidebarCollapsed(!appState.isSidebarCollapsed);
            return;
          }
          if (action === "show-all") {
            await handleBrowseModeChange("all");
            return;
          }
          if (action === "show-recent") {
            await handleBrowseModeChange("recent");
            return;
          }
          if (action === "show-starred") {
            await handleBrowseModeChange("starred");
            return;
          }
          if (action === "toggle-outline") {
            updateMarkdownPreference("outlineEnabled", !Boolean(appState.markdownPreferences.outlineEnabled));
            return;
          }
        } catch (error) {
          setStatus(`菜单操作失败：${normalizeError(error)}`, "error");
        }
      }

      window.__NUTBOOK_NATIVE_MENU__ = handleNativeMenuAction;

      function toggleHomeLayout() {
        if (!appState.items.length) {
          setStatus(t("status.noFilesAddFirst"), "warn");
          return;
        }
        appState.homeLayout = appState.homeLayout === "grid" ? "list" : "grid";
        applyHomeLayout();
        setStatus(appState.homeLayout === "grid" ? t("status.gridView") : t("status.listView"), "ok");
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeAttribute(value) {
        return escapeHtml(value);
      }

      function wireEvents() {
        setupWindowDragRegions();
        document.addEventListener("visibilitychange", () => {
          if (appState.htmlEditLeavePromptOpen) return;
          if (document.hidden) {
            suspendRuntimeSurfaces().catch(() => {});
          } else {
            resumeRuntimeSurfaces().catch(() => {});
          }
        });
        els.viewerBody.addEventListener("scroll", () => {
          captureActiveMarkdownScroll();
        }, { passive: true });
        els.toggleSidebarButton.addEventListener("pointerdown", () => {
          els.toggleSidebarButton.classList.add("suppress-tooltip");
        });
        els.toggleSidebarButton.addEventListener("click", () => {
          setSidebarCollapsed(!appState.isSidebarCollapsed);
        });
        els.updateBadge?.addEventListener("click", (event) => {
          event.stopPropagation();
          openUpdateRelease();
        });
        els.toggleSidebarButton.addEventListener("pointerleave", () => {
          els.toggleSidebarButton.classList.remove("suppress-tooltip");
        });
        els.folderPicker.addEventListener("change", async (event) => {
          const files = Array.from(event.target.files || []);
          const rootPath = deriveRootPathFromFiles(files);
          if (!rootPath) {
            setStatus("没有拿到目录路径，请再试一次", "warn");
            return;
          }
          els.libraryPath.value = rootPath;
          els.libraryName.value = rootPath.split("/").filter(Boolean).pop() || "Nutbook Workspace";
          await addLibrary("folder");
          if (appState.activeLibraryId) {
            await scanLibrary();
          }
        });
        els.singleFilePicker?.addEventListener("change", async (event) => {
          const [file] = Array.from(event.target.files || []);
          const selectedPath = file?.path || "";
          if (!selectedPath) {
            setStatus("没有拿到文件路径，请再试一次", "warn");
            return;
          }
          els.libraryPath.value = selectedPath;
          els.libraryName.value = selectedPath.split("/").filter(Boolean).pop() || "Untitled File";
          await addLibrary("file");
          if (appState.activeLibraryId) {
            await scanLibrary();
          }
          await revealImportedFile(selectedPath);
        });
        [els.viewModeButton, els.viewModeButtonHome].forEach((button) => {
          button?.addEventListener("click", toggleHomeLayout);
        });
        [els.sortButton, els.topbarSortButton].forEach((button) => {
          button?.addEventListener("click", (event) => {
            event.stopPropagation();
            appState.isSortMenuOpen = !appState.isSortMenuOpen;
            renderSortMenu();
          });
        });
        els.addLibraryButton.addEventListener("click", addLibrary);
        els.reloadLibrariesButton.addEventListener("click", loadLibraries);
        els.scanButton.addEventListener("click", scanLibrary);
        els.refreshListButton.addEventListener("click", scanLibrary);
        [els.searchInput, els.homeSearchInput].forEach((input) => {
          input?.addEventListener("input", () => syncSearchInputs(input.value));
          input?.addEventListener("keydown", (event) => {
            if (event.key === "Enter") loadItems();
          });
        });
        els.fileTypeSelect.addEventListener("change", loadItems);
        document.querySelectorAll("[data-nav-group='browse']").forEach((node) => {
          node.addEventListener("click", async () => {
            const previousTabId = appState.activeTabId;
            if (!(await confirmHtmlEditLeaveIfNeeded(previousTabId))) return;
            captureActiveMarkdownScroll();
            captureActiveMarkdownDraft();
            if (node.dataset.navValue === "all") {
              await showAllFilesHome({ confirmHtmlEdit: false });
              return;
            }
            appState.activeTabId = null;
            appState.isEditing = false;
            await handleBrowseModeChange(node.dataset.navValue, { confirmHtmlEdit: false });
            renderTabs();
            renderViewer();
          });
        });
        document.querySelectorAll("[data-nav-group='type']").forEach((node) => {
          node.addEventListener("click", async () => {
            const previousTabId = appState.activeTabId;
            if (!(await confirmHtmlEditLeaveIfNeeded(previousTabId))) return;
            captureActiveMarkdownScroll();
            captureActiveMarkdownDraft();
            appState.activeTabId = null;
            appState.isEditing = false;
            await handleTypeFilterChange(node.dataset.navValue);
            renderTabs();
            renderViewer();
          });
        });
        els.documentFavoriteButton.addEventListener("click", async () => {
          const tab = getActiveTab();
          if (!tab) return;
          await toggleFavorite(tab.id);
          viewerToolbarState();
        });
        els.documentRemoveButton.addEventListener("click", async () => {
          const tab = getActiveTab();
          if (!tab) return;
          await removeItemFromNutbook(tab.id);
        });
        els.documentMoreButton.addEventListener("click", (event) => {
          event.stopPropagation();
          if (els.documentMoreButton.disabled) return;
          appState.isDocumentMoreMenuOpen = !appState.isDocumentMoreMenuOpen;
          renderDocumentMoreMenu();
        });
        els.clearTabsButton.addEventListener("click", async () => {
          const tabsToClose = getOpenTabs();
          for (const tab of tabsToClose) {
            await closeOpenTab(tab.id);
          }
          appState.isEditing = getActiveTab()?.preview?.fileType === "markdown";
          renderTabs();
          renderViewer();
        });
        els.createTagButton.addEventListener("click", createTag);
        els.newTagName.addEventListener("keydown", (event) => {
          if (event.key === "Enter") createTag();
        });
        els.brandAboutButton?.addEventListener("click", (event) => {
          event.stopPropagation();
          openAboutDialog().catch((error) => {
            setStatus(`打开关于窗口失败：${normalizeError(error)}`, "error");
          });
        });
        els.brandAboutButton?.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          openAboutDialog().catch((error) => {
            setStatus(`打开关于窗口失败：${normalizeError(error)}`, "error");
          });
        });
        els.closeAboutButton?.addEventListener("click", closeAboutDialog);
        els.aboutScrim?.addEventListener("click", (event) => {
          if (event.target === els.aboutScrim) closeAboutDialog();
        });
        els.aboutGithubProfileButton?.addEventListener("click", async () => {
          await openExternalMarkdownLink(ABOUT_GITHUB_PROFILE_URL);
        });
        els.aboutGithubStarButton?.addEventListener("click", async () => {
          await openExternalMarkdownLink(ABOUT_GITHUB_STAR_URL);
        });
        els.settingsButton.addEventListener("click", (event) => {
          event.stopPropagation();
          if (getActiveTab()?.preview?.fileType === "html-runtime") {
            openSettingsOverlay(appState.settingsTab || "skills", "menu").catch((error) => {
              setStatus(`打开设置失败：${normalizeError(error)}`, "error");
            });
            return;
          }
          appState.isSettingsMenuOpen = !appState.isSettingsMenuOpen;
          renderSettingsMenu();
        });
        els.thumbnailEngineAlertButton?.addEventListener("click", (event) => {
          event.stopPropagation();
          openSettingsTab("thumbnails");
        });
        els.settingsSourceSortButton?.addEventListener("click", (event) => {
          event.stopPropagation();
          appState.isSettingsSourceSortMenuOpen = !appState.isSettingsSourceSortMenuOpen;
          renderSettingsSourceSortMenu();
        });
        els.closeSettingsButton.addEventListener("click", () => {
          if (appState.isSettingsOverlay) {
            closeSettingsOverlay();
            return;
          }
          appState.isSettingsOpen = false;
          renderSettingsPanel();
        });
        els.settingsScrim.addEventListener("click", (event) => {
          if (event.target === els.settingsScrim) {
            if (appState.isSettingsOverlay) {
              closeSettingsOverlay();
              return;
            }
            appState.isSettingsOpen = false;
            renderSettingsPanel();
          }
        });
        els.addFolderButtonTopbar?.addEventListener("click", addFolderFromMenu);
        els.addFileButtonTopbar?.addEventListener("click", addSingleFileFromMenu);
        els.settingsSourceSearchInput?.addEventListener("input", () => {
          appState.settingsSourceSearch = els.settingsSourceSearchInput.value;
          renderSettingsPanel();
        });
        els.hostSettingsMenu?.querySelectorAll("[data-host-settings-tab]").forEach((node) => {
          node.addEventListener("click", async (event) => {
            event.stopPropagation();
            await openSettingsPanelFromOverlay(node.dataset.hostSettingsTab || "skills");
          });
        });
        els.settingsCreateTagButton.addEventListener("click", createTagFromSettings);
        els.settingsNewTagName.addEventListener("keydown", (event) => {
          if (event.key === "Enter") createTagFromSettings();
        });
        document.querySelectorAll("[data-settings-tab]").forEach((node) => {
          node.addEventListener("click", () => {
            appState.settingsTab = node.dataset.settingsTab;
            if (appState.settingsTab === "preferences") {
              appState.updatePreferenceAutoCheckStarted = false;
            }
            renderSettingsPanel();
            node.blur();
          });
        });
        els.settingsRefreshThumbnailStatusButton.addEventListener("click", async () => {
          setStatus(t("status.thumbnailDetecting"), "warn");
          await loadThumbnailBackendStatus();
          renderSettingsPanel();
          setStatus(t("status.thumbnailStatusRefreshed"), "ok");
        });
        els.settingsRebuildVisibleThumbsButton.addEventListener("click", rebuildVisibleHtmlThumbnails);
        els.settingsRebuildLibraryThumbsButton.addEventListener("click", rebuildCurrentLibraryHtmlThumbnails);
        els.openCurrentFolderButton.addEventListener("click", () => {
          els.libraryPath.value = "/Users/hayley/.openclaw/workspace/nutbook";
          els.libraryName.value = "Nutbook Workspace";
        });
        document.addEventListener("click", (event) => {
          if (appState.isSettingsOverlay && appState.settingsOverlayMode === "menu" && !els.hostSettingsMenu?.contains(event.target)) {
            closeSettingsOverlay();
            return;
          }
          if (appState.isSortMenuOpen && !els.sortMenu.contains(event.target) && !els.sortButton.contains(event.target) && !els.topbarSortButton.contains(event.target)) {
            appState.isSortMenuOpen = false;
            renderSortMenu();
          }
          if (appState.isDocumentTagMenuOpen && !els.documentTagMenu.contains(event.target) && !els.breadcrumbTags.contains(event.target)) {
            appState.isDocumentTagMenuOpen = false;
            renderDocumentTagMenu();
          }
          if (appState.isDocumentMoreMenuOpen && !els.documentMoreMenu.contains(event.target) && !els.documentMoreButton.contains(event.target)) {
            appState.isDocumentMoreMenuOpen = false;
            renderDocumentMoreMenu();
          }
          if (appState.isSettingsMenuOpen && !els.settingsMenu.contains(event.target) && !els.settingsButton.contains(event.target)) {
            appState.isSettingsMenuOpen = false;
            renderSettingsMenu();
          }
          if (appState.isSettingsSourceSortMenuOpen && !els.settingsSourceSortMenu.contains(event.target) && !els.settingsSourceSortButton.contains(event.target)) {
            appState.isSettingsSourceSortMenuOpen = false;
            renderSettingsSourceSortMenu();
          }
        });
      }

      async function boot() {
        if (appState.isSettingsOverlay) {
          document.documentElement.classList.add("settings-overlay-mode");
          document.body.classList.add("settings-overlay-mode");
          appState.settingsTab = window.__NUTBOOK_SETTINGS_OVERLAY_TAB__ || "skills";
          appState.settingsOverlayMode = window.__NUTBOOK_SETTINGS_OVERLAY_MODE__ || "menu";
          document.body.classList.toggle("settings-overlay-menu", appState.settingsOverlayMode === "menu");
          appState.isAboutOpen = appState.settingsOverlayMode === "about";
          appState.isSettingsOpen = appState.settingsOverlayMode !== "menu" && appState.settingsOverlayMode !== "about";
          wireEvents();
          renderSettingsMenu();
          renderSettingsPanel();
          renderAboutPanel();
          i18n?.observe?.();
          if (appState.settingsOverlayMode === "menu") {
            els.hostSettingsMenu?.addEventListener("mouseenter", cancelHostSettingsOverlayClose);
            els.hostSettingsMenu?.addEventListener("mouseleave", () => scheduleHostSettingsOverlayClose(220));
            window.addEventListener("blur", () => scheduleHostSettingsOverlayClose(80));
            document.addEventListener("visibilitychange", () => {
              if (document.hidden) scheduleHostSettingsOverlayClose(80);
            });
            scheduleHostSettingsOverlayClose(2400);
          }
          if (appState.settingsOverlayMode !== "menu" && appState.settingsOverlayMode !== "about") {
            await loadLibraries();
            await loadTags();
            await loadIgnoredItems();
            await loadDiscoveredArtifactSkills();
            await loadThumbnailBackendStatus();
            await loadUpdateSettings();
            renderSettingsPanel();
          }
          return;
        }

        setSidebarCollapsed(false);
        els.sidebarFootnote.textContent = appState.isTauri
          ? "当前运行在 Tauri 内，页面会直接调用本地后端 command。"
          : "当前不在 Tauri 内，页面会自动切到 mock 数据，方便先看 UI 结构。";

        wireEvents();
        syncShellMode();
        renderTabs();
        renderViewer();
        renderTags();
        renderLibraries();
        renderNavState();
        renderSortMenu();
        renderSettingsMenu();
        renderSettingsPanel();
        i18n?.observe?.();
        applyHomeLayout();
        renderBootLoadingState();
        warmMarkdownEditorApi();

        if (appState.isTauri) {
          try {
            appState.localServerOrigin = await invoke("get_local_server_origin");
          } catch (error) {
            setStatus(`本地 HTML 服务启动失败：${normalizeError(error)}`, "error");
          }
        } else {
          appState.localServerOrigin = "http://127.0.0.1:4173";
        }
        await loadUpdateSettings();
        await loadLibraries();
        await loadTags();
        await loadIgnoredItems();
        await loadDiscoveredArtifactSkills();
        await loadThumbnailBackendStatus();
        if (appState.activeLibraryId && !isLibraryPathMissing(appState.activeLibraryId)) {
          await scanLibrary({ silent: true });
        }
        appState.isBooting = false;
        await showAllFilesHome({
          reload: !appState.activeLibraryId || !appState.items.length,
          updateStatus: false
        });
        await ensureWatcher();
        startAutoRefresh();
        scheduleAutomaticUpdateCheck();

        if (!appState.isTauri) {
          appState.activeLibraryId = 1;
          renderLibraries();
          await loadItems();
          setStatus("当前是浏览器 mock 模式；进 Tauri 后会直接调用真实后端。", "warn");
        }
      }

      boot();
    </script>
  </body>
</html>
