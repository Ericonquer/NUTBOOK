        if (session) {
          const canLeaveHtml = await confirmHtmlEditLeaveIfNeeded(session.itemId, { source: "app-exit" });
          if (!canLeaveHtml) return false;
        }
        return confirmMarkdownAppExitIfNeeded();
      }

      let appExitRequestInFlight = false;
      window.__NUTBOOK_REQUEST_APP_EXIT__ = function requestAppExit() {
        if (appExitRequestInFlight) return;
        appExitRequestInFlight = true;
        confirmAppExitIfNeeded()
          .then((canExit) => {
            if (!canExit) return false;
            return invoke("finalize_html_edit_app_exit_command");
          })
          .catch((error) => setStatus(`退出前检查失败：${normalizeError(error)}`, "error"))
          .finally(() => {
            appExitRequestInFlight = false;
          });
      };
      window.__NUTBOOK_REQUEST_HTML_EDIT_APP_EXIT__ = window.__NUTBOOK_REQUEST_APP_EXIT__;

      function normalizeMarkdownSelectionText(value) {
        return String(value || "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function findMarkdownSelectionIndex(raw, anchorText, offsetHint = 0) {
        const source = String(raw || "");
        const normalizedAnchor = normalizeMarkdownSelectionText(anchorText);
        if (!source) return 0;
        if (!normalizedAnchor) return 0;

        const candidates = [
          normalizedAnchor,
          normalizedAnchor.split("\n")[0],
          normalizedAnchor.slice(0, 48),
          normalizedAnchor.slice(0, 24)
        ]
          .map((entry) => normalizeMarkdownSelectionText(entry))
          .filter(Boolean);

        for (const candidate of candidates) {
          const index = source.indexOf(candidate);
          if (index >= 0) {
            return Math.max(0, Math.min(source.length, index + Math.max(0, offsetHint)));
          }
        }

        return 0;
      }

      async function sha256Hex(value) {
        if (!window.crypto?.subtle || !window.TextEncoder) return "";
        const bytes = new TextEncoder().encode(String(value || ""));
        const digest = await window.crypto.subtle.digest("SHA-256", bytes);
        return Array.from(new Uint8Array(digest))
          .map((byte) => byte.toString(16).padStart(2, "0"))
          .join("");
      }

      function suspendActiveMarkdownEditor() {
        hideMarkdownLinkTooltip();
        appState.markdownEditorMountToken += 1;
        if (!appState.activeMarkdownEditor) return;
        const tabId = appState.activeMarkdownEditorTabId;
        const session = appState.markdownEditorSessions.get(tabId);
        if (session?.editor === appState.activeMarkdownEditor) {
          try {
            session.editor.blur?.();
          } catch (_) {
          }
          // Detach the whole content card before viewerBody.innerHTML is
          // replaced. Keeping this exact card preserves the EditorView plus
          // its title-input and card-level listeners; serializing Markdown
          // alone cannot preserve PM history or selection.
          session.card?.remove?.();
        }
        appState.activeMarkdownEditor = null;
        appState.activeMarkdownEditorTabId = null;
      }

      function destroyMarkdownEditorSession(tabId) {
        if (tabId == null) return;
        appState.markdownEditorMountToken += 1;
        const session = appState.markdownEditorSessions.get(tabId);
        if (!session) {
          if (appState.activeMarkdownEditorTabId === tabId) {
            appState.activeMarkdownEditor = null;
            appState.activeMarkdownEditorTabId = null;
          }
          return;
        }
        try {
          session.editor.destroy?.();
        } catch (_) {
        }
        appState.markdownEditorSessions.delete(tabId);
        if (appState.activeMarkdownEditorTabId === tabId) {
          appState.activeMarkdownEditor = null;
          appState.activeMarkdownEditorTabId = null;
        }
      }

      function destroyAllMarkdownEditorSessions() {
        appState.markdownEditorMountToken += 1;
        for (const [tabId, session] of appState.markdownEditorSessions) {
          try {
            session.editor.destroy?.();
          } catch (_) {
          }
          appState.markdownEditorSessions.delete(tabId);
        }
        appState.activeMarkdownEditor = null;
        appState.activeMarkdownEditorTabId = null;
      }

      async function loadMarkdownEditorApi() {
        if (window.NutbookMarkdownEditor?.create) {
          return window.NutbookMarkdownEditor;
        }
        if (!appState.markdownEditorLoadPromise) {
          appState.markdownEditorLoadPromise = import("./assets/markdown-editor.js")
            .then(() => window.NutbookMarkdownEditor);
        }
        return appState.markdownEditorLoadPromise;
      }

      function sourceEditorValue(tab) {
        const sourceEditor = document.getElementById("editorArea");
        if (sourceEditor) return sourceEditor.value;
        return tab?.draft ?? tab?.preview?.raw ?? "";
      }

      function currentMarkdownContent(tab) {
        if (tab?.id === appState.activeMarkdownEditorTabId && appState.activeMarkdownEditor?.getMarkdown) {
          try {
            return appState.activeMarkdownEditor.getMarkdown();
          } catch (_) {
          }
        }
        return sourceEditorValue(tab);
      }

      function captureActiveMarkdownDraft() {
        const tab = getOpenTab(appState.activeMarkdownEditorTabId);
        if (tab?.preview?.fileType !== "markdown" || !appState.activeMarkdownEditor) return;
        tab.draft = currentMarkdownContent(tab);
        const baseline = tab.markdownBaseline ?? tab.preview.raw ?? "";
        tab.isDirty = tab.draft !== baseline;
      }

      function markdownContentForTab(tab) {
        if (!tab || tab.preview?.fileType !== "markdown") return "";
        if (tab.id === appState.activeTabId) {
          return currentMarkdownContent(tab);
        }
        return tab.draft ?? tab.preview.raw ?? "";
      }

      function isMarkdownTabDirty(tab) {
        if (!tab || tab.preview?.fileType !== "markdown") return false;
        const baseline = tab.markdownBaseline ?? tab.preview.raw ?? "";
        return Boolean(tab.isDirty) || markdownContentForTab(tab) !== baseline;
      }

      // 当前文档标题（供顶部标题输入框显示）：优先从 editor/draft 的
      // DocumentTitle 解析结果派生；无有效 H1 时固定回退真实文件名。
      // 绝不使用可变 draft title 或未保存的 tab.preview.title（B3 复审 P1）。
      function currentMarkdownDisplayTitle(tab) {
        if (!tab) return "Markdown";
        const editor = appState.activeMarkdownEditor;
        if (editor?.getDocumentTitle && tab.id === appState.activeMarkdownEditorTabId) {
          const title = editor.getDocumentTitle();
          if (title) return title;
          return tab.item?.fileName || "Markdown";
        }
        return markdownDocumentTitle(
          markdownContentForTab(tab),
          tab.item?.fileName || "Markdown"
        );
      }

      // 超长标题自动增高（B3 复审 P2）：textarea 高度随 scrollHeight 增长。
      function autosizeMarkdownTitleInput(input) {
        if (!input) return;
        input.style.height = "auto";
        input.style.height = `${input.scrollHeight}px`;
      }

      // 标题输入框的自维护文本 history（B3 复审修复：WKWebView 会把整个输入
      // 会话合并成单个原生 undo 单元——输入 abc 后按 ⌘Z 一次删光三个字母；
      // 改为按 input 事件粒度的快照栈，每次用户输入产生一个撤销步骤，
      // ⌘Z 逐字符回退，⇧⌘Z 逐字符重做。不触碰 ProseMirror。）
      const titleInputEditSessions = new WeakMap();

      function markdownTitleInputSession(input) {
        let session = titleInputEditSessions.get(input);
        if (!session) {
          session = { undoStack: [], redoStack: [], lastValue: input.value, composingStartValue: null };
          titleInputEditSessions.set(input, session);
        }
        return session;
      }

      // 程序化设值：清空编辑栈（输入会话被外部打断），并重算高度。
      // 所有非用户输入引发的 value 更新必须走这里，保证栈与真实值对齐。
      function setTitleInputValue(input, value) {
        if (!input) return;
        const next = String(value ?? "");
        if (input.value !== next) input.value = next;
        const session = titleInputEditSessions.get(input);
        if (session) {
          session.undoStack.length = 0;
          session.redoStack.length = 0;
          session.lastValue = next;
        }
        autosizeMarkdownTitleInput(input);
      }

      // 标题输入框 undo：恢复最近一次输入前快照（逐字符粒度）。
      function undoMarkdownTitleInput() {
        const input = document.getElementById("markdownTitleInput");
        if (!input) return false;
        const session = titleInputEditSessions.get(input);
        if (!session || session.undoStack.length === 0) return false;
        session.redoStack.push(input.value);
        input.value = session.undoStack.pop();
        session.lastValue = input.value;
        autosizeMarkdownTitleInput(input);
        return true;
      }

      // 标题输入框 redo：重放被撤销的输入快照。
      function redoMarkdownTitleInput() {
        const input = document.getElementById("markdownTitleInput");
        if (!input) return false;
        const session = titleInputEditSessions.get(input);
        if (!session || session.redoStack.length === 0) return false;
        session.undoStack.push(input.value);
        input.value = session.redoStack.pop();
        session.lastValue = input.value;
        autosizeMarkdownTitleInput(input);
        return true;
      }

      function commitMarkdownDocumentTitle(tab, input) {
        if (!tab || tab.preview?.fileType !== "markdown" || !input) return;
        const nextTitle = String(input.value || "").trim();
        if (!nextTitle) {
          setTitleInputValue(input, currentMarkdownDisplayTitle(tab));
          return;
        }
        const baseline = tab.markdownBaseline ?? tab.preview?.raw ?? "";
        const editor = appState.activeMarkdownEditor;
        const editorOwnsContent = editor?.setDocumentTitle && tab.id === appState.activeMarkdownEditorTabId;
        if (editorOwnsContent) {
          // Milkdown 活跃：通过一次 ProseMirror transaction 修改标题。
          // 不销毁、不重建、不重新挂载编辑器；不重置 baseline。
          const committed = editor.setDocumentTitle(nextTitle);
          if (!committed) return;
          tab.draft = editor.getMarkdown();
          tab.isDirty = tab.draft !== baseline;
          setTitleInputValue(input, currentMarkdownDisplayTitle(tab));
          updateMarkdownStatusHint(tab);
          return;
        }
        // 源码 fallback：只修改当前 draft / textarea，不重绘整个 viewer。
        const current = markdownContentForTab(tab);
        const next = setMarkdownDocumentTitle(current, nextTitle);
        if (next === current && currentMarkdownDisplayTitle(tab) === nextTitle) return;
        tab.draft = next;
        tab.isDirty = next !== baseline;
        const editorArea = document.getElementById("editorArea");
        if (editorArea && document.activeElement !== editorArea) {
          editorArea.value = next;
        }
        setTitleInputValue(input, currentMarkdownDisplayTitle(tab));
        updateMarkdownStatusHint(tab);
      }

      // 统一收敛"标题输入框未提交的值"（P0）：⌘S、关闭单个标签、关闭全部
      // 标签、应用退出共用。标题值与当前文档标题不同且未在 composition 时，
      // 先通过现有一次 PM transaction / fallback transform 提交标题，再计算
      // draft/dirty。composition 尚未结束时不得强制提交，返回 false 由调用方
      // 阻止退出/关闭并给出可理解状态。
      // 返回 true 表示已收敛（或无需收敛），false 表示 composition 进行中。
      function convergePendingMarkdownTitle(tab) {
        if (!tab || tab.preview?.fileType !== "markdown") return true;
        if (appState.markdownTitleInputComposing) return false;
        const input = document.getElementById("markdownTitleInput");
        if (!input) return true;
        // 标题输入框只属于当前显示的 tab；其他 tab 的标题由 draft 承载。
        if (tab.id !== appState.activeTabId) return true;
        const nextTitle = String(input.value || "").trim();
        const display = currentMarkdownDisplayTitle(tab);
        if (!nextTitle) {
          // 用户清空输入：恢复文档当前标题显示（不产生提交）。
          if (input.value !== display) setTitleInputValue(input, display);
          return true;
        }
        if (nextTitle === display) return true;
        commitMarkdownDocumentTitle(tab, input);
        return true;
      }

      function syncMarkdownTitleInputFromDocument(tab, markdown) {
        if (!tab || tab.id !== appState.activeTabId) return;
        const input = document.getElementById("markdownTitleInput");
        if (!input || document.activeElement === input) return;
        if (appState.markdownTitleInputComposing) return;
        // 无 H1 fallback 固定使用真实文件名（不使用 tab.preview.title——
        // 它是最近一次 durable preview，未保存的标题事务不得改写它）。
        const display = markdownDocumentTitle(markdown, tab.item?.fileName || "Markdown");
        if (input.value !== display) {
          setTitleInputValue(input, display);
        }
      }

      function setupMarkdownTitleInput(tab) {
        const input = document.getElementById("markdownTitleInput");
        if (!input || !tab) return;
        appState.markdownTitleInputComposing = false;
        const session = markdownTitleInputSession(input);
        input.addEventListener("compositionstart", () => {
          appState.markdownTitleInputComposing = true;
          // 记录本次组合开始前的 value：整个组合结果只记为一个 undo 单元，
          // 组合中间态（拼音候选等）不得入栈。
          session.composingStartValue = input.value;
        });
        input.addEventListener("compositionend", () => {
          appState.markdownTitleInputComposing = false;
          // 组合结束：若值变化，把整个组合结果记为一个撤销步骤（从组合前值
          // 一步到组合后值），更新 lastValue 并清空 redo 栈。
          if (input.value !== session.composingStartValue) {
            session.undoStack.push(session.composingStartValue);
            session.redoStack.length = 0;
            session.lastValue = input.value;
          }
          session.composingStartValue = null;
          autosizeMarkdownTitleInput(input);
          // composition 期间可能已失焦（blur 时因 composing 跳过 commit），
          // 结束后若已失焦则补一次收敛提交；仍聚焦时不得自动提交。
          if (document.activeElement !== input) {
            commitMarkdownDocumentTitle(tab, input);
          }
        });
        input.addEventListener("input", () => {
          // 用户输入（非 composition）：每次 input 事件产生一个撤销步骤。
          // IME composition 的中间态不记录，compositionend 后整体记录一次。
          if (!appState.markdownTitleInputComposing && input.value !== session.lastValue) {
            session.undoStack.push(session.lastValue);
            session.redoStack.length = 0;
            session.lastValue = input.value;
          }
          autosizeMarkdownTitleInput(input);
        });
        input.addEventListener("keydown", (event) => {
          if (event.isComposing || event.key === "Process") return;
          if (event.key === "Enter") {
            event.preventDefault();
            input.blur();
          }
          if (event.key === "Escape") {
            setTitleInputValue(input, currentMarkdownDisplayTitle(tab));
            input.blur();
          }
        });
        input.addEventListener("blur", () => {
          if (appState.markdownTitleInputComposing) return;
          commitMarkdownDocumentTitle(tab, input);
        });
        autosizeMarkdownTitleInput(input);
      }

      function updateMarkdownStatusHint(tab) {
        if (!tab || tab.preview?.fileType !== "markdown") return;
        if (appState.markdownEditorError) {
          setStatus(markdownEditorFailedStatus(appState.markdownEditorError), "warn");
          return;
        }
        if (isMarkdownTabDirty(tab)) {
          setStatus(t("markdown.dirty"), "warn");
        } else {
          setStatus(t("markdown.editableHint"), "ok");
        }
      }

      function logMarkdownPerf(label, startedAt, extra = "") {
        if (!window.console || !startedAt) return;
        const elapsed = Math.round(performance.now() - startedAt);
        console.debug(`[nutbook:md] ${label} ${elapsed}ms${extra ? ` ${extra}` : ""}`);
      }

      function scheduleMarkdownEditorMount(tab) {
        if (!tab || tab.preview?.fileType !== "markdown") return;
        const token = ++appState.markdownEditorMountToken;
        const run = () => {
          if (token !== appState.markdownEditorMountToken || appState.activeTabId !== tab.id) return;
          mountMarkdownEditor(tab);
        };
        window.requestAnimationFrame(run);
      }

      function warmMarkdownEditorApi() {
        const requestIdle = window.requestIdleCallback || ((callback) => window.setTimeout(callback, 80));
        requestIdle(() => {
          loadMarkdownEditorApi().catch((error) => {
            console.debug("[nutbook:md] editor warmup skipped", error);
          });
        }, { timeout: 900 });
      }

      async function insertMarkdownImageAssetForTab(tab) {
        if (!tab?.item?.filePath) {
          setStatus(t("markdown.imageInsertMissingPath"), "warn");
          return null;
        }
        const sourceImagePath = await invoke("open_image_file_dialog");
        if (!sourceImagePath) return null;
        try {
          const result = await invoke("copy_markdown_image_asset", {
            payload: {
              markdownFilePath: tab.item.filePath,
              sourceImagePath
            }
          });
          const relativePath = result?.relativePath ?? result?.relative_path ?? "";
          if (!relativePath) return null;
          setStatus(t("markdown.imageInserted"), "ok");
          return {
            relativePath,
            fileName: result?.fileName ?? result?.file_name ?? ""
          };
        } catch (error) {
          setStatus(statusError("markdown.imageInsertFailedPrefix", error), "error");
          return null;
        }
      }

      // PR C / C2：`+ → 封面图` 的宿主侧 picker/copy。复制前由后端完成全部安全
      // 校验（magic MIME / 扩展 / 字节 / 像素 / 4:3..2:1 / EXIF / SVG 安全），
      // 校验失败不留下半成品；成功后注册 staged lease 并绑定 item + tab +
      // operation generation。picker/copy 晚到或 generation 已失效时释放 lease，
      // 绝不把结果写入错误文档。
      async function insertMarkdownCoverAssetForTab(tab) {
        if (!tab?.item?.filePath) {
          const missingPathMessage = t("markdown.imageInsertMissingPath");
          setStatus(missingPathMessage, "warn");
          showToast(missingPathMessage);
          return null;
        }
        tab.coverOperationGeneration = (tab.coverOperationGeneration || 0) + 1;
        const generation = tab.coverOperationGeneration;
        const activationToken = tab.coverActivationToken || 0;
        const sourceImagePath = await invoke("open_image_file_dialog");
        if (!sourceImagePath) return null;
        // picker 打开期间切换 tab/关闭/重建编辑 surface：复制前即可判定失效，
        // 不制造无意义 staged 文件。A→B→A 回到原 tab 时 activation token 已变化，
        // 也不能让旧 picker 结果穿越两次切换后写回。
        if (
          tab.closed
          || appState.activeTabId !== tab.id
          || (tab.coverActivationToken || 0) !== activationToken
          || (tab.coverOperationGeneration || 0) !== generation
        ) {
          return null;
        }
        try {
          const result = await invoke("copy_markdown_cover_asset", {
            payload: {
              markdownFilePath: tab.item.filePath,
              sourceImagePath,
              itemId: tab.id,
              tabId: String(tab.id),
              operationGeneration: generation
            }
          });
          const relativePath = result?.relativePath ?? result?.relative_path ?? "";
          if (!relativePath) {
            releaseMarkdownCoverLeaseForTab(tab, generation);
            return null;
          }
          // 复制晚到 / 会话代号已失效：释放本次 staged lease，不插入错误文档。
          if (
            (tab.coverOperationGeneration ?? 0) !== generation
            || tab.closed
            || appState.activeTabId !== tab.id
            || (tab.coverActivationToken || 0) !== activationToken
          ) {
            releaseMarkdownCoverLeaseForTab(tab, generation);
            return null;
          }
          const insertedMessage = t("markdown.coverInserted");
          setStatus(insertedMessage, "ok");
          showToast(insertedMessage);
          return {
            relativePath,
            fileName: result?.fileName ?? result?.file_name ?? "",
            stagedAssetId: result?.stagedAssetId ?? result?.staged_asset_id ?? "",
            operationGeneration: generation,
            naturalWidth: Number(result?.naturalWidth ?? result?.natural_width ?? 0),
            naturalHeight: Number(result?.naturalHeight ?? result?.natural_height ?? 0)
          };
        } catch (error) {
          const { full, short } = statusAndShortToast(
            "markdown.coverInsertFailedPrefix",
            "markdown.coverInsertBlockedShort",
            error
          );
          setStatus(full, "error");
          showToast(short);
          return null;
        }
      }

      // 已有正文本地图片设为封面：不重复 copy，只校验 canonical path / MIME /
      // 尺寸 / 4:3..2:1（http/https 在线图片不下载不校验比例，直接可设封面）。
      async function validateMarkdownCoverAssetForTab(tab, src) {
        if (!tab?.item?.filePath || !src || !appState.isTauri) return false;
        if (/^https?:\/\//i.test(String(src).trim())) return true;
        try {
          const result = await invoke("validate_markdown_cover_asset", {
            payload: {
              itemId: tab.id,
              markdownFilePath: tab.item.filePath,
              src
            }
          });
          if (result?.valid) return true;
          const reason = result?.reason || t("markdown.coverAspectHint");
          // 状态栏 = 详细技术原因（比例 / MIME / SVG 安全规则）；toast = 口语总结。
          setStatus(`${t("markdown.coverValidationFailedPrefix")}${reason}`, "error");
          showToast(t("markdown.coverValidationBlockedShort"));
          return false;
        } catch (error) {
          const { full, short } = statusAndShortToast(
            "markdown.coverValidationFailedPrefix",
            "markdown.coverValidationBlockedShort",
            error
          );
          setStatus(full, "error");
          showToast(short);
          return false;
        }
      }

      // 放弃 / 关闭 / 复制晚到时释放 staged lease：只清理"本会话新建、磁盘
      // baseline 未引用、当前 draft 未引用"的 staged 文件；刚保存的封面（已被
      // 最终 Markdown 引用）保留。已提交旧封面 / 正文共享图片绝不被删除。
      async function releaseMarkdownCoverLeaseForTab(tab, generation, { quiet = false } = {}) {
        if (!tab?.id || !appState.isTauri) return;
        const operationGeneration = generation ?? tab.coverOperationGeneration ?? 0;
        if (!operationGeneration) return;
        const srcs = collectDraftImageSrcs(markdownContentForTab(tab));
        try {
          await invoke("release_markdown_cover_lease", {
            payload: {
              itemId: tab.id,
              tabId: String(tab.id),
              operationGeneration,
              draftImageSrcs: srcs
            }
          });
        } catch (error) {
          if (!quiet) console.warn("release cover lease failed", error);
        }
      }

      // 从 draft Markdown 保守提取图片 src（引用保护：宁可多保留也不误删）。
      function collectDraftImageSrcs(markdown = "") {
        const srcs = [];
        const seen = new Set();
        const push = (value) => {
          const cleaned = String(value || "").trim();
          if (cleaned && !seen.has(cleaned)) {
            seen.add(cleaned);
            srcs.push(cleaned);
          }
        };
        const imagePattern = /!\[[^\]]*\]\(\s*([^)\s]+)(?:\s+["'][^"']*["'])?\s*\)/g;
        let match = imagePattern.exec(markdown);
        while (match) {
          push(match[1]);
          match = imagePattern.exec(markdown);
        }
        const imgPattern = /<img\b[^>]*\bsrc=["']([^"']+)["']/gi;
        match = imgPattern.exec(markdown);
        while (match) {
          push(match[1]);
          match = imgPattern.exec(markdown);
        }
        return srcs;
      }

      async function deleteMarkdownImageAssetForTab(tab, imageSrc) {
        if (!tab?.item?.filePath || !imageSrc || !appState.isTauri) return false;
        try {
          return await invoke("delete_markdown_image_asset", {
            payload: {
              markdownFilePath: tab.item.filePath,
              imageSrc
            }
          });
        } catch (error) {
          console.warn("Markdown image asset delete failed", error);
          return false;
        }
      }

      async function mountMarkdownEditor(tab) {
        const root = document.getElementById("milkdownEditorRoot");
        if (!root || !tab) return;
        const mountStartedAt = performance.now();
        const expectedTabId = tab.id;
        const content = tab.draft ?? tab.preview.raw ?? "";
        try {
          appState.markdownEditorError = "";
          setStatus(t("markdown.loadingEditorStatus"), "warn");
          const preservedSession = appState.markdownEditorSessions.get(expectedTabId);
          if (preservedSession?.editor && preservedSession.root && preservedSession.card) {
            if (!root.isConnected || appState.activeTabId !== expectedTabId) return;
            const placeholderCard = root.closest(".content-card");
            if (!placeholderCard) return;
            placeholderCard.replaceWith(preservedSession.card);
            preservedSession.card.classList.toggle("markdown-code-theme-light", appState.markdownPreferences.codeBlockTheme === "light");
            preservedSession.card.classList.toggle("markdown-code-theme-dark", appState.markdownPreferences.codeBlockTheme !== "light");
            appState.activeMarkdownEditor = preservedSession.editor;
            appState.activeMarkdownEditorTabId = expectedTabId;
            preservedSession.card.classList.add("editor-ready");
            window.requestAnimationFrame(() => setupMarkdownOutline(preservedSession.card));
            setStatus(isMarkdownTabDirty(tab) ? t("markdown.dirty") : t("markdown.ready"), isMarkdownTabDirty(tab) ? "warn" : "ok");
            window.requestAnimationFrame(() => {
              restoreMarkdownScroll(tab, markdownScrollForTab(tab) || 0);
              if (appState.markdownEditorShouldFocus) {
                appState.markdownEditorShouldFocus = false;
                preservedSession.editor.focus?.();
              } else {
                preservedSession.editor.blur?.();
              }
            });
            logMarkdownPerf("editor-resumed", mountStartedAt, tab.item?.fileName || "");
            return;
          }
          const apiStartedAt = performance.now();
          const api = await loadMarkdownEditorApi();
          logMarkdownPerf("api-ready", apiStartedAt, tab.item?.fileName || "");
          if (!api?.create) {
            throw new Error("Markdown editor API is unavailable");
          }
          if (!root.isConnected || appState.activeTabId !== expectedTabId) {
            return;
          }
          const editor = await api.create({
            root,
            markdown: content,
            fileName: tab.item?.fileName || tab.preview?.title || "",
            language: appState.language,
            tableToolsEnabled: appState.markdownPreferences.tableToolsEnabled,
            resolveImageSrc(src) {
              return resolveMarkdownImageUrl(src, tab) || src;
            },
            onInsertImageAsset() {
              return insertMarkdownImageAssetForTab(tab);
            },
            onInsertCoverAsset() {
              return insertMarkdownCoverAssetForTab(tab);
            },
            onReleaseCoverAsset(asset) {
              return releaseMarkdownCoverLeaseForTab(tab, asset?.operationGeneration, { quiet: true });
            },
            onValidateCoverAsset(src) {
              return validateMarkdownCoverAssetForTab(tab, src);
            },
            // PR C / C2：封面身份操作反馈。校验拒绝的原因已由
            // validateMarkdownCoverAssetForTab 输出，这里不重复提示。
            onCoverChange(result) {
              if (!result) return;
              // 成功/失败与保存提醒同一 toast 通道：状态栏 + 居中 toast 双提示。
              if (result.ok) {
                const message = t(result.kind === "remove" ? "markdown.coverRemovedOk" : "markdown.coverSetOk");
                setStatus(message, "ok");
                showToast(message);
              } else if (!(result.kind === "set" && result.reason === "validation")) {
                const message = t(result.kind === "remove" ? "markdown.coverRemoveFailed" : "markdown.coverSetFailed");
                setStatus(message, "warn");
                showToast(message);
              }
            },
            onRemoveImageAsset(src) {
              return deleteMarkdownImageAssetForTab(tab, src);
            },
            onImageSizeError() {
              setStatus(t("markdown.imageSizeReadFailed"), "warn");
            },
            onEdit() {
              tab.isDirty = true;
              if (tab.id === appState.activeTabId) {
                setStatus(t("markdown.dirty"), "warn");
              }
            },
            onChange(value) {
              tab.draft = value;
              const baseline = tab.markdownBaseline ?? tab.preview.raw ?? "";
              tab.isDirty = value !== baseline;
              scheduleMarkdownOutlineRefresh(tab);
              // 撤销/重做/编辑后，顶部标题输入框与实际编辑器文档保持同步；
              // 输入框获得焦点或正在 composition 时不得反向覆盖用户输入。
              syncMarkdownTitleInputFromDocument(tab, value);
              if (tab.id === appState.activeTabId && tab.isDirty) {
                setStatus(t("markdown.dirty"), "warn");
              }
            }
          });
          logMarkdownPerf("editor-created", mountStartedAt, tab.item?.fileName || "");
          if (!root.isConnected || appState.activeTabId !== expectedTabId) {
            editor.destroy?.();
            return;
          }
          appState.markdownEditorSessions.set(expectedTabId, {
            root,
            card: root.closest(".content-card"),
            editor
          });
          appState.activeMarkdownEditor = editor;
          appState.activeMarkdownEditorTabId = expectedTabId;
          tab.markdownBaseline = editor.getBaselineMarkdown?.() ?? content;
          tab.draft = tab.markdownBaseline;
          tab.isDirty = false;
          const scrollBeforeReady = markdownScrollForTab(tab) || els.viewerBody.scrollTop || 0;
          root.closest(".content-card")?.classList.add("editor-ready");
          const markdownCard = root.closest(".content-card");
          window.requestAnimationFrame(() => {
            assignMarkdownOutlineTargets(markdownCard);
            setupMarkdownCodeCopyButton(markdownCard);
            setupMarkdownImageResources(markdownCard, tab);
          });
          setStatus(isMarkdownTabDirty(tab) ? t("markdown.dirty") : t("markdown.ready"), isMarkdownTabDirty(tab) ? "warn" : "ok");
          window.requestAnimationFrame(() => {
            restoreMarkdownScroll(tab, scrollBeforeReady);
            if (appState.markdownEditorShouldFocus) {
              appState.markdownEditorShouldFocus = false;
              editor.focus?.();
            } else {
              editor.blur?.();
            }
          });
        } catch (error) {
          console.warn("Milkdown failed to mount, falling back to source editor", error);
          appState.markdownEditMode = "source";
          appState.markdownEditorError = normalizeDetailedError(error);
          setStatus(markdownEditorFailedStatus(appState.markdownEditorError), "warn");
          renderViewer();
        }
      }

      function focusMarkdownEditorFromPendingSelection() {
        const editor = document.getElementById("editorArea");
        if (!editor) return;
        const tab = getActiveTab();
        const raw = editor.value || tab?.draft || tab?.preview?.raw || "";
        const cursor = 0;

        editor.focus({ preventScroll: true });
        editor.setSelectionRange(cursor, cursor);

        const lineCount = raw.slice(0, cursor).split("\n").length;
        const lineHeight = Number.parseFloat(window.getComputedStyle(editor).lineHeight) || 29;
        editor.scrollTop = Math.max(0, (lineCount - 3) * lineHeight);
      }

      function formatTimestamp(value) {
        if (!value) return "未知";
        const numeric = Number(value);
        const date = Number.isFinite(numeric) ? new Date(numeric * 1000) : new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        }).format(date);
      }

      function normalizeError(error) {
        if (!error) return "未知错误";
        if (typeof error === "string") return error;
        if (error.message && error.code) return `${error.message} [${error.code}]`;
        if (error.message) return error.message;
        if (error.code) return String(error.code);
        return JSON.stringify(error);
      }

      function normalizeDetailedError(error) {
        const message = normalizeError(error);
        const stackLine = String(error?.stack || "")
          .split("\n")
          .map((line) => line.trim())
          .find((line) => line && !line.includes("normalizeDetailedError"));
        return stackLine ? `${message} / ${stackLine}` : message;
      }

      function isMissingIndexedItemError(error) {
        const code = String(error?.code || "").toUpperCase();
        if (code === "ITEM_NOT_FOUND" || code === "LIBRARY_NOT_FOUND") return true;
        const message = normalizeError(error).toLowerCase();
        return message.includes("item not found") || message.includes("library not found");
      }

      function toRuntimeFileUrl(pathOrUrl, fallbackPath) {
        const candidate = fallbackPath || pathOrUrl;
        if (!candidate) return "";
        if (String(candidate).startsWith("nutbook-preview://")) {
          return String(candidate);
        }
        if (!appState.isTauri || typeof convertFileSrcRaw !== "function") {
          return pathOrUrl || candidate;
        }

        let localPath = candidate;
        if (String(localPath).startsWith("file://")) {
          try {
            localPath = decodeURIComponent(new URL(localPath).pathname);
          } catch (_) {
          }
        }
        return convertFileSrcRaw(localPath);
      }

      function toLocalServerUrl(pathOrUrl, query = "") {
        if (!pathOrUrl) return "";
        const value = String(pathOrUrl);
        if (value.startsWith("http://127.0.0.1:") || value.startsWith("http://localhost:")) {
          return `${value}${query}`;
        }

        let localPath = value;
        if (localPath.startsWith("file://")) {
          try {
            localPath = decodeURIComponent(new URL(localPath).pathname);
          } catch (_) {
          }
        }

        if (!localPath.startsWith("/") || !appState.localServerOrigin) {
          return value;
        }

        const encodedPath = localPath
          .split("/")
          .filter(Boolean)
          .map((segment) => encodeURIComponent(segment))
          .join("/");
        return `${appState.localServerOrigin}/fs/${encodedPath}${query}`;
      }

      function markdownToHtml(raw) {
        const escaped = raw
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
        return escaped
          .replace(/^### (.*)$/gm, "<h3>$1</h3>")
          .replace(/^## (.*)$/gm, "<h2>$1</h2>")
          .replace(/^# (.*)$/gm, "<h1>$1</h1>")
          .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
          .replace(/\n\n/g, "</p><p>")
          .replace(/^(?!<h)(.+)$/gm, "<p>$1</p>");
      }

      function normalizeTag(tag) {
        if (!tag) return null;
        return {
          id: Number(tag.id),
          name: tag.name,
          color: tag.color ?? null,
          createdAt: tag.createdAt ?? tag.created_at ?? null,
          updatedAt: tag.updatedAt ?? tag.updated_at ?? null
        };
      }

      function normalizeThumbnailInfo(thumbnail) {
        if (!thumbnail) return null;
        let path = thumbnail.path ?? null;
        if (path && (path.startsWith("/") || path.startsWith("file://"))) {
          path = toLocalServerUrl(path);
        }
        return {
          status: thumbnail.status,
          path,
          width: thumbnail.width ?? null,
          height: thumbnail.height ?? null,
          lastGeneratedAt: thumbnail.lastGeneratedAt ?? thumbnail.last_generated_at ?? null,
          errorMessage: thumbnail.errorMessage ?? thumbnail.error_message ?? null,
          desiredKey: thumbnail.desiredKey ?? thumbnail.desired_key ?? null,
          generation: thumbnail.generation ?? null,
          renderKind: thumbnail.renderKind ?? thumbnail.render_kind ?? null,
          remoteCoverUrl: thumbnail.remoteCoverUrl ?? thumbnail.remote_cover_url ?? null
        };
      }

      function normalizeThumbnailBackendStatus(status) {
        if (!status) return null;
        return {
          screenshotAvailable: Boolean(status.screenshotAvailable ?? status.screenshot_available),
          chromiumPath: status.chromiumPath ?? status.chromium_path ?? null,
          systemChromeAvailable: Boolean(status.systemChromeAvailable ?? status.system_chrome_available),
          systemChromePath: status.systemChromePath ?? status.system_chrome_path ?? null,
          systemChromeEnabled: Boolean(status.systemChromeEnabled ?? status.system_chrome_enabled),
          fallbackBackend: status.fallbackBackend ?? status.fallback_backend ?? "placeholder-svg"
        };
      }

      function thumbnailEngineKind() {
        const status = appState.thumbnailBackendStatus;
        if (!status?.screenshotAvailable) return "placeholder";
        if (status.systemChromeEnabled && status.systemChromePath && status.chromiumPath === status.systemChromePath) {
          return "system-chrome";
        }
        return "headless";
      }

      function thumbnailEngineDisplayName() {
        const status = appState.thumbnailBackendStatus;
        if (!status?.screenshotAvailable) return t("settings.thumbnailDefaultIcon");
        if (thumbnailEngineKind() === "system-chrome") return t("settings.thumbnailSystemChrome");
        const path = status.chromiumPath || "";
        if (path.includes("chrome-headless-shell")) return "Chrome Headless Shell";
        if (path.includes("Google Chrome for Testing")) return "Chrome for Testing";
        if (path) return t("settings.thumbnailLocalChromium");
        return t("settings.thumbnailEngineAvailable");
      }

      // B4 引擎能力拆分：Markdown 默认封面由 Rust 直接生成确定性 SVG，
      // **不依赖截图引擎**；只有 HTML 截图（html-screenshot）需要 Chromium。
      function thumbnailScreenshotEngineAvailable() {
        return Boolean(appState.thumbnailBackendStatus?.screenshotAvailable);
      }

      function canGenerateDocumentThumbnails() {
        return thumbnailScreenshotEngineAvailable();
      }

      // 某 item 当前是否需要（重新）生成缩略图：只按真实状态判断
      // （status / renderKind / desiredKey），不再用 data:image/svg+xml 前缀——
      // B4 的官方 Markdown 默认封面是真实 .svg 缓存文件路径，不是 placeholder。
      function thumbnailNeedsGeneration(item) {
        if (!supportsGeneratedThumbnail(item) || isItemPathMissing(item)) return false;
        const thumb = item.thumbnail;
        // 本地封面降级（status=failed + markdown-image-cover）是当前状态：
        // 卡片回退标题 SVG + hover 警告，不反复排队；资源恢复由读取路径的
        // asset stat 复核触发重新生成（自动升级并移除警告）。
        if (
          item.fileType === "markdown" &&
          thumb &&
          thumb.renderKind === "markdown-image-cover" &&
          thumb.status === "failed"
        ) {
          return false;
        }
        // 在线封面是只读 remote projection：有标题 SVG fallback + URL 即已收敛，
        // 不参加本地 generation/ready 队列。
        if (
          item.fileType === "markdown" &&
          thumb &&
          thumb.renderKind === "markdown-remote-image-cover" &&
          thumb.status === "stale" &&
          thumb.path &&
          thumb.remoteCoverUrl
        ) {
          return false;
        }
        if (!thumb || thumb.status !== "ready") return true;
        // render kind 必须精确匹配当前正式路径之一；markdown-html-screenshot
        // （已退休）、placeholder、缺失等任何其他 kind 一律按"需要重建"处理。
        const expectedKinds = item.fileType === "html"
          ? ["html-screenshot"]
          : ["markdown-default-cover", "markdown-image-cover", "markdown-remote-image-cover"];
        if (!expectedKinds.includes(thumb.renderKind)) return true;
        // 兜底：旧 md-screenshot 过渡缓存（B1-B3）若仍以 ready 泄漏，按默认封面重建。
        if (
          item.fileType === "markdown" &&
          typeof thumb.desiredKey === "string" &&
          thumb.desiredKey.startsWith("md-screenshot:")
        ) {
          return true;
        }
        return false;
      }

      // 自动补缺队列目标：只处理 missing / stale / 错误 render kind / 旧 key 的项。
      // HTML 项只有在引擎可用时才进入队列；引擎不可用时被跳过（Markdown 照常）。
      function thumbnailAutoQueueTargets(items) {
        const needs = items.filter(thumbnailNeedsGeneration);
        const engineBlocked = !thumbnailScreenshotEngineAvailable();
        if (!engineBlocked) return { targets: needs, skippedHtml: 0 };
        const targets = needs.filter((item) => item.fileType !== "html");
        const skippedHtml = needs.length - targets.length;
        return { targets, skippedHtml };
      }

      // 用户主动重建目标：处理**所有**支持的、路径有效的 Markdown/HTML——不因当前
      // thumbnail 是 ready 就排除（审查阻塞 1）。无截图引擎时：所有 Markdown 仍进入
      // 重建，HTML 跳过并计入 skippedHtml；有引擎时 HTML 与 Markdown 都重建。
      function thumbnailForceRebuildTargets(items) {
        const supported = items.filter(
          (item) => supportsGeneratedThumbnail(item) && !isItemPathMissing(item)
        );
        const engineBlocked = !thumbnailScreenshotEngineAvailable();
        if (!engineBlocked) return { targets: supported, skippedHtml: 0 };
        const targets = supported.filter((item) => item.fileType !== "html");
        const skippedHtml = supported.length - targets.length;
        return { targets, skippedHtml };
      }

      function thumbnailProgressMessage(done, total, mode = t("status.thumbnailRefreshMode")) {
        return thumbnailEngineKind() === "system-chrome"
          ? `${t("status.thumbnailChromeProgressPrefix")}${done}/${total}`
          : `${t("status.thumbnailProgressPrefix")}${mode}${t("status.thumbnailProgressInfix")}${done}/${total}`;
      }

      function setThumbnailSettingsFeedback(message = "", tone = "info") {
        appState.thumbnailSettingsFeedback = message ? { message, tone } : null;
        syncThumbnailSettingsControls();
      }

      function syncThumbnailSettingsControls() {
        const operation = appState.thumbnailSettingsOperation;
        const buttonOperations = new Map([
          [els.settingsRefreshThumbnailStatusButton, "detect"],
          [els.settingsRebuildVisibleThumbsButton, "visible"],
          [els.settingsRebuildLibraryThumbsButton, "library"]
        ]);
        buttonOperations.forEach((buttonOperation, button) => {
          if (!button) return;
          button.disabled = Boolean(operation);
          button.setAttribute("aria-busy", operation === buttonOperation ? "true" : "false");
        });

        const feedback = appState.thumbnailSettingsFeedback;
        if (!els.settingsThumbnailFeedback) return;
        els.settingsThumbnailFeedback.hidden = !feedback;
        els.settingsThumbnailFeedback.textContent = feedback?.message || "";
        els.settingsThumbnailFeedback.dataset.tone = feedback?.tone || "info";
      }

      async function runThumbnailSettingsOperation(operation, task) {
        if (appState.thumbnailSettingsOperation) return null;
        const operationButton = {
          detect: els.settingsRefreshThumbnailStatusButton,
          visible: els.settingsRebuildVisibleThumbsButton,
          library: els.settingsRebuildLibraryThumbsButton
        }[operation];
        appState.thumbnailSettingsOperation = operation;
        syncThumbnailSettingsControls();
        try {
          return await task();
        } finally {
          appState.thumbnailSettingsOperation = null;
          syncThumbnailSettingsControls();
          if (appState.isSettingsOpen && appState.settingsTab === "thumbnails") {
            operationButton?.focus({ preventScroll: true });
          }
        }
      }

      function showThumbnailRebuildResult(result, successMessage) {
        if (!result) {
          const message = t("status.thumbnailEngineDisabled");
          setThumbnailSettingsFeedback(message, "error");
          return { message, tone: "error" };
        }
        if (result.reason === "engine-disabled") {
          // 需要重建的只有 HTML 且引擎不可用：明确说明 Markdown 默认封面不受影响。
          const message = t("status.thumbnailEngineUnavailableMarkdownOk");
          setThumbnailSettingsFeedback(message, "warn");
          return { message, tone: "warn" };
        }
        if (result.reason === "no-documents") {
          const message = t("status.thumbnailNoDocuments");
          setThumbnailSettingsFeedback(message, "info");
          return { message, tone: "warn" };
        }
        if (result.reason === "canceled") {
          // 队列被后续操作接管（自动刷新/设置切换）：不得显示"成功 N/M"。
          const message = `${t("status.thumbnailRebuildPartialPrefix")}${result.completed}/${result.total}`;
          setThumbnailSettingsFeedback(message, "warn");
          return { message, tone: "warn" };
        }
        if (result.failed > 0) {
          const detail = result.lastError ? ` — ${normalizeError(result.lastError)}` : "";
          const message = `${t("status.thumbnailRebuildPartialPrefix")}${result.failed}/${result.total}${detail}`;
          setThumbnailSettingsFeedback(message, "error");
          return { message, tone: "error" };
        }
        if (result.completed !== result.total) {
          // 未归类的漏项也不能显示绿色成功。正常路径应保证每一项最终归入
          // completed / failed / canceled；这里是最后一道用户可见安全网。
          const message = `${t("status.thumbnailRebuildPartialPrefix")}${result.completed}/${result.total}`;
          setThumbnailSettingsFeedback(message, "warn");
          return { message, tone: "warn" };
        }
        if (result.skipped > 0) {
          // 引擎不可用时 HTML 被跳过，Markdown 全部完成：部分成功 + 澄清文案。
          const message = `${t("status.thumbnailRebuildPartialPrefix")}${result.completed}/${result.total} — ${t("status.thumbnailEngineUnavailableMarkdownOk")}`;
          setThumbnailSettingsFeedback(message, "warn");
          return { message, tone: "warn" };
        }
        const message = `${successMessage} ${result.completed}/${result.total}`;
        setThumbnailSettingsFeedback(message, "ok");
        return { message, tone: "ok" };
      }

      function thumbnailEngineNeedsAttention() {
        const status = appState.thumbnailBackendStatus;
        return Boolean(status && !status.screenshotAvailable);
      }

      async function copyThumbnailInstallCommand() {
        const command = "npx playwright install chromium";
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(command);
          } else {
            const input = document.createElement("textarea");
            input.value = command;
            input.setAttribute("readonly", "");
            input.style.position = "absolute";
            input.style.left = "-9999px";
            document.body.appendChild(input);
            input.select();
            document.execCommand("copy");
            document.body.removeChild(input);
          }
          appState.thumbnailInstallCommandCopied = true;
          if (appState.thumbnailInstallCommandCopiedTimer != null) {
            window.clearTimeout(appState.thumbnailInstallCommandCopiedTimer);
          }
          appState.thumbnailInstallCommandCopiedTimer = window.setTimeout(() => {
            appState.thumbnailInstallCommandCopied = false;
            appState.thumbnailInstallCommandCopiedTimer = null;
            if (appState.isSettingsOpen && appState.settingsTab === "thumbnails") {
              renderSettingsPanel();
            }
          }, 1800);
          if (appState.isSettingsOpen && appState.settingsTab === "thumbnails") {
            renderSettingsPanel();
          }
          setStatus(t("status.installCommandCopied"), "ok");
        } catch (error) {
          setStatus(statusError("status.copyInstallCommandFailedPrefix", error), "error");
        }
      }

      function normalizeLibrary(library) {
        return {
          id: Number(library.id),
          name: library.name,
          rootPath: library.rootPath ?? library.root_path,
          sourceKind: library.sourceKind ?? library.source_kind ?? "folder",
          pathState: library.pathState ?? library.path_state ?? "valid",
          isActive: library.isActive ?? library.is_active,
          createdAt: library.createdAt ?? library.created_at,
          updatedAt: library.updatedAt ?? library.updated_at,
          lastScannedAt: library.lastScannedAt ?? library.last_scanned_at ?? null,
          skillBinding: normalizeSkillBinding(library.skillBinding ?? library.skill_binding ?? null)
        };
      }

      function normalizeSkillBinding(binding) {
        if (!binding) return null;
        return {
          normalizedName: binding.normalizedName ?? binding.normalized_name ?? "",
          displayName: binding.displayName ?? binding.display_name ?? ""
        };
      }

      function normalizeSourceBadge(badge) {
        if (!badge) return null;
        return {
          kind: badge.kind,
          sourceId: badge.sourceId ?? badge.source_id ?? "",
          label: badge.label ?? "",
          isOwner: Boolean(badge.isOwner ?? badge.is_owner),
          available: badge.available !== false
        };
      }

      function normalizeDiscoveredSkill(skill) {
        if (!skill) return null;
        return {
          name: skill.name,
          normalizedName: skill.normalizedName ?? skill.normalized_name ?? "",
          manifestPath: skill.manifestPath ?? skill.manifest_path,
          skillRootPath: skill.skillRootPath ?? skill.skill_root_path,
          outputPath: skill.outputPath ?? skill.output_path ?? null,
          outputDirDeclared: skill.outputDirDeclared ?? skill.output_dir_declared ?? null,
          sourceExists: Boolean(skill.sourceExists ?? skill.source_exists),
          isConnected: Boolean(skill.isConnected ?? skill.is_connected),
          status: skill.status ?? "manual",
          duplicateCount: Number(skill.duplicateCount ?? skill.duplicate_count ?? 1)
        };
      }

      function normalizeItemSummary(item) {
        return {
          id: Number(item.id),
          libraryId: item.libraryId ?? item.library_id,
          filePath: item.filePath ?? item.file_path,
          relativePath: item.relativePath ?? item.relative_path,
          fileName: item.fileName ?? item.file_name,
          fileExt: item.fileExt ?? item.file_ext,
          fileType: item.fileType ?? item.file_type,
          fileSize: item.fileSize ?? item.file_size,
          modifiedAt: item.modifiedAt ?? item.modified_at,
          title: item.title ?? null,
          summary: item.summary ?? null,
          pathState: item.pathState ?? item.path_state ?? "valid",

      function renderDocumentTagChips(item, typeLabel) {

      function getSearchKeyword() {
        return appState.appliedSearch;
      }

      let searchDebounceTimer = null;
      let isComposingSearch = false;

      async function applySearch(query) {
        const keyword = normalizeSearchKeyword(query);
        const previousApplied = appState.appliedSearch;
        appState.appliedSearch = keyword;
        // 搜索请求永不等待文件系统同步：sync 可能耗时数百毫秒，且由 autoRefresh
        // （~2.5s 周期）与手动扫描负责，阻塞搜索只会让输入/删除逐字卡顿。
        const ok = await loadItems({ skipFilesystemSync: true });
        // 只有「真失败」（异常/后端错误，含空查询）才回滚；被更新请求淘汰
        // （epoch 过期）返回 "stale"，此时状态已由新请求接管，绝不能回滚。
        if (ok === false && appState.appliedSearch === keyword) {
          appState.appliedSearch = previousApplied;
        }
        return ok === false ? false : true;
      }

      async function executeSearch(query, { recordHistory } = {}) {
        // 唯一搜索入口：Enter 触发 recordHistory=true（A2 最近搜索历史据此记录），
        // 实时防抖搜索、清空与历史点击均为 recordHistory=false。任何搜索路径都必须经由
        // 本函数，不得直接调用 applySearch，为 A2 保留单一记录点。
        const ok = await applySearch(query);
        // 只在「真正成功」后记录（零结果仍算成功，后端失败 / 空查询不记录）。
        if (recordHistory && ok !== false) {
          recordRecentSearch(query);
        }
        return ok;
      }

      function scheduleSearch(input) {
        // 捕获查询字符串快照：timer 到期后不得再读取 input.value，
        // 避免 200ms 内输入框被清空/改写导致过期值被意外执行。
        const query = input.value;
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => {
          executeSearch(query, { recordHistory: false });
        }, 200);
      }

      let searchSuggestionTimer = null;
      function scheduleSearchSuggestions(input) {
        clearTimeout(searchSuggestionTimer);
        const prefix = String(input?.value || "").trim();
        if (!prefix) { appState.searchSuggestions = []; return; }
        const epoch = ++appState.searchSuggestionEpoch;
        searchSuggestionTimer = setTimeout(async () => {
          try {
            const suggestions = await invoke("suggest_items", { prefix, limit: 8 });
            if (epoch !== appState.searchSuggestionEpoch || document.activeElement !== input || input.value.trim() !== prefix) return;
            appState.searchSuggestions = Array.isArray(suggestions) ? suggestions : [];
            renderSearchSuggestions(input);
          } catch (_) {
            if (epoch === appState.searchSuggestionEpoch) appState.searchSuggestions = [];
          }
        }, 100);
      }

      function renderSearchSuggestions(anchor) {
        const popup = els.recentSearchPopup;
        const suggestions = appState.searchSuggestions;
        if (!popup || !suggestions.length || !anchor || !els.mainShell.classList.contains("home-mode")) return;
        recentSearchAnchor = anchor;
        if (appState.searchSuggestionActiveIndex < 0 || appState.searchSuggestionActiveIndex >= suggestions.length) appState.searchSuggestionActiveIndex = 0;
        popup.setAttribute("aria-label", t("home.searchPlaceholder"));
        popup.dataset.searchMode = "suggestions";

            <span class="recent-search-text">${escapeHtml(suggestion.label || "")}</span>
            ${suggestion.sublabel ? `<span class="muted">${escapeHtml(suggestion.sublabel)}</span>` : ""}
          </div>`).join("");
        positionRecentSearchPopup(anchor);
        popup.classList.add("open");

      }

      function moveSearchSuggestionActive(step) {
        const suggestions = appState.searchSuggestions;
        if (!suggestions.length) return;
        appState.searchSuggestionActiveIndex = (appState.searchSuggestionActiveIndex + step + suggestions.length) % suggestions.length;
        renderSearchSuggestions(recentSearchAnchor || els.searchInput);
      }

      function applySearchSuggestion(index) {
        const value = appState.searchSuggestions[index]?.label;
        if (!value) return;
        syncSearchInputs(value);
        appState.searchDraft = value;
        closeRecentSearchPopup();
        executeSearch(value, { recordHistory: true });
      }

      function handleSearchInput(input) {
        const rawValue = input.value;
        const documentFindEditor = currentDocumentFindEditor();
        // The top field becomes a document-find entry while a Markdown tab is
        // active. Cmd+K still returns to the home/library search path; this
        // direct field path never mutates the global result list.
        if (documentFindEditor?.openFind) {
          clearTimeout(searchDebounceTimer);
          clearTimeout(searchSuggestionTimer);
          closeRecentSearchPopup();
          if (!rawValue) documentFindEditor.closeFind?.();
          else documentFindEditor.openFind({ query: rawValue, focus: false });
          return;
        }
        appState.searchDraft = rawValue;
        syncSearchInputs(rawValue);
        if (!rawValue.trim()) {
          // 无条件取消未触发的 debounce：若此前只有尚未生效的输入，
          // 保持当前结果（不再等 200ms）；若已有生效搜索则立即空查询恢复全量。
          clearTimeout(searchDebounceTimer);
          if (appState.appliedSearch) {
            executeSearch("", { recordHistory: false });

          // A2：输入被清空且仍聚焦时，重新展示最近搜索历史。
          openRecentSearchPopup(input);
          return;

        // A2：开始输入后立即关闭历史列表。
        closeRecentSearchPopup();
