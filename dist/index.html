<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NUTBOOK</title>
    <link rel="stylesheet" href="./assets/markdown-editor.css" />
    <style>
      @font-face {
        font-family: "Material Symbols Outlined";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("./assets/fonts/material-symbols-outlined-400.ttf") format("truetype");
      }

      :root {
        --bg: #f9f9fb;
        --surface: #f9f9fb;
        --surface-variant: #f3f3f5;
        --surface-muted: #eeeef0;
        --paper: #ffffff;
        --ink: #1a1c1d;
        --ink-soft: #5e5e63;
        --line: #e2e2e4;
        --line-strong: #cfcfd3;
        --accent: #000000;
        --accent-soft: #ececef;
        --danger: #b42318;
        --shadow: 0 12px 28px rgba(26, 28, 29, 0.06);
        --radius: 12px;
        --radius-sm: 8px;
        --sidebar-width: 264px;
        --sidebar-collapsed-width: 76px;
        --list-width: 360px;
        --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
        --font-title: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", system-ui, sans-serif;
      }

      .material-symbols-outlined {
        font-family: "Material Symbols Outlined";
        font-weight: 400;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        font-feature-settings: "liga";
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-ui);
        overflow: hidden;
      }

      body {
        min-height: 100vh;
      }

      .app-shell {
        display: grid;
        grid-template-columns: var(--sidebar-width) 1fr;
        min-height: 100vh;
        height: 100vh;
        gap: 0;
        padding: 0;
        transition: grid-template-columns 220ms ease;
        overflow: hidden;
      }

      .sidebar {
        background: rgba(250, 250, 250, 0.9);
        backdrop-filter: blur(20px);
        border-right: 1px solid var(--line);
        padding: 31px 16px 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow: visible;
        transition: padding 220ms ease;
        position: relative;
        z-index: 30;
        height: 100vh;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 8px 14px;
        transition: padding 220ms ease;
      }

      .brand-copy {
        display: flex;
        flex-direction: column;
        gap: 0;
        min-width: 0;
        justify-content: center;
        position: relative;
      }

      .brand-logo-button {
        border: 0;
        background: transparent;
        padding: 0;
        color: inherit;
        text-align: left;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
      }

      .brand-logo-button:hover .brand-logo,
      .brand-logo-button:hover .brand-logo-compact {
        filter: brightness(0.96);
      }

      .brand-logo {
        display: block;
        width: auto;
        height: auto;
        max-width: 148px;
        max-height: 28px;
        object-fit: contain;
      }

      .brand-logo-compact {
        display: none;
        width: auto;
        height: auto;
        max-width: 30px;
        max-height: 30px;
        object-fit: contain;
      }

      .update-badge {
        position: absolute;
        top: -14px;
        right: -29px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 36px;
        height: 15px;
        padding: 0 6px;
        border: 0;
        border-radius: 5px;
        background: #111;
        color: #fff;
        font-size: 7px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        z-index: 6;
      }

      .update-badge::after {
        content: "";
        position: absolute;
        left: 5px;
        bottom: -7px;
        width: 15px;
        height: 9px;
        background: #111;
        clip-path: polygon(0 100%, 100% 0, 30% 0);
      }

      .update-badge span {
        position: relative;
        z-index: 1;
      }

      .update-badge[hidden] {
        display: none;
      }

      .update-badge-compact {
        display: none;
      }

      .app-shell.document-mode .update-badge {
        top: -13px;
        right: -19px;
        width: 20px;
        min-width: 20px;
        height: 14px;
        padding: 0;
        border-radius: 5px;
        font-size: 8px;
      }

      .app-shell.document-mode .update-badge::after {
        left: 3px;
        bottom: -7px;
        width: 13px;
        height: 8px;
      }

      .app-shell.document-mode .update-badge-expanded {
        display: none;
      }

      .app-shell.document-mode .update-badge-compact {
        display: inline;
      }

      .brand-short {
        display: none;
        font-size: 18px;
        font-style: italic;
        font-weight: 900;
        letter-spacing: -0.04em;
        color: #000;
      }

      .brand-mark {
        font-size: 24px;
        font-style: italic;
        font-weight: 900;
        letter-spacing: -0.04em;
        color: #000;
      }

      .brand-toggle {
        position: relative;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: var(--ink-soft);
        cursor: pointer;
        transition: background 140ms ease, color 140ms ease;
      }

      .brand-toggle:hover {
        background: rgba(20, 20, 20, 0.06);
        color: #000;
      }

      .brand-toggle .material-symbols-outlined {
        font-size: 16px;
      }

      .brand-toggle-tooltip {
        position: absolute;
        left: 50%;
        top: calc(100% + 8px);
        transform: translateX(-50%) translateY(-2px);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(24, 24, 27, 0.96);
        color: white;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease, visibility 140ms ease;
        z-index: 560;
      }

      .brand-toggle:hover .brand-toggle-tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
      }

      .brand-toggle.suppress-tooltip .brand-toggle-tooltip {
        opacity: 0 !important;
        visibility: hidden !important;
      }

      .field-stack,
      .library-stack,
      .meta-panel,
      .tag-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .hidden-controls {
        display: none !important;
      }

      .nav-shell {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .nav-item {
        min-height: 38px;
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        text-align: left;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: background 140ms ease, color 140ms ease, width 220ms ease, padding 220ms ease;
      }

      .nav-item.active {
        background: var(--paper);
        color: #000;
        box-shadow: 0 1px 3px rgba(26, 28, 29, 0.04);
        position: relative;
      }

      .nav-item:hover {
        background: rgba(20, 20, 20, 0.06);
        color: #000;
      }

      .nav-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 999px;
        background: #000;
      }

      .nav-icon {
        font-size: 17px;
        opacity: 0.88;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .topbar-right #viewModeButton,
      .topbar-right #topbarSortButton {
        display: none;
      }

      .icon-button {
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
      }

      .icon-button:hover {
        color: #000;
      }

      .icon-button {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background 140ms ease, color 140ms ease;
      }

      .icon-button.active {
        color: #111;
      }

      .icon-button:hover {
        background: rgba(20, 20, 20, 0.06);
      }

      .topbar-add-button {
        width: 26px;
        height: 26px;
        border-radius: 9px;
        color: #9a9aa1;
        position: relative;
      }

      .topbar-add-button .icon-svg {
        width: 17px;
        height: 17px;
      }

      .topbar-add-button:hover {
        color: #3a3a40;
        background: rgba(20, 20, 20, 0.05);
      }

      .topbar-button-tooltip {
        position: absolute;
        left: 50%;
        top: calc(100% + 8px);
        transform: translateX(-50%) translateY(-4px);
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(24, 24, 27, 0.96);
        color: #fff;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease;
        z-index: 420;
      }

      .topbar-add-button:hover .topbar-button-tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
      }

      .home-action-tooltip {
        position: absolute;
        left: 50%;
        top: calc(100% + 8px);
        transform: translateX(-50%) translateY(-4px);
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(24, 24, 27, 0.96);
        color: #fff;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease;
        z-index: 420;
      }

      .home-actions .icon-button {
        position: relative;
      }

      .home-actions .icon-button:hover .home-action-tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
      }

      .section-label {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink-soft);
        padding: 0 8px;
      }

      input,
      select,
      textarea,
      button {
        font: inherit;
      }

      button:focus,
      button:focus-visible,
      button:active {
        outline: none !important;
        box-shadow: none !important;
        -webkit-focus-ring-color: transparent !important;
      }

      .input,
      .select,
      .textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        color: var(--ink);
        transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }

      .input,
      .select {
        padding: 12px 14px;
      }

      .textarea {
        min-height: 320px;
        padding: 18px;
        border-radius: var(--radius);
        resize: vertical;
        line-height: 1.7;
      }

      .input:focus,
      .select:focus,
      .textarea:focus {
        outline: none;
        border-color: rgba(20, 20, 20, 0.35);
        box-shadow: 0 0 0 4px rgba(20, 20, 20, 0.06);
      }

      .button-row {
        display: flex;
        gap: 10px;
      }

      .button {
        border: 1px solid transparent;
        border-radius: 999px;
        min-height: 34px;
        padding: 0 14px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.01em;
        transition: transform 120ms ease, opacity 120ms ease, background 120ms ease, color 120ms ease, border-color 120ms ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
        transform: none;
      }

      .button-primary {
        background: var(--accent);
        color: white;
      }

      .button-secondary {
        background: var(--paper);
        color: #111;
        border-color: var(--line);
      }

      .button-ghost {
        background: var(--paper);
        color: #111;
        border: 1px solid var(--line);
      }

      .button-danger {
        background: var(--paper);
        color: #111;
        border-color: var(--line);
      }

      .library-list,
      .item-list,
      .tab-list,
      .tag-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .library-card,
      .item-card,
      .tab-chip,
      .tag-chip {
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
      }

      .library-card {
        padding: 11px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        cursor: pointer;
        text-align: left;
      }

      .library-card.active,
      .item-card.active,
      .tab-chip.active {
        border-color: var(--line);
        background: var(--paper);
        box-shadow: 0 2px 10px rgba(20, 20, 20, 0.04);
      }

      .library-card-title,
      .item-card-title {
        font-size: 14px;
        font-weight: 600;
      }
      .item-search-snippet { display: block; max-width: 100%; margin-top: 3px; overflow: hidden; color: #74747c; font-size: 11px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }

      .library-card-meta,
      .item-card-meta,
      .muted {
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.5;
      }

      .sidebar-footer {
        margin-top: auto;
        padding: 12px 10px 4px;
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.5;
      }

      .main-shell {
        background: var(--surface);
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        overflow: hidden;
        min-width: 0;
        min-height: 0;
        height: 100vh;
      }

      .app-shell.document-mode {
        grid-template-columns: var(--sidebar-collapsed-width) 1fr;
      }

      .app-shell.document-mode .sidebar {
        padding-top: 36px;
        padding-inline: 10px;
        align-items: center;
        overflow: visible;
      }

      .app-shell.document-mode .brand {
        padding-inline: 0;
        padding-top: 4px;
        align-items: center;
        justify-content: flex-start;
        flex-direction: column;
        gap: 6px;
      }

      .app-shell.document-mode .brand-mark {
        display: none;
      }

      .app-shell.document-mode .brand-subtitle,
      .app-shell.document-mode .section-label,
      .app-shell.document-mode .field-stack,
      .app-shell.document-mode .library-stack,
      .app-shell.document-mode .tag-panel,
      .app-shell.document-mode .sidebar-footer {
        display: none;
      }

      .app-shell.document-mode .brand {
        padding-bottom: 6px;
      }

      .app-shell.document-mode .brand-copy {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app-shell.document-mode .brand-short {
        display: block;
      }

      .app-shell.document-mode .brand-logo {
        display: none;
      }

      .app-shell.document-mode .brand-logo-compact {
        display: block;
      }

      .app-shell.document-mode .brand-subtitle {
        display: none;
      }

      .app-shell.document-mode .brand-toggle {
        display: inline-flex;
        color: #9b9ba1;
      }

      .app-shell.document-mode .nav-shell {
        align-items: center;
        width: 100%;
      }

      .app-shell.document-mode .nav-item {
        width: 44px;
        justify-content: center;
        padding: 0;
        position: relative;
        overflow: visible;
      }

      .app-shell.document-mode .nav-item:hover {
        background: rgba(20, 20, 20, 0.06);
      }

      .app-shell.document-mode .nav-item span:not(.material-symbols-outlined):not(.nav-tooltip) {
        display: none;
      }

      .app-shell.document-mode .nav-item .nav-tooltip {
        display: inline-flex;
      }

      .nav-tooltip {
        display: none;
      }

      .app-shell.document-mode .nav-tooltip {
        display: inline-flex;
        position: absolute;
        left: 50%;
        top: calc(100% + 8px);
        transform: translateX(-50%);
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(24, 24, 27, 0.96);
        color: white;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease;
        z-index: 520;
      }

      .app-shell.document-mode #settingsButton .nav-tooltip {
        top: auto;
        bottom: calc(100% + 8px);
      }

      .app-shell.document-mode .nav-item:hover .nav-tooltip {
        opacity: 1;
        transform: translateX(-50%);
        visibility: visible;
      }

      .app-shell.runtime-focus-mode {
        grid-template-columns: 1fr;
      }

      .app-shell.runtime-focus-mode .sidebar,
      .app-shell.runtime-focus-mode .topbar,
      .app-shell.runtime-focus-mode .document-toolbar,
      .app-shell.runtime-focus-mode .footer-bar {
        display: none;
      }

      .app-shell.runtime-focus-mode .main-shell,
      .app-shell.runtime-focus-mode .workspace,
      .app-shell.runtime-focus-mode .viewer-pane,
      .app-shell.runtime-focus-mode .viewer-body.runtime-mode,
      .app-shell.runtime-focus-mode .runtime-host-page,
      .app-shell.runtime-focus-mode .runtime-host-shell {
        min-height: 100vh;
        height: 100vh;
      }

      .settings-inline-feedback {
        align-self: center;
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
      }

      .thumbnail-settings-feedback {
        min-height: 34px;
        padding: 8px 10px;
        display: flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-variant);
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 500;
        line-height: 1.45;
      }

      .thumbnail-settings-feedback[hidden] {
        display: none;
      }

      .thumbnail-settings-feedback[data-tone="ok"] {
        color: var(--ink);
      }

      .thumbnail-settings-feedback[data-tone="error"] {
        border-color: var(--danger);
        color: var(--danger);
      }

      .topbar {
        min-height: 56px;
        padding: 0 16px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: end;
        border-bottom: 0;
        background: rgba(243, 243, 245, 0.82);
        backdrop-filter: blur(16px);
        position: sticky;
        top: 0;
        z-index: 200;
        flex-shrink: 0;
        min-width: 0;
      }

      .settings-nav {
        margin-top: auto;
      }

      .tabs-wrap {
        min-height: 56px;
        padding: 0;
        display: flex;
        gap: 2px;
        align-items: end;
        overflow: visible;
        background: transparent;
        border-bottom: 0;
        flex: 1;
        min-width: 0;
      }

      .tab-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex: 0 1 142px;
        min-width: 86px;
        max-width: 176px;
        min-height: 38px;
        padding: 0 15px;
        white-space: nowrap;
        overflow: visible;
        cursor: pointer;
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 500;
        position: relative;
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
        transition: background 140ms ease, color 140ms ease;
      }

      .tab-chip > span:not(.material-symbols-outlined) {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tab-chip:hover {
        background: rgba(20, 20, 20, 0.05);
        color: #000;
      }

      .tab-chip [data-close-tab] {
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        cursor: pointer;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        font-size: 13px;
        line-height: 1;
        flex: 0 0 16px;
        margin-left: auto;
        transition: opacity 140ms ease, color 140ms ease, visibility 140ms ease;
      }

      .tab-chip [data-close-home-tab] {
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        cursor: pointer;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        font-size: 13px;
        line-height: 1;
        flex: 0 0 16px;
        margin-left: auto;
        transition: opacity 140ms ease, color 140ms ease, visibility 140ms ease;
      }

      .tab-chip:hover [data-close-tab],
      .tab-chip.active [data-close-tab] {
        opacity: 1;
        visibility: visible;
      }

      .tab-chip:hover [data-close-home-tab] {
        opacity: 1;
        visibility: visible;
      }

      .tab-chip [data-close-tab]:hover {
        color: #000;
      }

      .tab-chip [data-close-home-tab]:hover {
        color: #000;
      }

      .tab-chip.active {
        background: var(--surface);
        color: #000;
        border: 1px solid var(--line);
        border-bottom-color: var(--surface);
        box-shadow: none;
      }

      .topbar-right {
        gap: 8px;
        margin-bottom: 10px;
        position: relative;
        flex: 0 1 auto;
        min-width: 0;
        z-index: 360;
      }

      .search-input {
        width: 232px;

      .topbar-search-field > .icon-svg { position: absolute; left: 6px; width: 17px; height: 17px; pointer-events: none; }
      .topbar-search-field .search-input { width: 100%; min-width: 0; height: 28px; padding: 6px 8px 6px 28px; opacity: 0; pointer-events: none; border-radius: 999px; }
      /* Width interpolation reflows the tab strip every frame. Switch layout
         immediately, then fade only the composited input surface. */
      .topbar-search-field:hover, .topbar-search-field:focus-within, .topbar-search-field[data-has-value="true"] { width: 232px; background: #f3f3f5; color: #3a3a40; }
      .topbar-search-field:hover .search-input, .topbar-search-field:focus-within .search-input, .topbar-search-field[data-has-value="true"] .search-input { opacity: 1; pointer-events: auto; transition: opacity 100ms ease-out; }
      .topbar-search-field[data-search-scope="document"], .topbar-search-field[data-search-scope="document"]:focus-within { width: 28px; background: transparent; color: #9a9aa1; cursor: pointer; }
      .topbar-search-field[data-search-scope="document"]:hover { width: 28px; background: #eeeef1; color: #5e5e63; cursor: pointer; }
      .topbar-search-field[data-search-scope="document"]:focus-visible { outline: 2px solid rgba(0, 0, 0, .36); outline-offset: 2px; }
      .topbar-search-field[data-search-scope="document"] .search-input { display: none; }
      .topbar-search-tooltip { position: absolute; left: 50%; top: calc(100% + 8px); z-index: 420; padding: 5px 8px; border-radius: 8px; background: rgba(24, 24, 27, .96); color: #fff; font-size: 11px; line-height: 1; white-space: nowrap; opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-4px); transition: opacity 140ms ease, transform 140ms ease; }
      .topbar-search-field[data-search-scope="document"]:hover .topbar-search-tooltip,
      .topbar-search-field[data-search-scope="document"]:focus-visible .topbar-search-tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* A2 最近搜索：单个全局 popup，fixed 定位到当前 anchor 输入框下方。
         data-i18n-skip 容器，历史词永不被 i18n 扫描翻译。 */
      .recent-search-popup {

      /* 左侧路径区：空间足够时吃满剩余留白显示完整路径（A1.3 用户反馈「空间足够却省略」）；
   空间不足时由 #breadcrumbItem 自身 ellipsis 收缩，绝不越出边界覆盖来源标签。
   不能用 margin-right:auto（会把剩余留白推给标签组，路径永远省略）；
   用固定 12px margin + toolbar gap 16px 保证路径与标签组之间有明确间距。 */
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
        color: var(--ink-soft);
        font-size: 11px;
        min-width: 0;
        flex: 1 1 auto;
        margin-right: 12px;
        overflow: hidden;

      #breadcrumbItem {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 直接子项中的固定标签（"文件"、分隔符"›"）保持单行不折叠、不被压缩；
         不命中 #breadcrumbItem：长路径必须允许收缩并在自身边界内尾部省略，
         路径文字绝不能越出 .breadcrumb 覆盖来源标签。 */
      .breadcrumb > span:not(#breadcrumbItem) {
        white-space: nowrap;
        flex: 0 0 auto;
      }

      /* 右侧标签/来源组：不得 flex:1 1 auto 贪婪占满空白；相对+绝对上限
         （A1.3 第五轮：min(46%, 470px) —— 大窗口两个徽标各 ~114px 恰容一个完整英文单词，
         同时路径仍可完整显示；小窗口随 46% 收缩，标签真正压缩） */
      .breadcrumb-tags {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        min-width: 0;
        flex: 0 1 auto;
        max-width: min(46%, 470px);
        overflow: visible;
      }

      .breadcrumb-tags.host-overlay-mode {
        opacity: 0;
        pointer-events: none;
        /* A1.3 第六轮：HTML 模式下该元素是 overlay 的预留 spacer，
           必须精确占据 overlay 宽度（路径随之 ellipsis 让位），
           不能再受 .breadcrumb-tags 的 min(46%, 470px) 上限截断，
           否则 overlay 会左移盖住路径尾部（「省略号贴着标签」）。 */
        flex: 0 0 auto;
        max-width: none;
      }

      .breadcrumb-tag-trigger {
        border: 0;
        background: transparent;
        padding: 0;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        /* A1.3 第六轮：min-width 必须等于内部 chip 的保底 56px（≥2 中文字）。
           之前是 0：组内 flex 挤压时按钮被压到 5~38px，而 chip 保底 56px
           溢出按钮、盖住后面的 +N / 项目徽标（「自定义标签和项目标签重叠」）。
           对齐保底后按钮与 chip 同步收缩，永不溢出、绝不重叠。 */
        min-width: 56px;
        position: relative;
      }

      .breadcrumb-tag-trigger .tag-chip,
      .breadcrumb-tag-trigger .meta-chip {
        cursor: pointer;
      }

      .breadcrumb-tag-trigger:hover .tag-chip,

      .breadcrumb-tag-placeholder {

        background: rgba(20, 20, 20, 0.02);

        white-space: nowrap;
      }

      .breadcrumb-tag-remove {
        position: absolute;
        top: -3px;
        right: -3px;

        border: 0;
        border-radius: 999px;
        background: rgba(20, 20, 20, 0.72);

      /* A1.2 Markdown 文档工具栏来源徽标：复用卡片（A1.1）同一结构化 sourceBadges 语义。
         常态近白浅底、深灰字、细边框；hover 只加深一档；非交互徽标 cursor:default、不增 tab stop。
         工具栏必须有明确最大宽度，长项目名/长 Skill 名不得挤压路径或右侧操作；
         但不换成失控的第二排；最小支持窗口下自定义标签入口仍可操作。 */
      .breadcrumb-tags .source-badge,
      .breadcrumb-tags .tag-chip,
      .breadcrumb-tags .meta-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        height: 22px;
        padding: 0 9px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(31, 35, 40, 0.16);

        font-size: 11px;
        font-weight: 500;
        line-height: 1.2;
        box-shadow: 0 1px 2px rgba(31, 35, 40, 0.06);
        cursor: default;
        flex: 0 1 auto;
        box-sizing: border-box;
        position: relative;
        white-space: nowrap;

      /* 文档工具栏 chip：上限 120px ≈ 一个完整英文单词/11 个中文字（A1.3 第五轮：
         用户要求展开时至少看清一个单词，而非三四词）；空间不足由 flex-shrink 收缩。
         自定义标签 chip 保底 56px（≥2 个中文字可读，绝不只剩省略号），优先于徽标保留。 */
      .breadcrumb-tags .source-badge-project { max-width: 120px; min-width: 40px; }
      .breadcrumb-tags .source-badge-skill { max-width: 120px; min-width: 40px; }
      .breadcrumb-tags .tag-chip:not(.tag-chip-more) { max-width: 176px; min-width: 56px; }
      .breadcrumb-tags .source-badge-label,
      .breadcrumb-tags .tag-chip-label {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
      }
      /* +N 与类型徽标固定不可压缩 */
      .breadcrumb-tags .source-badge-more,
      .breadcrumb-tags .tag-chip-more {
        flex: 0 0 auto;
        max-width: none;
        padding: 0 6px;
        cursor: default;
      }
      .breadcrumb-tags .meta-chip {
        flex: 0 0 auto;
        max-width: none;
        text-transform: none;
      }
      /* available=false：中性失效视觉（降饱和 + 虚线边框），不假装来源可用 */
      .breadcrumb-tags .source-badge--unavailable {
        color: #8a8d93;
        border-style: dashed;
        border-color: rgba(31, 35, 40, 0.22);

      /* per-badge 的 .chip-tooltip 只是 tooltip 文本源（display:none，视觉不用它）；
         全局 floating chip-tooltip 由 coordinator 在 hover 时显示。与卡片同一约定。 */
      .breadcrumb-tags .source-badge .chip-tooltip,
      .breadcrumb-tags .tag-chip .chip-tooltip,

      /* hover 只加深一档，不做深黑底白字；常态用工具栏统一次要文字色 var(--ink-soft)。

      .breadcrumb-tags .source-badge:hover,

      .thumb-chip-row .source-badge .chip-tooltip,

      /* 全局 floating chip-tooltip：mouseover 时由 JS 定位 + 显示，scroll/mouseleave/mouseout 时隐藏。
     tooltip 元素默认 span（inline），position:fixed 不会自动 blockify；必须显式 block
     否则 width/max-width/white-space 不生效，文本超 max-width 不换行且定位 clamp 无效。
     不再用 transition：cancelAnimationFrame + token++ 反复触发 transition，造成 opacity 闪烁。 */
      .chip-tooltip.chip-tooltip--floating {

        left: 0;
        top: 0;

        pointer-events: none;
        /* 重置 .chip-tooltip 基类的 transition：opacity + cancelAnimationFrame
           反复触发会造成 mouseover/mouseout 之间 opacity 闪烁 */
        transition: none;
        z-index: 380;
      }

        display: flex;
        padding: 0;
        background: var(--paper);
        border: 1px solid var(--line);
        box-shadow: 0 1px 3px rgba(26, 28, 29, 0.03);
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .item-card-open {
        width: 100%;
        padding: 14px;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        display: flex;
        gap: 12px;
        align-items: flex-start;
        text-align: left;
        appearance: none;
      }

      .item-card-open:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: -3px;
        border-radius: inherit;
      }

      .item-card:hover {
        transform: translateY(-2px);
        border-color: #c9c9ce;
        box-shadow: var(--shadow);
      }

      .thumb-wrap {
        position: relative;
        flex: none;
        width: 62px;
        height: 62px;
        border-radius: 12px;
        overflow: hidden;
        background: linear-gradient(135deg, #f1f1f4, #e4e4e8);
      }

      .thumb-wrap.path-missing .thumb {
        filter: grayscale(1) brightness(0.72);
      }

      .thumb-missing-mask {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        background: rgba(30, 30, 34, 0.28);
        pointer-events: none;
      }

      .thumb-missing-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        background: rgba(18, 18, 22, 0.84);
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
        white-space: nowrap;
      }

      /* B2 stale preview：durable save 且索引同步后、新 generation ready 前，
         仅在当前页面把旧图作为非持久视觉 preview 显示；遮罩 + "正在更新缩略图"
         文案，容器 aria-busy=true。stale preview 不是 ready、不参与缓存命中，
         生成明确失败或引擎不可用时由 thumbnailNode 切换到 placeholder。 */
      .thumb-refreshing .thumb {
        filter: saturate(0.72) brightness(0.86);
      }

      .thumb-refresh-mask {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        background: rgba(30, 30, 34, 0.34);
        pointer-events: none;
      }

      .thumb-refresh-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        background: rgba(18, 18, 22, 0.84);
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
        white-space: nowrap;
      }

      /* A1.1 返工：常态浅色（近白近乎不透明 + 深灰文字 + 细灰边框），
         类型徽标（thumb-badge-type）固定不可压缩；视觉权重低于缩略图与标题。 */
      .thumb-badge {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 34px;
        height: 20px;
        padding: 0 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(31, 35, 40, 0.14);
        color: #3a3d44;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        box-shadow: 0 1px 2px rgba(31, 35, 40, 0.08);
        cursor: default;
        flex: 0 0 auto;
      }

      /* 标签行从左侧开始排布（不再 flex-end）；给右侧类型徽标让位。 */
      .thumb-chip-row {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 4px;
        min-width: 0;
        z-index: 2;
      }

      /* 无自定义标签时，来源徽标与右下角类型徽标作为一个组靠右对齐。 */
      .thumb-chip-row.chip-row--align-end {
        justify-content: flex-end;
      }

      /* 行内只有类型徽标（无来源徽标）时推到右，与多 chip 时的右缘视觉一致 */
      .thumb-chip-row.thumb-chip-row--type-only {
        justify-content: flex-end;
      }

      /* 外层 pill：只负责高度、padding、背景、边框与垂直居中。
         min-width:0 允许收缩；明确 hard cap；不承担文本裁切。 */
      .thumb-chip-row .tag-chip,
      .thumb-chip-row .meta-chip,
      .thumb-chip-row .source-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        padding: 0 8px;
        height: 20px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(31, 35, 40, 0.14);
        color: #3a3d44;
        font-size: 10px;
        font-weight: 500;
        line-height: 1.2;
        box-shadow: 0 1px 2px rgba(31, 35, 40, 0.08);
        cursor: default;
        flex: 0 1 auto;
        box-sizing: border-box;
        position: relative;
      }

      /* 自定义主标签拥有更高可辨认优先级：min-width 保证两个汉字 + 省略号
         （如「测试…」）真正可见，不允许被长 Project/Skill 一起 shrink 成纯省略号
         或只显示一个字符（"测…"）。 */
      .thumb-chip-row .tag-chip:not(.tag-chip-more) {
        max-width: 96px;
        min-width: 52px;
      }

      .thumb-chip-row .source-badge-project {
        max-width: 132px;
        min-width: 28px;
      }

      .thumb-chip-row .source-badge-skill {
        max-width: 112px;
        min-width: 28px;
      }

      /* 内层 label：真正负责文本裁切，text-align:left 保证开头可见、尾部省略。 */
      .thumb-chip-row .tag-chip-label,
      .thumb-chip-row .source-badge-label {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
      }

      /* +N 与自定义标签 +N 固定不可压缩；padding 更窄保证最坏布局（3/2/2+type）塞得进 row。 */
      .thumb-chip-row .source-badge-more,
      .thumb-chip-row .tag-chip-more {
        flex: 0 0 auto;
        max-width: none;
        min-width: 0;
        padding: 0 3px;
      }

      .thumb-chip-row .meta-chip {
        text-transform: none;
      }

      /* available=false：中性失效视觉（降饱和 + 虚线边框），不假装来源可用。 */
      .thumb-chip-row .source-badge--unavailable {
        color: #8a8d93;
        border-style: dashed;
        border-color: rgba(31, 35, 40, 0.22);
        background: rgba(255, 255, 255, 0.78);
        box-shadow: none;
        opacity: 0.85;
      }

      /* hover / 卡片 focus-visible：只加深一档，保持浅底深字，不做深黑底白字。 */
      .item-card:hover .thumb-chip-row .tag-chip,
      .item-card:hover .thumb-chip-row .meta-chip,
      .item-card:hover .thumb-chip-row .source-badge,
      .item-card:hover .thumb-badge,
      .item-card:focus-within .thumb-chip-row .tag-chip,
      .item-card:focus-within .thumb-chip-row .meta-chip,
      .item-card:focus-within .thumb-chip-row .source-badge,
      .item-card:focus-within .thumb-badge,
      .item-card:focus-visible .thumb-chip-row .tag-chip,
      .item-card:focus-visible .thumb-chip-row .meta-chip,
      .item-card:focus-visible .thumb-chip-row .source-badge,
      .item-card:focus-visible .thumb-badge {
        background: rgba(232, 235, 240, 0.98);
        border-color: rgba(31, 35, 40, 0.28);
        color: #1f2329;
      }

      /* PR C / C2：在线封面 / 本地降级封面卡片状态。
         标题 SVG fallback 常显；远程 live 图只在 lazy 加载成功且比例合格后整体替换。
         警告常态隐藏（opacity 0），hover/focus 才显示完整原因——不制造永久错误。 */
      .thumb-cover-state {

      .thumb-cover-state:hover .thumb-cover-warning,

      /* ── 检查视图（inspector view）────────────────────────────────────
       取代旧"带缩略图竖列表"。左栏固定属性列表（名称/类型/来源/修改时间），
       右栏统一首屏视觉预览；分栏默认 40/60，分隔条列宽固定 10px。
       两侧轨道由同一组像素宽度驱动，避免卡片外间距在窄栏时跨轨道覆盖。 */
      .inspector-shell {
        display: none;
        flex: 1 1 auto;
        min-height: 0;
        min-width: 0;
      }

      .main-shell.home-mode.inspector-layout .list-body {
        display: none;
      }

      .main-shell.home-mode.inspector-layout .inspector-shell {
        display: grid;
        grid-template-columns: minmax(0, 2fr) 10px minmax(0, 3fr);
      }

      /* 检查视图占满主区：home 网格的 workspace 默认落在 auto 行（内容高、
         footer 反占 1fr），内容少时整栏塌缩、右栏舞台被详情区挤没。
         检查视图激活时把 workspace 行提升为 1fr，高度链才完整。 */
      .main-shell.home-mode.inspector-layout {
        grid-template-rows: auto 1fr auto auto;
      }

      /* 左栏与右栏同规格外框：1px 边框 + 14px 圆角 + 纸面底色，顶底间距与
         右栏 preview-frame 对齐（16/12），两栏视觉成对。 */
      .inspector-list-pane {
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        min-width: 0;
        max-width: 100%;
        min-height: 0;
        margin: 16px 0 12px 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--paper);
        overflow: hidden;
      }

      .inspector-list-head {
        display: grid;
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        /* 表头本身不裁切文字；横向越界由外层 list pane 统一收口，避免较窄
           的持久化列宽把“名称 / 修改时间”等标签裁成半行。 */
        overflow: visible;
        grid-template-columns: var(--inspector-cols, minmax(0, 1fr) 56px 64px 82px);
        gap: 8px;
        /* 列原点必须与行对齐：行轨道起点 = .inspector-rows 左内边距 8 + 行左内边距 14 = 22；
           右侧 8 与 .inspector-rows 右内边距一致。表头按钮自身无水平内边距（见下），
           这样每个固定 px 列的边界在表头与数据行里逐像素对齐。 */
        padding: 6px 8px 6px 22px;
        border-bottom: 1px solid var(--line);
      }

      .inspector-col-button {
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-align: left;
        /* 无水平内边距：列标签与单元格文本同一 x 起点（对齐是硬要求）。 */
        padding: 2px 0;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        min-width: 0;
        white-space: nowrap;
        /* 文字裁切交给内层 label；这里必须允许边界手柄伸进 grid gap，不能
           把大部分命中区裁掉后只剩几个像素可拖。 */
        overflow: visible;
        position: relative;
      }

      .inspector-col-label {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        flex: 1 1 auto;
        min-width: 0;
        white-space: nowrap;
      }

      .inspector-col-label-text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 列宽拖拽手柄只存在于真实的列间边界：名称|类型、类型|来源、来源|时间。
         18px 命中带覆盖整段 grid gap；细线只是可发现性提示，实际手柄全高可拖。 */
      .inspector-col-handle {
        position: absolute;
        top: -4px;
        bottom: -4px;
        right: -13px;
        width: 18px;
        cursor: col-resize !important;
        touch-action: none;
        z-index: 3;
      }

      .inspector-col-handle::before {
        content: "";
        position: absolute;
        top: 6px;
        bottom: 6px;
        left: 50%;
        width: 1px;
        transform: translateX(-50%);
        border-radius: 2px;
        background: #d9dadc;
        transition: background 140ms ease;
      }

      .inspector-col-handle:hover::before,
      .inspector-col-handle.dragging::before {
        background: #9a9aa0;
      }

      .inspector-col-handle:focus-visible {
        outline: 2px solid rgba(0, 0, 0, 0.4);
        outline-offset: 1px;
        border-radius: 4px;
      }

      /* 类型列内容居中（表头与单元格一致）。 */
      .inspector-list-head .inspector-col-button[data-inspector-sort="fileType"] {
        justify-content: center;
      }

      .inspector-col-button:hover {
        color: #000;
        background: rgba(20, 20, 20, 0.04);
      }

      .inspector-col-button:focus-visible {
        outline: 2px solid rgba(0, 0, 0, 0.4);
        outline-offset: 1px;
      }

      .inspector-col-button .inspector-sort-arrow {
        font-size: 12px;
        line-height: 1;
        flex: 0 0 auto;
      }

      .inspector-col-button[aria-sort="ascending"],
      .inspector-col-button[aria-sort="descending"] {
        color: #000;
      }

      .inspector-rows {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 6px 8px 10px;
        outline: none;
      }

      .inspector-rows:focus-visible {
        outline: 2px solid rgba(0, 0, 0, 0.28);
        outline-offset: -2px;
        border-radius: 10px;
      }

      .inspector-row {
        display: grid;
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        overflow: hidden;
        grid-template-columns: var(--inspector-cols, minmax(0, 1fr) 56px 64px 82px);
        gap: 8px;
        align-items: center;
        position: relative;
        padding: 9px 12px 9px 14px;
        border-radius: 8px;
        color: var(--ink);
        cursor: default;
        user-select: none;
      }

      /* 表格感斑马纹：偶数行浅灰衬底。声明顺序在 hover/selected 之前，
         保证三者同特异性时 hover/选中仍覆盖斑马纹。 */
      .inspector-row:nth-child(even) {
        background: #f5f5f7;
      }

      .inspector-row:hover {
        background: #e8e8ea;
      }

      /* 选中态遵循 DESIGN.md 列表规范：2px 黑色竖向 accent bar + 8px 圆角。
         引入斑马纹后选中底色加深一档（#ececee），与条纹明确区分。 */
      .inspector-row.selected {
        background: #ececee;
      }

      .inspector-row.selected::before {
        content: "";
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 2px;
        border-radius: 1px;
        background: #000;
      }

      .inspector-row.path-missing .inspector-cell-name {
        color: #8a8a90;
      }

      .inspector-cell-name {
        font-size: 12.5px;
        line-height: 1.45;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      .inspector-cell-type {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #6a6a72;
        text-align: center;
        white-space: nowrap;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .inspector-cell-source {
        font-size: 11px;
        color: #6f6f75;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      .inspector-cell-time {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }

      .inspector-cell-time-date,
      .inspector-cell-time-clock {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 默认完整显示日期；修改时间列被用户拉宽后才显示时分，绝不留下
         一个被截断的时间字符。由 applyInspectorColumns 的实际列宽标记驱动。 */
      .inspector-cell-time-clock {
        display: none;
      }

      .inspector-shell[data-inspector-time-detail="true"] .inspector-cell-time-clock {
        display: inline;
      }

      .inspector-empty {
        margin-top: 8px;
      }

      .inspector-splitter {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: col-resize;
        min-height: 0;
        touch-action: none;
      }

      .inspector-splitter::before {
        content: "";
        width: 2px;
        height: 52px;
        border-radius: 2px;
        background: var(--line);
        transition: background 140ms ease;
      }

      .inspector-splitter:hover::before,
      .inspector-splitter.dragging::before {
        background: #9a9aa0;
      }

      .inspector-splitter:focus-visible {
        outline: none;
      }

      .inspector-splitter:focus-visible::before {
        background: #000;
        height: 84px;
      }

      .inspector-preview-pane {
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        min-width: 0;
        max-width: 100%;
        min-height: 0;
        padding: 16px 16px 12px 0;
        overflow: clip;
      }

      /* 右栏单一框体：预览区 + 详情区 + 打开横条共用一个边框圆角容器，
         不再是上下两个独立卡片。 */
      .inspector-preview-frame {
        position: relative;
        flex: 1 1 auto;
        box-sizing: border-box;
        min-width: 0;
        max-width: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--paper);
      }

      /* 预览舞台只承载滚动正文与渐隐。更多控件是独立 native child WebView，
         绝不在 root WKWebView 内与 Markdown 滚动层共享合成面，也不占布局高度。 */
      .inspector-preview-stage {
        position: relative;
        flex: 1 1 auto;
        box-sizing: border-box;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        contain: paint;
      }

      /* 首屏语义：顶部裁切、默认不可滚动。内容宽度复用正式打开页同一公式
         （content-card: width 100% / max-width 920 / margin auto）。 */
      .inspector-preview-scroll {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        padding: 26px 28px 28px;
      }

      /* 展开态允许舞台内滚动；仅留 16px 渐隐，内容自然收进详情区边界。 */
      .inspector-preview-stage.inspector-preview-expanded .inspector-preview-scroll {
        overflow-y: auto;
        padding-bottom: 12px;
      }

      .inspector-preview-stage.inspector-preview-expanded .inspector-preview-fade {
        display: block;
        height: 16px;
      }

      /* 渐隐层贴住舞台内缘（bottom/left/right 0），与详情区顶边无缝衔接；
         留 1px 内缩会在图片恰好在底部时露出未遮盖条。 */
      .inspector-preview-fade {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 88px;
        z-index: 1;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0), var(--paper));
        pointer-events: none;
      }


      .inspector-more-button svg {
        transition: transform 160ms ease;
      }

      .inspector-more-button.inspector-more-expanded svg {
        transform: rotate(180deg);
      }

      .inspector-more-button:hover {
        background: #eeeef0;
        color: #000;
      }

      .inspector-more-button:focus-visible {
        outline: 2px solid rgba(0, 0, 0, 0.4) !important;
        outline-offset: 2px;
      }

      /* 图标按钮 tooltip：复用 home-action-tooltip 视觉。「更多」在舞台底部，
         气泡放按钮上方；详情区按钮靠右缘，气泡右对齐防溢出框体。 */
      .inspector-more-button .home-action-tooltip {
        top: auto;
        bottom: calc(100% + 8px);
        transform: translateX(-50%) translateY(4px);
      }

      .inspector-more-button:hover .home-action-tooltip,
      .inspector-more-button:focus-visible .home-action-tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
      }

      .inspector-preview-card {
        max-width: 920px;
        margin: 0 auto;
        width: 100%;
        background: transparent;
      }

      /* 隐藏挂载期：正文卡保持正常文档流（宽度与最终显示逐像素一致，ProseMirror
         测量不受影响）但不可见，loading 状态层覆盖其上；Milkdown ready / 图片就绪 /
         显示前三次 revision 复核全部通过后才翻转为可见。 */
      .inspector-preview-card.inspector-preview-pending {
        visibility: hidden;
      }

      /* MD 预览整体缩放 0.75，靠齐 HTML 截图的有效字号（截图按 1280 宽捕获、
         显示时约 0.68-0.72 倍）。100/0.75 = 133.333% 宽 + 负左边距：
         缩放后正文仍精确占满内容宽，视觉上“md 去 html 靠拢”。 */
      .inspector-preview-card.inspector-preview-text {
        width: 133.333%;
        max-width: none;
        margin-left: -16.6665%;
        transform: scale(0.75);
        transform-origin: top center;
      }

      .inspector-preview-card .milkdown-editor-root {
        display: block;
      }

      /* 预览不是第二个阅读器：正文链接、图片与控件一律不可鼠标/键盘激活。 */
      .inspector-preview-card a[href],
      .inspector-preview-card img,
      .inspector-preview-card button,
      .inspector-preview-card input,
      .inspector-preview-card textarea,
      .inspector-preview-card select {
        pointer-events: none;
      }

      .inspector-preview-card .markdown-title-input {
        pointer-events: none;
        resize: none;
      }

      /* 只读标题壳复用 .markdown-title-input 的排版，但不得出现输入态背景。 */
      .inspector-preview-card .markdown-title-readout:hover,
      .inspector-preview-card .markdown-title-readout:focus {
        background: transparent;
        outline: none;
        box-shadow: none;
      }

      .inspector-html-shot {
        display: block;
        width: 100%;
        height: auto;
      }

      .inspector-state {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-align: center;
        padding: 24px;
        color: #8a8a90;
      }

      .inspector-state .material-symbols-outlined {
        font-size: 30px;
        opacity: 0.7;
      }

      .inspector-state-title {
        font-size: 13px;
        font-weight: 600;
        color: #5f5f66;
      }

      .inspector-state-hint {
        font-size: 11.5px;
        line-height: 1.6;
        max-width: 360px;
      }

      .inspector-state .button {
        margin-top: 8px;
      }

      .inspector-stale-preview {
        position: relative;
        width: 100%;
      }

      .inspector-stale-mask {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 14px;
        background: rgba(255, 255, 255, 0.55);
      }

      .inspector-stale-pill {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(20, 20, 20, 0.72);
        color: #fff;
        font-size: 11px;
      }

      /* 详情区：框体底部信息区（属性栅格 + 来源/标签/路径行），
         与预览舞台同处一个边框容器，顶部用分隔线区隔。 */
      .inspector-details {
        flex: 0 0 auto;
        display: block;
        min-height: 0;
        padding: 12px 16px 12px;
        border-top: 1px solid var(--line);
        background: var(--paper);
      }

      .inspector-details-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .inspector-details-head .icon-button {
        margin-left: auto;
        position: relative;
        color: #a4a4aa;
        background: transparent;
        transition: color 140ms ease, background 140ms ease;
      }

      .inspector-details-head .icon-button:hover,
      .inspector-details-head .icon-button:focus-visible {
        color: #303036;
        background: rgba(20, 20, 20, 0.06);
      }

      /* 详情区图标按钮的应用内 tooltip（原生 title 在这里不可发现）：
         按钮贴详情区右缘，气泡右对齐并允许换行，避免溢出框体被裁剪。 */
      .inspector-details .icon-button .home-action-tooltip {
        left: auto;
        right: -6px;
        top: calc(100% + 7px);
        transform: translateY(-4px);
        white-space: normal;
        width: max-content;
        max-width: 240px;
        text-align: left;
        line-height: 1.4;
      }

      .inspector-details .icon-button:hover .home-action-tooltip,
      .inspector-details .icon-button:focus-visible .home-action-tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .inspector-details-empty {
        color: #8a8a90;
        font-weight: 500;
      }

      .inspector-details-missing {
        flex: 0 0 auto;
        font-size: 10.5px;
        color: #93000a;
        background: #ffdad6;
        border-radius: 999px;
        padding: 2px 8px;
      }

      .inspector-details-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      .inspector-details-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 2px 20px;
        margin: 8px 0 0;
      }

      .inspector-details-grid > div,
      .inspector-details-line {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
        font-size: 11px;
        line-height: 1.7;
      }

      .inspector-details-grid dt,
      .inspector-details-line dt,
      .inspector-details-label {
        flex: 0 0 auto;
        color: #8a8a90;
      }

      .inspector-details-grid dd,
      .inspector-details-line dd {
        margin: 0;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      .inspector-details-line {
        margin-top: 4px;
      }

      .inspector-details-line dd {
        direction: rtl;
        text-align: left;
      }

      /* 路径行例外：绝对路径是 LTR 内容，rtl 反排会把 `/` 与目录段顺序打乱
         （如 /Users/a/b.md 排成 b.md/a/Users）。固定保留两行高度，让长路径能
         在第二行继续显示；极长时才截断，完整值仍通过 title 可见。 */
      .inspector-details-line dd.inspector-details-path {
        direction: ltr;
        text-align: left;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        white-space: normal;
        overflow-wrap: anywhere;
        line-height: 1.5;
        min-height: 3em;
      }

      /* 此选择器必须压过 `.inspector-details-line dd` 的 rtl：后者用于普通
         长文本省略，而这里是离散标签。令 dd 占据标签标题后的余量，chips 才会
         从紧贴“标签”的左端开始，而不会按 rtl 从右侧回排。 */
      .inspector-details-line dd.inspector-details-chips {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        flex: 1 1 auto;
        min-width: 0;
        margin-top: 4px;
        direction: ltr;
        text-align: left;
        white-space: normal;
        overflow: visible;
      }

      .inspector-details-chips .tag-chip {
        padding: 2px 8px;
        font-size: 10.5px;
      }

      /* 来源徽标与自定义标签共享“标签”行，但保留来源的轻量视觉语义。
         徽标文本始终单行省略，不能因超长项目/Skill 名抢走整行或撑高详情区。 */
      .inspector-details-chips .inspector-details-source-badge {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        max-width: min(196px, 100%);
        padding: 2px 8px;
        border-radius: 999px;
        background: #f2f2f4;
        color: #5f5f66;
        font-size: 10.5px;
        line-height: 1.4;
      }

      .inspector-details-chips .inspector-details-source-badge .source-badge-label {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 完整来源名交给全局 chip tooltip coordinator；不得退回原生 title 系统提示。 */
      .inspector-details-chips .inspector-details-source-badge .chip-tooltip {
        display: none;
      }

      /* 底部打开横条：框体最底部的通栏主按钮。 */
      .inspector-open-bar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 42px;
        border: 0;
        border-top: 1px solid var(--line);
        border-radius: 0 0 13px 13px;
        background: #111;
        color: #fff;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: background 140ms ease;
      }

      .inspector-open-bar:hover:not(:disabled) {
        background: #2b2b2f;
      }

      .inspector-open-bar:focus-visible {
        outline: 2px solid rgba(0, 0, 0, 0.5);
        outline-offset: -3px;
      }

      .inspector-open-bar:disabled {
        background: #e2e2e4;
        color: #8a8a90;
        cursor: default;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag-chip,
      .meta-chip {
        display: inline-flex;
        align-items: center;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(20, 20, 20, 0.06);
        color: var(--ink-soft);
        font-size: 11px;
      }

      .viewer-pane {
        display: grid;
        grid-template-rows: 1fr;
        min-height: 0;
        min-width: 0;
        background: var(--paper);
      }

      .viewer-body {
        padding: 26px 28px 28px;
        height: 100%;
      }

      .viewer-body.runtime-mode {
        padding: 0;
        background: #fff;
        overflow: hidden;
      }

      .empty-state,
      .content-card {
        max-width: 920px;
        margin: 0 auto;
        width: 100%;
      }

      .empty-state {
        min-height: 100%;
        display: grid;
        place-items: start center;
        text-align: center;
        color: #8a8a90;
        padding-top: 12vh;
        width: 100%;
        justify-items: center;
      }

      .main-shell.home-mode .empty-state {
        min-height: 100%;
        box-sizing: border-box;
        padding-top: clamp(40px, 8vh, 92px);
      }

      .empty-state h2 {
        margin: 0 0 8px;
        font-family: var(--font-title);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: #6f6f75;
      }

      .empty-state div:last-child {
        font-size: 12px;
        line-height: 1.7;
      }

      .empty-state-action {
        margin-top: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        height: 34px;
        min-width: 112px;
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: white;
        color: #5f5f66;
        font-size: 12px;
        cursor: pointer;
        transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
      }

      .empty-state-action:hover {
        background: #f3f3f5;
        color: #000;
        border-color: #cfcfd3;
      }

      .empty-state-action.primary {
        background: #111;
        border-color: #111;
        color: #fff;
      }

      .empty-state-action.primary:hover {
        background: #2b2b2f;
        border-color: #2b2b2f;
        color: #fff;
      }

      .content-card {
        position: relative;
        background: var(--paper);
        border: 0;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
      }

      .content-head {
        padding: 10px 0 24px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-start;
      }

      .markdown-title-copy {
        min-width: 0;
        flex: 1 1 auto;
      }

      .content-title {
        margin: 0;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .markdown-title-input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        font-family: var(--font-title);
        line-height: 1.2;
        padding: 2px 4px;
        resize: none;
        overflow-y: hidden;
        overflow-x: hidden;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
        vertical-align: bottom;
      }

      .markdown-title-input:hover,
      .markdown-title-input:focus {
        background: rgba(20, 20, 20, 0.04);
        outline: none;
      }

      .markdown-title-input:focus {
        box-shadow: 0 0 0 3px rgba(20, 20, 20, 0.08);
      }

      .content-meta {
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.6;
        padding-left: 4px;
        margin-top: 6px;
      }

      .source-kind-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 20px;
        padding: 0 8px;
        border-radius: 999px;
        background: #f2f2f4;
        color: #6a6a72;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .markdown-preview {
        padding: 30px 0 38px;
        font-size: 16px;
        line-height: 1.82;
        color: #25211f;
      }

      .markdown-document-shell {
        width: 100%;
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }

      .markdown-document-shell.no-outline {
        display: block;

      /* PR C / C1：封面 wrapper（markdown-cover-image-block）继承普通图片的
         行内盒模型语义——普通（未对齐）图片在编辑器里是 display:inline，底部
         带字脚（descender）间隙；此前用 display:flex + inline-flex 包裹会丢失
         该间隙，导致设为封面后比普通图片少约 4px 底部间距。改为 block + text-align
         对齐、media 用 inline-block，使封面图与正文普通图底部间距完全一致。 */
      .milkdown-editor-root .markdown-cover-image-block {
        display: block;
        width: 100%;
        position: relative;
        /* 与 ProseMirror paragraph 16px 底部间距对齐：设为封面后不能与下一段
           紧贴。ProseMirror 不做 block margin collapse，wrapper 无 mb 时与
           紧邻 paragraph 间距为 0；A→B 身份转移后视觉上两张图贴在一起。 */
        margin: 0 0 16px;
      }

      .milkdown-editor-root .markdown-cover-image-block.nutbook-image-align-center {
        text-align: center;
      }

      .milkdown-editor-root .markdown-cover-image-block.nutbook-image-align-right {
        text-align: right;
      }

      .milkdown-editor-root .markdown-cover-image-block .markdown-cover-media {
        position: relative;
        display: inline-block;
        max-width: 100%;
      }

      .milkdown-editor-root .markdown-cover-image-block .markdown-cover-media > a {
        display: inline-flex;
        max-width: 100%;
      }

      .milkdown-editor-root .markdown-cover-image-block img {
        width: auto;
        height: auto;
        max-width: 100%;
      }

      .milkdown-editor-root .markdown-cover-image-block.ProseMirror-selectednode {
        outline: none;
      }

      /* PR C / C2：轻量「封面」身份徽标——只在 hover / focus / 选中时出现，
         阅读常态不显示永久徽标；装饰性徽标不进可访问性树（状态由图片工具栏
         「取消封面」按钮的 aria-label / tooltip 同步表达）。
         伪元素挂在 .markdown-cover-media（相对定位、宽度跟随图片）上，
         保证图片居中/右对齐时徽标仍落在图片左上角，而不是 wrapper 左缘。 */
      .milkdown-editor-root .markdown-cover-image-block .markdown-cover-media::after {
        content: attr(data-cover-badge);
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 2;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 11px;
        line-height: 1.5;
        color: #3a3a3a;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(0, 0, 0, 0.16);
        opacity: 0;
        pointer-events: none;
        user-select: none;
        transition: opacity 0.12s ease;
      }

      .milkdown-editor-root .markdown-cover-image-block .markdown-cover-media:hover::after,
      .milkdown-editor-root .markdown-cover-image-block .markdown-cover-media:focus-within::after,
      .milkdown-editor-root .markdown-cover-image-block.ProseMirror-selectednode .markdown-cover-media::after {
        opacity: 1;
      }

      .milkdown-editor-root .ProseMirror h2 {
        font-size: 21px;
        line-height: 1.32;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
      }

      .milkdown-editor-root .ProseMirror h3 {
        font-size: 18px;
        line-height: 1.35;
      }

      .milkdown-editor-root .ProseMirror h4 {
        font-size: 16px;
        line-height: 1.45;
      }

      .milkdown-editor-root .ProseMirror h5 {
        font-size: 15px;
        line-height: 1.5;
      }

      .milkdown-editor-root .ProseMirror h6 {
        font-size: 14px;
        line-height: 1.55;
        color: var(--muted);
      }

      .milkdown-editor-root .ProseMirror pre {
        margin: 18px 0;
        padding: 40px 18px 16px;
        border-radius: 16px;
        background: #171717;
        color: #f3f1ea;
        font: 13px/1.7 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        white-space: pre;
        overflow-x: auto;
      }

      .milkdown-editor-root .ProseMirror-focused {
        box-shadow: none;
      }

      .milkdown-source-fallback {
        width: 100%;
        display: none;
      }

      .content-card.source-editing .milkdown-editor-root {
        display: none;
      }

      .content-card.source-editing .milkdown-source-fallback {
        display: block;
      }

      .markdown-editor-failure {
        margin: 18px 0 22px;
        padding: 14px 16px;
        border: 1px solid #e3d6c8;
        border-radius: 16px;
        background: #fff8f0;
        color: #7a4a1d;
        font-size: 12px;
        line-height: 1.65;
      }

      .markdown-editor-failure strong {
        display: block;
        margin-bottom: 4px;
        color: #4d2c12;
        font-size: 13px;
      }

      .content-card.editing .textarea {
        flex: 1 1 auto;
        min-height: min(68vh, 720px);
        padding: 24px 26px;
        font-size: 16px;
        line-height: 1.82;
        color: #25211f;
        border-radius: 20px;
        resize: none;
        overflow: auto;
      }

      .footer-bar {
        border-top: 1px solid var(--line);
        padding: 12px 18px 14px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--ink-soft);
        font-size: 12px;
      }

      .main-shell.home-mode .footer-bar {
        display: none;
      }

      .status {
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #2d8a57;
      }

      .status-dot.warn {
        background: #d97706;
      }

      .status-dot.error {
        background: var(--danger);
      }

      #statusHint {
        display: none;
      }

      .toast {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 12px 18px;
        border-radius: 14px;
        background: rgba(28, 28, 32, 0.88);
        color: #fff;
        font-size: 13px;
        line-height: 1;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.18);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
        z-index: 500;
      }

      .toast.open {
        opacity: 1;
      }

      .markdown-link-tooltip {
        position: fixed;
        z-index: 520;
        max-width: min(520px, calc(100vw - 32px));
        padding: 7px 10px;
        border-radius: 10px;
        background: rgba(24, 24, 28, 0.94);
        color: #fff;
        font-size: 11px;
        line-height: 1.35;
        white-space: normal;
        overflow-wrap: anywhere;
        opacity: 0;
        pointer-events: none;
        transform: translateY(2px);
        transition: opacity 100ms ease, transform 100ms ease;
      }

      .markdown-link-tooltip.open {
        opacity: 1;
        transform: translateY(0);
      }

      .settings-tab:active,
      .popover-option:focus,
      .popover-option:focus-visible,

        box-shadow: none !important;

      }

      function tFallback(key, fallbackByLanguage) {
        const value = t(key);
        if (value && value !== key) return value;
        const language = currentLanguage();
        return fallbackByLanguage[language] ?? fallbackByLanguage["zh-CN"] ?? "";
      }
      function formatTranslation(key, values = {}) {
        let value = t(key);
        Object.entries(values).forEach(([name, replacement]) => {
          value = value.replaceAll(`{${name}}`, String(replacement ?? ""));
        });
        return value;
      }

        tableToolsEnabled: true

        try {

          const parsed = raw ? JSON.parse(raw) : {};
          return {
            ...DEFAULT_MARKDOWN_PREFERENCES,
            ...parsed,
            codeBlockTheme: parsed?.codeBlockTheme === "light" ? "light" : "dark",
            outlineEnabled: parsed?.outlineEnabled !== false,
            tableToolsEnabled: parsed?.tableToolsEnabled !== false
          };
        } catch (_) {
          return { ...DEFAULT_MARKDOWN_PREFERENCES };
        }

      function buildMarkdownOutline(markdown) {
        const outline = [];
        const lines = String(markdown || "").split(/\r?\n/);
        let fence = "";
        let skippedDocumentTitle = false;
        lines.forEach((line) => {
          const fenceMatch = line.match(/^\s*(```+|~~~+)/);
          if (fenceMatch) {
            fence = fence ? "" : fenceMatch[1][0];
            return;
          }
          if (fence) return;
          const match = line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
          if (!match) return;
          const title = markdownInlinePlainText(match[2]);
          if (!title) return;
          if (match[1].length === 1 && !skippedDocumentTitle) {
            skippedDocumentTitle = true;
            return;
          }
          outline.push({
            index: outline.length,
            level: match[1].length,
            title
          });
        });
        return outline;
      }

        // 与 .milkdown-editor-root .ProseMirror。向编辑器内容区写 class /

        const container = card.querySelector(".markdown-preview");

        container.querySelectorAll(".markdown-document-title-source").forEach((heading) => {
          heading.classList.remove("markdown-document-title-source");

        let skippedDocumentTitle = false;
        let outlineIndex = 0;
        container.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach((heading) => {
          if (heading.tagName === "H1" && !skippedDocumentTitle) {
            skippedDocumentTitle = true;
            if (!heading.closest('[data-type="aligned-text-block"]')) {

            delete heading.dataset.markdownOutlineIndex;

        const existingOutline = Array.from(shell.children).find((node) => node.classList?.contains("markdown-outline"));
