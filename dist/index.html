<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NUTBOOK</title>
    <link rel="stylesheet" href="./assets/markdown-editor.css" />
    <style>
      @font-face {
        font-family: "Material Symbols Outlined";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("./assets/fonts/material-symbols-outlined-400.ttf") format("truetype");
      }

      :root {
        --bg: #f9f9fb;
        --surface: #f9f9fb;
        --surface-variant: #f3f3f5;
        --surface-muted: #eeeef0;
        --paper: #ffffff;
        --ink: #1a1c1d;
        --ink-soft: #5e5e63;
        --line: #e2e2e4;
        --line-strong: #cfcfd3;
        --accent: #000000;
        --accent-soft: #ececef;
        --danger: #b42318;
        --shadow: 0 12px 28px rgba(26, 28, 29, 0.06);
        --radius: 12px;
        --radius-sm: 8px;
        --sidebar-width: 264px;
        --sidebar-collapsed-width: 76px;
        --list-width: 360px;
        --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
        --font-title: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", system-ui, sans-serif;
      }

      .material-symbols-outlined {
        font-family: "Material Symbols Outlined";
        font-weight: 400;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        font-feature-settings: "liga";
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-ui);
        overflow: hidden;
      }

      body {
        min-height: 100vh;
      }

      .app-shell {
        display: grid;
        grid-template-columns: var(--sidebar-width) 1fr;
        min-height: 100vh;
        height: 100vh;
        gap: 0;
        padding: 0;
        transition: grid-template-columns 220ms ease;
        overflow: hidden;
      }

      .sidebar {
        background: rgba(250, 250, 250, 0.9);
        backdrop-filter: blur(20px);
        border-right: 1px solid var(--line);
        padding: 31px 16px 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow: visible;
        transition: padding 220ms ease;
        position: relative;
        z-index: 30;
        height: 100vh;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 8px 14px;
        transition: padding 220ms ease;
      }

      .brand-copy {
        display: flex;
        flex-direction: column;
        gap: 0;
        min-width: 0;
        justify-content: center;
        position: relative;
      }

      .brand-logo-button {
        border: 0;
        background: transparent;
        padding: 0;
        color: inherit;
        text-align: left;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
      }

      .brand-logo-button:hover .brand-logo,
      .brand-logo-button:hover .brand-logo-compact {
        filter: brightness(0.96);
      }

      .brand-logo {
        display: block;
        width: auto;
        height: auto;
        max-width: 148px;
        max-height: 28px;
        object-fit: contain;
      }

      .brand-logo-compact {
        display: none;
        width: auto;
        height: auto;
        max-width: 30px;
        max-height: 30px;
        object-fit: contain;
      }

      .update-badge {
        position: absolute;
        top: -14px;
        right: -29px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 36px;
        height: 15px;
        padding: 0 6px;
        border: 0;
        border-radius: 5px;
        background: #111;
        color: #fff;
        font-size: 7px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        z-index: 6;
      }

      .update-badge::after {
        content: "";
        position: absolute;
        left: 5px;
        bottom: -7px;
        width: 15px;
        height: 9px;
        background: #111;
        clip-path: polygon(0 100%, 100% 0, 30% 0);
      }

      .update-badge span {
        position: relative;
        z-index: 1;
      }

      .update-badge[hidden] {
        display: none;
      }

      .update-badge-compact {
        display: none;
      }

      .app-shell.document-mode .update-badge {
        top: -13px;
        right: -19px;
        width: 20px;
        min-width: 20px;
        height: 14px;
        padding: 0;
        border-radius: 5px;
        font-size: 8px;
      }

      .app-shell.document-mode .update-badge::after {
        left: 3px;
        bottom: -7px;
        width: 13px;
        height: 8px;
      }

      .app-shell.document-mode .update-badge-expanded {
        display: none;
      }

      .app-shell.document-mode .update-badge-compact {
        display: inline;
      }

      .brand-short {
        display: none;
        font-size: 18px;
        font-style: italic;
        font-weight: 900;
        letter-spacing: -0.04em;
        color: #000;
      }

      .brand-mark {
        font-size: 24px;
        font-style: italic;
        font-weight: 900;
        letter-spacing: -0.04em;
        color: #000;
      }

      .brand-toggle {
        position: relative;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: var(--ink-soft);
        cursor: pointer;
        transition: background 140ms ease, color 140ms ease;
      }

      .brand-toggle:hover {
        background: rgba(20, 20, 20, 0.06);
        color: #000;
      }

      .brand-toggle .material-symbols-outlined {
        font-size: 16px;
      }

      .brand-toggle-tooltip {
        position: absolute;
        left: 50%;
        top: calc(100% + 8px);
        transform: translateX(-50%) translateY(-2px);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(24, 24, 27, 0.96);
        color: white;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease, visibility 140ms ease;
        z-index: 560;
      }

      .brand-toggle:hover .brand-toggle-tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
      }

      .brand-toggle.suppress-tooltip .brand-toggle-tooltip {
        opacity: 0 !important;
        visibility: hidden !important;
      }

      .field-stack,
      .library-stack,
      .meta-panel,
      .tag-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .hidden-controls {
        display: none !important;
      }

      .nav-shell {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .nav-item {
        min-height: 38px;
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        text-align: left;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: background 140ms ease, color 140ms ease, width 220ms ease, padding 220ms ease;
      }

      .nav-item.active {
        background: var(--paper);
        color: #000;
        box-shadow: 0 1px 3px rgba(26, 28, 29, 0.04);
        position: relative;
      }

      .nav-item:hover {
        background: rgba(20, 20, 20, 0.06);
        color: #000;
      }

      .nav-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 999px;
        background: #000;
      }

      .nav-icon {
        font-size: 17px;
        opacity: 0.88;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .topbar-right #viewModeButton,
      .topbar-right #topbarSortButton {
        display: none;
      }

      .home-search {
        display: none;
      }

      .icon-button {
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
      }

      .icon-button:hover {
        color: #000;
      }

      .icon-button {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background 140ms ease, color 140ms ease;
      }

      .icon-button.active {
        color: #111;
      }

      .icon-button:hover {
        background: rgba(20, 20, 20, 0.06);
      }

      .topbar-add-button {
        width: 26px;
        height: 26px;
        border-radius: 9px;
        color: #9a9aa1;
        position: relative;
      }

      .topbar-add-button .icon-svg {
        width: 17px;
        height: 17px;
      }

      .topbar-add-button:hover {
        color: #3a3a40;
        background: rgba(20, 20, 20, 0.05);
      }

      .topbar-button-tooltip {
        position: absolute;
        left: 50%;
        top: calc(100% + 8px);
        transform: translateX(-50%) translateY(-4px);
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(24, 24, 27, 0.96);
        color: #fff;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease;
        z-index: 420;
      }

      .topbar-add-button:hover .topbar-button-tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
      }

      .home-action-tooltip {
        position: absolute;
        left: 50%;
        top: calc(100% + 8px);
        transform: translateX(-50%) translateY(-4px);
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(24, 24, 27, 0.96);
        color: #fff;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease;
        z-index: 420;
      }

      .home-actions .icon-button {
        position: relative;
      }

      .home-actions .icon-button:hover .home-action-tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
      }

      .section-label {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink-soft);
        padding: 0 8px;
      }

      input,
      select,
      textarea,
      button {
        font: inherit;
      }

      button:focus,
      button:focus-visible,
      button:active {
        outline: none !important;
        box-shadow: none !important;
        -webkit-focus-ring-color: transparent !important;
      }

      .input,
      .select,
      .textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        color: var(--ink);
        transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }

      .input,
      .select {
        padding: 12px 14px;
      }

      .textarea {
        min-height: 320px;
        padding: 18px;
        border-radius: var(--radius);
        resize: vertical;
        line-height: 1.7;
      }

      .input:focus,
      .select:focus,
      .textarea:focus {
        outline: none;
        border-color: rgba(20, 20, 20, 0.35);
        box-shadow: 0 0 0 4px rgba(20, 20, 20, 0.06);
      }

      .button-row {
        display: flex;
        gap: 10px;
      }

      .button {
        border: 1px solid transparent;
        border-radius: 999px;
        min-height: 34px;
        padding: 0 14px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.01em;
        transition: transform 120ms ease, opacity 120ms ease, background 120ms ease, color 120ms ease, border-color 120ms ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
        transform: none;
      }

      .button-primary {
        background: var(--accent);
        color: white;
      }

      .button-secondary {
        background: var(--paper);
        color: #111;
        border-color: var(--line);
      }

      .button-ghost {
        background: var(--paper);
        color: #111;
        border: 1px solid var(--line);
      }

      .button-danger {
        background: var(--paper);
        color: #111;
        border-color: var(--line);
      }

      .library-list,
      .item-list,
      .tab-list,
      .tag-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .library-card,
      .item-card,
      .tab-chip,
      .tag-chip {
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
      }

      .library-card {
        padding: 11px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        cursor: pointer;
        text-align: left;
      }

      .library-card.active,
      .item-card.active,
      .tab-chip.active {
        border-color: var(--line);
        background: var(--paper);
        box-shadow: 0 2px 10px rgba(20, 20, 20, 0.04);
      }

      .library-card-title,
      .item-card-title {
        font-size: 14px;
        font-weight: 600;
      }

      .library-card-meta,
      .item-card-meta,
      .muted {
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.5;
      }

      .sidebar-footer {
        margin-top: auto;
        padding: 12px 10px 4px;
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.5;
      }

      .main-shell {
        background: var(--surface);
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        overflow: hidden;
        min-width: 0;
        min-height: 0;
        height: 100vh;
      }

      .app-shell.document-mode {
        grid-template-columns: var(--sidebar-collapsed-width) 1fr;
      }

      .app-shell.document-mode .sidebar {
        padding-top: 36px;
        padding-inline: 10px;
        align-items: center;
        overflow: visible;
      }

      .app-shell.document-mode .brand {
        padding-inline: 0;
        padding-top: 4px;
        align-items: center;
        justify-content: flex-start;
        flex-direction: column;
        gap: 6px;
      }

      .app-shell.document-mode .brand-mark {
        display: none;
      }

      .app-shell.document-mode .brand-subtitle,
      .app-shell.document-mode .section-label,
      .app-shell.document-mode .field-stack,
      .app-shell.document-mode .library-stack,
      .app-shell.document-mode .tag-panel,
      .app-shell.document-mode .sidebar-footer {
        display: none;
      }

      .app-shell.document-mode .brand {
        padding-bottom: 6px;
      }

      .app-shell.document-mode .brand-copy {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app-shell.document-mode .brand-short {
        display: block;
      }

      .app-shell.document-mode .brand-logo {
        display: none;
      }

      .app-shell.document-mode .brand-logo-compact {
        display: block;
      }

      .app-shell.document-mode .brand-subtitle {
        display: none;
      }

      .app-shell.document-mode .brand-toggle {
        display: inline-flex;
        color: #9b9ba1;
      }

      .app-shell.document-mode .nav-shell {
        align-items: center;
        width: 100%;
      }

      .app-shell.document-mode .nav-item {
        width: 44px;
        justify-content: center;
        padding: 0;
        position: relative;
        overflow: visible;
      }

      .app-shell.document-mode .nav-item:hover {
        background: rgba(20, 20, 20, 0.06);
      }

      .app-shell.document-mode .nav-item span:not(.material-symbols-outlined):not(.nav-tooltip) {
        display: none;
      }

      .app-shell.document-mode .nav-item .nav-tooltip {
        display: inline-flex;
      }

      .nav-tooltip {
        display: none;
      }

      .app-shell.document-mode .nav-tooltip {
        display: inline-flex;
        position: absolute;
        left: 50%;
        top: calc(100% + 8px);
        transform: translateX(-50%);
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(24, 24, 27, 0.96);
        color: white;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease;
        z-index: 520;
      }

      .app-shell.document-mode #settingsButton .nav-tooltip {
        top: auto;
        bottom: calc(100% + 8px);
      }

      .app-shell.document-mode .nav-item:hover .nav-tooltip {
        opacity: 1;
        transform: translateX(-50%);
        visibility: visible;
      }

      .app-shell.runtime-focus-mode {
        grid-template-columns: 1fr;
      }

      .app-shell.runtime-focus-mode .sidebar,
      .app-shell.runtime-focus-mode .topbar,
      .app-shell.runtime-focus-mode .document-toolbar,
      .app-shell.runtime-focus-mode .footer-bar {
        display: none;
      }

      .app-shell.runtime-focus-mode .main-shell,
      .app-shell.runtime-focus-mode .workspace,
      .app-shell.runtime-focus-mode .viewer-pane,
      .app-shell.runtime-focus-mode .viewer-body.runtime-mode,
      .app-shell.runtime-focus-mode .runtime-host-page,
      .app-shell.runtime-focus-mode .runtime-host-shell {
        min-height: 100vh;
        height: 100vh;
      }

      .settings-inline-feedback {
        align-self: center;
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
      }

      .topbar {
        min-height: 56px;
        padding: 0 16px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: end;
        border-bottom: 0;
        background: rgba(243, 243, 245, 0.82);
        backdrop-filter: blur(16px);
        position: sticky;
        top: 0;
        z-index: 200;
        flex-shrink: 0;
        min-width: 0;
      }

      .settings-nav {
        margin-top: auto;
      }

      .tabs-wrap {
        min-height: 56px;
        padding: 0;
        display: flex;
        gap: 2px;
        align-items: end;
        overflow: visible;
        background: transparent;
        border-bottom: 0;
        flex: 1;
        min-width: 0;
      }

      .tab-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex: 0 1 142px;
        min-width: 86px;
        max-width: 176px;
        min-height: 38px;
        padding: 0 15px;
        white-space: nowrap;
        overflow: visible;
        cursor: pointer;
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 500;
        position: relative;
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
        transition: background 140ms ease, color 140ms ease;
      }

      .tab-chip > span:not(.material-symbols-outlined) {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tab-chip:hover {
        background: rgba(20, 20, 20, 0.05);
        color: #000;
      }

      .tab-chip [data-close-tab] {
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        cursor: pointer;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        font-size: 13px;
        line-height: 1;
        flex: 0 0 16px;
        margin-left: auto;
        transition: opacity 140ms ease, color 140ms ease, visibility 140ms ease;
      }

      .tab-chip [data-close-home-tab] {
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        cursor: pointer;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        font-size: 13px;
        line-height: 1;
        flex: 0 0 16px;
        margin-left: auto;
        transition: opacity 140ms ease, color 140ms ease, visibility 140ms ease;
      }

      .tab-chip:hover [data-close-tab],
      .tab-chip.active [data-close-tab] {
        opacity: 1;
        visibility: visible;
      }

      .tab-chip:hover [data-close-home-tab] {
        opacity: 1;
        visibility: visible;
      }

      .tab-chip [data-close-tab]:hover {
        color: #000;
      }

      .tab-chip [data-close-home-tab]:hover {
        color: #000;
      }

      .tab-chip.active {
        background: var(--surface);
        color: #000;
        border: 1px solid var(--line);
        border-bottom-color: var(--surface);
        box-shadow: none;
      }

      .topbar-right {
        gap: 8px;
        margin-bottom: 10px;
        position: relative;
        flex: 0 1 auto;
        min-width: 0;
        z-index: 360;
      }

      .search-input {
        width: 232px;
        min-width: 128px;
        flex: 0 1 232px;
        padding: 6px 11px;
        font-size: 12px;
        line-height: 1;
      }

      .tab-chip.active::before,
      .tab-chip.active::after {
        content: "";
        position: absolute;
        bottom: -1px;
        width: 12px;
        height: 12px;
        background: transparent;
      }

      .tab-chip.active::before {
        left: -12px;
        border-bottom-right-radius: 12px;
        box-shadow: 6px 0 0 0 var(--surface);
      }

      .tab-chip.active::after {
        right: -12px;
        border-bottom-left-radius: 12px;
        box-shadow: -6px 0 0 0 var(--surface);
      }

      .workspace {
        display: grid;
        grid-template-columns: var(--list-width) 1fr;
        min-height: 0;

      function isExternalHttpUrl(value) {
        return /^https?:\/\//i.test(String(value || "").trim());

      function safeDecodeUri(value) {
        try {
          return decodeURI(value);

      function normalizeLinkedFilePath(value) {
        const raw = safeDecodeUri(String(value || "").trim()).replace(/\\/g, "/");
        if (!raw) return "";
        const isAbsolute = raw.startsWith("/");
        const parts = [];
        raw.split("/").forEach((part) => {
          if (!part || part === ".") return;
          if (part === "..") {
            if (parts.length && parts[parts.length - 1] !== "..") {
              parts.pop();
            } else if (!isAbsolute) {
              parts.push(part);
            }
            return;
          }
          parts.push(part);
        });
        return `${isAbsolute ? "/" : ""}${parts.join("/")}`.replace(/\/$/, "");
      }

      function dirnamePath(value) {
        const normalized = normalizeLinkedFilePath(value);
        const index = normalized.lastIndexOf("/");
        return index > 0 ? normalized.slice(0, index) : "";

      function stripLinkFragmentAndQuery(value) {
        const text = String(value || "").trim();
        const hashIndex = text.indexOf("#");
        const queryIndex = text.indexOf("?");
        const cutIndexes = [hashIndex, queryIndex].filter((index) => index >= 0);
        const cutIndex = cutIndexes.length ? Math.min(...cutIndexes) : -1;
        return cutIndex >= 0 ? text.slice(0, cutIndex) : text;

      function markdownLinkedFilePath(href, tab) {
        const target = stripLinkFragmentAndQuery(href);
        if (!target || isExternalHttpUrl(target)) return "";
        if (/^[a-z][a-z0-9+.-]*:/i.test(target) && !target.toLowerCase().startsWith("file:")) {
          return "";
        }
        if (target.toLowerCase().startsWith("file:")) {
          try {
            return normalizeLinkedFilePath(decodeURIComponent(new URL(target).pathname));
          } catch (_) {
            return "";
          }
        }
        if (target.startsWith("/")) {
          return normalizeLinkedFilePath(target);
        }
        const baseDir = dirnamePath(tab?.item?.filePath || "");
        return normalizeLinkedFilePath(`${baseDir}/${target}`);
      }

      function markdownImageFilePath(src, tab) {
        const target = stripLinkFragmentAndQuery(src);
        if (!target || target.startsWith("#") || isExternalHttpUrl(target)) return "";
        if (/^(data|blob):/i.test(target)) return "";
        if (/^[a-z][a-z0-9+.-]*:/i.test(target) && !target.toLowerCase().startsWith("file:")) {

            return normalizeLinkedFilePath(decodeURIComponent(new URL(target).pathname));

        return baseDir ? normalizeLinkedFilePath(`${baseDir}/${target}`) : "";

          return true;
        }

        const containingLibrary = appState.libraries.find((library) => libraryContainsFile(library, target));
        if (containingLibrary) {
          appState.activeLibraryId = containingLibrary.id;
          await scanLibrary();
        } else {
          els.libraryPath.value = target;
          els.libraryName.value = target.split("/").filter(Boolean).pop() || "Linked File";
          const library = await addLibrary("file");
          if (!library?.id) return false;
          appState.activeLibraryId = library.id;
          await scanLibrary();
        }

        await loadLibraries();
        await loadItems();
        const imported = await findIndexedItemByPath(target);
        if (!imported) {
          setStatus(statusWithValue("status.linkImportNotFoundPrefix", target), "warn");
          return false;
        }

        await openItem(imported.id);
        setStatus(statusWithValue("status.linkImportedPrefix", imported.fileName), "ok");
        return true;
      }

      async function confirmImportLinkedFile(targetPath) {
        const fileName = targetPath.split("/").filter(Boolean).pop() || targetPath;
        return appConfirm({
          title: "链接文件还未接入 Nutbook",
          message: `“${fileName}” 不在当前文件列表中。是否接入并打开这个文件？\n${targetPath}`,
          confirmText: "接入并打开",
          cancelText: "取消"
        });
      }

      function markdownLinkTargetLabel(href, tab) {
        if (!href || href.startsWith("#")) return "";
        if (isExternalHttpUrl(href)) return href;
        return markdownLinkedFilePath(href, tab);
      }

      function moveMarkdownLinkTooltip(event) {
        if (!els.markdownLinkTooltip?.classList.contains("open")) return;
        const margin = 12;
        const rect = els.markdownLinkTooltip.getBoundingClientRect();
        let left = event.clientX + margin;
        let top = event.clientY + margin;
        if (left + rect.width > window.innerWidth - margin) {
          left = Math.max(margin, window.innerWidth - rect.width - margin);
        }
        if (top + rect.height > window.innerHeight - margin) {
          top = Math.max(margin, event.clientY - rect.height - margin);
        }
        els.markdownLinkTooltip.style.left = `${left}px`;
        els.markdownLinkTooltip.style.top = `${top}px`;
      }

      function showMarkdownLinkTooltip(label, event) {
        if (!els.markdownLinkTooltip || !label) return;
        els.markdownLinkTooltip.textContent = label;
        els.markdownLinkTooltip.setAttribute("aria-hidden", "false");
        els.markdownLinkTooltip.classList.add("open");
        moveMarkdownLinkTooltip(event);
      }

      function hideMarkdownLinkTooltip() {
        if (!els.markdownLinkTooltip) return;
        els.markdownLinkTooltip.classList.remove("open");
        els.markdownLinkTooltip.setAttribute("aria-hidden", "true");
      }

      async function openMarkdownLocalLink(href, tab) {
        const targetPath = markdownLinkedFilePath(href, tab);
        if (!targetPath) {
          setStatus(t("status.unsupportedLinkType"), "warn");
          return;
        }
        if (!isSupportedLinkedArtifactPath(targetPath)) {
          setStatus(t("status.markdownHtmlLinksOnly"), "warn");
          return;
        }
        const targetItem = await findIndexedItemByPath(targetPath);
        if (!targetItem) {
          const shouldImport = await confirmImportLinkedFile(targetPath);
          if (!shouldImport) {
            setStatus(t("status.linkOpenCancelled"), "warn");
            return;
          }
          await openImportedLinkedFile(targetPath);
          return;
        }
        await openItem(targetItem.id);
      }

      function setupMarkdownLinkHandling(card, tab) {
        if (!card || !tab) return;
        card.querySelectorAll(".markdown-preview, .milkdown-editor-root").forEach((container) => {
          container.querySelectorAll("a[href]").forEach((anchor) => {
            const href = anchor.getAttribute("href") || "";
            if (!href || anchor.getAttribute("title")) return;
            const label = markdownLinkTargetLabel(href, tab);
            if (label) anchor.setAttribute("data-nutbook-link-target", label);
          });
          container.addEventListener("mouseover", (event) => {
            const anchor = event.target.closest?.("a[href]");
            if (!anchor || !container.contains(anchor)) return;
            const label = anchor.getAttribute("data-nutbook-link-target")
              || markdownLinkTargetLabel(anchor.getAttribute("href") || "", tab);
            if (label) showMarkdownLinkTooltip(label, event);
          }, true);
          container.addEventListener("mousemove", (event) => {
            moveMarkdownLinkTooltip(event);
          }, true);
          container.addEventListener("mouseout", (event) => {
            const anchor = event.target.closest?.("a[href]");
            if (!anchor || !container.contains(anchor)) return;
            const related = event.relatedTarget;
            if (related && anchor.contains(related)) return;
            hideMarkdownLinkTooltip();
          });
          container.addEventListener("click", async (event) => {
            const anchor = event.target.closest?.("a[href]");
            if (!anchor || !container.contains(anchor)) return;
            const href = anchor.getAttribute("href") || "";
            if (!href || href.startsWith("#")) return;
            event.preventDefault();
            event.stopPropagation();
            hideMarkdownLinkTooltip();
            try {
              if (isExternalHttpUrl(href)) {
                await openExternalMarkdownLink(href);
              } else {
                await openMarkdownLocalLink(href, tab);
              }
            } catch (error) {
              setStatus(statusError("status.linkOpenFailedPrefix", error), "error");
            }
          }, true);
        });
      }

      function appConfirm({ title = t("actions.confirm"), message = "", confirmText = t("actions.confirm"), cancelText = t("actions.cancel"), danger = false } = {}) {
        if (!els.confirmScrim) return Promise.resolve(window.confirm(message || title));
        return new Promise((resolve) => {
          const close = (value) => {
            els.confirmScrim.classList.remove("open");
            els.confirmScrim.setAttribute("aria-hidden", "true");
            els.confirmScrim.innerHTML = "";
            resolve(value);
          };
          els.confirmScrim.innerHTML = `
            <div class="confirm-card" role="dialog" aria-modal="true">
              <h3 class="confirm-title">${escapeHtml(title)}</h3>
              <p class="confirm-message">${escapeHtml(message)}</p>
              <div class="confirm-actions">
                <button class="button button-secondary" type="button" data-confirm-cancel>${escapeHtml(cancelText)}</button>
                <button class="button ${danger ? "button-danger" : "button-primary"}" type="button" data-confirm-ok>${escapeHtml(confirmText)}</button>
              </div>
            </div>
          `;
          els.confirmScrim.classList.add("open");
          els.confirmScrim.setAttribute("aria-hidden", "false");
          els.confirmScrim.querySelector("[data-confirm-cancel]")?.addEventListener("click", () => close(false));
          els.confirmScrim.querySelector("[data-confirm-ok]")?.addEventListener("click", () => close(true));
          els.confirmScrim.addEventListener("click", (event) => {
            if (event.target === els.confirmScrim) close(false);
          }, { once: true });
        });
      }

      function htmlEditLeaveConfirmBounds() {
        const width = Math.min(456, Math.max(360, window.innerWidth - 32));
        const height = 216;
        return {
          x: Math.max(0, Math.round((window.innerWidth - width) / 2)),
          y: Math.max(0, Math.round((window.innerHeight - height) / 2)),
          width,
          height
        };
      }

      function closeHtmlEditLeaveConfirmOverlay(itemId) {
        if (itemId == null) return;
        invoke("close_html_edit_leave_confirm_overlay_command", { payload: { itemId } }).catch(() => false);
      }

      function resolveHtmlEditLeaveChoice(choice, runtimeSessionId = "") {
        const intent = appState.htmlEditDirtyLeaveIntent;
        if (!intent || (runtimeSessionId && intent.runtimeSessionId !== runtimeSessionId)) return false;
        appState.htmlEditDirtyLeaveIntent = null;
        appState.htmlEditLeavePromptOpen = false;
        closeHtmlEditLeaveConfirmOverlay(intent.itemId);
        intent.resolve(choice);
        return true;
      }

      async function showHtmlEditLeaveConfirmOverlay(session) {
        const existingIntent = appState.htmlEditDirtyLeaveIntent;
        if (existingIntent?.runtimeSessionId === session?.runtimeSessionId && existingIntent.promise) {
          return existingIntent.promise;
        }
        let resolveChoice = () => {};
        const promise = new Promise((resolve) => { resolveChoice = resolve; });
        appState.htmlEditDirtyLeaveIntent = {
          itemId: session.itemId,
          runtimeSessionId: session.runtimeSessionId,
          promise,
          resolve: resolveChoice
        };
        appState.htmlEditLeavePromptOpen = true;
        try {
          await invoke("attach_html_edit_leave_confirm_overlay_command", {
            payload: {
              itemId: session.itemId,
              bounds: htmlEditLeaveConfirmBounds()
            }
          });
        } catch (error) {
          if (appState.htmlEditDirtyLeaveIntent?.runtimeSessionId !== session.runtimeSessionId) return;
          appState.htmlEditDirtyLeaveIntent = null;
          appState.htmlEditLeavePromptOpen = false;
          setStatus(htmlEditSaveErrorStatus(error), "error");
          syncHtmlEditToolbar().catch(() => {});
          throw error;
        }
        return promise;
      }

      async function promptHtmlEditLeaveChoice(tab, session) {
        if (tab?.preview?.fileType === "html-runtime") {
          return showHtmlEditLeaveConfirmOverlay(session);
        }
        const existingIntent = appState.htmlEditDirtyLeaveIntent;
        if (
          existingIntent &&
          typeof existingIntent === "object" &&
          existingIntent.runtimeSessionId === session?.runtimeSessionId &&
          existingIntent.promise
        ) {
          return existingIntent.promise;
        }
        if (!els.confirmScrim) {
          return Promise.resolve(window.confirm(t("htmlEdit.confirmLeave")) ? "save" : "keep");
        }
        let closePrompt = () => {};
        const promise = new Promise((resolve) => {
          closePrompt = (value) => {
            els.confirmScrim.classList.remove("open");
            els.confirmScrim.setAttribute("aria-hidden", "true");
            els.confirmScrim.innerHTML = "";
            if (appState.htmlEditDirtyLeaveIntent?.runtimeSessionId === session?.runtimeSessionId) {
              appState.htmlEditDirtyLeaveIntent = null;
            }
            resolve(value);
          };
        });
        appState.htmlEditDirtyLeaveIntent = {
          itemId: session?.itemId ?? tab?.id ?? null,
          runtimeSessionId: session?.runtimeSessionId ?? "",
          promise
        };
        els.confirmScrim.innerHTML = `
            <div class="confirm-card" role="dialog" aria-modal="true">
              <h3 class="confirm-title">${escapeHtml(t("htmlEdit.confirmLeave"))}</h3>
              <p class="confirm-message">${escapeHtml(tab?.item?.fileName || tab?.preview?.title || "HTML")}</p>
              <div class="confirm-actions">
                <button class="button button-secondary" type="button" data-html-edit-keep>${escapeHtml(t("htmlEdit.keepEditing"))}</button>
                <button class="button button-secondary" type="button" data-html-edit-discard>${escapeHtml(t("htmlEdit.discardAndContinue"))}</button>
                <button class="button button-primary" type="button" data-html-edit-save>${escapeHtml(t("htmlEdit.saveAndContinue"))}</button>
              </div>
            </div>
          `;
        els.confirmScrim.classList.add("open");
        els.confirmScrim.setAttribute("aria-hidden", "false");
        els.confirmScrim.querySelector("[data-html-edit-keep]")?.addEventListener("click", () => closePrompt("keep"));
        els.confirmScrim.querySelector("[data-html-edit-discard]")?.addEventListener("click", () => closePrompt("discard"));
        els.confirmScrim.querySelector("[data-html-edit-save]")?.addEventListener("click", () => closePrompt("save"));
        els.confirmScrim.addEventListener("click", (event) => {
          if (event.target === els.confirmScrim) closePrompt("keep");
        }, { once: true });
        return promise;
      }

      async function confirmHtmlEditLeaveIfNeeded(tabId = appState.activeTabId) {
        const session = appState.htmlEditSession;
        if (!session || session.itemId !== tabId) return true;
        if (!session.dirty) {
          await exitHtmlEditMode({ runtimeSessionId: session.runtimeSessionId, discard: false });
          return true;
        }
        const tab = getOpenTab(session.itemId);
        const choice = await promptHtmlEditLeaveChoice(tab, session);
        if (appState.htmlEditSession?.runtimeSessionId !== session.runtimeSessionId) return true;
        if (choice === "keep") return false;
        if (choice === "save") {
          const saveResult = await saveActiveHtmlEditPatch();
          if (!saveResult?.saved || !saveResult.canLeave) return false;
          if (appState.htmlEditSession?.runtimeSessionId !== session.runtimeSessionId) return true;
        }
        await exitHtmlEditMode({ runtimeSessionId: session.runtimeSessionId, discard: choice === "discard" });
        return true;
      }

      let htmlEditRuntimeScriptCache = null;

      function htmlEditReadonlyPatchScript(patch) {
        return `(function (changes) {
          function isValidatedRichHtml(html) {
            if (typeof html !== 'string') return false;
            var holder = document.createElement('div');
            holder.innerHTML = html;
            var allowed = { P: true, BR: true, STRONG: true, EM: true, H1: true, H2: true, H3: true, H4: true, UL: true, OL: true, LI: true };
            return Array.prototype.every.call(holder.querySelectorAll('*'), function (node) {
              return allowed[node.tagName] && !node.attributes.length;
            }) && holder.innerHTML === html;
          }
          function apply() {
            var count = 0;
            Object.keys(changes || {}).forEach(function (id) {
              var change = changes[id];
              var element = document.querySelector('[data-id="' + CSS.escape(id) + '"]');
              if (!element) return;
              if (change.type === 'text' && element.getAttribute('data-editable') === 'text') {
                element.textContent = change.text || '';
              } else if ((change.type === 'rich_text' || change.type === 'rich-text') && element.getAttribute('data-editable') === 'rich-text' && isValidatedRichHtml(change.html)) {
                element.innerHTML = change.html;
                if (change.textAlign) element.style.textAlign = change.textAlign;
              } else {
                return;
              }
              count += 1;
            });
            return count;
          }
          (function wait(attempt) { if (apply() || attempt > 40) return; setTimeout(function () { wait(attempt + 1); }, 50); })(0);
        })(${JSON.stringify(patch?.changes || {})});`;
      }

      async function applyHtmlEditPatchToRuntime(itemId) {
        if (!appState.isTauri || appState.htmlEditSession?.itemId === itemId) return;
        const response = await invoke("get_html_edit_patch", { itemId });
        if ((appState.runtimePatchAppliedKeys.get(itemId) || 0) >= (response.patchRevision || 0)) return;
        if (!isRuntimeSurfaceActive(itemId) || response.patchApplyStatus !== "clean" || !Object.keys(response.patch?.changes || {}).length) return;
        await invoke("eval_html_runtime_script_command", { itemId, script: htmlEditReadonlyPatchScript(response.patch) });
        appState.runtimePatchAppliedKeys.set(itemId, response.patchRevision || 0);
      }

      function htmlEditSaveErrorStatus(error) {
        const message = normalizeError(error);
        if (message.includes("EDIT_CONFLICT") || message.includes("edit conflict")) {
          return t("htmlEdit.revisionStale");
        }
        return `${t("htmlEdit.saveFailed")}${message}`;
      }

      function htmlEditSaveNeedsRetryStatus() {
        return appState.language === "en-US"
          ? "Saved this batch, but new edits were made while saving. Save again before leaving."
          : "已保存本次修改，但保存期间又产生了新修改，请再次保存。";
      }

      function htmlEditSaveResult({ saved = false, canLeave = false, sessionChanged = false } = {}) {
        return { saved, canLeave, sessionChanged };
      }

      function nextHtmlEditSessionGeneration() {
        appState.htmlEditSessionGeneration += 1;
        return appState.htmlEditSessionGeneration;
      }

      function isHtmlEditEnterCurrent(itemId, generation) {
        return appState.htmlEditSessionGeneration === generation && getActiveTab()?.id === itemId;
      }

      function isCurrentHtmlEditSession(session, { requireActive = true } = {}) {
        if (!session || appState.htmlEditSession !== session) return false;
        if (appState.htmlEditSessionGeneration !== session.generation) return false;
        if (requireActive && getActiveTab()?.id !== session.itemId) return false;
        return true;
      }

      async function closeStaleHtmlEditToolbar(itemId) {
        const session = appState.htmlEditSession;
        if (session?.itemId === itemId && isCurrentHtmlEditSession(session)) return;
        await invoke("close_html_edit_toolbar_overlay_command", { itemId }).catch(() => false);
        if (appState.htmlEditSession?.itemId !== itemId || !isCurrentHtmlEditSession(appState.htmlEditSession)) {
          appState.htmlEditToolbarVisible = false;
        }
      }

      async function loadHtmlEditRuntimeScript() {
        if (htmlEditRuntimeScriptCache) return htmlEditRuntimeScriptCache;
        const response = await fetch("./assets/html-edit-runtime.js");
        if (!response.ok) throw new Error(`Failed to load html edit runtime: ${response.status}`);
        htmlEditRuntimeScriptCache = await response.text();
        return htmlEditRuntimeScriptCache;
      }

      async function injectHtmlEditRuntime(itemId, runtimeSessionId, patchResponse, isCurrent) {
        if (!isCurrent()) return false;
        const runtimeScript = await loadHtmlEditRuntimeScript();
        if (!isCurrent()) return false;
        await invoke("eval_html_runtime_script_command", {
          itemId,
          script: `
            (function (source) {
              if (window.__NUTBOOK_HTML_EDIT__) return;
              (0, eval)(source);
            })(${JSON.stringify(runtimeScript)});
          `
        });
        if (!isCurrent()) return false;
        await invoke("eval_html_runtime_script_command", {
          itemId,
          script: `
            window.__NUTBOOK_HTML_EDIT_PENDING_SESSION__ = ${JSON.stringify(runtimeSessionId)};
            (function waitForHtmlEditRuntime(attempt) {
              if (window.__NUTBOOK_HTML_EDIT_PENDING_SESSION__ !== ${JSON.stringify(runtimeSessionId)}) return;
              if (window.__NUTBOOK_HTML_EDIT__) {
                window.__NUTBOOK_HTML_EDIT__.enter(${JSON.stringify({
                  runtimeSessionId,
                  patch: patchResponse.patch || null,
                  patchApplyStatus: patchResponse.patchApplyStatus,
                  fieldApplyResults: patchResponse.fieldApplyResults || {},
                  patchRevision: patchResponse.patchRevision || 0
                })});
                if (window.__NUTBOOK_HTML_EDIT_PENDING_SESSION__ === ${JSON.stringify(runtimeSessionId)}) {
                  window.__NUTBOOK_HTML_EDIT_PENDING_SESSION__ = "";
                }
                return;
              }
              if (attempt > 40) {
                window.__NUTBOOK_HTML_EDIT_PENDING_SESSION__ = "";
                document.title = "__NUTBOOK_HTML_EDIT_RUNTIME__:" + JSON.stringify({
                  type: "html_edit_ready",
                  runtimeSessionId: ${JSON.stringify(runtimeSessionId)},
                  count: 0,
                  duplicates: [],
                  shortcutsIntercepted: false
                });
                return;
              }
              setTimeout(function () { waitForHtmlEditRuntime(attempt + 1); }, 50);
            })(0);
          `
        });
        if (!isCurrent()) return false;
        return true;
      }

      async function enterHtmlEditMode(itemId) {
        const tab = getOpenTab(itemId);
        if (!tab || tab.preview?.fileType !== "html-runtime") return;
        if (appState.htmlEditSession?.itemId === itemId) {
          await syncHtmlEditToolbar();
          return;
        }
        if (appState.htmlEditSession && !(await confirmHtmlEditLeaveIfNeeded(appState.htmlEditSession.itemId))) return;
        const generation = nextHtmlEditSessionGeneration();
        if (!isHtmlEditEnterCurrent(itemId, generation)) return;
        const response = await invoke("get_html_edit_patch", { itemId });
        if (!isHtmlEditEnterCurrent(itemId, generation)) return;
        if (response.patchApplyStatus !== "clean") {
          setStatus(t("htmlEdit.sourceChanged"), "warn");
          return;
        }
        const runtimeSessionId = `html-edit-${itemId}-${Date.now()}`;
        appState.htmlEditSession = {
          itemId,
          runtimeSessionId,
          artifactEditId: response.artifactEditId,
          sourceFileHash: response.sourceFileHash,
          sourceModifiedAt: response.sourceModifiedAt,
          patchRevision: response.patchRevision || 0,
          generation,
          state: "editing",
          dirty: false,
          changes: {},
          selectedDataId: null,
          formatState: null,
          saveInFlight: null,
          shortcutsIntercepted: false
        };
        const session = appState.htmlEditSession;
        const isCurrent = () => isCurrentHtmlEditSession(session);
        try {
          const injected = await injectHtmlEditRuntime(itemId, runtimeSessionId, response, isCurrent);
          if (!injected || !isCurrent()) {
            await closeStaleHtmlEditToolbar(itemId);
            if (appState.htmlEditSession?.runtimeSessionId === runtimeSessionId) {
              appState.htmlEditSession = null;
              appState.htmlEditToolbarVisible = false;
              appState.htmlEditToolbarSyncPending = false;
            }
            return;
          }
          await syncHtmlEditToolbar();
          if (!isCurrent()) {
            await closeStaleHtmlEditToolbar(itemId);
          }
        } catch (error) {
          await invoke("close_html_edit_toolbar_overlay_command", { itemId }).catch(() => false);
          if (appState.htmlEditSession?.runtimeSessionId === runtimeSessionId) {
            appState.htmlEditSession = null;
          }
          appState.htmlEditToolbarVisible = false;
          appState.htmlEditToolbarSyncPending = false;
          throw error;
        }
      }

      function htmlEditToolbarBounds() {
        const width = 260;
        const height = 56;
        return {
          x: Math.max(0, Math.round((window.innerWidth - width) / 2)),
          y: Math.max(0, Math.round(window.innerHeight - height - 24)),
          width,
          height
        };
      }

      async function syncHtmlEditToolbar() {
        if (appState.htmlEditToolbarSyncInFlight) {
          appState.htmlEditToolbarSyncPending = true;
          return;
        }
        appState.htmlEditToolbarSyncInFlight = true;
        appState.htmlEditToolbarSyncPending = false;
        try {
          await syncHtmlEditToolbarNow();
        } finally {
          appState.htmlEditToolbarSyncInFlight = false;
          if (appState.htmlEditToolbarSyncPending) {
            appState.htmlEditToolbarSyncPending = false;
            syncHtmlEditToolbar().catch((error) => {
              setStatus(htmlEditSaveErrorStatus(error), "error");
            });
          }
        }
      }

      async function syncHtmlEditToolbarNow() {
        const session = appState.htmlEditSession;
        if (!session) return;
        const isCurrent = (options) => isCurrentHtmlEditSession(session, options);
        if (getActiveTab()?.id !== session.itemId) {
          if (appState.htmlEditToolbarVisible) {
            if (!isCurrent({ requireActive: false })) return;
            await invoke("set_html_edit_toolbar_overlay_visibility_command", {
              itemId: session.itemId,
              visible: false
            }).catch(() => false);
            if (!isCurrent({ requireActive: false })) return;
            appState.htmlEditToolbarVisible = false;
            if (getActiveTab()?.id === session.itemId) {
              appState.htmlEditToolbarSyncPending = true;
            }
          }
          return;
        }
        if (!isCurrent()) return;
        await invoke("attach_html_edit_toolbar_overlay_command", {
          itemId: session.itemId,
          bounds: htmlEditToolbarBounds(),
          dirty: Boolean(session.dirty)
        });
        if (!isCurrent()) {
          await closeStaleHtmlEditToolbar(session.itemId);
          return;
        }
        appState.htmlEditToolbarVisible = true;
      }

      function htmlEditMarkSavedWaiterKey(runtimeSessionId, requestId) {
        return `${runtimeSessionId || ""}:${requestId || ""}`;
      }

      function waitForHtmlEditMarkSavedResult(runtimeSessionId, requestId) {
        const key = htmlEditMarkSavedWaiterKey(runtimeSessionId, requestId);
        return new Promise((resolve) => {
          const timeoutId = window.setTimeout(() => {
            appState.htmlEditMarkSavedWaiters.delete(key);
            resolve(false);
          }, 1200);
          appState.htmlEditMarkSavedWaiters.set(key, (saved) => {
            window.clearTimeout(timeoutId);
            resolve(Boolean(saved));
          });
        });
      }

      async function saveActiveHtmlEditPatch() {
        const session = appState.htmlEditSession;
        if (!session) return htmlEditSaveResult();
        if (!session.dirty) return htmlEditSaveResult({ saved: true, canLeave: true });
        if (session.saveInFlight) return session.saveInFlight;
        const runtimeSessionId = session.runtimeSessionId;
        const generation = session.generation;
        const savedChangesJson = JSON.stringify(session.changes || {});
        const savedChanges = typeof structuredClone === "function"
          ? structuredClone(session.changes || {})
          : JSON.parse(savedChangesJson);
        let savePromise;
        savePromise = (async () => {
          try {
            const result = await invoke("save_html_edit_patch", {
              itemId: session.itemId,
              runtimeSessionId,
              artifactEditId: session.artifactEditId,
              expectedFileHash: session.sourceFileHash,
              expectedModifiedAt: session.sourceModifiedAt,
              expectedPatchRevision: session.patchRevision,
              changes: savedChanges
            });
            if (appState.htmlEditSession !== session || session.generation !== generation || session.runtimeSessionId !== runtimeSessionId) {
              return htmlEditSaveResult({ saved: true, canLeave: true, sessionChanged: true });
            }
            session.patchRevision = result.patchRevision ?? (session.patchRevision + 1);
            session.sourceFileHash = result.sourceFileHash ?? session.sourceFileHash;
            session.sourceModifiedAt = result.sourceModifiedAt ?? session.sourceModifiedAt;
            const currentChangesMatch = JSON.stringify(session.changes || {}) === savedChangesJson;
            if (!currentChangesMatch) {
              setStatus(htmlEditSaveNeedsRetryStatus(), "warn");
              await syncHtmlEditToolbar();
              return htmlEditSaveResult({ saved: true, canLeave: false });
            }
            session.dirty = false;
            session.changes = {};
            await syncHtmlEditToolbar();
            const markSavedRequestId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
            const markSavedResult = waitForHtmlEditMarkSavedResult(runtimeSessionId, markSavedRequestId);
            await invoke("eval_html_runtime_script_command", {
              itemId: session.itemId,
              script: `
                (function () {
                  var runtimeSessionId = ${JSON.stringify(runtimeSessionId)};
                  var requestId = ${JSON.stringify(markSavedRequestId)};
                  var saved = false;
                  try {

      function normalizeMarkdownSelectionText(value) {
        return String(value || "")
          .replace(/\s+/g, " ")
          .trim();

      function findMarkdownSelectionIndex(raw, anchorText, offsetHint = 0) {
        const source = String(raw || "");
        const normalizedAnchor = normalizeMarkdownSelectionText(anchorText);
        if (!source) return 0;
        if (!normalizedAnchor) return 0;

        const candidates = [
          normalizedAnchor,
          normalizedAnchor.split("\n")[0],
          normalizedAnchor.slice(0, 48),
          normalizedAnchor.slice(0, 24)
        ]
          .map((entry) => normalizeMarkdownSelectionText(entry))
          .filter(Boolean);

        for (const candidate of candidates) {
          const index = source.indexOf(candidate);
          if (index >= 0) {
            return Math.max(0, Math.min(source.length, index + Math.max(0, offsetHint)));
          }
        }

        return 0;
      }

      async function sha256Hex(value) {
        if (!window.crypto?.subtle || !window.TextEncoder) return "";
        const bytes = new TextEncoder().encode(String(value || ""));
        const digest = await window.crypto.subtle.digest("SHA-256", bytes);
        return Array.from(new Uint8Array(digest))
          .map((byte) => byte.toString(16).padStart(2, "0"))
          .join("");
      }

      function commitMarkdownDocumentTitle(tab, input) {
        if (!tab || tab.preview?.fileType !== "markdown" || !input) return;

        const current = markdownContentForTab(tab);

        captureMarkdownScrollForTab(tab);
        cleanupMarkdownEditor();

      async function mountMarkdownEditor(tab) {

          appState.markdownEditorError = "";

          logMarkdownPerf("api-ready", apiStartedAt, tab.item?.fileName || "");
          if (!api?.create) {

          if (!root.isConnected || appState.activeTabId !== expectedTabId) {
            return;

          const editor = await api.create({
            root,
            markdown: content,
            language: appState.language,
            tableToolsEnabled: appState.markdownPreferences.tableToolsEnabled,
            resolveImageSrc(src) {

      function formatTimestamp(value) {

        return new Intl.DateTimeFormat("zh-CN", {

      function normalizeError(error) {
        if (!error) return "未知错误";
        if (typeof error === "string") return error;
        if (error.message && error.code) return `${error.message} [${error.code}]`;
        if (error.message) return error.message;
        if (error.code) return String(error.code);

      function normalizeDetailedError(error) {
        const message = normalizeError(error);
        const stackLine = String(error?.stack || "")
          .split("\n")
          .map((line) => line.trim())
          .find((line) => line && !line.includes("normalizeDetailedError"));
        return stackLine ? `${message} / ${stackLine}` : message;

        if (code === "ITEM_NOT_FOUND" || code === "LIBRARY_NOT_FOUND") return true;

        return message.includes("item not found") || message.includes("library not found");

      function toRuntimeFileUrl(pathOrUrl, fallbackPath) {
        const candidate = fallbackPath || pathOrUrl;
        if (!candidate) return "";
        if (String(candidate).startsWith("nutbook-preview://")) {
          return String(candidate);
        }
        if (!appState.isTauri || typeof convertFileSrcRaw !== "function") {
          return pathOrUrl || candidate;
        }

        let localPath = candidate;
        if (String(localPath).startsWith("file://")) {
          try {
            localPath = decodeURIComponent(new URL(localPath).pathname);
          } catch (_) {
          }
        }
        return convertFileSrcRaw(localPath);
      }

      function toLocalServerUrl(pathOrUrl, query = "") {
        if (!pathOrUrl) return "";
        const value = String(pathOrUrl);
        if (value.startsWith("http://127.0.0.1:") || value.startsWith("http://localhost:")) {
          return `${value}${query}`;
        }

        let localPath = value;
        if (localPath.startsWith("file://")) {
          try {
            localPath = decodeURIComponent(new URL(localPath).pathname);
          } catch (_) {
          }
        }

        if (!localPath.startsWith("/") || !appState.localServerOrigin) {
          return value;
        }

        const encodedPath = localPath
          .split("/")
          .filter(Boolean)
          .map((segment) => encodeURIComponent(segment))
          .join("/");
        return `${appState.localServerOrigin}/fs/${encodedPath}${query}`;
      }

      function markdownToHtml(raw) {
        const escaped = raw
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
        return escaped
          .replace(/^### (.*)$/gm, "<h3>$1</h3>")
          .replace(/^## (.*)$/gm, "<h2>$1</h2>")
          .replace(/^# (.*)$/gm, "<h1>$1</h1>")
          .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
          .replace(/\n\n/g, "</p><p>")
          .replace(/^(?!<h)(.+)$/gm, "<p>$1</p>");
      }

          const rightKey = (right.tags?.[0]?.name || "").toLowerCase();
          if (!leftKey && !rightKey) return 0;

        if (appState.updateCheckInFlight) return t("settings.updateChecking");

        if (status === "available") {
          return t("settings.updateAvailable");
        }
        if (status === "current") return t("settings.updateCurrent");
        if (status === "disabled") return t("settings.updateDisabled");
        if (status === "error") return `${t("settings.updateFailedPrefix")}${appState.updateStatus.error || t("settings.updateNetworkUnavailable")}`;

      function formatUpdateCheckedAt(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        const numeric = /^\d+$/.test(raw) ? Number(raw) : null;
        const date = numeric != null
          ? new Date(raw.length >= 13 ? numeric : numeric * 1000)
          : new Date(raw);
        if (!Number.isFinite(date.getTime())) return raw;
        return new Intl.DateTimeFormat(currentLanguage(), {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(date);
      }

          return;

        appState.isAboutOpen = true;

      async function openAboutOverlay() {

          renderAboutPanel();

        }

          },

      async function openSettingsOverlay(tab = "skills", mode = "menu") {
        if (!appState.isTauri) {
          openSettingsTab(tab);
          return;
        }
        const isMenuMode = mode === "menu";
        await invoke("attach_settings_overlay_command", {
          bounds: isMenuMode
            ? {
                x: 76,
                y: Math.max(0, window.innerHeight - 238),
                width: 220,
                height: 220
              }
            : {
                x: 0,
                y: 0,
                width: Math.max(1, window.innerWidth),
                height: Math.max(1, window.innerHeight)
              },
          tab,
          mode
        });
      }

      function closeSettingsOverlay() {
        cancelHostSettingsOverlayClose();
        document.title = "__NUTBOOK_SETTINGS_OVERLAY__:close";
      }

      async function openSettingsPanelFromOverlay(tab = "skills") {
        appState.settingsOverlayMode = "panel";
        appState.settingsTab = tab;
        appState.isSettingsOpen = false;
        document.body.classList.remove("settings-overlay-menu");
        if (appState.isTauri) {
          await invoke("attach_settings_overlay_command", {
            bounds: {
              x: 0,
              y: 0,
              width: Math.max(1, window.innerWidth),
              height: Math.max(1, window.innerHeight)
            },
            tab,
            mode: "panel"

        appState.isSettingsOpen = true;

        await loadTags();

        document.body.classList.add("settings-overlay-mode");
        document.body.classList.toggle("settings-overlay-menu", mode === "menu");
        appState.settingsTab = tab;
        appState.isAboutOpen = mode === "about";
        appState.isSettingsOpen = mode !== "menu" && mode !== "about";
        renderSettingsPanel();
        renderAboutPanel();

      window.__NUTBOOK_REFRESH_AFTER_SETTINGS__ = async () => {
        await loadLibraries();
        await loadTags();
        await loadIgnoredItems();
        await loadDiscoveredArtifactSkills();
        await loadItems();
      };

      function renderSortMenu() {
        const options = [
          { value: "modifiedAtDesc", label: "按修改时间" },
          { value: "fileNameAsc", label: "按文件名" },
          { value: "lastOpenedDesc", label: "按打开时间" },
          { value: "tagsAsc", label: "按标签" }
        ];
        els.sortMenu.innerHTML = options.map((option) => `
          <button class="popover-option ${appState.sortMode === option.value ? "active" : ""}" type="button" data-sort-mode="${option.value}">${option.label}</button>
        `).join("");
        els.sortMenu.classList.toggle("open", appState.isSortMenuOpen);
        els.sortMenu.querySelectorAll("[data-sort-mode]").forEach((node) => {
          node.addEventListener("click", async () => {
            appState.sortMode = node.dataset.sortMode;
            appState.isSortMenuOpen = false;
            renderSortMenu();
            await loadItems();
            setStatus(currentSortConfig().label, "ok");
          });
        });
      }

      function toggleSettingsGroup(groupKey) {
        appState.settingsCollapsedGroups[groupKey] = !appState.settingsCollapsedGroups[groupKey];
        renderSettingsPanel();
      }

      function sourceSortComparator(sortMode) {
        const byName = (left, right) => left.name.localeCompare(right.name, "zh-CN");
        const byPath = (left, right) => left.rootPath.localeCompare(right.rootPath, "zh-CN");
        const byCreatedDesc = (left, right) =>
          String(right.createdAt || "").localeCompare(String(left.createdAt || ""));
        switch (sortMode) {
          case "pathAsc":
            return byPath;
          case "kindThenName":
            return (left, right) => {
              if (left.sourceKind !== right.sourceKind) {
                return left.sourceKind === "folder" ? -1 : 1;
              }
              return byName(left, right);
            };
          case "recentFirst":
            return (left, right) => {
              const diff = byCreatedDesc(left, right);
              return diff || byName(left, right);
            };
          case "nameAsc":
          default:
            return byName;
        }
      }

      function renderSettingsGroup({ key, title, count, bodyHtml }) {
        const collapsed = Boolean(appState.settingsCollapsedGroups[key]);
        return `
          <div class="settings-group">
            <div class="settings-group-header">
              <button class="settings-group-title" type="button" data-settings-group-toggle="${key}">
                <span class="material-symbols-outlined">${collapsed ? "chevron_right" : "expand_more"}</span>
                <span>${title}</span>
              </button>
              <div class="settings-group-count">${count}</div>
            </div>
            <div class="settings-group-body" ${collapsed ? "hidden" : ""}>
              ${bodyHtml}
            </div>
          </div>
        `;
      }

      function renderSettingsSourceSortMenu() {
        const options = [
          { value: "nameAsc", label: "按名称" },
          { value: "pathAsc", label: "按路径" },
          { value: "kindThenName", label: "按类型" },
          { value: "recentFirst", label: "最近添加" }
        ];
        if (!els.settingsSourceSortMenu) return;
        els.settingsSourceSortMenu.innerHTML = options.map((option) => `
          <button class="popover-option ${appState.settingsSourceSort === option.value ? "active" : ""}" type="button" data-settings-source-sort="${option.value}">${option.label}</button>
        `).join("");
        els.settingsSourceSortMenu.classList.toggle("open", Boolean(appState.isSettingsSourceSortMenuOpen));
        els.settingsSourceSortMenu.setAttribute("aria-hidden", appState.isSettingsSourceSortMenuOpen ? "false" : "true");
        els.settingsSourceSortMenu.querySelectorAll("[data-settings-source-sort]").forEach((node) => {
          node.addEventListener("click", () => {
            appState.settingsSourceSort = node.dataset.settingsSourceSort;
            appState.isSettingsSourceSortMenuOpen = false;
            renderSettingsSourceSortMenu();
            renderSettingsPanel();
          });
        });
      }

      function renderDocumentMoreMenu() {
        const tab = getActiveTab();
        const isMarkdown = tab?.preview?.fileType === "markdown";
        const isHtmlRuntime = tab?.preview?.fileType === "html-runtime";
        const options = isHtmlRuntime
          ? [
              {
                action: "toggle-runtime-presentation",
                label: appState.runtimeFullscreenItemId === tab?.id ? t("actions.exitPresentationShortcut") : t("actions.enterPresentationShortcut"),
                className: "presentation-option",
                disabled: false
              }
            ]
          : [
              { action: "save-markdown", label: "保存", disabled: !isMarkdown },
              { action: "export-markdown", label: "导出", disabled: !isMarkdown }
            ];
        els.documentMoreMenu.innerHTML = options.map((option) => `
          <button class="popover-option ${option.className || ""} ${option.disabled ? "disabled" : ""}" type="button" data-document-action="${option.action}" ${option.disabled ? "disabled" : ""}>${option.label}</button>
        `).join("");
        els.documentMoreMenu.classList.toggle("open", appState.isDocumentMoreMenuOpen);
        els.documentMoreMenu.setAttribute("aria-hidden", appState.isDocumentMoreMenuOpen ? "false" : "true");
        els.documentMoreMenu.querySelectorAll("[data-document-action]").forEach((node) => {
          node.addEventListener("click", async () => {
            const action = node.dataset.documentAction;
            appState.isDocumentMoreMenuOpen = false;
            renderDocumentMoreMenu();
            if (action === "save-markdown") {
              await saveActiveMarkdown();
              return;
            }
            if (action === "export-markdown") {
              await exportActiveMarkdown();
              return;
            }
            if (action === "toggle-runtime-presentation") {
              await toggleActiveHtmlRuntimePresentationMode();
            }
          });
        });
      }

      function renderSettingsPanel() {
        els.settingsScrim.classList.toggle("open", appState.isSettingsOpen);
        if (!appState.isSettingsOpen) return;
        els.settingsSkillsSection.hidden = appState.settingsTab !== "skills";
        els.settingsLibrariesSection.hidden = appState.settingsTab !== "libraries";
        els.settingsTagsSection.hidden = appState.settingsTab !== "tags";
        els.settingsPreferencesSection.hidden = appState.settingsTab !== "preferences";
        els.settingsThumbnailsSection.hidden = appState.settingsTab !== "thumbnails";
        maybeCheckUpdatesForPreferences();
        if (els.settingsSourceSearchInput) {
          els.settingsSourceSearchInput.value = appState.settingsSourceSearch;
        }
        renderSettingsSourceSortMenu();
        document.querySelectorAll("[data-settings-tab]").forEach((node) => {
          node.classList.toggle("active", node.dataset.settingsTab === appState.settingsTab);
        });

        const sourceKeyword = appState.settingsSourceSearch.trim().toLowerCase();
        const filteredLibraries = [...appState.libraries]
          .filter((library) => {
            if (!sourceKeyword) return true;
            return `${library.name}\n${library.rootPath}`.toLowerCase().includes(sourceKeyword);
          })
          .sort(sourceSortComparator(appState.settingsSourceSort));
        const folderLibraries = filteredLibraries.filter((library) => library.sourceKind !== "file");
        const fileLibraries = filteredLibraries.filter((library) => library.sourceKind === "file");
        const filteredIgnoredItems = [...appState.ignoredItems]
          .filter((item) => {
            if (!sourceKeyword) return true;
            return `${item.fileName}\n${item.filePath}\n${item.libraryName}`.toLowerCase().includes(sourceKeyword);
          })
          .sort((left, right) => String(right.createdAt || "").localeCompare(String(left.createdAt || "")));
        const filteredSkills = [...appState.discoveredArtifactSkills]
          .filter((skill) => {
            if (!sourceKeyword) return true;
            return `${skill.name}\n${skill.outputPath || ""}\n${skill.status || ""}`.toLowerCase().includes(sourceKeyword);
          })
          .sort((left, right) => {
            const statusRank = { connected: 0, ready: 1, manual: 2 };
            const leftRank = statusRank[left.status] ?? 9;
            const rightRank = statusRank[right.status] ?? 9;
            if (leftRank !== rightRank) return leftRank - rightRank;
            if (appState.settingsSourceSort === "pathAsc") {
              return String(left.outputPath || "").toLowerCase().localeCompare(String(right.outputPath || "").toLowerCase());
            }
            return left.name.toLowerCase().localeCompare(right.name.toLowerCase());
          });
        appState.settingsSkillSelection.forEach((normalizedName) => {
          if (!filteredSkills.some((skill) => skill.normalizedName === normalizedName && (skill.status === "ready" || skill.status === "manual"))) {
            appState.settingsSkillSelection.delete(normalizedName);
          }
        });

        const renderLibraryRows = (libraries) => libraries.length
          ? libraries.map((library) => `
              <div class="settings-row">
                <div class="settings-row-copy">
                  <div class="settings-row-copy-top">
                    <div class="settings-row-title">${escapeHtml(library.name)}</div>
                    <span class="source-kind-badge">${library.sourceKind === "file" ? t("settings.singleFile") : t("settings.folder")}</span>
                    ${library.skillBinding ? `<span class="source-kind-badge">${escapeHtml(library.skillBinding.displayName)}</span>` : ""}
                    ${library.pathState === "missing" ? `<span class="source-kind-badge">路径失效</span>` : ""}
                  </div>
                  <div class="settings-row-meta settings-row-path">${escapeHtml(library.rootPath)}</div>
                </div>
                <div class="button-row">
                  <button class="button button-secondary" type="button" data-settings-scan-library="${library.id}">${library.pathState === "missing" ? "修正路径" : (library.sourceKind === "file" ? t("actions.index") : t("actions.scan"))}</button>
                  <button class="button button-ghost" type="button" data-settings-delete-library="${library.id}">${t("actions.remove")}</button>
                </div>
              </div>
            `).join("")
          : `<div class="settings-empty">${t("settings.noGroupContent")}</div>`;

        els.settingsLibraryList.innerHTML = [
          renderSettingsGroup({
            key: "folders",
            title: "文件夹来源",
            count: countText(folderLibraries.length),
            bodyHtml: `
              <div class="settings-header">
                <div class="muted">${t("settings.sourceFoldersDescription")}</div>
                <div class="button-row">
                  <button class="button button-primary button-small" type="button" data-settings-add-folder="true">${t("actions.addFolder")}</button>
                </div>
              </div>
              ${renderLibraryRows(folderLibraries)}
            `
          }),
          renderSettingsGroup({
            key: "files",
            title: "单文件来源",
            count: countText(fileLibraries.length),
            bodyHtml: `
              <div class="settings-header">
                <div class="muted">${t("settings.sourceFilesDescription")}</div>
                <div class="button-row">
                  <button class="button button-primary button-small" type="button" data-settings-add-file="true">${t("actions.addSingleFile")}</button>
                </div>
              </div>
              ${renderLibraryRows(fileLibraries)}
            `
          })
        ].join("");

        const ignoredBody = filteredIgnoredItems.length
          ? `
              <div class="settings-header">
                <div class="muted">${t("settings.ignoredDescription")}</div>
                <div class="button-row">
                  <button class="button button-primary button-small" type="button" data-settings-restore-selected="true" ${appState.settingsIgnoredSelection.size === 0 ? "disabled" : ""}>${t("actions.restoreSelected")}</button>
                </div>
              </div>
              ${filteredIgnoredItems.map((item) => `
              <div class="settings-row">
                <div class="settings-row-copy">
                  <div class="settings-row-copy-top">
                    <input type="checkbox" data-settings-ignored-select="${item.itemId}" ${appState.settingsIgnoredSelection.has(item.itemId) ? "checked" : ""} />
                    <div class="settings-row-title">${escapeHtml(item.fileName)}</div>
                    <span class="source-kind-badge">${t("settings.removed")}</span>
                  </div>
                  <div class="settings-row-meta settings-row-path">${escapeHtml(item.filePath)}</div>
                  <div class="settings-row-meta">${t("settings.sourcePrefix")}${escapeHtml(item.libraryName)}</div>
                </div>
                <div class="button-row">
                  <button class="button button-secondary" type="button" data-settings-restore-ignored="${item.itemId}">${t("actions.restore")}</button>
                </div>
              </div>
            `).join("")}
            `
          : `<div class="settings-empty">${t("settings.noRemovedFiles")}</div>`;

        els.settingsIgnoredList.innerHTML = renderSettingsGroup({
          key: "ignored",
          title: "已移除文件",
          count: countText(filteredIgnoredItems.length),
          bodyHtml: ignoredBody
        });

        const skillButtonLabel = (skill) => {
          switch (skill.status) {
            case "connected":
              return t("actions.connected");
            case "ready":
              return t("actions.attach");
            case "excluded":
              return t("actions.excluded");
            case "manual":

              return t("actions.manualAttach");
          }

        const skillStatusLabel = (skill) => {
          switch (skill.status) {
            case "connected":

            case "ready":
              return t("settings.ready");
            case "excluded":
              return t("actions.excluded");
            case "manual":
            default:
              return t("settings.manualRequired");
          }
        };

        const renderSkillRows = (skills, options = {}) => skills.length
          ? `
              <div class="settings-skill-list">
                ${skills.map((skill) => `
                  <div class="settings-row settings-skill-row" data-settings-skill-source-exists="${skill.sourceExists ? "true" : "false"}">
                    <div class="settings-row-copy">
                      <div class="settings-skill-inline">
                        ${options.allowSelection ? `<input type="checkbox" data-settings-skill-select="${escapeAttribute(skill.normalizedName)}" ${appState.settingsSkillSelection.has(skill.normalizedName) ? "checked" : ""} />` : ""}

                    </div>
                  </div>

              </div>

          : `<div class="settings-empty">${escapeHtml(options.emptyLabel || t("settings.noGroupContent"))}</div>`;

        const connectedOrReadySkills = filteredSkills.filter((skill) => skill.status === "connected" || skill.status === "ready");
        const manualSkills = filteredSkills.filter((skill) => skill.status === "manual");
        const excludedSkills = filteredSkills.filter((skill) => skill.status === "excluded");

        els.settingsSkillList.innerHTML = `
          <div class="settings-skill-summary">
            <div class="muted">${skillScanSummaryText(appState.discoveredSkillScannedCount, filteredSkills.length)}</div>
