        }
        renderDocumentMoreMenu();
        scheduleRuntimeHostSync();
      }

      function cleanupRuntimeHostSync(options = {}) {
        if (options.invalidate !== false) {
          appState.runtimeHostSyncRunId += 1;
          appState.runtimeControlsOverlayLastKey = null;
        }
        appState.runtimeHostSyncPending = false;
        if (appState.runtimeHostSyncFrame) {
          cancelAnimationFrame(appState.runtimeHostSyncFrame);
          appState.runtimeHostSyncFrame = null;
        }
        if (appState.runtimeHostResizeObserver) {
          appState.runtimeHostResizeObserver.disconnect();
          appState.runtimeHostResizeObserver = null;
          appState.runtimeHostResizeObserverTarget = null;
        }
      }

      async function setRuntimeHostVisibility(itemId, visible) {
        try {
          return Boolean(await invoke("set_html_runtime_host_visibility_command", { itemId, visible }));
        } catch (_) {
          return false;
        }
      }

      function normalizeHtmlRuntimeViewState(rawState) {
        if (!rawState || typeof rawState !== "object") return null;
        const finitePosition = (value) => Math.min(100000000, Math.max(0, Number.isFinite(Number(value)) ? Number(value) : 0));
        const hash = typeof rawState.hash === "string" && (rawState.hash === "" || rawState.hash.startsWith("#"))
          ? rawState.hash.slice(0, 2048)
          : "";
        return {
          surfaceToken: Math.max(0, Number(rawState.surfaceToken) || 0),
          sequence: Math.max(0, Number(rawState.sequence) || 0),
          scrollX: finitePosition(rawState.scrollX),
          scrollY: finitePosition(rawState.scrollY),
          hash,
          presentationPageId: typeof rawState.presentationPageId === "string"
            ? rawState.presentationPageId.slice(0, 512)
            : null
        };
      }

      function htmlRuntimeViewStateWaiterKey(itemId, surfaceToken, requestId) {
        return `${itemId}:${surfaceToken}:${requestId}`;
      }

      function nextHtmlRuntimeViewStateSurfaceToken(itemId) {
        const token = ++appState.runtimeViewStateSurfaceSequence;
        appState.runtimeViewStateSurfaceTokens.set(itemId, token);
        return token;
      }

      function htmlRuntimeViewStateSurfaceToken(itemId) {
        return appState.runtimeViewStateSurfaceTokens.get(itemId) || 0;
      }

      async function refreshHtmlRuntimeViewState(itemId, timeoutMs = 120) {
        const session = appState.runtimeSessions.find((entry) => entry.id === itemId);
        const surfaceToken = htmlRuntimeViewStateSurfaceToken(itemId);
        if (!session || !surfaceToken) return false;
        const requestId = `view-${itemId}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const key = htmlRuntimeViewStateWaiterKey(itemId, surfaceToken, requestId);
        return new Promise((resolve) => {
          let settled = false;
          const finish = (captured) => {
            if (settled) return;
            settled = true;
            window.clearTimeout(timeoutId);
            appState.runtimeViewStateWaiters.delete(key);
            resolve(Boolean(captured));
          };
          const timeoutId = window.setTimeout(() => finish(false), timeoutMs);
          appState.runtimeViewStateWaiters.set(key, finish);
          invoke("eval_html_runtime_script_command", {
            itemId,
            script: `window.__NUTBOOK_RUNTIME_VIEW_STATE__?.flush?.(${JSON.stringify(requestId)});`
          }).then((applied) => {
            if (!applied) finish(false);
          }).catch(() => finish(false));
        });
      }

      window.__NUTBOOK_HANDLE_HTML_RUNTIME_VIEW_STATE__ = function handleHtmlRuntimeViewState(data) {
        if (!data || data.type !== "html_runtime_view_state") return;
        const itemId = Number(data.itemId);
        const surfaceToken = Number(data.surfaceToken);
        if (!Number.isInteger(itemId) || surfaceToken !== htmlRuntimeViewStateSurfaceToken(itemId)) return;
        const session = appState.runtimeSessions.find((entry) => entry.id === itemId);
        if (!session) return;
        const nextState = normalizeHtmlRuntimeViewState(data);
        if (!nextState) return;
        const previousState = session.viewState;
        if (
          previousState?.surfaceToken === surfaceToken
          && Number(previousState.sequence || 0) > nextState.sequence
        ) return;
        session.viewState = nextState;
        const requestId = typeof data.requestId === "string" ? data.requestId : "";
        if (!requestId) return;
        const resolveSnapshot = appState.runtimeViewStateWaiters.get(
          htmlRuntimeViewStateWaiterKey(itemId, surfaceToken, requestId)
        );
        resolveSnapshot?.(true);
      };

      async function setRuntimeControlsOverlayVisibility(itemId, visible) {
        try {
          return Boolean(await invoke("set_html_runtime_controls_overlay_visibility_command", { itemId, visible }));
        } catch (_) {
          return false;
        }
      }

      function nextRuntimeSurfaceToken(itemId) {
        if (!itemId) return 0;
        const next = (appState.runtimeSurfaceTokens.get(itemId) || 0) + 1;
        appState.runtimeSurfaceTokens.set(itemId, next);
        return next;
      }

      function currentRuntimeSurfaceToken(itemId) {
        return appState.runtimeSurfaceTokens.get(itemId) || 0;
      }

      function nextItemOpenToken(itemId) {
        if (!itemId) return 0;
        const next = (appState.itemOpenTokens.get(itemId) || 0) + 1;
        appState.itemOpenTokens.set(itemId, next);
        return next;
      }

      function isCurrentItemOpenToken(itemId, token, navigationEpoch = null) {
        if (!itemId || !token) return false;
        return appState.itemOpenTokens.get(itemId) === token
          && (navigationEpoch == null || isRuntimeNavigationCurrent(navigationEpoch));
      }

      function invalidateItemOpenToken(itemId) {
        nextItemOpenToken(itemId);
      }

      function isRuntimeSurfaceActive(itemId) {
        const activeTab = getActiveTab();
        return activeTab?.id === itemId && activeTab.preview?.fileType === "html-runtime";
      }

      function isRuntimePatchSurfaceCurrent(itemId, generation, surfaceToken) {
        return isRuntimeSurfaceActive(itemId)
          && appState.htmlEditSession?.itemId !== itemId
          && appState.htmlEditSessionGeneration === generation
          && currentRuntimeSurfaceToken(itemId) === surfaceToken;
      }

      function isRuntimeSurfaceHideCurrent(itemId, token, force = false) {
        if (force) return true;
        if (isRuntimeSurfaceActive(itemId)) return false;
        return token == null || currentRuntimeSurfaceToken(itemId) === token;
      }

      async function markRuntimeSurfaceActive(itemId) {
        if (!itemId) return;
        appState.runtimeHiddenSurfaceIds.delete(itemId);
        const surfaceToken = nextRuntimeSurfaceToken(itemId);
        await syncHtmlEditReadonlyPatchSurfaceToken(itemId, surfaceToken).catch(() => {});
      }

      async function hideRuntimeSessionSurfaces(itemId, options = {}) {
        if (!itemId) return;
        const force = Boolean(options.force);
        const token = options.token ?? currentRuntimeSurfaceToken(itemId);
        const cleanupIntentIsCurrent = () => (
          (options.navigationEpoch == null || isRuntimeNavigationCurrent(options.navigationEpoch))
          && options.keepItemId !== itemId
        );
        if (!cleanupIntentIsCurrent()) return;
        if (appState.runtimeHiddenSurfaceIds.has(itemId) && !options.recoverLateAttach) return;
        if (!force && isRuntimeSurfaceActive(itemId)) {
          return;
        }
        if (!isRuntimeSurfaceHideCurrent(itemId, token, force)) return;
        if (appState.activeRuntimeHostId === itemId) {
          await refreshHtmlRuntimeViewState(itemId).catch(() => false);
        }
        if (!cleanupIntentIsCurrent()) return;
        if (!isRuntimeSurfaceHideCurrent(itemId, token, force)) return;
        if (appState.htmlFind.itemId === itemId) await closeActiveHtmlFind();
        if (!cleanupIntentIsCurrent()) return;
        if (!isRuntimeSurfaceHideCurrent(itemId, token, force)) return;
        if (appState.activeRuntimeHostId === itemId) {
          appState.runtimeControlsOverlayLastKey = null;
        }
        await setRuntimeControlsOverlayVisibility(itemId, false);
        if (!cleanupIntentIsCurrent()) return;
        if (!isRuntimeSurfaceHideCurrent(itemId, token, force)) return;
        const previewSession = appState.htmlEditSession;
        if (!options.preservePresentationPreview && previewSession?.itemId === itemId) {
          await invoke("set_html_presentation_preview_visibility_command", { itemId, runtimeSessionId: previewSession.runtimeSessionId, generation: previewSession.generation, previewInstanceId: previewSession.presentation?.previewInstanceId || "", visible: false }).catch(() => false);
        }
        if (!cleanupIntentIsCurrent()) return;
        if (!isRuntimeSurfaceHideCurrent(itemId, token, force)) return;
        await setRuntimeHostVisibility(itemId, false);
        if (cleanupIntentIsCurrent()) appState.runtimeHiddenSurfaceIds.add(itemId);
      }

      async function hideStaleRuntimeHostSync(runId, itemId) {
        if (!appState.runtimeSurfacesSuspended && isRuntimeHostSyncCurrent(runId, itemId)) return false;
        const token = nextRuntimeSurfaceToken(itemId);
        await syncHtmlEditReadonlyPatchSurfaceToken(itemId, token).catch(() => {});
        await hideRuntimeSessionSurfaces(itemId, { force: true, token, recoverLateAttach: true });
        if (appState.activeRuntimeHostId === itemId) {
          appState.activeRuntimeHostId = null;
          appState.runtimeHostLastBoundsKey = null;
        }
        return true;
      }

      async function suspendRuntimeSurfaces() {
        if (appState.runtimeSurfacesSuspended) return appState.runtimeSurfaceSuspendPromise;
        appState.runtimeSurfacesSuspended = true;
        const editSession = appState.htmlEditSession;
        if (isCurrentHtmlEditSession(editSession) && editSession.sectionNavigation) {
          editSession.sectionNavigationEpoch += 1;
          editSession.sectionNavigation.pendingRequestId = null;
          editSession.sectionNavigation.pendingPageId = null;
          renderHtmlEditSectionNavigationRail(editSession);
        }
        const activeRuntimeHostId = appState.activeRuntimeHostId;
        if (activeRuntimeHostId != null) {
          await refreshHtmlRuntimeViewState(activeRuntimeHostId).catch(() => false);
        }
        cleanupRuntimeHostSync();
        appState.activeRuntimeHostId = null;
        appState.runtimeHostLastBoundsKey = null;
        const removeConfirmItemId = appState.htmlRemoveConfirmItemId;
        const removeConfirmClose = removeConfirmItemId == null
          ? Promise.resolve()
          : cancelHtmlRemoveConfirmOverlay(removeConfirmItemId, { restore: false });
        const suspendPromise = Promise.all([removeConfirmClose, ...appState.runtimeSessions.map(async (session) => {
          const token = nextRuntimeSurfaceToken(session.id);
          await syncHtmlEditReadonlyPatchSurfaceToken(session.id, token).catch(() => {});
          await hideRuntimeSessionSurfaces(session.id, { force: true, token, preservePresentationPreview: true });
        })]);
        appState.runtimeSurfaceSuspendPromise = suspendPromise;
        try {
          await suspendPromise;
        } finally {
          if (appState.runtimeSurfaceSuspendPromise === suspendPromise) {
            appState.runtimeSurfaceSuspendPromise = null;
          }
        }
      }

      async function resumeRuntimeSurfaces() {
        if (!appState.runtimeSurfacesSuspended) return;
        appState.runtimeSurfacesSuspended = false;
        const suspendPromise = appState.runtimeSurfaceSuspendPromise;
        if (suspendPromise) {
          try {
            await suspendPromise;
          } catch (_) {
          }
        }
        if (appState.runtimeSurfacesSuspended) return;
        const editSession = appState.htmlEditSession;
        if (isCurrentHtmlEditSession(editSession) && editSession.presentation?.pages?.length) {
          editSession.presentation.previewReady = false;
          delete editSession.presentation.previewBoundsKey;
        }
        scheduleRuntimeHostSync();
        refreshHtmlEditSectionNavigation(editSession);
      }

      async function hideInactiveRuntimeHosts(activeItemId = null, options = {}) {
        if (options.invalidate !== false) cleanupRuntimeHostSync();
        const sessionsToHide = appState.runtimeSessions.filter((session) => activeItemId == null || session.id !== activeItemId);
        await Promise.all(sessionsToHide.map(async (session) => {
          const token = nextRuntimeSurfaceToken(session.id);
          await syncHtmlEditReadonlyPatchSurfaceToken(session.id, token).catch(() => {});
          return hideRuntimeSessionSurfaces(session.id, { token });
        }));
        const activeTab = getActiveTab();
        if (activeItemId == null && activeTab?.preview?.fileType !== "html-runtime") {
          appState.activeRuntimeHostId = null;
          appState.runtimeHostLastBoundsKey = null;
        }
      }

      function runtimeHostBounds(node) {
        const rect = node.getBoundingClientRect();
        return {
          x: Math.round(rect.left),
          y: Math.round(rect.top),
          width: Math.round(rect.width),
          height: Math.round(rect.height)
        };
      }

      function ensureRuntimeHostResizeObserver(mount) {
        if (!mount || typeof ResizeObserver !== "function") return;
        if (appState.runtimeHostResizeObserver && appState.runtimeHostResizeObserverTarget === mount) return;
        if (!appState.runtimeHostResizeObserver) {
          appState.runtimeHostResizeObserver = new ResizeObserver(() => {
            scheduleRuntimeHostSync();
          });
        } else {
          appState.runtimeHostResizeObserver.disconnect();
        }
        appState.runtimeHostResizeObserverTarget = mount;
        appState.runtimeHostResizeObserver.observe(mount);
      }

      function runtimeControlsOverlayHeight() {
        if (appState.runtimeControlsOverlayMode === "tags") return 260;
        if (appState.runtimeControlsOverlayMode === "more") return 180;
        // A1.3：来源徽标 tooltip 展开态（多行完整来源名），须高于 hover 68px 才不会被裁。
        if (appState.runtimeControlsOverlayMode === "badge-tip") return 100;
        if (appState.runtimeControlsOverlayMode === "hover") return 68;
        return 40;
      }

      function runtimeControlsTagWidth(text, fallback = 52) {
        const value = String(text || "").trim();
        if (!value) return 0;
        return Math.min(Math.max(value.length * 7 + 24, fallback), 168);
      }

      function runtimeControlsOverlayBounds(tab, toolbarRect, fallbackBounds) {
        const actionsRect = els.toolbarActions?.getBoundingClientRect();
        const actionRight = actionsRect?.right || toolbarRect?.right || (fallbackBounds.x + fallbackBounds.width);
        const actionWidth = Math.max(actionsRect?.width || 96, 96);
        const toolbarWidth = toolbarRect?.width || window.innerWidth || 1280;
        // 自定义标签优先全量显示（上限 176px，保底 56px ≥ 2 中文字），多标签显示不可收缩 +N
        const customTags = Array.isArray(tab.item?.tags) ? tab.item.tags : [];
        const customPrimaryWidth = customTags.length
          ? Math.min(176, Math.max(56, String(customTags[0].name || "").trim().length * 12 + 24))
          : runtimeControlsTagWidth("+ 标签", 58);
        const customMoreWidth = customTags.length > 1 ? 30 : 0;
        // A1.3：来源徽标只从 sourceBadges 投影；上限 120px ≈ 一个完整英文单词/11 中文字，
        // 不多不少（用户要求展开时至少看清一个单词，而非三四词）。
        const projectBadges = (tab.item?.sourceBadges || []).filter((b) => b && b.kind === "project");
        const skillBadges = (tab.item?.sourceBadges || []).filter((b) => b && b.kind === "skill");
        const badgePrimaryWidth = (badges) => badges.length
          ? Math.min(120, Math.max(40, String(badges[0].label || "").trim().length * 12 + 24))
          : 0;
        const projectWidth = badgePrimaryWidth(projectBadges);
        const skillWidth = badgePrimaryWidth(skillBadges);
        const projectMoreWidth = projectBadges.length > 1 ? 30 : 0;
        const skillMoreWidth = skillBadges.length > 1 ? 30 : 0;
        const typeTagWidth = runtimeControlsTagWidth("HTML", 50);
        const visibleChips = 1 + (customMoreWidth ? 1 : 0) + (projectBadges.length ? 1 : 0) + (projectBadges.length > 1 ? 1 : 0) + (skillBadges.length ? 1 : 0) + (skillBadges.length > 1 ? 1 : 0) + 1;
        const chipGaps = Math.max(0, visibleChips - 1) * 6;
        const islandGap = 8;
        const islandPadding = 2;
        const baseWidth = Math.ceil(customPrimaryWidth + customMoreWidth + projectWidth + projectMoreWidth + skillWidth + skillMoreWidth + typeTagWidth + chipGaps + islandGap + actionWidth + islandPadding);
        // A1.3 第五轮：响应式预算。overlay 宽度 = min(内容自然宽度, 46% 工具栏 + actions)，
        // 与 MD 标签组同一占位比例 → 窗口缩小时 overlay 随工具栏收缩，chip 真正压缩
        // （而非只压路径）；大窗口取自然宽度（徽标 ~120px 一个单词）。
        const responsiveBudget = Math.max(240, Math.round(toolbarWidth * 0.46) + actionWidth);
        const width = appState.runtimeControlsOverlayMode === "tags"
          ? Math.min(Math.max(baseWidth, 300), Math.max(300, responsiveBudget))
          : Math.min(baseWidth, responsiveBudget);
        const right = Math.round(actionRight);
        return {
          x: Math.round(Math.max(0, right - width)),
          y: Math.round(toolbarRect?.top ?? (fallbackBounds.y + 6)),
          width: Math.max(width, 176),
          height: runtimeControlsOverlayHeight()
        };
      }

      function runtimeFullscreenHintOverlayBounds(hostBounds) {
        return {
          x: Math.round(hostBounds.x),
          y: Math.round(hostBounds.y),
          width: Math.max(Math.round(hostBounds.width), 320),
          height: 80
        };
      }

      function runtimeControlsOverlaySyncKey(tab, bounds, isFullscreen) {
        return JSON.stringify({
          itemId: tab.id,
          bounds,
          isFavorite: Boolean(tab.item?.isFavorite),
          isFullscreen: Boolean(isFullscreen),
          isEditing: appState.htmlEditSession?.itemId === tab.id,
          isPrimaryBusy: primaryActionBusyItemId != null,
          customTag: Array.isArray(tab.item?.tags) ? (tab.item.tags[0] ?? null) : null,
          availableTags: appState.tags,
          skillTag: tab.item?.skillBinding?.displayName ?? null,
          typeTag: "HTML",
          customTags: Array.isArray(tab.item?.tags) ? tab.item.tags : [],
          sourceBadges: Array.isArray(tab.item?.sourceBadges) ? tab.item.sourceBadges : [],
          mode: appState.runtimeControlsOverlayMode,
          expanded: appState.runtimeControlsOverlayExpanded
        });
      }

      function isRuntimeHostSyncCurrent(runId, itemId = null) {
        if (runId != null && runId !== appState.runtimeHostSyncRunId) return false;
        if (itemId == null) return true;
        const activeTab = getActiveTab();
        return activeTab?.id === itemId && activeTab.preview?.fileType === "html-runtime";
      }

      async function syncActiveHtmlFindLayoutBounds(tab, runId = null) {
        if (appState.htmlFind.itemId !== tab?.id) return;
        const bounds = htmlFindOverlayBounds();
        const boundsKey = JSON.stringify(bounds);
        if (appState.htmlFindOverlayLastBoundsKey === boundsKey) return;
        const updated = await invoke("set_html_find_overlay_bounds_command", { itemId: tab.id, bounds });
        if (updated === false || !isRuntimeHostSyncCurrent(runId, tab.id) || appState.htmlFind.itemId !== tab.id) return;
        appState.htmlFindOverlayLastBoundsKey = boundsKey;
      }

      async function syncActiveRuntimeHost(runId = null) {
        if (appState.runtimeSurfacesSuspended) return;
        const tab = getActiveTab();
        if (!tab || tab.preview?.fileType !== "html-runtime") {
          appState.runtimeControlsOverlayExpanded = false;
          appState.runtimeControlsOverlayMode = "default";
          if (els.breadcrumbTags) els.breadcrumbTags.style.width = "";
          cleanupRuntimeHostSync();
          hideInactiveRuntimeHosts().catch(() => {});
          return;
        }

        if (!isRuntimeHostSyncCurrent(runId, tab.id)) return;
        if (isHtmlEditBlockingOverlayForItem(tab.id)) {
          nextRuntimeSurfaceToken(tab.id);
          return;
        }
        const needsNewViewStateSurface = appState.activeRuntimeHostId !== tab.id
          || appState.runtimeHiddenSurfaceIds.has(tab.id)
          || !htmlRuntimeViewStateSurfaceToken(tab.id);
        if (needsNewViewStateSurface) nextHtmlRuntimeViewStateSurfaceToken(tab.id);
        await markRuntimeSurfaceActive(tab.id);
        const mount = document.getElementById("runtimeHostMount");
        if (!mount) return;
        let bounds = runtimeHostBounds(mount);
        if (bounds.width < 40 || bounds.height < 40) return;
        const toolbarRect = els.documentToolbar?.getBoundingClientRect();
        if (toolbarRect && toolbarRect.height > 0 && bounds.y < Math.round(toolbarRect.bottom) - 1) {
          const safeTop = Math.round(toolbarRect.bottom);
          const delta = safeTop - bounds.y;
          bounds = {
            ...bounds,
            y: safeTop,
            height: Math.max(40, bounds.height - delta)
          };
        }
        const boundsKey = `${tab.id}:${bounds.x}:${bounds.y}:${bounds.width}:${bounds.height}`;
        const controlsBounds = runtimeControlsOverlayBounds(tab, toolbarRect, bounds);
        // A1.3：HTML 模式主工具栏为 overlay 预留同宽空间（隐藏的 breadcrumbTags 当 spacer），
        // 路径随之 ellipsis 压缩，与 MD 工具栏行为一致，overlay 不再盖住路径文字。
        if (appState.runtimeFullscreenItemId !== tab.id && els.breadcrumbTags) {
          const actionW = Math.max(els.toolbarActions?.getBoundingClientRect()?.width || 96, 96);
          const reserved = Math.max(0, Math.round(controlsBounds.width - actionW));
          els.breadcrumbTags.style.width = reserved > 0 ? `${reserved}px` : "";
        }

        await hideInactiveRuntimeHosts(tab.id, { invalidate: false });
        if (!isRuntimeHostSyncCurrent(runId, tab.id)) return;
        if (appState.activeRuntimeHostId !== tab.id || appState.runtimeHostLastBoundsKey !== boundsKey) {
          appState.runtimeHostLastHeight = Math.round(bounds.height);
          await invoke("attach_html_runtime_host_command", {
            itemId: tab.id,
            bounds,
            viewStateSurfaceToken: htmlRuntimeViewStateSurfaceToken(tab.id),
            viewState: tab.viewState || null
          });
          if (await hideStaleRuntimeHostSync(runId, tab.id)) return;
          appState.runtimeHostLastBoundsKey = boundsKey;
        }
        appState.activeRuntimeHostId = tab.id;
        applyHtmlEditPatchToRuntime(tab.id).catch(() => {});
        const editSession = appState.htmlEditSession;
        if (editSession?.itemId === tab.id && editSession.presentation?.pages?.length) {
          await syncHtmlEditPresentationPreview(editSession, runId);
          if (await hideStaleRuntimeHostSync(runId, tab.id)) return;
        }

        if (appState.runtimeFullscreenItemId === tab.id) {
          const fullscreenControlsBounds = runtimeFullscreenHintOverlayBounds(bounds);
          const fullscreenControlsKey = runtimeControlsOverlaySyncKey(tab, fullscreenControlsBounds, true);
          if (appState.runtimeControlsOverlayLastKey !== fullscreenControlsKey) {
            await invoke("attach_html_runtime_controls_overlay_command", {
              itemId: tab.id,
              bounds: fullscreenControlsBounds,
              isFavorite: Boolean(tab.item?.isFavorite),
              isFullscreen: true,
              isEditing: appState.htmlEditSession?.itemId === tab.id,
              isPrimaryBusy: primaryActionBusyItemId != null,
              customTag: Array.isArray(tab.item?.tags) ? (tab.item.tags[0] ?? null) : null,
              availableTags: appState.tags,
              skillTag: tab.item?.skillBinding?.displayName ?? null,
              typeTag: "HTML",
              customTags: Array.isArray(tab.item?.tags) ? tab.item.tags : [],
              sourceBadges: Array.isArray(tab.item?.sourceBadges) ? tab.item.sourceBadges : []
            });
            if (await hideStaleRuntimeHostSync(runId, tab.id)) return;
            await setRuntimeControlsOverlayVisibility(tab.id, true);
            if (await hideStaleRuntimeHostSync(runId, tab.id)) return;
            appState.runtimeControlsOverlayLastKey = fullscreenControlsKey;
          }
          await syncActiveHtmlFindLayoutBounds(tab, runId);
          if (!isRuntimeHostSyncCurrent(runId, tab.id)) return;
          ensureRuntimeHostResizeObserver(mount);
          return;
        }

        if (!isRuntimeHostSyncCurrent(runId, tab.id)) return;
        const controlsKey = runtimeControlsOverlaySyncKey(tab, controlsBounds, false);
        if (appState.runtimeControlsOverlayLastKey !== controlsKey) {
          await invoke("attach_html_runtime_controls_overlay_command", {
            itemId: tab.id,
            bounds: controlsBounds,
            isFavorite: Boolean(tab.item?.isFavorite),
            isFullscreen: false,
            isEditing: appState.htmlEditSession?.itemId === tab.id,
            isPrimaryBusy: primaryActionBusyItemId != null,
            customTag: Array.isArray(tab.item?.tags) ? (tab.item.tags[0] ?? null) : null,
            availableTags: appState.tags,
            skillTag: tab.item?.skillBinding?.displayName ?? null,
            typeTag: "HTML",
            customTags: Array.isArray(tab.item?.tags) ? tab.item.tags : [],
            sourceBadges: Array.isArray(tab.item?.sourceBadges) ? tab.item.sourceBadges : []
          });
          if (await hideStaleRuntimeHostSync(runId, tab.id)) return;
          await setRuntimeControlsOverlayVisibility(tab.id, true);
          if (await hideStaleRuntimeHostSync(runId, tab.id)) return;
          appState.runtimeControlsOverlayLastKey = controlsKey;
          // Do not create the transparent find child until the user explicitly
          // opens find. Cold-start A/B proved that staging it beneath the host
          // can poison unrelated host/controls backing in the window compositor.
        }

        await syncActiveHtmlFindLayoutBounds(tab, runId);
        if (!isRuntimeHostSyncCurrent(runId, tab.id)) return;
        ensureRuntimeHostResizeObserver(mount);
      }

      function scheduleRuntimeHostSync() {
        if (appState.runtimeSurfacesSuspended) return;
        if (appState.runtimeHostSyncInFlight) {
          appState.runtimeHostSyncPending = true;
          return;
        }
        if (appState.runtimeHostSyncFrame) {
          cancelAnimationFrame(appState.runtimeHostSyncFrame);
        }
        const runId = ++appState.runtimeHostSyncRunId;
        appState.runtimeHostSyncFrame = requestAnimationFrame(() => {
          appState.runtimeHostSyncFrame = null;
          runRuntimeHostSync(runId);
        });
      }

      async function runRuntimeHostSync(runId) {
        if (appState.runtimeHostSyncInFlight) {
          appState.runtimeHostSyncPending = true;
          return;
        }
        appState.runtimeHostSyncInFlight = true;
        try {
          await syncActiveRuntimeHost(runId);
        } catch (_) {
        } finally {
          appState.runtimeHostSyncInFlight = false;
          if (appState.runtimeHostSyncPending) {
            appState.runtimeHostSyncPending = false;
            scheduleRuntimeHostSync();
          }
        }
      }

      async function loadLibraries() {
        try {
          appState.libraries = (await invoke("list_libraries")).map(normalizeLibrary);
          reconcileActiveLibrary();
          renderLibraries();
          renderSettingsPanel();
          await loadIgnoredItems();
          await loadDiscoveredArtifactSkills();
          // 资料库集合可能变化（接入/删除/repair），同步全部有效来源的 watcher。
          // 幂等：后端只为缺失的 library 建立监听并安排一次后台 catch-up scan。
          await ensureWatcher();
        } catch (error) {
          setStatus(`加载资料库失败：${normalizeError(error)}`, "error");
        }
      }

      function reconcileActiveLibrary() {
        const activeLibrary = appState.libraries.find((library) => library.id === appState.activeLibraryId);
        if (activeLibrary && activeLibrary.pathState !== "missing") return;
        appState.activeLibraryId = appState.libraries.find((library) => library.pathState !== "missing")?.id ?? null;
      }

      async function loadItems(options = {}) {
        const { skipFilesystemSync = false } = options;
        const searchEpoch = ++appState.searchEpoch;
        appState.thumbnailQueueRunId += 1;
        appState.thumbnailQueueActive = false;
        if (!appState.libraries.length) {
          appState.items = [];
          renderItems();
          return true;
        }

        try {
          if (!skipFilesystemSync) {
            await maybeSyncFilesystemState();
          }
          const sortConfig = currentSortConfig();
          const libraryId = appState.browseMode === "all" || appState.browseMode === "recent" || appState.browseMode === "starred"
            ? undefined
            : appState.activeLibraryId;
          const result = await invoke("list_items", {
            libraryId,
            browseMode: appState.browseMode,
            keyword: getSearchKeyword() || undefined,
            fileTypes: getFileTypeFilter() ? [getFileTypeFilter()] : undefined,
            tagIds: appState.activeTagFilterIds.length ? appState.activeTagFilterIds : undefined,
            page: 1,
            pageSize: 100,
            sortBy: sortConfig.sortBy,
            sortOrder: sortConfig.sortOrder
          });
          // 过期请求：一个更新的请求已经发起。不渲染、不报错，返回 "stale"
          // 让调用方知道这不是失败，而是被取代——绝不能触发回滚。
          if (searchEpoch !== appState.searchEpoch) return "stale";
          appState.items = sortItemsInPlace((result.items || []).map(normalizeItemSummary));
          renderItems();
          // A1.1-PERF：忽略列表只在设置区打开或真实状态变化时刷新（loadLibraries/恢复操作已覆盖），
          // 不在首页每 2.5s 无条件调用 loadIgnoredItems。
          ensureDocumentThumbnails(appState.items);
          return true;
        } catch (error) {
          if (searchEpoch !== appState.searchEpoch) return "stale";
          setStatus(statusError("status.listLoadFailedPrefix", error), "error");
          return false;
        }
      }

      async function maybeSyncFilesystemState(force = false) {
        if (!appState.isTauri) return null;
        const now = Date.now();
        if (!force && appState.filesystemSyncInFlight) {
          return appState.filesystemSyncInFlight;
        }
        if (!force && now - appState.lastFilesystemSyncAt < 5000) {
          return null;
        }
        const task = invoke("sync_filesystem_state")
          .then(async (result) => {
            appState.lastFilesystemSyncAt = Date.now();
            const missing = Number(result?.missingItemsMarkedMissing ?? 0);
            const restored = Number(result?.restoredItemsMarkedValid ?? 0);
            const purged = Number(result?.missingIgnoredItemsPurged ?? 0);
            const missingSources = Number(result?.missingLibrariesMarkedMissing ?? 0);
            const restoredSources = Number(result?.restoredLibrariesMarkedValid ?? 0);
            if (missingSources > 0 || restoredSources > 0) {
              await refreshLibrariesAfterFilesystemSync();
            }
            if (missing > 0 || restored > 0 || purged > 0 || missingSources > 0 || restoredSources > 0) {
              const sourceText = missingSources > 0
                ? `${t("status.filesystemSyncedSourcePrefix")}${missingSources}${t("status.filesystemSyncedSourceSuffix")}`
                : "";
              const restoredText = restored > 0 || restoredSources > 0
                ? `，恢复 ${restored + restoredSources} 条路径`
                : "";
              setStatus(`${t("status.filesystemSyncedPrefix")}${missing}${t("status.filesystemSyncedMiddle")}${purged}${t("status.filesystemSyncedSuffix")}${sourceText}${restoredText}`, "ok");
            }
            return result;
          })
          .catch((error) => {
            setStatus(statusError("status.filesystemSyncFailedPrefix", error), "warn");
            return null;
          })
          .finally(() => {
            appState.filesystemSyncInFlight = null;
          });

        appState.filesystemSyncInFlight = task;
        return task;
      }

          if (isItemPathMissing(detail) || isLibraryPathMissing(detail.libraryId)) {

      async function rebuildThumbnailsForItems(items, options) {
        const { onProgress } = options || {};
        // B4：用户主动重建使用**强制目标**——所有支持的、路径有效的 Markdown/HTML
        // 都重建，已 ready 的官方封面也重新生成（不再只处理 thumbnailNeedsGeneration）。
        // 引擎不可用时 HTML 项跳过并计入 skippedHtml，Markdown 仍全量重建。
        const { targets: thumbnailItems, skippedHtml } = thumbnailForceRebuildTargets(items);
        if (!thumbnailItems.length) {
          if (skippedHtml > 0) {
            setStatus(t("status.thumbnailEngineUnavailableMarkdownOk"), "warn");
            openSettingsTab("thumbnails");
            return { total: 0, completed: 0, failed: 0, canceled: 0, skipped: skippedHtml, reason: "engine-disabled", lastError: null };
          }
          setStatus(t("status.thumbnailNoDocuments"), "warn");
          return { total: 0, completed: 0, failed: 0, canceled: 0, skipped: 0, reason: "no-documents", lastError: null };
        }

        // 独占固定 runId（阻塞 5 修正）：手动重建与自动刷新互斥，谁后启动谁接管。
        // 期间 runId 被其他操作（自动刷新 / 设置切换）修改时，本循环必须停止，
        // 被取消的项不得计入 completed，也不得显示"成功 N/M"。
        const runId = ++appState.thumbnailQueueRunId;
        appState.thumbnailQueueActive = true;
        let completed = 0;
        let failed = 0;
        let canceled = 0;
        let lastError = null;
        setStatus(thumbnailProgressMessage(0, thumbnailItems.length, t("status.thumbnailRebuildMode")), "warn");
        onProgress?.({ completed, failed, canceled, total: thumbnailItems.length });
        for (const item of thumbnailItems) {
          if (runId !== appState.thumbnailQueueRunId) { canceled += 1; break; }
          // 先等待被本 run 取消的旧 owner 释放 slot，再由手动操作占用；不能直接
          // continue，否则该 item 会成为未计数漏项并可能显示绿色“成功 N/M”。
          if (!(await waitForThumbnailSlot(item.id, runId))) { canceled += 1; break; }
          appState.pendingThumbnailIds.add(item.id);
          try {
            await delay(80);
            // B1：旧响应不得覆盖新 generation；晚到被丢弃时按 expectedKey 持续收敛。
            // 只有 { ok: true } 计入 completed；canceled / failed / terminal / error 不计入。
            const outcome = await generateThumbnailOnce(item, runId);
            if (runId !== appState.thumbnailQueueRunId) { canceled += 1; break; }
            if (!outcome.ok) {
              if (outcome.reason === "canceled") { canceled += 1; break; }
              failed += 1;
              lastError = outcome.error ?? new Error(outcome.reason || "thumbnail generation failed");
              renderItems();
              const processed = completed + failed;
              const progressMessage = thumbnailProgressMessage(processed, thumbnailItems.length, t("status.thumbnailRebuildMode"));
              setStatus(progressMessage, failed ? "error" : "warn");
              onProgress?.({ completed, failed, canceled, total: thumbnailItems.length, lastError });
              continue;
            }
            completed += 1;
            renderItems();
          } catch (error) {
            failed += 1;
            lastError = error;
          } finally {
            appState.pendingThumbnailIds.delete(item.id);
          }
          const processed = completed + failed;
          const progressMessage = thumbnailProgressMessage(processed, thumbnailItems.length, t("status.thumbnailRebuildMode"));
          setStatus(progressMessage, failed ? "error" : "warn");
          onProgress?.({ completed, failed, canceled, total: thumbnailItems.length, lastError });
        }

        if (runId === appState.thumbnailQueueRunId) {
          // 只有自己仍是当前队列时才释放 active 标志；被接管（取消）时不动。
          appState.thumbnailQueueActive = false;
        }
        renderItems();
        renderSettingsPanel();
        const reason = canceled > 0 ? "canceled" : null;
        return { total: thumbnailItems.length, completed, failed, canceled, skipped: skippedHtml, reason, lastError };
      }

      async function rebuildVisibleHtmlThumbnails() {
        return runThumbnailSettingsOperation("visible", async () => {
          setThumbnailSettingsFeedback(thumbnailProgressMessage(0, appState.items.filter(supportsGeneratedThumbnail).length, t("status.thumbnailRebuildMode")), "info");
          try {
            const result = await rebuildThumbnailsForItems(appState.items, {
              onProgress: ({ completed, failed, total }) => {
                setThumbnailSettingsFeedback(thumbnailProgressMessage(completed + failed, total, t("status.thumbnailRebuildMode")), failed ? "error" : "info");

        captureActiveMarkdownScroll();
        captureActiveMarkdownDraft();
        const session = await invoke("open_html_window", { itemId: detail.id });
        if (!isCurrentItemOpenToken(detail.id, openToken, navigationEpoch)) {
          // A newer intent for the same item owns the shared runtime session;
          // an older completion must not close it underneath the new owner.
          if (appState.itemOpenTokens.get(detail.id) === openToken) {
            try {
              await invoke("close_html_window", { itemId: detail.id });
            } catch (_) {
            }
          }
          return;

        const tabItem = item || normalizeItemSummary(detail);
        const existing = appState.runtimeSessions.find((tab) => tab.id === detail.id);
        const preview = {
          fileType: "html-runtime",
          itemId: detail.id,
          title: session.title || detail.fileName || item?.fileName,
          runtimeUrl: session.runtimeUrl,
          label: session.label,
          detached: session.detached !== false
        };

        if (existing) {
          existing.item = tabItem;
          existing.detail = detail;
          existing.preview = preview;
        } else {
          appState.runtimeSessions.push({
            id: detail.id,
            item: tabItem,
            detail,
            preview,
            draft: "",
            viewState: null
          });

        appState.activeTabId = detail.id;

      async function openItem(itemId) {
        const previousTabId = appState.activeTabId;
        if (previousTabId !== itemId && !(await confirmHtmlEditLeaveIfNeeded(previousTabId))) return;
        const navigationEpoch = nextRuntimeNavigationEpoch();
        const openToken = nextItemOpenToken(itemId);
        try {
          const item = appState.items.find((entry) => entry.id === itemId);
          if (!(await ensureItemStillAvailable(itemId, item))) {
            return;
          }
          if (!isCurrentItemOpenToken(itemId, openToken, navigationEpoch)) return;
          if (previousTabId !== itemId) {
            cleanupRuntimeHostSync();
            if (!(await convergeInactiveRuntimeSurfaces(null, navigationEpoch))) return;
          }
          if (!isCurrentItemOpenToken(itemId, openToken, navigationEpoch)) return;
          if (item?.fileType === "markdown") {
            openMarkdownLoadingTab(itemId, item);
          }
          if (!isCurrentItemOpenToken(itemId, openToken, navigationEpoch)) return;
          try {
            await invoke("mark_item_opened", { itemId });
          } catch (_) {
          }
          if (!isCurrentItemOpenToken(itemId, openToken, navigationEpoch)) return;
          const detail = normalizeItemDetail(await invoke("get_item_detail", { itemId }));
          if (!isCurrentItemOpenToken(itemId, openToken, navigationEpoch)) return;

          await openArtifactRuntime(itemId, item, detail, openToken, navigationEpoch);
        } catch (error) {
          if (!isCurrentItemOpenToken(itemId, openToken, navigationEpoch)) return;
          const loadingTab = getOpenTab(itemId);
          if (loadingTab?.preview?.fileType === "markdown-loading") {
            appState.tabs = appState.tabs.filter((tab) => tab.id !== itemId);
            if (appState.activeTabId === itemId) {
              appState.activeTabId = getOpenTabs()[getOpenTabs().length - 1]?.id ?? null;
            }
            renderTabs();
            renderViewer();
          }
          if (isMissingIndexedItemError(error)) {
            const item = appState.items.find((entry) => entry.id === itemId) || getOpenTab(itemId)?.item;
            await refreshInvalidIndexedItemState(itemId, item);
            return;
          }
          setStatus(statusError("status.openFileFailedPrefix", error), "error");
        }
      }

      // 统一的"从 Nutbook 移除"用户动作入口（主页面 / 卡片来源使用主 DOM 可访问
      // 确认；HTML runtime 来源由宿主 overlay 自行确认后回调 executeRemoveItem）。
      // 先确认是否移除，再进入未保存裁决，最后才修改索引。
      async function requestRemoveItemFromNutbook(itemId) {
        const item = appState.items.find((entry) => entry.id === itemId) || getOpenTab(itemId)?.item;
        const fileName = item?.fileName || t("removeConfirm.thisFile");
        const confirmed = await appConfirm({
          title: formatTranslation("removeConfirm.title", { name: fileName }),
          message: t("removeConfirm.message"),
          detail: item?.path || item?.sourcePath || "",
          confirmText: t("actions.confirmRemove"),
          cancelText: t("actions.cancel"),
          danger: false
        });
        if (!confirmed) return;
        await executeRemoveItem(itemId);
      }

      // 真正执行索引移除：必须先成功关闭 tab（含未保存裁决），再修改索引。
      // 打开且有未保存修改的文档，关闭失败（继续编辑 / 保存失败）即取消移除。
      const pendingRemoveItemIds = new Set();
      async function executeRemoveItem(itemId) {
        if (pendingRemoveItemIds.has(itemId)) return;
        pendingRemoveItemIds.add(itemId);
        const item = appState.items.find((entry) => entry.id === itemId) || getOpenTab(itemId)?.item;
        const fileName = item?.fileName || t("removeConfirm.thisFile");
        try {
          setStatus(statusWithValue("status.itemRemovingPrefix", fileName), "warn");
          // 先收敛并关闭：dirty Markdown 进入未保存裁决，HTML 进入退出协调器；
          // 返回 false（继续编辑 / 失败）即终止移除，保留可恢复界面。
          const closed = await closeOpenTab(itemId);
          if (!closed) {
            setStatus(formatTranslation("removeConfirm.cancelled", { name: fileName }), "warn");
            return;
          }
          // 关闭成功后，再修改索引。
          await maybeSyncFilesystemState(true);
          await invoke("remove_item_from_nutbook", { itemId });
          await loadLibraries();
          await loadItems();
          if (appState.agentDiscoveryPayload) {
            await loadAgentProjectsInSettings();
          }
          renderItems();
          renderTabs();
          renderViewer();
          setStatus(statusWithValue("status.itemRemovedPrefix", fileName), "ok");
          showToast(t("removeConfirm.removedToast"));
        } catch (error) {
          if (isMissingIndexedItemError(error)) {
            await refreshInvalidIndexedItemState(itemId, item, { fileName });
            return;
          }
          setStatus(statusError("status.removeFailedPrefix", error), "error");
          showToast(t("removeConfirm.failedToast"));
        } finally {
          pendingRemoveItemIds.delete(itemId);
        }
      }

      async function ensureWatcher() {
        // 多资料库监听：所有有效 folder/file 来源由后端统一启动 watcher，
        // 并安排后台 catch-up scan 覆盖启动前/监听建立前的磁盘变更。
        // 幂等调用；单个来源失败由后端记录 warning，不阻断其他来源。
        if (!appState.isTauri) return;
        try {
          await invoke("sync_library_watchers");
        } catch (error) {
          setStatus(`同步文件监听失败：${normalizeError(error)}`, "warn");
        }
      }

      // A1.1-PERF：自动刷新 single-flight。
      // - 任意时刻最多一个自动 loadItems（in-flight guard）
      // - 一轮完成后再 setTimeout 安排下一轮；期间触发的刷新合并为一次 pending
      // - 页面隐藏 / 设置页 / 文档阅读页 / 无活动库时暂停
      // - 用户主动搜索/筛选请求是新 searchEpoch，自动刷新在途请求返回 stale 被静默忽略，
      //   自动刷新永远不会把用户请求标成 stale
      function startAutoRefresh() {
        if (!appState.isTauri || appState.refreshTimer) return;
        const REFRESH_INTERVAL_MS = 2500;
        let refreshInFlight = false;
        let refreshPending = false;
        let refreshTimerHandle = null;

        const autoRefreshShouldRun = () => {
          if (!appState.activeLibraryId) return false;
          if (document.hidden) return false;
          if (appState.isSettingsOpen) return false;
          if (!appState.homeTabOpen || getActiveTab()) return false;
          return true;
        };

        const runAutoRefresh = async () => {
          if (refreshInFlight) {
            refreshPending = true;
            return;
          }
          refreshInFlight = true;
          try {
            await loadItems();
          } finally {
            refreshInFlight = false;
            if (refreshPending) {
              refreshPending = false;
              scheduleAutoRefreshTick(0);
            } else {
              scheduleAutoRefreshTick(REFRESH_INTERVAL_MS);
            }
          }
        };

        const scheduleAutoRefreshTick = (delayMs) => {
          window.clearTimeout(refreshTimerHandle);
          refreshTimerHandle = window.setTimeout(() => {
            if (!autoRefreshShouldRun()) {
              // 暂停中：延后重查，不堆积任务
              scheduleAutoRefreshTick(REFRESH_INTERVAL_MS);
              return;
            }
            runAutoRefresh();
          }, delayMs);
        };

        appState.refreshTimer = { schedule: scheduleAutoRefreshTick };
        // 自动化合同钩子：触发一轮自动刷新（single-flight guard 内），无日志无 IPC
        window.__nutbookAutoRefresh = {
          trigger: runAutoRefresh,
          stop: () => {
            window.clearTimeout(refreshTimerHandle);
            appState.refreshTimer = null;
          },
          get state() {
            return { inFlight: refreshInFlight, pending: refreshPending };
          }
        };
        scheduleAutoRefreshTick(REFRESH_INTERVAL_MS);
      }

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || data.type !== "nutbook-html-command") return;
        setStatus(`收到 HTML 命令：${data.command}`, "warn");

        if (data.command === "fullscreen") {

          if (frame?.requestFullscreen) {
            frame.requestFullscreen()
              .then(() => setStatus("已请求 HTML 全屏", "ok"))
              .catch(() => setStatus("HTML 全屏请求失败", "error"));
          }

        if (data.command === "presenter") {

            setStatus(popup ? "已尝试打开 HTML 演讲者窗口" : "HTML 演讲者窗口被拦截", popup ? "ok" : "error");
          }
        }
      });

      window.addEventListener("keydown", (event) => {
        if (event.isComposing || event.key === "Process") return;
        const tab = getActiveTab();
        const isMarkdownEditorKeyEvent = Boolean(event.target?.closest?.(".milkdown-editor-root .ProseMirror"));
        if ((event.metaKey || event.ctrlKey) && !event.altKey && event.key.toLowerCase() === "s") {
          if (tab?.preview?.fileType === "markdown") {
            event.preventDefault();
            saveActiveMarkdown();
            return;
          }
        }
        if (isMarkdownEditorKeyEvent) return;
        const altKeyChanged = appState.altKeyPressed !== event.altKey;
        appState.altKeyPressed = event.altKey;
        viewerToolbarState();
        if (altKeyChanged && appState.homeTabOpen && !getActiveTab()) {
          renderItems();
        }
        if ((event.key === "x" || event.key === "X") && event.altKey && !event.metaKey && !event.ctrlKey) {
          const tag = document.activeElement?.tagName;
          if (tag !== "INPUT" && tag !== "TEXTAREA") {
            event.preventDefault();
            moveActiveItemToTrash().catch(() => {});
            return;
          }
        }
        if (event.key === "Escape" && appState.runtimeFullscreenItemId != null) {
          event.preventDefault();
          const exitingRuntimeId = appState.runtimeFullscreenItemId;
          clearHostFocus();
          if (appState.isTauri) {
            invoke("set_window_fullscreen_command", { fullscreen: false })
              .then(() => {
                setRuntimeFullscreenState(exitingRuntimeId, false);
                refocusActiveRuntimeHost(exitingRuntimeId);
              });
          } else {
            setRuntimeFullscreenState(exitingRuntimeId, false);
          }
          return;
        }
        if (!tab || (tab.preview?.fileType !== "html" && tab.preview?.fileType !== "html-runtime")) return;
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        if (tab.preview?.fileType === "html-runtime" && appState.htmlEditSession?.itemId === tab.id) {
          const session = appState.htmlEditSession;
          const hostEditable = Boolean(event.target?.closest?.("input, textarea, select, [contenteditable='true']"));
          if (!hostEditable && (event.key === "ArrowUp" || event.key === "ArrowDown") && session.presentation?.pageIds?.length) {
            event.preventDefault();
            const currentIndex = session.presentation.pageIds.indexOf(session.presentation.activePageId);
            const pageId = session.presentation.pageIds[currentIndex + (event.key === "ArrowUp" ? -1 : 1)];
            if (pageId && !event.repeat) selectHtmlEditPresentationPage(session, pageId);
          }
          return;
        }
        if (tab.preview?.fileType === "html-runtime") {
          if (HOST_FORWARDED_RUNTIME_KEYS.has(event.key) || (event.code === "Space" && event.key === " ")) {
            event.preventDefault();
            forwardRuntimeShortcut(tab.id, event.key);
            return;
          }

          if (event.key === "f" || event.key === "F") {
            event.preventDefault();
            clearHostFocus();
            const nextEnabled = appState.runtimeFullscreenItemId !== tab.id;
            if (appState.isTauri) {
              invoke("set_window_fullscreen_command", { fullscreen: nextEnabled })
                .then(async () => {
                  setRuntimeFullscreenState(tab.id, nextEnabled);
                  await refocusActiveRuntimeHost(tab.id);
                  setStatus(nextEnabled ? t("status.hostFullscreenEntered") : t("status.hostFullscreenExited"), "ok");
                })
                .catch(() => setStatus(t("status.hostFullscreenFailed"), "error"))
              ;
            } else {
              setRuntimeFullscreenState(tab.id, nextEnabled);
            }
            return;
          }

          if (event.key === "s" || event.key === "S") {
            event.preventDefault();
            clearHostFocus();
            if (appState.isTauri) {
              forwardRuntimeShortcut(tab.id, "s", "宿主已转发 S 命令");
            } else {
              const popup = window.open(appState.activeHtmlRuntimeUrl, "nutbook-html-preview", "width=1280,height=820");
              setStatus(popup ? "宿主已处理 S 弹窗" : "宿主 S 弹窗失败", popup ? "ok" : "error");
            }
            return;
          }
        }
        const tag = document.activeElement?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;

        if (event.key === "f" || event.key === "F") {
          const frame = document.querySelector(".html-frame");
          if (frame?.requestFullscreen) {
            event.preventDefault();
            frame.requestFullscreen()
              .then(() => setStatus(t("status.hostFullscreenEntered"), "ok"))
              .catch(() => setStatus(t("status.hostFullscreenFailed"), "error"));
          }
        }

        if (event.key === "s" || event.key === "S") {
          if (appState.activeHtmlRuntimeUrl) {
            event.preventDefault();
            const popup = window.open(appState.activeHtmlRuntimeUrl, "nutbook-html-preview", "width=1280,height=820");
            setStatus(popup ? "宿主已处理 S 弹窗" : "宿主 S 弹窗失败", popup ? "ok" : "error");
          }
        }
      });

      async function saveMarkdownTab(tab, { renderAfter = true } = {}) {
        if (!tab || tab.preview?.fileType !== "markdown") return false;

        const content = markdownContentForTab(tab);
        tab.draft = content;

        try {
          setStatus(t("markdown.saving"), "warn");
          const expectedFileHash = tab.detail.fileHash || await sha256Hex(tab.preview.raw || "");
          await invoke("save_markdown_content", {
            itemId: tab.id,
            content,
            expectedFileHash,
            expectedModifiedAt: tab.detail.modifiedAt || tab.item.modifiedAt
          });

          const [freshDetailRaw, freshPreviewRaw] = await Promise.all([
            invoke("get_item_detail", { itemId: tab.id }),
            invoke("get_item_preview", { itemId: tab.id })
          ]);
          const freshDetail = normalizeItemDetail(freshDetailRaw);
          const freshPreview = normalizePreview(freshPreviewRaw);

          tab.detail = freshDetail;
          tab.preview = freshPreview;
          tab.draft = freshPreview?.raw || content;
          tab.markdownBaseline = tab.draft;
          tab.isDirty = false;
          tab.item = normalizeItemSummary(freshDetail);
          // durable save 成功后首页持久 item 状态必须收敛，无论 renderAfter
          // true/false（save-and-close / 关闭全部标签后 appState.items 不得
          // 仍是旧标题——P1）。loadItems 只调用一次（B3 复审 P2 已删除重复）。
          await loadItems();
          // PR C / C2：保存成功后本次 staged cover lease 转为 committed 语义——
          // 释放 lease（被最终 Markdown 引用的 staged 文件保留，未引用的清理）。
          if (typeof releaseMarkdownCoverLeaseForTab === "function") {
            releaseMarkdownCoverLeaseForTab(tab, tab.coverOperationGeneration, { quiet: true });
          }
          const refreshedListItem = appState.items.find((entry) => entry.id === tab.id);
          if (refreshedListItem) {
            tab.item = refreshedListItem;
          }
          if (renderAfter) {
            // 保存后只刷新 preview/input/meta 等局部元素，绝不重建整个
            // viewer（重建会销毁 milkdownEditorRoot，导致 PM history 全部
            // 丢失，用户无法 ⌘Z/⇧⌘Z 撤销保存前的修改——B3 GUI 验收）。
            // 刷新预览 HTML、标题输入框与修改时间。
            const titleInput = document.getElementById("markdownTitleInput");
            if (titleInput && freshPreview) {
              setTitleInputValue(
                titleInput,
                markdownDocumentTitle(
                  tab.draft ?? freshPreview.raw ?? "",
                  freshPreview.title || tab.item.fileName
                )
              );
            }
            const metaEl = els.viewerBody?.querySelector?.(".content-meta");
            if (metaEl) {
              const ts = freshDetail?.modifiedAt || tab.item?.modifiedAt || "";
              metaEl.textContent = `修改时间：${formatTimestamp(ts)} · 修改后按 ⌘S 保存`;
            }
            const previewEl = els.viewerBody?.querySelector?.(".markdown-preview");
            if (previewEl && freshPreview?.html != null) {
              previewEl.innerHTML = freshPreview.html;
            }
            renderTabs();
            setStatus(markdownSavedStatus(tab.item.fileName), "ok");
            showToast("保存成功");
          }
          return true;
        } catch (error) {
          const conflict = markdownSaveConflict(error);
          setStatus(markdownSaveErrorStatus(error), "error");
          showToast(conflict ? t("markdown.saveConflictToast") : t("markdown.saveFailed"));
          return false;
        }
      }

      function deriveRootPathFromFiles(files) {
        const [first] = files;
        if (!first) return null;
        const absolutePath = first.path || first.webkitRelativePath || "";
        const relativePath = first.webkitRelativePath || "";
        if (absolutePath && relativePath && absolutePath.endsWith(relativePath)) {
          return absolutePath.slice(0, absolutePath.length - relativePath.length).replace(/\/$/, "");
        }
        if (absolutePath && !relativePath) {
          return absolutePath.replace(/\/[^/]+$/, "");
        }
        return null;
      }

      function parentDirectoryOf(path) {
        if (!path || !path.includes("/")) return null;
        return path.replace(/\/[^/]+$/, "") || "/";
      }
