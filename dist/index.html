      async function handleNativeEditHistory(action) {
        const htmlSession = appState.htmlEditSession;
        if (htmlSession) {
          try {
            // This enters the child WebView through the host runtime shortcut
            // command. `window.eval` on the main WebView is not a reliable
            // forwarding boundary for a native macOS accelerator.
            return Boolean(await invoke("dispatch_html_runtime_shortcut_command", {
              itemId: htmlSession.itemId,
              key: action === "redo" ? "CmdOrCtrl+Shift+Z" : "CmdOrCtrl+Z"
            }));
          } catch (_) {
            return false;
          }
        }
        const active = document.activeElement;
        const tag = active?.tagName;
        const isFormField = tag === "INPUT" || tag === "TEXTAREA" || active?.isContentEditable;
        const tab = getActiveTab();
        const markdownEditor = appState.activeMarkdownEditor;
        const isMarkdownTab =
          tab?.preview?.fileType === "markdown" &&
          markdownEditor &&
          tab.id === appState.activeMarkdownEditorTabId;
        if (isMarkdownTab) {
          const titleInput = document.getElementById("markdownTitleInput");
          // 1. 焦点在标题输入框且标题尚未提交（未 Enter/blur）：undo/redo
          //    只作用于标题输入框自身的文本 history，不触碰 ProseMirror。
          //    使用自维护的按 input 事件粒度的快照栈（WKWebView 的原生
          //    undo 会把整个输入会话合并成一个单元——输入 abc 后 ⌘Z 一次
          //    删光三个字母；自维护栈保证逐字符回退），逐字符撤销/重做。
          if (active === titleInput) {
            return action === "redo" ? redoMarkdownTitleInput() : undoMarkdownTitleInput();
          }
          // 2. 焦点在 ProseMirror contenteditable：只使用 PM history。
          if (active?.isContentEditable && active.closest?.(".milkdown-editor-root")) {
            const handled = action === "redo"
              ? markdownEditor.redo?.()
              : markdownEditor.undo?.();
            if (handled) {
              // PM undo/redo 成功：立即把顶部标题输入框同步到新文档标题。
              // 无有效 H1 时 getDocumentTitle() 返回 null，此时显示文件名
              // fallback（B3 复审 P1：undo 删除插入的 H1 后输入框恢复文件名）。
              const currentTitle = markdownEditor.getDocumentTitle?.();
              const display = currentTitle || tab.item?.fileName || "Markdown";
              if (titleInput && titleInput.value !== display) {
                setTitleInputValue(titleInput, display);
              }
              return true;
            }
            // PM undo/redo 栈为空：绝不 fallback 到 document.execCommand。
            // WKWebView 会重放 contenteditable 原生 undo/redo 快照，与 PM
            // state 脱节，导致标题/正文 DOM 重复（"连按 ⇧⌘Z 出现两个标题"）。
            return false;
          }
        }
        if (isFormField) {
          try {
            return document.execCommand(action === "redo" ? "redo" : "undo");
          } catch (_) {
            return false;
          }
        }
        return false;
      }

      async function handleNativeMenuAction(action) {
        try {
          if (action === "undo" || action === "redo") {
            if (!(await handleNativeEditHistory(action))) {
              setStatus(action === "undo" ? "当前没有可撤销的编辑" : "当前没有可重做的编辑", "warn");
            }
            return;
          }
          if (action === "add-folder") {
            await addFolderFromMenu();
            return;
          }
          if (action === "add-file") {
            await addSingleFileFromMenu();
            return;
          }
          if (action === "scan-skills") {
            openSettingsTab("skills");
            await loadDiscoveredArtifactSkills();
            setStatus("已打开 Skill 产物扫描", "ok");
            return;
          }
          if (action === "rescan-library") {
            if (!appState.activeLibraryId) {
              setStatus("当前没有选中的资料库", "warn");
              return;
            }
            await scanLibrary();
            return;
          }
          if (action === "toggle-sidebar") {
            setSidebarCollapsed(!appState.isSidebarCollapsed);
            return;
          }
          if (action === "show-all") {
            await handleBrowseModeChange("all");
            return;
          }
          if (action === "show-recent") {
            await handleBrowseModeChange("recent");
            return;
          }
          if (action === "show-starred") {
            await handleBrowseModeChange("starred");
            return;
          }
          if (action === "toggle-outline") {
            updateMarkdownPreference("outlineEnabled", !Boolean(appState.markdownPreferences.outlineEnabled));
            return;
          }
        } catch (error) {
          setStatus(`菜单操作失败：${normalizeError(error)}`, "error");
        }
      }

      window.__NUTBOOK_NATIVE_MENU__ = handleNativeMenuAction;

      function toggleHomeLayout() {
        if (!appState.items.length && appState.homeLayout !== "inspector") {
          setStatus(t("status.noFilesAddFirst"), "warn");
          return;
        }
        const previousLayout = appState.homeLayout;
        appState.homeLayout = previousLayout === "grid" ? "inspector" : "grid";
        saveHomeLayoutPreference();
        applyHomeLayout();
        if (appState.homeLayout === "inspector") {
          setStatus(t("status.inspectorView"), "ok");
          // 渲染列表头/行；revalidateInspectorSelection 会自动选中第一条可见结果
          // （无选择或选择因筛选消失时同规则）。
          renderInspectorItems();
        } else {
          setStatus(t("status.gridView"), "ok");
        }
      }

      // 首页视图与检查分栏只保存用户显式选择；localStorage 不可用或旧值无效时
      // 安全回落默认卡片视图 / 40:60，不把偏好故障扩散到首页渲染。
      function loadHomeLayoutPreference() {
        try {
          const value = window.localStorage?.getItem("nutbook.homeLayout");
          return value === "inspector" || value === "grid" ? value : "grid";
        } catch (_) {
          return "grid";
        }
      }

      function saveHomeLayoutPreference() {
        try {
          window.localStorage?.setItem("nutbook.homeLayout", appState.homeLayout === "inspector" ? "inspector" : "grid");
        } catch (_) {
        }
      }

      function loadInspectorSplitRatioPreference() {
        try {
          const value = Number(window.localStorage?.getItem("nutbook.inspector.splitRatio"));
          return Number.isFinite(value) && value >= 0 && value <= 1 ? value : 0.6;
        } catch (_) {
          return 0.6;
        }
      }

      function saveInspectorSplitRatioPreference() {
        try {
          const ratio = Number(appState.inspector.splitRatio);
          if (Number.isFinite(ratio)) {
            window.localStorage?.setItem("nutbook.inspector.splitRatio", String(Math.min(1, Math.max(0, ratio))));
          }
        } catch (_) {
        }
      }

      // ── 检查视图（inspector view）──────────────────────────────────────
      // 左栏固定属性列表（名称/类型/来源/修改时间，排序不持久化）+ 右栏统一
      // 首屏视觉预览。Markdown 用与正式打开页同一 Milkdown bundle 的只读
      // inspector；HTML 只消费已合并基线的 revision-aware 卡片截图状态。
      // 所有可能晚到的异步结果同时受 selection token 与 snapshot revision 双重保护。

      function isInspectorActive() {
        return appState.homeLayout === "inspector"
          && Boolean(els.inspectorShell)
          && !els.inspectorShell.hidden
          && els.mainShell.classList.contains("home-mode");
      }

      function isInspectorSelectionCurrent(itemId, token) {
        return isInspectorActive()
          && appState.inspector.selectedItemId === itemId
          && appState.inspector.selectionToken === token;
      }

      // 来源列只表达 project / skill 来源徽标；用户标签不再混入。
      // 无任何来源的本地文件回落为「本地」。
      function inspectorSourceBadges(item) {
        return (item.sourceBadges || []).map((badge) => badge.label).filter(Boolean);
      }

      function inspectorSourceLabel(item) {
        return inspectorSourceBadges(item).join("，") || t("inspector.sourceLocal");
      }

      function inspectorModifiedTimeValue(item) {
        const [secs, nanos = "0"] = String(item?.modifiedAt || "0").split(".");
        return Number(`${Number(secs) || 0}.${nanos}`);
      }

      function inspectorSortedItems() {
        const sortKey = appState.inspector.sortKey;
        const direction = appState.inspector.sortDir === "asc" ? 1 : -1;
        const sortValue = (item) => {
          switch (sortKey) {
            case "fileName":
              return (item.fileName || "").toLowerCase();
            case "fileType":
              return item.fileType === "html" ? "html" : "markdown";
            case "source":
              return inspectorSourceLabel(item).toLowerCase();
            case "modifiedAt":
            default:
              return inspectorModifiedTimeValue(item);
          }
        };
        return [...appState.items].sort((a, b) => {
          const valueA = sortValue(a);
          const valueB = sortValue(b);
          if (valueA < valueB) return -direction;
          if (valueA > valueB) return direction;
          return a.id - b.id;
        });
      }

      function inspectorRowMarkup(item) {
        const selected = item.id === appState.inspector.selectedItemId;
        const pathMissing = isItemPathMissing(item);
        const modifiedDate = formatInspectorListDate(item.modifiedAt || "");
        const modifiedTime = formatInspectorListTime(item.modifiedAt || "");
        return `
          <div class="inspector-row${selected ? " selected" : ""}${pathMissing ? " path-missing" : ""}" role="option" aria-selected="${selected}" data-inspector-item="${item.id}">
            <span class="inspector-cell-name">${escapeHtml(item.fileName || "")}</span>
            <span class="inspector-cell-type">${escapeHtml(item.fileType === "html" ? "HTML" : "MD")}</span>
            <span class="inspector-cell-source">${escapeHtml(inspectorSourceLabel(item))}</span>
            <span class="inspector-cell-time"><span class="inspector-cell-time-date">${escapeHtml(modifiedDate)}</span><span class="inspector-cell-time-clock">${escapeHtml(modifiedTime)}</span></span>
          </div>
        `;
      }

      function renderInspectorListHead() {
        if (!els.inspectorListHead) return;
        // 只有三个真实列间边界可拖。最后一列没有“右缘”可供调整：把它做成
        // 手柄只会制造反向拖拽或挤压远处列的错觉。
        const columns = [
          { key: "fileName", label: t("inspector.colName"), resizable: true },
          { key: "fileType", label: t("inspector.colType"), resizable: true },
          { key: "source", label: t("inspector.colSource"), resizable: true },
          { key: "modifiedAt", label: t("inspector.colModified"), resizable: false }
        ];
        const resizeHint = t("inspector.colResizeHint");
        els.inspectorListHead.innerHTML = columns.map((column) => {
          const active = appState.inspector.sortKey === column.key;
          const sortState = active ? (appState.inspector.sortDir === "asc" ? "ascending" : "descending") : "none";
          const arrow = active ? (appState.inspector.sortDir === "asc" ? "↑" : "↓") : "";
          const ariaLabel = `${column.label}，${sortState === "none" ? t("inspector.sortHint") : (sortState === "ascending" ? t("inspector.sortAsc") : t("inspector.sortDesc"))}`;
          const handle = column.resizable
            ? `<span class="inspector-col-handle" data-inspector-col-handle="${column.key}" title="${escapeAttribute(resizeHint)}" aria-label="${escapeAttribute(column.label)}，${escapeAttribute(resizeHint)}"></span>`
            : "";
          return `
            <button type="button" class="inspector-col-button" data-inspector-sort="${column.key}" aria-sort="${sortState}" aria-label="${escapeAttribute(ariaLabel)}" title="${escapeAttribute(ariaLabel)}">
              <span class="inspector-col-label"><span class="inspector-col-label-text">${escapeHtml(column.label)}</span><span class="inspector-sort-arrow" aria-hidden="true">${arrow}</span></span>${handle}
            </button>
          `;
        }).join("");
      }

      function renderInspectorItems() {
        if (!els.inspectorShell) return;
        if (!appState.items.length) {
          appState.inspector.listFingerprint = "";
          appState.inspector.selectedItemId = null;
          destroyMarkdownInspector();
          if (els.inspectorListHead) els.inspectorListHead.innerHTML = "";
          const hasActiveSearch = Boolean(appState.appliedSearch);
          const emptyTitle = hasActiveSearch
            ? t("home.noSearchResults")
            : appState.browseMode === "starred" ? t("home.noStarred") : appState.browseMode === "recent" ? t("home.noRecent") : t("home.noFiles");
          els.inspectorRows.innerHTML = `
            <div class="empty-state inspector-empty">
              <div>
                <h2>${emptyTitle}</h2>
                <div>${hasActiveSearch ? t("home.noSearchResultsHint") : t("home.emptyHint")}</div>
              </div>
            </div>
          `;
          renderInspectorPreview();
          renderInspectorDetails();
          return;
        }
        renderInspectorListHead();
        const sorted = inspectorSortedItems();
        const fingerprint = JSON.stringify([
          appState.language,
          appState.inspector.sortKey,
          appState.inspector.sortDir,
          appState.inspector.selectedItemId,
          sorted.map((item) => [
            item.id,
            item.fileName || "",
            item.pathState || "",
            item.modifiedAt || "",
            inspectorSourceLabel(item)
          ])
        ]);
        if (fingerprint === appState.inspector.listFingerprint && els.inspectorRows.firstElementChild) {
          revalidateInspectorSelection(sorted);
          return;
        }
        appState.inspector.listFingerprint = fingerprint;
        els.inspectorRows.innerHTML = sorted.map(inspectorRowMarkup).join("");
        revalidateInspectorSelection(sorted);
      }

      // 选择复核：进入检查视图、筛选变化或数据刷新后调用。
      // 选择消失 → 自动选中第一条可见；选择仍在但文件已变化 → 重新读取 snapshot。
      function revalidateInspectorSelection(sorted) {
        const selectedId = appState.inspector.selectedItemId;
        const selected = sorted.find((item) => item.id === selectedId);
        if (!selected) {
          if (sorted.length) {
            selectInspectorItem(sorted[0].id, { skipScroll: true });
          } else {
            appState.inspector.selectedItemId = null;
          }
          return;
        }
        const snapshot = appState.inspector.snapshot;
        const previewStale = !snapshot
          || snapshot.itemId !== selected.id
          || snapshot.sourceModifiedAt !== selected.modifiedAt
          || snapshot.sourcePathState !== selected.pathState;
        updateInspectorRowSelection();
        // 只在可收敛状态自动重载：unavailable / missing 是终态，交给用户动作，
        // 避免自动刷新周期把失败状态变成无限重载循环。
        const autoReloadAllowed = appState.inspector.status === "ready" || appState.inspector.status === "empty";
        if (previewStale && autoReloadAllowed) {
          selectInspectorItem(selected.id, { skipScroll: true });
        }
      }

      function updateInspectorRowSelection() {
        if (!els.inspectorRows) return;
        els.inspectorRows.querySelectorAll(".inspector-row").forEach((row) => {
          const selected = Number(row.dataset.inspectorItem) === appState.inspector.selectedItemId;
          row.classList.toggle("selected", selected);
          row.setAttribute("aria-selected", String(selected));
        });
      }

      function selectInspectorItem(itemId, options = {}) {
        appState.inspector.selectedItemId = Number(itemId);
        // 旧异步 snapshot/旧 editor 一律失效：token 推进 + 立即销毁旧实例。
        appState.inspector.selectionToken += 1;
        appState.inspector.loadDepth = 0;
        updateInspectorRowSelection();
        renderInspectorDetails();
        const item = appState.items.find((entry) => entry.id === appState.inspector.selectedItemId);
        if (!item) {
          appState.inspector.status = "empty";
          renderInspectorPreview();
          return;
        }
        loadInspectorPreview(item);
        if (!options.skipScroll) {
          document.querySelector(`.inspector-row[data-inspector-item="${appState.inspector.selectedItemId}"]`)
            ?.scrollIntoView({ block: "nearest" });
        }
      }

      function destroyInspectorEditorOnly() {
        const editor = appState.inspector.editor;
        appState.inspector.editor = null;
        appState.inspector.snapshot = null;
        try {
          editor?.destroy?.();
        } catch (_) {
        }
        if (els.inspectorPreviewBody) {
          els.inspectorPreviewBody.innerHTML = "";
        }
        // 「更多」随每次加载重置：新文件未 reveal 前不出现，滚动态收起。
        hideInspectorMoreButton();
      }

      function destroyMarkdownInspector() {
        // 推进 token：所有在途 snapshot / revision 复核结果晚到即失效。
        appState.inspector.selectionToken += 1;
        appState.inspector.status = "empty";
        appState.inspector.loadDepth = 0;
        destroyInspectorEditorOnly();
      }

      function inspectorStateMarkup(kind) {
        const states = {
          empty: {
            icon: "text_snippet",
            title: t("inspector.previewEmptyTitle"),
            hint: t("inspector.previewEmptyHint")
          },
          loading: {
            icon: "hourglass_top",
            title: t("inspector.previewLoadingTitle"),
            hint: ""
          },
          missing: {
            icon: "link_off",
            title: t("inspector.pathMissingTitle"),
            hint: t("inspector.pathMissingHint")
          },
          unavailable: {
            icon: "visibility_off",
            title: t("inspector.previewUnavailableTitle"),
            hint: t("inspector.previewUnavailableHint")
          },
          pending: {
            icon: "hourglass_top",
            title: t("inspector.htmlPendingTitle"),
            hint: t("inspector.htmlPendingHint")
          },
          failed: {
            icon: "image_not_supported",
            title: t("inspector.htmlFailedTitle"),
            hint: t("inspector.htmlFailedHint")
          },
          engineUnavailable: {
            icon: "image_not_supported",
            title: t("inspector.htmlEngineTitle"),
            hint: t("inspector.htmlEngineHint")
          }
        };
        const state = states[kind] || states.empty;
        const retryButton = kind === "failed"
          ? `<button type="button" class="button button-ghost" data-inspector-retry-thumbnail="1">${escapeHtml(t("inspector.htmlRetry"))}</button>`
          : "";
        return `
          <div class="inspector-state" role="status" data-inspector-state="${kind}">
            <span class="material-symbols-outlined" aria-hidden="true">${state.icon}</span>
            <div class="inspector-state-title">${escapeHtml(state.title)}</div>
            ${state.hint ? `<div class="inspector-state-hint">${escapeHtml(state.hint)}</div>` : ""}
            ${retryButton}
          </div>
        `;
      }

      function renderInspectorPreview() {
        if (!els.inspectorPreviewBody) return;
        const item = appState.items.find((entry) => entry.id === appState.inspector.selectedItemId);
        if (!item) {
          hideInspectorMoreButton();
          els.inspectorPreviewBody.innerHTML = inspectorStateMarkup("empty");
          return;
        }
        if (isItemPathMissing(item)) {
          hideInspectorMoreButton();
          els.inspectorPreviewBody.innerHTML = inspectorStateMarkup("missing");
          return;
        }
        if (item.fileType === "markdown") {
          // ready 的 DOM 由 mount 流程持有；loading / unavailable / 意外空态在此收敛。
          if (appState.inspector.status === "loading") {
            // 隐藏挂载进行中：loading 层已覆盖正文卡，重建 innerHTML 会撕掉
            // 挂载中的编辑器根；此时 DOM 保持原样即可。
            if (!els.inspectorPreviewBody.querySelector("[data-inspector-preview].inspector-preview-pending")) {
              els.inspectorPreviewBody.innerHTML = inspectorStateMarkup("loading");
            }
          } else if (appState.inspector.status === "unavailable") {
            els.inspectorPreviewBody.innerHTML = inspectorStateMarkup("unavailable");
          } else if (!appState.inspector.editor) {
            els.inspectorPreviewBody.innerHTML = inspectorStateMarkup("empty");
          }
          return;
        }
        renderInspectorHtmlPreview(item);
      }

      // HTML：只消费已合并基线的 thumbnail 状态。ready 图立即显示；
      // session-local stale preview 仅在来源校验 + 引擎可用 + 刷新进行中时带遮罩显示；
      // 其余 stale/pending/failed/引擎不可用都是可解释的状态层，不把旧图当 current ready。
      function renderInspectorHtmlPreview(item) {
        // HTML 首屏是静态截图，绝不复用上一份 Markdown 的「更多」按钮或展开态。
        // 显式清空而非只依赖 select → destroy 的隐式顺序，缩略图异步刷新也安全。
        hideInspectorMoreButton();
        const staleEntry = appState.stalePreviewThumbnails.get(item.id);
        const thumb = item.thumbnail;
        if (thumb?.status === "ready" && thumb.path) {
          els.inspectorPreviewBody.innerHTML = `
            <div class="inspector-preview-card" data-inspector-preview="1" data-inspector-html-key="${escapeAttribute(thumb.desiredKey || "")}">
              <img class="inspector-html-shot" src="${escapeAttribute(thumb.path)}" alt="" draggable="false" />
            </div>
          `;
          return;
        }
        if (
          staleEntry
          && staleEntry.state === "preview"
          && staleEntry.thumbnail?.path
          && canGenerateDocumentThumbnails()
        ) {
          const previewPath = staleEntry.thumbnail.path;
          els.inspectorPreviewBody.innerHTML = `
            <div class="inspector-preview-card inspector-stale-preview" data-inspector-preview="1" aria-busy="true">
              <img class="inspector-html-shot" src="${escapeAttribute(previewPath)}" alt="" draggable="false" />
              <div class="inspector-stale-mask"><span class="inspector-stale-pill">${escapeHtml(t("status.thumbnailUpdating"))}</span></div>
            </div>
          `;
          return;
        }
        if (!canGenerateDocumentThumbnails()) {
          els.inspectorPreviewBody.innerHTML = inspectorStateMarkup("engineUnavailable");
          return;
        }
        if (item._thumbFailed || thumb?.status === "failed" || staleEntry?.state === "failed") {
          els.inspectorPreviewBody.innerHTML = inspectorStateMarkup("failed");
          return;
        }
        els.inspectorPreviewBody.innerHTML = inspectorStateMarkup("pending");
      }

      // 失败态“重试”：清 failed 标记并走既有缩略图刷新队列；完成后由
      // updateCardThumbnail 的 inspector 分支把状态层收敛回 ready/stale/failed。
      // 入口被详情区与预览区（inspectorStateMarkup 的 failed 按钮）两处委托共用。
      function retryInspectorThumbnail() {
        const item = appState.items.find((entry) => entry.id === appState.inspector.selectedItemId);
        if (!item) return;
        item._thumbFailed = false;
        ensureDocumentThumbnails([item]);
      }

      function formatInspectorFileSize(bytes) {
        const value = Number(bytes);
        if (!Number.isFinite(value) || value <= 0) return "—";
        if (value < 1024) return `${value} B`;
        if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
        if (value < 1024 * 1024 * 1024) return `${(value / (1024 * 1024)).toFixed(1)} MB`;
        return `${(value / (1024 * 1024 * 1024)).toFixed(2)} GB`;
      }

      // 左侧列表只承担扫读和排序：显示完整日期即可。详情区仍使用
      // formatTimestamp 显示到分钟，避免窄列出现“日期完整、时间只露一个字”的残片。
      function formatInspectorListDate(value) {
        if (!value) return "未知";
        const numeric = Number(value);
        const date = Number.isFinite(numeric) ? new Date(numeric * 1000) : new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(date);
      }

      function formatInspectorListTime(value) {
        if (!value) return "";
        const numeric = Number(value);
        const date = Number.isFinite(numeric) ? new Date(numeric * 1000) : new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat("zh-CN", {
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).format(date);
      }

      function inspectorLibraryName(item) {
        const library = appState.libraries.find((entry) => Number(entry.id) === Number(item.libraryId));
        return library?.name || "";
      }

      // 详情区（GUI 验收反馈）：合并进右栏单一框体后的属性信息区。
      // 头行：名称 + 类型徽标 + （路径失效提示）+ 重置分栏；
      // 属性栅格：大小 / 修改时间 / 最近打开 / 所属库；之下：合并后的标签（来源徽标 +
      // 自定义标签）、路径。
      // 打开入口是框体最底部的通栏横条（#inspectorOpenBar），不在这里渲染。
      function renderInspectorDetails() {
        if (!els.inspectorDetails) return;
        const item = appState.items.find((entry) => entry.id === appState.inspector.selectedItemId);
        const openBar = els.inspectorOpenBar;
        if (openBar) {
          openBar.textContent = t("inspector.openFile");
          openBar.disabled = !item || isItemPathMissing(item);
        }
        // 重置分栏入口：应用内可见 tooltip（原生 title 在真实使用中不可发现），
        // 图标用恢复语义的 settings_backup_restore（drag_indicator 六点把手被
        // 误读成拖拽 grip，GUI 验收第二批反馈）。
        const resetSplitTooltip = t("inspector.resetSplit");
        const resetSplitButton = `
          <button type="button" class="icon-button" data-inspector-reset-split="1" aria-label="${escapeAttribute(resetSplitTooltip)}">
            <span class="material-symbols-outlined" aria-hidden="true">settings_backup_restore</span>
            <span class="home-action-tooltip">${escapeHtml(resetSplitTooltip)}</span>
          </button>
        `;
        if (!item) {
          els.inspectorDetails.innerHTML = `
            <div class="inspector-details-head">
              <span class="inspector-details-name inspector-details-empty">${escapeHtml(t("inspector.detailsEmpty"))}</span>
              ${resetSplitButton}
            </div>
          `;
          return;
        }
        const pathMissing = isItemPathMissing(item);
        const relativePath = item.relativePath || item.filePath || item.fileName || "";
        // 路径按 GUI 验收要求显示文件绝对路径（完整路径同时挂在 title 上）。
        const absolutePath = item.filePath || relativePath;
        const sourceBadges = item.sourceBadges || [];
        const tags = (item.tags || []).map((tag) => tag.name).filter(Boolean);
        const sourceBadgeChips = sourceBadges.map((badge) => {
          const unavailable = badge.available === false;
          const kindClass = badge.kind === "project" ? "source-badge-project" : "source-badge-skill";
          const label = String(badge.label || "").trim();
          if (!label) return "";
          return `<span class="source-badge inspector-details-source-badge ${kindClass}${unavailable ? " source-badge--unavailable" : ""}" aria-label="${escapeAttribute(label + (unavailable ? "（来源不可用）" : ""))}"><span class="source-badge-label">${escapeHtml(label)}</span><span class="chip-tooltip">${escapeHtml(label)}</span></span>`;
        }).filter(Boolean);
        const tagChips = tags.map((tag) => `<span class="tag-chip">${escapeHtml(tag)}</span>`);
        const libraryName = inspectorLibraryName(item);
        const lastOpened = item.lastOpenedAt ? formatTimestamp(item.lastOpenedAt) : t("inspector.detailsNeverOpened");
        const modified = formatTimestamp(item.modifiedAt || "") || "—";
        els.inspectorDetails.innerHTML = `
          <div class="inspector-details-head">
            <span class="inspector-details-name" title="${escapeAttribute(item.fileName || "")}">${escapeHtml(item.fileName || "")}</span>
            <span class="thumb-badge thumb-badge-type">${escapeHtml(item.fileType === "html" ? "HTML" : "MD")}</span>
            ${pathMissing ? `<span class="inspector-details-missing">${escapeHtml(t("inspector.pathMissingTitle"))}</span>` : ""}
            ${resetSplitButton}
          </div>
          <dl class="inspector-details-grid">
            <div><dt>${escapeHtml(t("inspector.detailsSize"))}</dt><dd>${escapeHtml(formatInspectorFileSize(item.fileSize))}</dd></div>
            <div><dt>${escapeHtml(t("inspector.colModified"))}</dt><dd>${escapeHtml(modified)}</dd></div>
            <div><dt>${escapeHtml(t("inspector.detailsOpened"))}</dt><dd>${escapeHtml(lastOpened)}</dd></div>
            ${libraryName ? `<div><dt>${escapeHtml(t("inspector.detailsLibrary"))}</dt><dd>${escapeHtml(libraryName)}</dd></div>` : ""}
          </dl>
          ${sourceBadgeChips.length || tagChips.length ? `
          <div class="inspector-details-line">
            <dt>${escapeHtml(t("inspector.detailsTags"))}</dt>
            <dd class="inspector-details-chips">${sourceBadgeChips.join("")}${tagChips.join("")}</dd>
          </div>` : ""}
          <div class="inspector-details-line">
            <dt>${escapeHtml(t("inspector.detailsPath"))}</dt>
            <dd class="inspector-details-path" title="${escapeAttribute(absolutePath)}">${escapeHtml(absolutePath)}</dd>
          </div>
        `;
      }

      async function loadInspectorPreview(item) {
        const token = appState.inspector.selectionToken;
        if (isItemPathMissing(item)) {
          appState.inspector.status = "missing";
          destroyInspectorEditorOnly();
          renderInspectorPreview();
          return;
        }
        if (item.fileType !== "markdown") {
          appState.inspector.status = "ready";
          destroyInspectorEditorOnly();
          // HTML 没有正文 snapshot；记录来源状态用于自动刷新时的过期判断，
          // 避免每个刷新周期都重挂 <img>。
          appState.inspector.snapshot = {
            itemId: item.id,
            kind: "html",
            revision: item.thumbnail?.desiredKey || "",
            sourceModifiedAt: item.modifiedAt || "",
            sourcePathState: item.pathState || "valid"
          };
          renderInspectorPreview();
          return;
        }
        appState.inspector.status = "loading";
        destroyInspectorEditorOnly();
        renderInspectorPreview();
        try {
          const snapshot = await invoke("get_item_inspector_snapshot", { itemId: item.id });
          if (!isInspectorSelectionCurrent(item.id, token)) return;
          const normalized = {
            itemId: Number(snapshot.itemId ?? snapshot.item_id ?? item.id),
            raw: String(snapshot.raw ?? ""),
            revision: String(snapshot.revision ?? ""),
            baseDir: String(snapshot.baseDir ?? ""),
            filePath: String(snapshot.filePath ?? snapshot.file_path ?? item.filePath ?? ""),
            fileName: String(snapshot.fileName ?? snapshot.file_name ?? item.fileName ?? ""),
            title: snapshot.title ?? null,
            sourceModifiedAt: item.modifiedAt || "",
            sourcePathState: item.pathState || "valid"
          };
          const editor = await mountInspectorMarkdownPreview(item, normalized, token);
          if (!editor) return;
          if (!isInspectorSelectionCurrent(item.id, token)) return;
          // 复核 1/3：Milkdown ready —— 读取 → 挂载之间发生外部替换时丢弃旧 snapshot。
          if (await settleInspectorRevision(item, normalized, token, await verifyInspectorRevision(item, normalized, token))) return;
          if (!isInspectorSelectionCurrent(item.id, token)) return;
          // 本地图片就绪后再进入显示判定；慢图不永久阻塞（与正式打开页同一容错）。
          await waitForInspectorImages(token);
          if (!isInspectorSelectionCurrent(item.id, token)) return;
          // 复核 2/3：本地图片就绪。
          if (await settleInspectorRevision(item, normalized, token, await verifyInspectorRevision(item, normalized, token))) return;
          if (!isInspectorSelectionCurrent(item.id, token)) return;
          // 复核 3/3：显示前 —— 契约要求未复核的旧正文绝不短暂可见。
          if (await settleInspectorRevision(item, normalized, token, await verifyInspectorRevision(item, normalized, token))) return;
          revealInspectorMarkdownPreview();
        } catch (error) {
          if (!isInspectorSelectionCurrent(item.id, token)) return;
          console.warn("inspector preview failed", error);
          appState.inspector.status = "unavailable";
          destroyInspectorEditorOnly();
          renderInspectorPreview();
        }
      }

      async function mountInspectorMarkdownPreview(item, snapshot, token) {
        const codeThemeClass = appState.markdownPreferences.codeBlockTheme === "light"
          ? "markdown-code-theme-light"
          : "markdown-code-theme-dark";
        const shellTitle = markdownDocumentTitle(snapshot.raw, snapshot.fileName || "Markdown");
        // 隐藏挂载：loading 状态层覆盖在正文卡上方，正文卡以正常流参与排版但
        // visibility:hidden。三次 revision 复核全部通过前，正文绝不进入可见区。
        els.inspectorPreviewBody.innerHTML = `
          ${inspectorStateMarkup("loading")}
          <div class="content-card editing editor-ready ${codeThemeClass} inspector-preview-card inspector-preview-text inspector-preview-pending" data-inspector-preview="1" inert>
            <div class="content-head">
              <div class="markdown-title-copy">
                <div class="content-title markdown-title-input markdown-title-readout" data-inspector-title="1">${escapeHtml(shellTitle)}</div>
                <div class="content-meta">${escapeHtml(t("inspector.modifiedAtPrefix"))}${escapeHtml(formatTimestamp(item.modifiedAt || ""))}</div>
              </div>
            </div>
            <div id="inspectorMilkdownRoot" class="milkdown-editor-root"></div>
          </div>
        `;
        // 根引用在 innerHTML 赋值后立即捕获：等待期间发生整表重建时，
        // 旧编辑器只会进入已脱离的旧根，不会污染新一轮挂载。
        const root = els.inspectorPreviewBody.querySelector("#inspectorMilkdownRoot");
        const api = await loadMarkdownEditorApi();
        if (!api?.create) {
          throw new Error("Markdown editor API is unavailable");
        }
        if (!isInspectorSelectionCurrent(item.id, token) || !root?.isConnected) return null;
        const tabLike = {
          item: { filePath: snapshot.filePath, fileName: snapshot.fileName },
          preview: { baseDir: snapshot.baseDir }
        };
        const editor = await api.create({
          root,
          markdown: snapshot.raw,
          fileName: snapshot.fileName || "",
          language: appState.language,
          // 创建期只读：插件/事件边界在编辑器内部裁剪，contenteditable 只是兜底。
          readOnly: true,
          resolveImageSrc(src) {
            return resolveMarkdownImageUrl(src, tabLike) || src;
          }
        });
        if (!isInspectorSelectionCurrent(item.id, token) || !root.isConnected) {
          editor.destroy?.();
          return null;
        }
        appState.inspector.editor = editor;
        appState.inspector.snapshot = snapshot;
        return editor;
      }

      async function waitForInspectorImages(token, timeoutMs = 10000) {
        const deadline = performance.now() + timeoutMs;
        for (;;) {
          if (!isInspectorActive() || appState.inspector.selectionToken !== token) return;
          const images = [...(els.inspectorPreviewBody?.querySelectorAll("img") || [])];
          const pending = images.filter((img) => !img.complete);
          if (!pending.length || performance.now() > deadline) return;
          await delay(120);
        }
      }

      // revision 复核（无副作用，只判定）：返回 "match" | "mismatch" | "unknown"；
      // 选择已失效返回 "superseded"，由处置方直接停止且不触碰 DOM。
      // Milkdown ready / 图片就绪 / 显示前三个时点都会调用本函数。
      async function verifyInspectorRevision(item, snapshot, token) {
        let currentRevision = null;
        try {
          const current = await invoke("get_item_content_revision", { itemId: item.id });
          if (!isInspectorSelectionCurrent(item.id, token)) return "superseded";
          currentRevision = String(current?.revision ?? "");
        } catch (_) {
          if (!isInspectorSelectionCurrent(item.id, token)) return "superseded";
        }
        if (currentRevision && currentRevision === snapshot.revision) return "match";
        return currentRevision === null ? "unknown" : "mismatch";
      }

      // 复核结果的统一处置：不一致/读取失败 → 销毁本次实例并重读 snapshot
      // （有限深度防循环）；深度耗尽收敛到显式 unavailable。
      // 未通过复核的内容绝不显示。返回 true 表示调用方应停止当前流程。
      async function settleInspectorRevision(item, snapshot, token, verdict) {
        if (verdict === "match") return false;
        if (verdict === "superseded") return true;
        if (!isInspectorSelectionCurrent(item.id, token)) return true;
        destroyInspectorEditorOnly();
        if (appState.inspector.loadDepth < 3) {
          appState.inspector.loadDepth += 1;
          const latest = appState.items.find((entry) => entry.id === item.id);
          if (latest) {
            await loadInspectorPreview(latest);
          }
          return true;
        }
        appState.inspector.status = "unavailable";
        renderInspectorPreview();
        return true;
      }

      // 三次复核全部通过后的唯一显示入口。更多控件属于独立的透明 child
      // WebView，原生 bounds 从创建起固定，hover 仅在小岛内部显隐 tooltip，
      // 避免 WKWebView 因 hover resize/reposition 再次合成闪烁。
      function inspectorMoreOverlayBounds() {
        const stage = els.inspectorPreviewStage?.getBoundingClientRect();
        if (!stage || stage.width < 40 || stage.height < 40) return null;
        const size = 34;
        const inset = 18;
        const buttonX = Math.round(stage.left + stage.width / 2 - size / 2);
        const buttonY = Math.round(stage.bottom - inset - size);
        // 30px 圆钮落在固定 152px 小岛正中，tooltip 可正上方完整展开；
        // bounds 固定一次即可，不能根据 hover 改变 native webview bounds。
        return { x: buttonX - 59, y: buttonY - 40, width: 152, height: 74 };
      }

      function syncInspectorMoreOverlay() {
        const overlay = appState.inspector.moreOverlay;
        const stage = els.inspectorPreviewStage;
        const itemId = appState.inspector.selectedItemId;
        const visible = Boolean(
          isInspectorActive()
          && itemId != null
          && appState.inspector.status === "ready"
          && stage?.classList.contains("inspector-preview-expanded") !== undefined
        );
        const previousItemId = overlay.itemId;
        const nextRunId = ++overlay.syncRunId;
        overlay.syncPromise = overlay.syncPromise.then(async () => {
          if (previousItemId != null && (!visible || previousItemId !== itemId)) {
            await invoke("close_inspector_more_overlay_command", { payload: { itemId: previousItemId } }).catch(() => false);
          }
          if (!visible || !isInspectorSelectionCurrent(itemId, appState.inspector.selectionToken) || nextRunId !== overlay.syncRunId) {
            if (!visible) {
              overlay.itemId = null;
              overlay.selectionToken = 0;
            }
            return;
          }
          const bounds = inspectorMoreOverlayBounds();
          if (!bounds) return;
          const expanded = stage.classList.contains("inspector-preview-expanded");
          const label = t(expanded ? "inspector.showLess" : "inspector.showMore");
          const selectionToken = appState.inspector.selectionToken;
          await invoke("attach_inspector_more_overlay_command", {
            payload: { itemId, selectionToken, bounds, expanded, label }
          }).catch(() => false);
          if (nextRunId !== overlay.syncRunId || !isInspectorSelectionCurrent(itemId, selectionToken)) {
            await invoke("close_inspector_more_overlay_command", { payload: { itemId } }).catch(() => false);
            return;
          }
          overlay.itemId = itemId;
          overlay.selectionToken = selectionToken;
          overlay.expanded = expanded;
        });
      }

      function setInspectorPreviewExpanded(expanded) {
        const stage = els.inspectorPreviewStage;
        if (!stage) return;
        stage.classList.toggle("inspector-preview-expanded", Boolean(expanded));
        if (!expanded && els.inspectorPreviewBody) els.inspectorPreviewBody.scrollTop = 0;
        syncInspectorMoreOverlay();
      }

      function hideInspectorMoreButton() {
        const overlay = appState.inspector.moreOverlay;
        if (els.inspectorPreviewStage) {
          els.inspectorPreviewStage.classList.remove("inspector-preview-expanded");
        }
        const itemId = overlay.itemId;
        ++overlay.syncRunId;
        overlay.itemId = null;
        overlay.selectionToken = 0;
        if (itemId != null) {
          overlay.syncPromise = overlay.syncPromise.then(() =>
            invoke("close_inspector_more_overlay_command", { payload: { itemId } }).catch(() => false)
          );
        }
      }

      function revealInspectorMarkdownPreview() {
        const body = els.inspectorPreviewBody;
        if (!body) return;
        body.querySelector(".inspector-state")?.remove();
        body.querySelector("[data-inspector-preview].inspector-preview-pending")?.classList.remove("inspector-preview-pending");
        appState.inspector.status = "ready";
        body.scrollTop = 0;
        setInspectorPreviewExpanded(false);
      }

      // 安全宽（GUI 验收第二批）：左栏最窄 280px（列最小宽总和约 272 + 内边距），
      // 右栏最窄 340px（预览框 + 详情栅格可读下限）。集中在这里钳制，
      // 拖拽 / 键盘方向键 / 双击重置 / 持久化恢复四条入口统一受限。
      const INSPECTOR_LEFT_MIN_PX = 280;
      const INSPECTOR_RIGHT_MIN_PX = 340;

      function applyInspectorSplitRatio() {
        if (!els.inspectorShell) return;
        // 注意不能用 `Number(x) || 0.6`：向右拖到底时 ratio 合法地等于 0，
        // 会被 || 当成“未设置”吞成 0.6（右栏安全钳制随之失效，实测复现）。
        const stored = Number(appState.inspector.splitRatio);
        let ratio = Number.isFinite(stored) ? Math.min(1, Math.max(0, stored)) : 0.6;
        const width = els.inspectorShell.getBoundingClientRect().width;
        // 栏未布局（隐藏/首帧）时量不到宽度，跳过像素钳制只做 0..1。
        if (width > 120) {
          const usable = Math.max(1, width - 10);
          const minLeftPx = Math.min(INSPECTOR_LEFT_MIN_PX, usable);
          const maxLeftPx = Math.max(minLeftPx, usable - INSPECTOR_RIGHT_MIN_PX);
          const leftPx = Math.min(maxLeftPx, Math.max(minLeftPx, (1 - ratio) * usable));
          ratio = Math.min(1, Math.max(0, 1 - leftPx / usable));
        }
        // 不使用 fr：左右卡片各自有外间距/内边距，fr 轨道在极窄时会让
        // 视觉盒跨越自己的 track，表现为“右栏向左拖时逐个覆盖左栏”。
        // 两个 px track 从同一个 usable 宽度计算，分隔条和两栏同步收缩。
        const usable = Math.max(1, width - 10);
        const leftPx = Math.round((1 - ratio) * usable * 1000) / 1000;
        const rightPx = Math.max(0, Math.round((usable - leftPx) * 1000) / 1000);
        els.inspectorShell.style.gridTemplateColumns = `minmax(0, ${leftPx}px) 10px minmax(0, ${rightPx}px)`;
        applyInspectorColumns();
        els.inspectorSplitter?.setAttribute("aria-valuenow", String(Math.round(ratio * 100)));
        // 返回钳制后的生效值，调用方（拖拽 move）用它回写状态，避免残留越界原值。
        return ratio;
      }

      // ── 检查视图列宽：四列始终是一组固定总宽的轨道。三个列间手柄只在
      // 紧邻的两列间转移宽度，鼠标方向就是左列边界的移动方向；绝不让远处列
      // 或“剩余空间吸收列”参与一次拖拽。v5 同时使“日期 82px”的保守旧偏好
      // 失效，让贴合完整日期的 72px 默认真正回收空间给名称。
      function loadInspectorColumnWidths() {
        const key = "nutbook.inspector.colWidths.v5";
        const limits = {
          fileName: [64, 560],
          fileType: [40, 160],
          source: [48, 260],
          // 默认显示完整日期；手动调整允许继续压缩，日期按普通单行省略显示。
          modifiedAt: [64, 220]
        };
        try {
          const raw = window.localStorage?.getItem(key);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          const widths = {};
          for (const col of Object.keys(limits)) {
            const value = Number(parsed?.[col]);
            if (!Number.isFinite(value)) return null;
            widths[col] = Math.min(limits[col][1], Math.max(limits[col][0], Math.round(value)));
          }
          return widths;
        } catch (_) {
          return null;
        }
      }

      function saveInspectorColumnWidths() {
        try {
          if (appState.inspector.colWidths) {
            window.localStorage?.setItem("nutbook.inspector.colWidths.v5", JSON.stringify(appState.inspector.colWidths));
          } else {
            window.localStorage?.removeItem("nutbook.inspector.colWidths.v5");
          }
          // 清掉无版本旧值，避免后续代码或旧窗口把它重新视为当前偏好。
          window.localStorage?.removeItem("nutbook.inspector.colWidths");
          window.localStorage?.removeItem("nutbook.inspector.colWidths.v2");
          window.localStorage?.removeItem("nutbook.inspector.colWidths.v3");
          window.localStorage?.removeItem("nutbook.inspector.colWidths.v4");
        } catch (_) {
        }
      }

      // 默认态先给修改时间完整日期所需宽度，其余可用空间优先给名称。用户调整后
      // 保存四列的实际宽度；窗口大小变化时等比适配到新总宽，保持列间关系。
      function applyInspectorColumns() {
        if (!els.inspectorShell) return;
        const widths = appState.inspector.colWidths;
        const paneWidth = document.querySelector(".inspector-list-pane")?.clientWidth || 0;
        // 列轨道必须从“行的实际可用内容宽”推导：rows 左右 padding 16px、
        // row 左右 padding 26px、三段 gap 共 24px。过去只从 pane 扣 46px，
        // 漏了 gap，导致最后一列溢出行背景，表现为右侧日期被卡片截断。
        const rowsWidth = els.inspectorRows?.clientWidth || paneWidth;
        const available = Math.max(176, rowsWidth - 66);
        // 默认必须贴合完整日期；但用户已手动调整时，时间列可降到紧凑宽度。
        const minimum = available < 234
          ? { fileName: 48, fileType: 32, source: 32, modifiedAt: 64 }
          : { fileName: 64, fileType: 40, source: 48, modifiedAt: widths ? 64 : 72 };
        const maximum = { fileName: 560, fileType: 160, source: 260, modifiedAt: 220 };
        const keys = ["fileName", "fileType", "source", "modifiedAt"];
        const defaults = available < 234
          ? { fileName: Math.max(48, available - 128), fileType: 32, source: 32, modifiedAt: 64 }
          : { fileName: Math.max(64, available - 192), fileType: 56, source: 64, modifiedAt: 72 };
        const preferred = widths || defaults;
        const preferredTotal = keys.reduce((total, key) => total + Math.max(0, Number(preferred[key]) || 0), 0);
        const scale = preferredTotal > 0 ? available / preferredTotal : 1;
        const effective = {};
        for (const key of keys) {
          effective[key] = Math.min(maximum[key], Math.max(minimum[key], Math.round((Number(preferred[key]) || minimum[key]) * scale)));
        }
        // 钳制和取整后只可能留下少量差额；优先交给名称，确保标题始终是最宽列。
        let remainder = available - keys.reduce((total, key) => total + effective[key], 0);
        for (const key of ["fileName", "modifiedAt", "source", "fileType"]) {
          if (!remainder) break;
          const adjustment = remainder > 0
            ? Math.min(remainder, maximum[key] - effective[key])
            : Math.max(remainder, minimum[key] - effective[key]);
          effective[key] += adjustment;
          remainder -= adjustment;
        }
        els.inspectorShell.style.setProperty(
          "--inspector-cols",
          `${effective.fileName}px ${effective.fileType}px ${effective.source}px ${effective.modifiedAt}px`
        );
        els.inspectorShell.dataset.inspectorTimeDetail = effective.modifiedAt >= 118 ? "true" : "false";
      }

      function resetInspectorColumns() {
        appState.inspector.colWidths = null;
        saveInspectorColumnWidths();
        applyInspectorColumns();
      }

      function resetInspectorSplit() {
        appState.inspector.splitRatio = 0.6;
        appState.inspector.splitRatio = applyInspectorSplitRatio();
        saveInspectorSplitRatioPreference();
        setStatus(t("inspector.splitResetDone"), "ok");
      }


      function wireInspectorEvents() {
        if (!els.inspectorShell || els.inspectorShell.dataset.inspectorWired === "true") return;
        els.inspectorShell.dataset.inspectorWired = "true";

        // 列宽拖拽期间抑制随后的 click，避免拖完手柄误触发表头排序。
        let inspectorColDragUsed = false;
        els.inspectorListHead?.addEventListener("click", (event) => {
          // 手柄上的裸点击/拖拽收尾点击不得触发表头排序（拖拽结束的 click
          // 因 pointer capture 也落在手柄上）。
          if (event.target.closest("[data-inspector-col-handle]")) return;
          if (inspectorColDragUsed) {
            inspectorColDragUsed = false;
            return;
          }
          const button = event.target.closest("[data-inspector-sort]");
          if (!button) return;
          const key = button.dataset.inspectorSort;
          if (appState.inspector.sortKey === key) {

        els.inspectorListHead?.addEventListener("pointerdown", (event) => {
          const handle = event.target.closest("[data-inspector-col-handle]");
          if (!handle) return;
          event.preventDefault();
          event.stopPropagation();
          // 逐列安全区间（与 loadInspectorColumnWidths 内联值保持一致）。
          const limits = {
            fileName: [64, 560],
            fileType: [40, 160],
            source: [48, 260],
            modifiedAt: [64, 220]
          };
          const columnKey = handle.dataset.inspectorColHandle;
          const columnKeys = ["fileName", "fileType", "source", "modifiedAt"];
          const neighborKey = columnKeys[columnKeys.indexOf(columnKey) + 1];
          if (!neighborKey) return;
          const measure = (key, fallback) => {
            const width = els.inspectorListHead.querySelector(`[data-inspector-sort="${key}"]`)?.getBoundingClientRect().width;
            return Number.isFinite(width) && width > 0 ? Math.round(width) : fallback;
          };
          const startX = event.clientX;
          // 必须量取当前实际轨道，而非直接复用持久化值：分栏/窗口缩放后持久化
          // 宽度会按比例适配，若从旧值继续算，手柄会在首次移动时跳动或落后鼠标。
          const startWidths = {
            fileName: measure("fileName", 180),
            fileType: measure("fileType", 56),
            source: measure("source", 90),
            modifiedAt: measure("modifiedAt", 112)
          };
          if (!(columnKey in startWidths)) return;
          const [minWidth, maxWidth] = limits[columnKey];
          const [neighborMinWidth, neighborMaxWidth] = limits[neighborKey];
          const startWidth = Math.min(maxWidth, Math.max(minWidth, startWidths[columnKey]));
          const startNeighborWidth = Math.min(neighborMaxWidth, Math.max(neighborMinWidth, startWidths[neighborKey]));
          handle.setPointerCapture(event.pointerId);
          handle.classList.add("dragging");
          const move = (moveEvent) => {
            const requestedDelta = Math.round(moveEvent.clientX - startX);
            const minDelta = Math.max(minWidth - startWidth, startNeighborWidth - neighborMaxWidth);
            const maxDelta = Math.min(maxWidth - startWidth, startNeighborWidth - neighborMinWidth);
            const delta = Math.min(maxDelta, Math.max(minDelta, requestedDelta));
            const next = startWidth + delta;
            const nextNeighbor = startNeighborWidth - delta;
            if (next === appState.inspector.colWidths?.[columnKey] && nextNeighbor === appState.inspector.colWidths?.[neighborKey]) return;
            inspectorColDragUsed = true;
            appState.inspector.colWidths = { ...startWidths, [columnKey]: next, [neighborKey]: nextNeighbor };

            handle.classList.remove("dragging");
            handle.removeEventListener("pointermove", move);
            handle.removeEventListener("pointerup", finish);
            handle.removeEventListener("pointercancel", finish);
            try {
              handle.releasePointerCapture(finishEvent.pointerId);
            } catch (_) {
            }
            saveInspectorColumnWidths();
            setTimeout(() => {
              inspectorColDragUsed = false;
            }, 0);
          };
          handle.addEventListener("pointermove", move);
          handle.addEventListener("pointerup", finish);
          handle.addEventListener("pointercancel", finish);

        if (window.ResizeObserver && els.inspectorPreviewFrame) {

        // 左栏目标宽 = 指针位置 - 分隔条半宽（10px 列补偿），右栏 = 其余。
        // 安全宽钳制统一在 applyInspectorSplitRatio（GUI 验收第二批）：
        // 旧实现只有 0..1 钳制，左右栏都可以被拖到完全消失。

        const splitter = els.inspectorSplitter;

          event.preventDefault();
          openAboutDialog().catch((error) => {
            setStatus(`打开关于窗口失败：${normalizeError(error)}`, "error");
          });
        });
        els.closeAboutButton?.addEventListener("click", closeAboutDialog);
        els.aboutScrim?.addEventListener("click", (event) => {
          if (event.target === els.aboutScrim) closeAboutDialog();
        });
        els.aboutGithubProfileButton?.addEventListener("click", async () => {
          await openExternalMarkdownLink(ABOUT_GITHUB_PROFILE_URL);
        });
        els.aboutGithubStarButton?.addEventListener("click", async () => {
          await openExternalMarkdownLink(ABOUT_GITHUB_STAR_URL);
        });
        els.settingsButton.addEventListener("click", (event) => {
          event.stopPropagation();
          if (getActiveTab()?.preview?.fileType === "html-runtime") {
            openSettingsOverlay(appState.settingsTab || "skills", "menu").catch((error) => {
              setStatus(`打开设置失败：${normalizeError(error)}`, "error");
            });
            return;
          }
          appState.isSettingsMenuOpen = !appState.isSettingsMenuOpen;
          renderSettingsMenu();
        });
        els.thumbnailEngineAlertButton?.addEventListener("click", (event) => {
          event.stopPropagation();
          openSettingsTab("thumbnails");
        });
        els.settingsDiscoverAgentsButton?.addEventListener("click", loadAgentProjectsInSettings);
        els.settingsNbskillEnhancementHint?.addEventListener("click", () => {
          showAgentIntegrationHelp(els.settingsNbskillEnhancementHint.dataset.helpMode === "guide" ? "guide" : "intro");
        });
        els.settingsRefreshNbskillStatusButton?.addEventListener("click", () => runAgentIntegrationAction("primary"));
        els.settingsCopyNbskillPromptButton?.addEventListener("click", () => runAgentIntegrationAction("repair"));
        els.settingsSourceSortButton?.addEventListener("click", (event) => {
          event.stopPropagation();
          appState.isSettingsSourceSortMenuOpen = !appState.isSettingsSourceSortMenuOpen;
          renderSettingsSourceSortMenu();
        });
        els.closeSettingsButton.addEventListener("click", closeSettingsPanel);
        els.settingsScrim.addEventListener("click", (event) => {
          if (event.target === els.settingsScrim) {
            closeSettingsPanel();
          }
        });
        els.addFolderButtonTopbar?.addEventListener("click", addFolderFromMenu);
        els.addFileButtonTopbar?.addEventListener("click", addSingleFileFromMenu);
        els.settingsSourceSearchInput?.addEventListener("input", () => {
          appState.settingsSourceSearch = els.settingsSourceSearchInput.value;
          renderSettingsPanel();
          showSettingsSearchSuggestions(els.settingsSourceSearchInput);
        });
        els.settingsProjectSearchInput?.addEventListener("input", () => {
          appState.settingsProjectSearch = els.settingsProjectSearchInput.value;
          renderSettingsPanel();
          showSettingsSearchSuggestions(els.settingsProjectSearchInput);
        });
        els.settingsProjectSortButton?.addEventListener("click", (event) => {
          event.stopPropagation();
          appState.isSettingsProjectSortMenuOpen = !appState.isSettingsProjectSortMenuOpen;
          appState.isSettingsSkillSortMenuOpen = false;
          renderSettingsArtifactSortMenus();
        });
        els.settingsSkillSearchInput?.addEventListener("input", () => {
          appState.settingsSkillSearch = els.settingsSkillSearchInput.value;
          renderSettingsPanel();
          showSettingsSearchSuggestions(els.settingsSkillSearchInput);
        });
        els.settingsSkillSortButton?.addEventListener("click", (event) => {
          event.stopPropagation();
          appState.isSettingsSkillSortMenuOpen = !appState.isSettingsSkillSortMenuOpen;
          appState.isSettingsProjectSortMenuOpen = false;
          renderSettingsArtifactSortMenus();
        });
        els.hostSettingsMenu?.querySelectorAll("[data-host-settings-tab]").forEach((node) => {
          node.addEventListener("click", async (event) => {
            event.stopPropagation();
            await openSettingsPanelFromOverlay(node.dataset.hostSettingsTab || "skills");
          });
        });
        els.settingsCreateTagButton.addEventListener("click", createTagFromSettings);
        els.settingsNewTagName.addEventListener("keydown", (event) => {
          if (event.key === "Enter") createTagFromSettings();
        });
        document.querySelectorAll("[data-settings-tab]").forEach((node) => {
          node.addEventListener("click", () => {
            appState.settingsKeyboardTablist = "settings";
            appState.settingsTab = node.dataset.settingsTab;
            if (appState.settingsTab === "preferences") {
              appState.updatePreferenceAutoCheckStarted = false;
            }
            renderSettingsPanel();
          });
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && updateDialogIsOpen() && !appState.updateDownload.inProgress) {
            event.preventDefault();
            closeUpdateDialog();
            return;
          }
          if (!appState.isSettingsOpen || els.confirmScrim?.classList.contains("open")) return;
          if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) {
            const activeElement = document.activeElement;
            const focusedTab = activeElement?.closest?.('[role="tab"]');
            const tablistKind = focusedTab?.matches?.("[data-settings-artifact-section]")
              ? "artifact"
              : focusedTab?.matches?.("[data-settings-library-section]")
                ? "library"
                : focusedTab?.matches?.("[data-settings-tab]")
                  ? "settings"
                  : appState.settingsKeyboardTablist;
            if (!tablistKind) return;
            const selector = tablistKind === "artifact"
              ? "[data-settings-artifact-section]"
              : tablistKind === "library"
                ? "[data-settings-library-section]"
                : "[data-settings-tab]";
            const tabs = [...document.querySelectorAll(selector)].filter((node) => node.offsetParent !== null);
            if (tabs.length) {
              event.preventDefault();
              event.stopPropagation();
              const currentIndex = Math.max(0, tabs.findIndex((node) => node.getAttribute("aria-selected") === "true"));
              const nextIndex = event.key === "Home" ? 0
                : event.key === "End" ? tabs.length - 1
                : (currentIndex + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
              tabs[nextIndex].click();
              tabs[nextIndex].focus();
              return;
            }
          }
          if (event.key === "Escape") {
            if (appState.isSettingsProjectSortMenuOpen || appState.isSettingsSkillSortMenuOpen) {
              const returnFocus = appState.isSettingsProjectSortMenuOpen
                ? els.settingsProjectSortButton
                : els.settingsSkillSortButton;
              appState.isSettingsProjectSortMenuOpen = false;
              appState.isSettingsSkillSortMenuOpen = false;
              renderSettingsArtifactSortMenus();
              returnFocus?.focus();
              return;
            }
            event.preventDefault();
            closeSettingsPanel();
            return;
          }
          if (event.key !== "Tab") return;
          const modal = els.settingsScrim.querySelector(".settings-modal");
          const focusable = [...modal?.querySelectorAll('button:not([disabled]):not([hidden]), input:not([disabled]):not([hidden]), select:not([disabled]):not([hidden]), textarea:not([disabled]):not([hidden]), a[href]:not([hidden]), [tabindex]:not([tabindex="-1"]):not([hidden])') || []]
            .filter((node) => node.offsetParent !== null);
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        });
        els.settingsRefreshThumbnailStatusButton.addEventListener("click", refreshThumbnailBackendStatusFromSettings);
        els.settingsRebuildVisibleThumbsButton.addEventListener("click", rebuildVisibleHtmlThumbnails);
        els.settingsRebuildLibraryThumbsButton.addEventListener("click", rebuildCurrentLibraryHtmlThumbnails);
        els.openCurrentFolderButton.addEventListener("click", () => {
          els.libraryPath.value = "/Users/hayley/.openclaw/workspace/nutbook";
          els.libraryName.value = "Nutbook Workspace";
        });
        document.addEventListener("click", (event) => {
          if (appState.isSettingsOverlay && appState.settingsOverlayMode === "menu" && !els.hostSettingsMenu?.contains(event.target)) {
            closeSettingsOverlay();
            return;
          }
          if (appState.isSortMenuOpen && !els.sortMenu.contains(event.target) && !els.sortButton.contains(event.target) && !els.topbarSortButton.contains(event.target)) {
            appState.isSortMenuOpen = false;
            renderSortMenu();
          }
          if (appState.isDocumentTagMenuOpen && !els.documentTagMenu.contains(event.target) && !els.breadcrumbTags.contains(event.target)) {
            appState.isDocumentTagMenuOpen = false;
            renderDocumentTagMenu();
          }
          if (appState.isDocumentMoreMenuOpen && !els.documentMoreMenu.contains(event.target) && !els.documentMoreButton.contains(event.target)) {
            closeDocumentMoreMenu();
          }
          if (appState.isSettingsMenuOpen && !els.settingsMenu.contains(event.target) && !els.settingsButton.contains(event.target)) {
            appState.isSettingsMenuOpen = false;
            renderSettingsMenu();
          }
          if (appState.isSettingsSourceSortMenuOpen && !els.settingsSourceSortMenu.contains(event.target) && !els.settingsSourceSortButton.contains(event.target)) {
            appState.isSettingsSourceSortMenuOpen = false;
            renderSettingsSourceSortMenu();
          }
          if (appState.isSettingsProjectSortMenuOpen && !els.settingsProjectSortMenu.contains(event.target) && !els.settingsProjectSortButton.contains(event.target)) {
            appState.isSettingsProjectSortMenuOpen = false;
            renderSettingsArtifactSortMenus();
          }
          if (appState.isSettingsSkillSortMenuOpen && !els.settingsSkillSortMenu.contains(event.target) && !els.settingsSkillSortButton.contains(event.target)) {
            appState.isSettingsSkillSortMenuOpen = false;
            renderSettingsArtifactSortMenus();
          }
        });
      }

      async function boot() {
        if (appState.isSettingsOverlay) {
          document.documentElement.classList.add("settings-overlay-mode");
          document.body.classList.add("settings-overlay-mode");
          appState.settingsTab = window.__NUTBOOK_SETTINGS_OVERLAY_TAB__ || "skills";
          appState.settingsOverlayMode = window.__NUTBOOK_SETTINGS_OVERLAY_MODE__ || "menu";
          document.body.classList.toggle("settings-overlay-menu", appState.settingsOverlayMode === "menu");
          appState.isAboutOpen = appState.settingsOverlayMode === "about";
          appState.isSettingsOpen = appState.settingsOverlayMode !== "menu" && appState.settingsOverlayMode !== "about" && appState.settingsOverlayMode !== "update";
          appState.isUpdateDialogOpen = appState.settingsOverlayMode === "update";
          wireEvents();
          renderSettingsMenu();
          renderSettingsPanel();
          renderUpdateDialog();
          renderAboutPanel();
          i18n?.observe?.();
          if (appState.settingsOverlayMode === "menu") {
            els.hostSettingsMenu?.addEventListener("mouseenter", cancelHostSettingsOverlayClose);
            els.hostSettingsMenu?.addEventListener("mouseleave", () => scheduleHostSettingsOverlayClose(220));
            window.addEventListener("blur", () => scheduleHostSettingsOverlayClose(80));
            document.addEventListener("visibilitychange", () => {
              if (document.hidden) scheduleHostSettingsOverlayClose(80);
            });
            scheduleHostSettingsOverlayClose(2400);
          }
          if (appState.settingsOverlayMode === "update") {
            await loadUpdateSettings();
            await checkForUpdates({ manual: true, force: true });
          } else if (appState.settingsOverlayMode !== "menu" && appState.settingsOverlayMode !== "about") {
            await loadLibraries();
            await loadTags();
            await loadIgnoredItems();
            await loadDiscoveredArtifactSkills();
            await loadThumbnailBackendStatus();
            await loadUpdateSettings();
            renderSettingsPanel();
          }
          return;
        }

        setSidebarCollapsed(false);
        els.sidebarFootnote.textContent = appState.isTauri
          ? "当前运行在 Tauri 内，页面会直接调用本地后端 command。"
          : "当前不在 Tauri 内，页面会自动切到 mock 数据，方便先看 UI 结构。";

        wireEvents();
        syncShellMode();
        renderTabs();
        renderViewer();
        renderTags();
        renderLibraries();
        renderNavState();
        renderSortMenu();
        renderSettingsMenu();
        renderSettingsPanel();
        i18n?.observe?.();
        applyHomeLayout();
        renderBootLoadingState();
        warmMarkdownEditorApi();

        if (appState.isTauri) {
          if (!cliSyncUnlisten) {
            listenRaw?.("nutbook-cli-sync", async () => {
              await Promise.all([loadLibraries(), loadItems(), loadIgnoredItems(), loadCachedAgentProjects()]);
              if (appState.isSettingsOpen) renderSettingsPanel();
            }).then((unlisten) => { cliSyncUnlisten = typeof unlisten === "function" ? unlisten : (() => {}); }).catch(() => {});
          }
          try {
            appState.localServerOrigin = await invoke("get_local_server_origin");
          } catch (error) {
            setStatus(`本地 HTML 服务启动失败：${normalizeError(error)}`, "error");
          }
        } else {
          appState.localServerOrigin = "http://127.0.0.1:4173";
        }
        await loadUpdateSettings();
        await loadLibraries();
        await loadTags();
        await loadIgnoredItems();
        await loadDiscoveredArtifactSkills();
        await loadThumbnailBackendStatus();
        if (appState.activeLibraryId && !isLibraryPathMissing(appState.activeLibraryId)) {
          await scanLibrary({ silent: true });
        }
        appState.isBooting = false;
        await showAllFilesHome({
          reload: !appState.activeLibraryId || !appState.items.length,
          updateStatus: false
        });
        await ensureWatcher();
        startAutoRefresh();
        scheduleAutomaticUpdateCheck();

        if (!appState.isTauri) {
          appState.activeLibraryId = 1;
          renderLibraries();
          await loadItems();
          setStatus("当前是浏览器 mock 模式；进 Tauri 后会直接调用真实后端。", "warn");
        }
      }

      window.__NUTBOOK_UPDATE_INTERFACE_LANGUAGE__ = (language) => updateInterfaceLanguage(language, { propagateToMain: false });

      boot();
    </script>
  </body>
</html>
