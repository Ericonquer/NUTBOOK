        const scrollTop = Math.max(0, els.viewerBody.scrollTop || 0);
        appState.markdownScrollByTab.set(tab.id, scrollTop);
        tab.markdownScrollTop = scrollTop;
        appState.markdownEditScrollTop = scrollTop;
      }

      function markdownScrollForTab(tab) {
        if (!tab || tab.preview?.fileType !== "markdown") return 0;
        return appState.markdownScrollByTab.get(tab.id) ?? tab.markdownScrollTop ?? 0;
      }

      function restoreMarkdownScroll(tab, scrollTop = markdownScrollForTab(tab)) {
        if (!tab || tab.preview?.fileType !== "markdown") return;
        const expectedTabId = tab.id;
        const target = Math.max(0, Number(scrollTop) || 0);
        const apply = () => {
          if (appState.activeTabId !== expectedTabId) return;
          els.viewerBody.scrollTop = target;
          appState.markdownScrollByTab.set(expectedTabId, target);
          tab.markdownScrollTop = target;
        };
        window.requestAnimationFrame(() => {
          apply();
          window.requestAnimationFrame(apply);
        });
      }

      async function writeClipboardText(text) {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "true");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }

      function setupMarkdownCodeCopyButton(card) {
        if (!card) return;
        if (card.__markdownCodeCopyCleanup) {
          card.__markdownCodeCopyCleanup();
        }
        let layer = Array.from(card.children).find((node) => node.classList?.contains("markdown-code-copy-layer"));
        if (!layer) {
          layer = document.createElement("div");
          layer.className = "markdown-code-copy-layer";
          card.appendChild(layer);
        }
        const buttons = new Map();
        const createButton = (pre) => {
          if (buttons.has(pre)) return buttons.get(pre);
          const button = document.createElement("button");
          button.className = "markdown-code-copy-button";
          button.type = "button";
          button.setAttribute("aria-label", "复制代码块");
          button.innerHTML = `
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="9" width="10" height="10" rx="2"></rect>
              <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="button-tooltip">复制</span>
          `;
          card.appendChild(button);
          const tooltip = button.querySelector(".button-tooltip");
          const setTooltip = (text) => {
            if (tooltip) tooltip.textContent = text;
          };
          button.addEventListener("click", async (event) => {
            event.preventDefault();
            event.stopPropagation();
            try {
              await writeClipboardText(pre.innerText || pre.textContent || "");
              setTooltip("已复制");
              showToast("代码已复制");
              setStatus(t("status.codeCopied"), "ok");
              window.setTimeout(() => setTooltip("复制"), 900);
            } catch (error) {
              setStatus(statusError("status.codeCopyFailedPrefix", error), "error");
            }
          });
          layer.appendChild(button);
          buttons.set(pre, button);
          return button;
        };

        const updateButtonPositions = () => {
          const cardRect = card.getBoundingClientRect();
          buttons.forEach((button, pre) => {
            const preRect = pre.getBoundingClientRect();
            const isVisible = preRect.bottom > cardRect.top && preRect.top < cardRect.bottom && pre.offsetParent !== null;
            button.style.display = isVisible ? "inline-flex" : "none";
            if (!isVisible) return;
            const left = Math.max(8, preRect.right - cardRect.left - 40);
            const top = Math.max(8, preRect.top - cardRect.top + 10);
            button.style.left = `${left}px`;
            button.style.top = `${top}px`;
          });
        };
        let refreshFrame = 0;
        const refreshButtons = () => {
          refreshFrame = 0;
          const currentPres = Array.from(card.querySelectorAll(".markdown-preview pre, .milkdown-editor-root .ProseMirror pre"));
          buttons.forEach((button, pre) => {
            if (!currentPres.includes(pre)) {
              button.remove();
              buttons.delete(pre);
            }
          });
          currentPres.forEach(createButton);
          updateButtonPositions();
        };
        const scheduleRefresh = () => {
          if (refreshFrame) return;
          refreshFrame = window.requestAnimationFrame(refreshButtons);
        };
        const observer = new MutationObserver((mutations) => {
          const onlyCopyLayerChanges = mutations.every((mutation) => mutation.target === layer || layer.contains(mutation.target));
          if (!onlyCopyLayerChanges) scheduleRefresh();
        });
        card.querySelectorAll(".markdown-preview, .milkdown-editor-root").forEach((container) => {
          observer.observe(container, { childList: true, subtree: true });
        });
        refreshButtons();
        window.requestAnimationFrame(scheduleRefresh);
        window.setTimeout(scheduleRefresh, 120);
        window.setTimeout(scheduleRefresh, 360);
        window.addEventListener("resize", updateButtonPositions);
        card.__markdownCodeCopyCleanup = () => {
          if (refreshFrame) {
            window.cancelAnimationFrame(refreshFrame);
            refreshFrame = 0;
          }
          observer.disconnect();
          window.removeEventListener("resize", updateButtonPositions);
          buttons.forEach((button) => button.remove());
          buttons.clear();
          layer?.remove();
          card.__markdownCodeCopyCleanup = null;
        };
      }

      function isExternalHttpUrl(value) {
        return /^https?:\/\//i.test(String(value || "").trim());
      }

      function safeDecodeUri(value) {
        try {
          return decodeURI(value);
        } catch (_) {
          return value;
        }
      }

      function normalizeLinkedFilePath(value) {
        const raw = safeDecodeUri(String(value || "").trim()).replace(/\\/g, "/");
        if (!raw) return "";
        const isAbsolute = raw.startsWith("/");
        const parts = [];
        raw.split("/").forEach((part) => {
          if (!part || part === ".") return;
          if (part === "..") {
            if (parts.length && parts[parts.length - 1] !== "..") {
              parts.pop();
            } else if (!isAbsolute) {
              parts.push(part);
            }
            return;
          }
          parts.push(part);
        });
        return `${isAbsolute ? "/" : ""}${parts.join("/")}`.replace(/\/$/, "");
      }

      function dirnamePath(value) {
        const normalized = normalizeLinkedFilePath(value);
        const index = normalized.lastIndexOf("/");
        return index > 0 ? normalized.slice(0, index) : "";
      }

      function stripLinkFragmentAndQuery(value) {
        const text = String(value || "").trim();
        const hashIndex = text.indexOf("#");
        const queryIndex = text.indexOf("?");
        const cutIndexes = [hashIndex, queryIndex].filter((index) => index >= 0);
        const cutIndex = cutIndexes.length ? Math.min(...cutIndexes) : -1;
        return cutIndex >= 0 ? text.slice(0, cutIndex) : text;
      }

      function markdownLinkedFilePath(href, tab) {
        const target = stripLinkFragmentAndQuery(href);
        if (!target || isExternalHttpUrl(target)) return "";
        if (/^[a-z][a-z0-9+.-]*:/i.test(target) && !target.toLowerCase().startsWith("file:")) {
          return "";
        }
        if (target.toLowerCase().startsWith("file:")) {
          try {
            return normalizeLinkedFilePath(decodeURIComponent(new URL(target).pathname));
          } catch (_) {
            return "";
          }
        }
        if (target.startsWith("/")) {
          return normalizeLinkedFilePath(target);
        }
        const baseDir = dirnamePath(tab?.item?.filePath || "");
        return normalizeLinkedFilePath(`${baseDir}/${target}`);
      }

      function markdownImageFilePath(src, tab) {
        const target = stripLinkFragmentAndQuery(src);
        if (!target || target.startsWith("#") || isExternalHttpUrl(target)) return "";
        if (/^(data|blob):/i.test(target)) return "";
        if (/^[a-z][a-z0-9+.-]*:/i.test(target) && !target.toLowerCase().startsWith("file:")) {
          return "";
        }
        if (target.toLowerCase().startsWith("file:")) {
          try {
            return normalizeLinkedFilePath(decodeURIComponent(new URL(target).pathname));
          } catch (_) {
            return "";
          }
        }
        if (target.startsWith("/")) {
          return normalizeLinkedFilePath(target);
        }
        const baseDir = tab?.preview?.baseDir || dirnamePath(tab?.item?.filePath || "");
        return baseDir ? normalizeLinkedFilePath(`${baseDir}/${target}`) : "";
      }

      function resolveMarkdownImageUrl(src, tab) {
        const targetPath = markdownImageFilePath(src, tab);
        return targetPath ? toLocalServerUrl(targetPath) : "";
      }

      function markdownImageAlignmentFromTitle(title) {
        const match = String(title || "").match(/(?:^|\s)nutbook-align=(left|center|right)(?=\s|$)/i);
        return match?.[1]?.toLowerCase() || "";
      }

      function markdownImageSizeFromTitle(title) {
        const match = String(title || "").match(/(?:^|\s)nutbook-size=(small|medium|large)(?=\s|$)/i);
        return match?.[1]?.toLowerCase() || "large";
      }

      function applyMarkdownImageAlignment(image) {
        const title = image?.getAttribute("title") || "";
        const alignment = markdownImageAlignmentFromTitle(title);
        const explicitWidthText = image?.getAttribute("width") || "";
        const explicitWidth = /^\d+$/.test(explicitWidthText)
          ? Number.parseInt(explicitWidthText, 10)
          : 0;
        const hasPortableWidth = explicitWidth >= 1 && explicitWidth <= 8192;
        const size = hasPortableWidth ? "" : markdownImageSizeFromTitle(title);
        ["left", "center", "right"].forEach((value) => {
          image?.classList.toggle(`nutbook-image-align-${value}`, alignment === value);
        });
        ["small", "medium", "large"].forEach((value) => {
          image?.classList.toggle(`nutbook-image-size-${value}`, size === value);
        });
        if (hasPortableWidth) {
          image.style.width = "auto";
          image.style.height = "auto";
          image.style.maxWidth = `min(${explicitWidth}px, 100%)`;
        }
      }

      function setupMarkdownImageResources(card, tab) {
        if (!card || tab?.preview?.fileType !== "markdown") return;
        card.querySelectorAll(".markdown-preview img[src]").forEach((image) => {
          const originalSrc = image.getAttribute("src") || "";
          const resolvedSrc = resolveMarkdownImageUrl(originalSrc, tab);
          if (resolvedSrc && resolvedSrc !== originalSrc) {
            image.setAttribute("src", resolvedSrc);
          }
          applyMarkdownImageAlignment(image);
        });
      }

      function isSupportedLinkedArtifactPath(path) {
        const ext = String(path || "").split(".").pop()?.toLowerCase();
        return ["md", "markdown", "html", "htm"].includes(ext);
      }

      async function openExternalMarkdownLink(url) {
        if (!isExternalHttpUrl(url)) {
          setStatus(t("status.externalLinksOnly"), "warn");
          return;
        }
        if (appState.isTauri) {
          await invoke("open_external_url_command", { payload: { url } });
        } else {
          window.open(url, "_blank", "noopener,noreferrer");
        }
        setStatus(t("status.externalLinkOpened"), "ok");
      }

      async function findIndexedItemByPath(filePath) {
        const normalized = normalizeLinkedFilePath(filePath);
        const localMatch = appState.items.find((item) => normalizeLinkedFilePath(item.filePath) === normalized);
        if (localMatch) return localMatch;
        if (!appState.isTauri) return null;
        const found = await invoke("find_item_by_path", { payload: { filePath: normalized } });
        return found ? normalizeItem(found) : null;
      }

      function libraryContainsFile(library, filePath) {
        if (!library || library.sourceKind === "file") return false;
        const root = normalizeLinkedFilePath(library.rootPath);
        const target = normalizeLinkedFilePath(filePath);
        return Boolean(root && target && (target === root || target.startsWith(`${root}/`)));
      }

      async function openImportedLinkedFile(targetPath) {
        const target = normalizeLinkedFilePath(targetPath);
        if (!target) return false;

        const existing = await findIndexedItemByPath(target);
        if (existing) {
          await openItem(existing.id);
          return true;
        }

        const containingLibrary = appState.libraries.find((library) => libraryContainsFile(library, target));
        if (containingLibrary) {
          appState.activeLibraryId = containingLibrary.id;
          await scanLibrary();
        } else {
          els.libraryPath.value = target;
          els.libraryName.value = target.split("/").filter(Boolean).pop() || "Linked File";
          const library = await addLibrary("file");
          if (!library?.id) return false;
          appState.activeLibraryId = library.id;
          await scanLibrary();
        }

        await loadLibraries();
        await loadItems();
        const imported = await findIndexedItemByPath(target);
        if (!imported) {
          setStatus(statusWithValue("status.linkImportNotFoundPrefix", target), "warn");
          return false;
        }

        await openItem(imported.id);
        setStatus(statusWithValue("status.linkImportedPrefix", imported.fileName), "ok");
        return true;
      }

      async function confirmImportLinkedFile(targetPath) {
        const fileName = targetPath.split("/").filter(Boolean).pop() || targetPath;
        return appConfirm({
          title: "链接文件还未接入 Nutbook",
          message: `“${fileName}” 不在当前文件列表中。是否接入并打开这个文件？\n${targetPath}`,
          confirmText: "接入并打开",
          cancelText: "取消"
        });
      }

      function markdownLinkTargetLabel(href, tab) {
        if (!href || href.startsWith("#")) return "";
        if (isExternalHttpUrl(href)) return href;
        return markdownLinkedFilePath(href, tab);
      }

      function moveMarkdownLinkTooltip(event) {
        if (!els.markdownLinkTooltip?.classList.contains("open")) return;
        const margin = 12;
        const rect = els.markdownLinkTooltip.getBoundingClientRect();
        let left = event.clientX + margin;
        let top = event.clientY + margin;
        if (left + rect.width > window.innerWidth - margin) {
          left = Math.max(margin, window.innerWidth - rect.width - margin);
        }
        if (top + rect.height > window.innerHeight - margin) {
          top = Math.max(margin, event.clientY - rect.height - margin);
        }
        els.markdownLinkTooltip.style.left = `${left}px`;
        els.markdownLinkTooltip.style.top = `${top}px`;
      }

      function showMarkdownLinkTooltip(label, event) {
        if (!els.markdownLinkTooltip || !label) return;
        els.markdownLinkTooltip.textContent = label;
        els.markdownLinkTooltip.setAttribute("aria-hidden", "false");
        els.markdownLinkTooltip.classList.add("open");
        moveMarkdownLinkTooltip(event);
      }

      function hideMarkdownLinkTooltip() {
        if (!els.markdownLinkTooltip) return;
        els.markdownLinkTooltip.classList.remove("open");
        els.markdownLinkTooltip.setAttribute("aria-hidden", "true");
      }

      async function openMarkdownLocalLink(href, tab) {
        const targetPath = markdownLinkedFilePath(href, tab);
        if (!targetPath) {
          setStatus(t("status.unsupportedLinkType"), "warn");
          return;
        }
        if (!isSupportedLinkedArtifactPath(targetPath)) {
          setStatus(t("status.markdownHtmlLinksOnly"), "warn");
          return;
        }
        const targetItem = await findIndexedItemByPath(targetPath);
        if (!targetItem) {
          const shouldImport = await confirmImportLinkedFile(targetPath);
          if (!shouldImport) {
            setStatus(t("status.linkOpenCancelled"), "warn");
            return;
          }
          await openImportedLinkedFile(targetPath);
          return;
        }
        await openItem(targetItem.id);
      }

      function setupMarkdownLinkHandling(card, tab) {
        if (!card || !tab) return;
        card.querySelectorAll(".markdown-preview, .milkdown-editor-root").forEach((container) => {
          container.querySelectorAll("a[href]").forEach((anchor) => {
            const href = anchor.getAttribute("href") || "";
            if (!href || anchor.getAttribute("title")) return;
            const label = markdownLinkTargetLabel(href, tab);
            if (label) anchor.setAttribute("data-nutbook-link-target", label);
          });
          container.addEventListener("mouseover", (event) => {
            const anchor = event.target.closest?.("a[href]");
            if (!anchor || !container.contains(anchor)) return;
            const label = anchor.getAttribute("data-nutbook-link-target")
              || markdownLinkTargetLabel(anchor.getAttribute("href") || "", tab);
            if (label) showMarkdownLinkTooltip(label, event);
          }, true);
          container.addEventListener("mousemove", (event) => {
            moveMarkdownLinkTooltip(event);
          }, true);
          container.addEventListener("mouseout", (event) => {
            const anchor = event.target.closest?.("a[href]");
            if (!anchor || !container.contains(anchor)) return;
            const related = event.relatedTarget;
            if (related && anchor.contains(related)) return;
            hideMarkdownLinkTooltip();
          });
          container.addEventListener("click", async (event) => {
            const anchor = event.target.closest?.("a[href]");
            if (!anchor || !container.contains(anchor)) return;
            const href = anchor.getAttribute("href") || "";
            if (!href || href.startsWith("#")) return;
            event.preventDefault();
            event.stopPropagation();
            hideMarkdownLinkTooltip();
            try {
              if (isExternalHttpUrl(href)) {
                await openExternalMarkdownLink(href);
              } else {
                await openMarkdownLocalLink(href, tab);
              }
            } catch (error) {
              setStatus(statusError("status.linkOpenFailedPrefix", error), "error");
            }
          }, true);
        });
      }

      function appConfirm({ title = t("actions.confirm"), message = "", detail = "", confirmText = t("actions.confirm"), cancelText = t("actions.cancel"), danger = false } = {}) {
        if (!els.confirmScrim) return Promise.resolve(window.confirm(message || title));
        return new Promise((resolve) => {
          const previousFocus = document.activeElement;
          const handleBackdropClick = (event) => {
            if (event.target === els.confirmScrim) close(false);
          };
          const handleKeydown = (event) => {
            if (event.key === "Escape") {
              event.preventDefault();
              close(false);
              return;
            }
            if (event.key !== "Tab") return;
            const focusable = [...els.confirmScrim.querySelectorAll("button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled])")];
            if (!focusable.length) return;
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus();
            }
          };
          const close = (value) => {
            document.removeEventListener("keydown", handleKeydown, true);
            els.confirmScrim.removeEventListener("click", handleBackdropClick);
            els.confirmScrim.classList.remove("open");
            els.confirmScrim.setAttribute("aria-hidden", "true");
            els.confirmScrim.innerHTML = "";
            previousFocus?.focus?.();
            resolve(value);
          };
          els.confirmScrim.innerHTML = `
            <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="appConfirmTitle" aria-describedby="appConfirmMessage">
              <h3 id="appConfirmTitle" class="confirm-title">${escapeHtml(title)}</h3>
              <p id="appConfirmMessage" class="confirm-message">${escapeHtml(message)}</p>
              ${detail ? `<div class="confirm-detail"><span class="confirm-detail-label">${escapeHtml(t("settings.originalFilePath"))}</span>${escapeHtml(detail)}</div>` : ""}
              <div class="confirm-actions">
                <button class="button button-secondary" type="button" data-confirm-cancel>${escapeHtml(cancelText)}</button>
                <button class="button ${danger ? "button-danger" : "button-primary"}" type="button" data-confirm-ok>${escapeHtml(confirmText)}</button>
              </div>
            </div>
          `;
          els.confirmScrim.classList.add("open");
          els.confirmScrim.setAttribute("aria-hidden", "false");
          document.addEventListener("keydown", handleKeydown, true);
          els.confirmScrim.querySelector("[data-confirm-cancel]")?.addEventListener("click", () => close(false));
          els.confirmScrim.querySelector("[data-confirm-ok]")?.addEventListener("click", () => close(true));
          els.confirmScrim.addEventListener("click", handleBackdropClick);
          els.confirmScrim.querySelector("[data-confirm-cancel]")?.focus();
        });
      }

      function confirmMarkdownUnsavedClose(fileName) {
        if (!els.confirmScrim) {
          return Promise.resolve(window.confirm(formatTranslation("markdown.unsavedCloseMessage", { fileName })) ? "save" : "continue");
        }
        return new Promise((resolve) => {
          const previousFocus = document.activeElement;
          const close = (choice) => {
            document.removeEventListener("keydown", handleKeydown, true);
            els.confirmScrim.removeEventListener("click", handleBackdropClick);
            els.confirmScrim.classList.remove("open");
            els.confirmScrim.setAttribute("aria-hidden", "true");
            els.confirmScrim.innerHTML = "";
            previousFocus?.focus?.();
            resolve(choice);
          };
          const handleBackdropClick = (event) => {
            if (event.target === els.confirmScrim) close("continue");
          };
          const handleKeydown = (event) => {
            if (event.key === "Escape") {
              event.preventDefault();
              close("continue");
              return;
            }
            if (event.key !== "Tab") return;
            const focusable = [...els.confirmScrim.querySelectorAll("button:not([disabled])")];
            if (!focusable.length) return;
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus();
            }
          };
          els.confirmScrim.innerHTML = `
            <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="markdownCloseTitle" aria-describedby="markdownCloseMessage">
              <h3 id="markdownCloseTitle" class="confirm-title">${escapeHtml(t("markdown.unsavedCloseTitle"))}</h3>
              <p id="markdownCloseMessage" class="confirm-message">${escapeHtml(formatTranslation("markdown.unsavedCloseMessage", { fileName }))}</p>
              <div class="confirm-actions">
                <button class="button button-secondary" type="button" data-markdown-close-choice="continue">${escapeHtml(t("markdown.continueEditing"))}</button>
                <button class="button button-secondary" type="button" data-markdown-close-choice="discard">${escapeHtml(t("markdown.discardAndClose"))}</button>
                <button class="button button-primary" type="button" data-markdown-close-choice="save">${escapeHtml(t("markdown.saveAndClose"))}</button>
              </div>
            </div>
          `;
          els.confirmScrim.classList.add("open");
          els.confirmScrim.setAttribute("aria-hidden", "false");
          document.addEventListener("keydown", handleKeydown, true);
          els.confirmScrim.addEventListener("click", handleBackdropClick);
          els.confirmScrim.querySelectorAll("[data-markdown-close-choice]").forEach((button) => {
            button.addEventListener("click", () => close(button.dataset.markdownCloseChoice));
          });
          els.confirmScrim.querySelector('[data-markdown-close-choice="continue"]')?.focus();
        });
      }

      function closeSettingsPanel() {
        if (appState.isSettingsOverlay) {
          const returnFocus = appState.settingsReturnFocus;
          appState.settingsReturnFocus = null;
          closeSettingsOverlay();
          returnFocus?.focus?.();
          return;
        }
        const returnFocus = appState.settingsReturnFocus;
        appState.settingsArtifactView = "list";
        appState.agentArtifactPreview = null;
        appState.isSettingsOpen = false;
        appState.settingsReturnFocus = null;
        renderSettingsPanel();
        returnFocus?.focus?.();
      }

      function appConfirmSelection({ title, message, options = [], confirmText, cancelText = t("actions.cancel"), danger = false } = {}) {
        const available = options.filter((option) => !option.disabled);
        if (!els.confirmScrim) {
          return Promise.resolve(window.confirm(message || title) ? available.filter((option) => option.checked).map((option) => option.id) : null);
        }
        return new Promise((resolve) => {
          const close = (value) => {
            els.confirmScrim.classList.remove("open");
            els.confirmScrim.setAttribute("aria-hidden", "true");
            els.confirmScrim.innerHTML = "";
            resolve(value);
          };
          const optionMarkup = options.map((option) => `
            <label class="confirm-selection-option${option.contextual ? " confirm-selection-option--context" : ""}${option.secondary ? " confirm-selection-option--secondary" : ""}">
              <input type="checkbox" data-confirm-selection="${escapeAttribute(option.id)}"${option.checked ? " checked" : ""}${option.disabled ? " disabled" : ""} />
              <span><span class="confirm-selection-label">${escapeHtml(option.label)}</span><span class="confirm-selection-detail">${escapeHtml(option.detail)}</span></span>
            </label>
          `).join("");
          els.confirmScrim.innerHTML = `
            <div class="confirm-card" role="dialog" aria-modal="true" aria-label="${escapeAttribute(title)}">
              <h3 class="confirm-title">${escapeHtml(title)}</h3>
              <p class="confirm-message">${escapeHtml(message)}</p>
              <div class="confirm-selection-list">${optionMarkup}</div>
              <div class="confirm-actions">
                <button class="button button-secondary" type="button" data-confirm-cancel>${escapeHtml(cancelText)}</button>
                <button class="button ${danger ? "button-danger" : "button-primary"}" type="button" data-confirm-ok></button>
              </div>
            </div>
          `;
          const dialog = els.confirmScrim.querySelector(".confirm-card");
          const ok = dialog?.querySelector("[data-confirm-ok]");
          const selectedIds = () => [...dialog.querySelectorAll("[data-confirm-selection]:checked")].map((input) => input.dataset.confirmSelection);

        try {

          if (navigator.clipboard?.writeText) {
            try {
              await navigator.clipboard.writeText(text);
              copied = true;
            } catch (_) {
            }
          }
          if (!copied) {
            const input = document.createElement("textarea");
            input.value = text;
            input.setAttribute("readonly", "");
            input.style.position = "fixed";
            input.style.opacity = "0";
            document.body.appendChild(input);
            input.select();
            copied = document.execCommand("copy");
            input.remove();
          }
          if (!copied) throw new Error("clipboard unavailable");
          button.textContent = t("settings.agentIntegrationCopied");
        } catch (_) {
          button.textContent = t("settings.agentIntegrationCopyFailed");
        }
        window.setTimeout(() => {
          if (button.isConnected) button.textContent = original;
        }, 2400);

      function stableHtmlEditJson(value) {
        const normalize = (entry) => {
          if (Array.isArray(entry)) return entry.map(normalize);
          if (!entry || typeof entry !== "object") return entry;
          const sorted = {};
          for (const key of Object.keys(entry).sort()) sorted[key] = normalize(entry[key]);
          return sorted;
        };
        return JSON.stringify(normalize(value));
      }

      function htmlEditDocumentStateKey(data) {
        return `${data.dirty ? "1" : "0"}:${stableHtmlEditJson(data.changes)}`;
      }

      function isCompleteHtmlEditDocumentSnapshot(data) {
        if (!Number.isInteger(data?.documentRevision) || data.documentRevision < 0) return false;
        if (typeof data.dirty !== "boolean" || !data.changes || typeof data.changes !== "object" || Array.isArray(data.changes)) return false;
        if (data.dirty !== (Object.keys(data.changes).length > 0)) return false;
        return data.documentRevision !== 0 || (!data.dirty && Object.keys(data.changes).length === 0);
      }

      function acceptHtmlEditDocumentSnapshot(session, data) {
        if (!isCompleteHtmlEditDocumentSnapshot(data)) return false;
        if (data.documentRevision < session.documentRevision) return false;
        const incomingKey = htmlEditDocumentStateKey(data);
        if (data.documentRevision === session.documentRevision && incomingKey !== session.documentStateKey) return false;
        session.documentRevision = data.documentRevision;
        session.documentStateKey = incomingKey;
        session.dirty = data.dirty;
        session.changes = data.changes;
        if (Object.prototype.hasOwnProperty.call(data, "selectedDataId")) session.selectedDataId = data.selectedDataId || null;
        if (data.formatState && typeof data.formatState === "object") session.formatState = data.formatState;
        return true;
      }

      function applyHtmlEditDoneSnapshot(session, data) {
        const revision = data?.documentRevision;
        if (!Number.isInteger(revision)) return { action: "refresh", minimumRevision: session.documentRevision, protocolError: true };
        if (revision < session.documentRevision) return { action: "use-current" };
        if (revision === session.documentRevision) return { action: "use-current", protocolError: !acceptHtmlEditDocumentSnapshot(session, data) };
        if (acceptHtmlEditDocumentSnapshot(session, data)) return { action: "accepted" };
        return { action: "refresh", minimumRevision: revision, protocolError: true };
      }

      function isHtmlEditCleanRevisionSatisfied(session, minimumRevision) {
        return Boolean(session) && session.dirty === false && Number.isInteger(session.documentRevision) && session.documentRevision >= minimumRevision;
      }

      function htmlEditLeaveRequiresSave(session) {
        return Boolean(session?.dirty || session?.requiresPatchReconciliation);

      function canProceedHtmlEditLeaveAfterSnapshotRefresh(session, refreshed) {

        if (message.includes("ASSET_INVALID_TYPE")) return t("htmlEdit.imageInvalidType");
        if (message.includes("ASSET_TOO_LARGE")) return t("htmlEdit.imageTooLarge");

      async function loadHtmlEditRuntimeScript() {
        if (htmlEditRuntimeScriptCache) return htmlEditRuntimeScriptCache;

        if (!response.ok) throw new Error(`Failed to load html edit runtime: ${response.status}`);
        htmlEditRuntimeScriptCache = await response.text();
        return htmlEditRuntimeScriptCache;
      }

      async function loadHtmlEditConverterScript() {
        if (htmlEditConverterScriptCache) return htmlEditConverterScriptCache;
        // The conversion request happens before the editable runtime is
        // installed. Fetching a second frontend asset here can remain pending
        // behind a child WebView transition, leaving the confirmation action
        // with no result. The host ships this static source over the same IPC
        // path that has already registered the conversion lease and read the
        // source patch.

        if (typeof htmlEditConverterScriptCache !== "string" || !htmlEditConverterScriptCache.includes("__NUTBOOK_HTML_EDIT_CONVERTER__")) {

      async function waitForHtmlRuntimeHost(itemId, isCurrent) {
        // openItem resolves once the tab state is rendered, while its child
        // WebView is attached by the subsequent runtime-surface sync. Do not
        // enter editing against that gap: eval returns false before the host
        // exists and leaves a superficially opened, read-only copy behind.
        for (let attempt = 0; attempt < 50; attempt += 1) {
          if (!isCurrent()) return false;
          const attached = await invoke("eval_html_runtime_script_command", {
            itemId,
            script: "void 0;"
          }).catch(() => false);
          if (attached) return true;
          await new Promise((resolve) => window.setTimeout(resolve, 50));
        }
        return false;
      }

      async function waitForHtmlEditableRuntimeDocument(itemId, runtimeSessionId, generation, isCurrent) {
        for (let attempt = 0; attempt < 50; attempt += 1) {
          if (!isCurrent()) return false;
          const requestId = `html-edit-document-ready-${itemId}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
          const ready = await new Promise((resolve) => {
            const finish = (accepted) => {
              appState.htmlEditRuntimeDocumentReadyWaiters.delete(requestId);
              resolve(Boolean(accepted));
            };
            const timeoutId = window.setTimeout(() => finish(false), 120);
            appState.htmlEditRuntimeDocumentReadyWaiters.set(requestId, (data) => {
              window.clearTimeout(timeoutId);
              finish(
                Number(data?.itemId) === itemId
                && data?.runtimeSessionId === runtimeSessionId
                && Number(data?.generation) === generation
              );
            });
            invoke("eval_html_runtime_script_command", {
              itemId,
              script: `(function () {
                if (
                  location.href === "about:blank"
                  || document.readyState !== "complete"
                  || !document.querySelector("[data-editable][data-id]")
                ) return;
                const payload = {
                  type: "html_edit_runtime_document_ready",
                  itemId: ${itemId},
                  requestId: ${JSON.stringify(requestId)},
                  runtimeSessionId: ${JSON.stringify(runtimeSessionId)},
                  generation: ${generation}
                };
                const invoke = window.__TAURI_INTERNALS__?.invoke;

                  Promise.resolve(invoke("html_edit_runtime_message_command", { payload })).catch(function () {});
                }

              window.clearTimeout(timeoutId);
              finish(false);
            });
          });
          if (ready) return true;
          await new Promise((resolve) => window.setTimeout(resolve, 50));
        }
        return false;
      }

      async function createEditableCopyForActiveHtml(itemId) {

        const generation = ++htmlEditConversionGeneration;

      async function navigateHtmlEditPresentationPage(session, pageId) {
        if (!isCurrentHtmlEditSession(session) || !session.presentation?.pageIds?.includes(pageId)) return false;
        const runtimeSessionId = session.runtimeSessionId;
        const generation = session.generation;
        const applied = await invoke("eval_html_runtime_script_command", {
          itemId: session.itemId,
          script: `;(async()=>{let ok=false;try{ok=Boolean(await window.__NUTBOOK_HTML_EDIT__?.goToPresentationPage(${JSON.stringify(pageId)}));}catch(_){}window.__NUTBOOK_HTML_EDIT__?.emitHostMessage?.({type:"html_edit_presentation_navigation_result",runtimeSessionId:${JSON.stringify(runtimeSessionId)},generation:${generation},pageId:${JSON.stringify(pageId)},ok});})();`

        session.presentation.activePageId = pageId;
        session.presentation.pendingNavigationPageId = pageId;

      async function syncHtmlEditPresentationPreview(session, runId) {
        if (!isCurrentHtmlEditSession(session) || !session.presentation?.pages?.length) return false;
        const rail = document.getElementById("presentationEditRail");
        if (!rail) return false;
        const bounds = runtimeHostBounds(rail);
        if (bounds.width < 40 || bounds.height < 40) return false;
        if (!session.presentation.previewInstanceId) session.presentation.previewInstanceId = `presentation-preview-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const key = `${bounds.x}:${bounds.y}:${bounds.width}:${bounds.height}:${session.runtimeSessionId}:${session.generation}:${session.presentation.previewInstanceId}`;

          itemId: session.itemId,
          bounds,
          runtimeSessionId: session.runtimeSessionId,

      function presentationThumbnailKey(session, pageId) {

      function discardPresentationThumbnailsForItem(itemId) {

        for (const key of presentationThumbnailCache.keys()) {
          if (key.startsWith(prefix)) presentationThumbnailCache.delete(key);
        }
      }

      function pumpPresentationThumbnailQueue() {
        while (presentationThumbnailActive < PRESENTATION_THUMBNAIL_CONCURRENCY && presentationThumbnailQueue.length) {
          const task = presentationThumbnailQueue.shift();
          if (!isCurrentHtmlEditSession(task.session) || presentationThumbnailCache.has(task.key)) {
            presentationThumbnailPending.delete(task.key);
            continue;
          }
          presentationThumbnailActive += 1;
          invoke("generate_presentation_thumbnail", {
            itemId: task.session.itemId,
            runtimeSessionId: task.session.runtimeSessionId,
            generation: task.session.generation,
            sourceFileHash: task.session.sourceFileHash,
            pageId: task.pageId
          }).then((thumbnail) => {
            if (!thumbnail?.dataUrl || thumbnail.pageId !== task.pageId) throw new Error("缩略图响应无效");
            presentationThumbnailCache.set(task.key, { dataUrl: thumbnail.dataUrl });
          }).catch(() => {
            // A missing screenshot backend is a recoverable presentation
            // fallback; retain metadata navigation and do not retry forever.
            presentationThumbnailCache.set(task.key, { failed: true });
          }).finally(() => {
            presentationThumbnailActive -= 1;
            presentationThumbnailPending.delete(task.key);
            if (isCurrentHtmlEditSession(task.session)) renderHtmlEditPresentationRail(task.session);
            pumpPresentationThumbnailQueue();
          });
        }

        if (!PRESENTATION_VISUAL_THUMBNAILS_ENABLED) return;
        if (!isCurrentHtmlEditSession(session)) return;
        const key = presentationThumbnailKey(session, pageId);
        if (presentationThumbnailCache.has(key) || presentationThumbnailPending.has(key)) return;
        presentationThumbnailPending.add(key);
        presentationThumbnailQueue.push({ session, pageId, key });
        pumpPresentationThumbnailQueue();
      }

        // Capture the active page first, followed by the immediately useful
        // neighbours. Scrolling a card into view requests the remaining pages.
        for (let offset = 0; offset <= 4; offset += 1) {
          const page = pages[activeIndex + offset] || pages[activeIndex - offset];
          if (page) requestPresentationThumbnail(session, page.id);

            thumbnail.innerHTML = `<span>${escapeHtml(presentationPage.title || "未命名页面")}</span><small>${escapeHtml(presentationPage.kind || "presentation")}</small>`;
          } else if (cachedThumbnail?.dataUrl) {
            const image = document.createElement("img");
            image.src = cachedThumbnail.dataUrl;
            image.alt = `${presentationPage.title || "未命名页面"} 缩略图`;
            thumbnail.append(image);
          } else if (!cachedThumbnail?.failed) {
            thumbnail.classList.add("is-loading");
          }
          const meta = document.createElement("span");
          meta.className = "presentation-edit-page-meta";
          meta.innerHTML = `<span class="presentation-edit-page-index">${escapeHtml(String(presentationPage.index))}</span><span class="presentation-edit-page-copy"><span class="presentation-edit-page-title">${escapeHtml(presentationPage.title || "未命名页面")}</span><span class="presentation-edit-page-kind">${escapeHtml(presentationPage.kind || "presentation")}</span></span>`;
          button.append(thumbnail, meta);
          button.addEventListener("click", () => selectHtmlEditPresentationPage(session, presentationPage.id));
          button.addEventListener("mouseenter", () => requestPresentationThumbnail(session, presentationPage.id), { once: true });
          rail.append(button);
        }
        rail.scrollTop = previousScrollTop;
        const requestVisibleThumbnails = () => {
          const railRect = rail.getBoundingClientRect();
          for (const card of rail.querySelectorAll(".presentation-edit-page")) {
            const rect = card.getBoundingClientRect();
            const cardIndex = [...rail.children].indexOf(card) - 1;
            const pageId = session.presentation.pages[cardIndex]?.id;
            if (pageId && rect.bottom >= railRect.top - 120 && rect.top <= railRect.bottom + 120) requestPresentationThumbnail(session, pageId);
          }
        };
        if (rail.__nutbookPresentationScrollHandler) rail.removeEventListener("scroll", rail.__nutbookPresentationScrollHandler);
        rail.__nutbookPresentationScrollHandler = requestVisibleThumbnails;
        rail.addEventListener("scroll", requestVisibleThumbnails, { passive: true });
        requestVisibleThumbnails();
        prefetchPresentationThumbnails(session);
      }

      async function navigateHtmlEditSection(session, pageId, requestId) {
        if (!isCurrentHtmlEditSession(session) || !session.sectionNavigation?.pageIds?.includes(pageId)) return false;
        const payload = {
          itemId: session.itemId,
          runtimeSessionId: session.runtimeSessionId,
          generation: session.generation,
          pageId,
          requestId,
          requestEpoch: session.sectionNavigationEpoch
        };
        return Boolean(await invoke("eval_html_runtime_script_command", {
          itemId: session.itemId,
          script: `;(function(payload){let accepted=false;try{accepted=Boolean(window.__NUTBOOK_HTML_EDIT__?.goToSection(payload));}catch(_){}if(!accepted)window.__NUTBOOK_HTML_EDIT__?.emitHostMessage?.({type:"html_edit_section_navigation_result",requestId:payload.requestId,pageId:payload.pageId,requestEpoch:payload.requestEpoch,ok:false,reason:"rejected"});})(${JSON.stringify(payload)});`
        }).catch(() => false));
      }

      function selectHtmlEditSection(session, pageId) {
        const navigation = session.sectionNavigation;
        if (!isCurrentHtmlEditSession(session) || !navigation?.pageIds?.includes(pageId) || navigation.pendingRequestId || navigation.activePageId === pageId) return;
        const requestId = `section-${session.generation}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        navigation.pendingRequestId = requestId;
        navigation.pendingPageId = pageId;
        renderHtmlEditSectionNavigationRail(session);
        navigateHtmlEditSection(session, pageId, requestId).then((applied) => {
          if (!applied && isCurrentHtmlEditSession(session) && navigation.pendingRequestId === requestId) {
            navigation.pendingRequestId = null;
            navigation.pendingPageId = null;
            renderHtmlEditSectionNavigationRail(session);
            setStatus(t("htmlEdit.sectionNavigationFailed"), "warn");
          }
        });
      }

      function applyHtmlEditSectionNavigationReady(session, snapshot, requestEpoch = null) {
        if (!isCurrentHtmlEditSession(session) || !snapshot || !Array.isArray(snapshot.pages) || snapshot.pages.length < 2) return false;
        const pages = snapshot.pages.map((page, index) => ({
          id: String(page?.id || ""),
          index: Number.isInteger(page?.index) ? page.index : index + 1,
          title: String(page?.title || ""),
          kind: page?.kind === "scroll-snap" ? "scroll-snap" : "section"
        }));
        const pageIds = pages.map((page) => page.id);
        if (pageIds.some((id) => !id) || new Set(pageIds).size !== pageIds.length || !pageIds.includes(snapshot.activePageId)) return false;
        const epoch = Number.isInteger(requestEpoch) ? requestEpoch : Number.isInteger(snapshot.requestEpoch) ? snapshot.requestEpoch : session.sectionNavigationEpoch;
        if (epoch < session.sectionNavigationEpoch) return false;
        session.sectionNavigationEpoch = epoch;
        session.sectionNavigation = {
          pages,
          pageIds,
          activePageId: snapshot.activePageId,
          pendingRequestId: null,
          pendingPageId: null
        };
        renderHtmlEditSectionNavigationRail(session);
        return true;
      }

      function renderHtmlEditSectionNavigationRail(session = appState.htmlEditSession) {
        const page = document.querySelector(".runtime-host-page");
        const rail = document.getElementById("sectionNavigationRail");
        if (!page || !rail) return;
        if (!isCurrentHtmlEditSession(session) || !session.sectionNavigation?.pages?.length) {
          page.classList.remove("section-navigation-editing");
          rail.replaceChildren();
          return;
        }
        page.classList.add("section-navigation-editing");
        const previousScrollTop = rail.scrollTop;
        rail.replaceChildren();
        const heading = document.createElement("div");
        heading.className = "presentation-edit-rail-title";
        heading.textContent = `${t("htmlEdit.sectionNavigationTitle")} · ${session.sectionNavigation.pages.length}`;
        rail.append(heading);
        for (const section of session.sectionNavigation.pages) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "presentation-edit-page";
          button.classList.toggle("is-active", section.id === session.sectionNavigation.activePageId);
          button.classList.toggle("is-pending", section.id === session.sectionNavigation.pendingPageId);
          button.setAttribute("aria-current", section.id === session.sectionNavigation.activePageId ? "location" : "false");
          const meta = document.createElement("span");
          meta.className = "presentation-edit-page-meta";
          const index = document.createElement("span");
          index.className = "presentation-edit-page-index";
          index.textContent = String(section.index).padStart(2, "0");
          const copy = document.createElement("span");
          copy.className = "presentation-edit-page-copy";
          const title = document.createElement("span");
          title.className = "presentation-edit-page-title";
          title.textContent = section.title || `第 ${section.index} 段`;
          const kind = document.createElement("span");
          kind.className = "presentation-edit-page-kind";
          kind.textContent = section.kind;
          copy.append(title, kind);
          meta.append(index, copy);
          button.append(meta);
          button.addEventListener("click", () => selectHtmlEditSection(session, section.id));
          rail.append(button);
        }
        rail.scrollTop = previousScrollTop;
      }

      function refreshHtmlEditSectionNavigation(session = appState.htmlEditSession) {
        if (!isCurrentHtmlEditSession(session) || !session.sectionNavigation) return;
        const requestEpoch = ++session.sectionNavigationEpoch;
        const script = `window.__NUTBOOK_HTML_EDIT__?.refreshSectionNavigation(${JSON.stringify({
          itemId: session.itemId,
          runtimeSessionId: session.runtimeSessionId,
          generation: session.generation,
          requestEpoch
        })});`;
        const apply = (remainingAttempts) => invoke("eval_html_runtime_script_command", { itemId: session.itemId, script }).then((applied) => {
          if (!applied && remainingAttempts > 0 && isCurrentHtmlEditSession(session) && session.sectionNavigationEpoch === requestEpoch) {
            window.setTimeout(() => apply(remainingAttempts - 1), 80);
          }
        }).catch(() => false);
        apply(2);
      }

      async function injectHtmlEditRuntime(itemId, runtimeSessionId, patchResponse, isCurrent) {
        if (!isCurrent()) return false;
        const runtimeScript = await loadHtmlEditRuntimeScript();
        if (!isCurrent()) return false;
        await invoke("eval_html_runtime_script_command", {
          itemId,
          script: `
            (function (source) {
              if (window.__NUTBOOK_HTML_EDIT__) return;
              (0, eval)(source);
            })(${JSON.stringify(runtimeScript)});
          `
        });
        if (!isCurrent()) return false;
        await invoke("eval_html_runtime_script_command", {
          itemId,
          script: `
            window.__NUTBOOK_HTML_EDIT_PENDING_SESSION__ = ${JSON.stringify(runtimeSessionId)};
            (function waitForHtmlEditRuntime(attempt) {
              if (window.__NUTBOOK_HTML_EDIT_PENDING_SESSION__ !== ${JSON.stringify(runtimeSessionId)}) return;
              if (window.__NUTBOOK_HTML_EDIT__) {
                window.__NUTBOOK_HTML_EDIT__.enter(${JSON.stringify({
                  itemId,
                  runtimeSessionId,
                  patch: patchResponse.patch || null,
                  patchApplyStatus: patchResponse.patchApplyStatus,
                  fieldApplyResults: patchResponse.fieldApplyResults || {},
                  runtimeAssetUrls: patchResponse.runtimeAssetUrls || {},
                  patchRevision: patchResponse.patchRevision || 0,
                  generation: appState.htmlEditSession?.runtimeSessionId === runtimeSessionId ? appState.htmlEditSession.generation : 0,
                  inlineToolbar: Boolean(appState.htmlEditSession?.runtimeSessionId === runtimeSessionId && usesInlineHtmlEditToolbarForSession(appState.htmlEditSession)),
                  locale: appState.language
                })});
                if (window.__NUTBOOK_HTML_EDIT_PENDING_SESSION__ === ${JSON.stringify(runtimeSessionId)}) {
                  window.__NUTBOOK_HTML_EDIT_PENDING_SESSION__ = "";
                }
                return;
              }
              if (attempt > 40) {
                window.__NUTBOOK_HTML_EDIT_PENDING_SESSION__ = "";
                document.title = "__NUTBOOK_HTML_EDIT_RUNTIME__:" + JSON.stringify({
                  type: "html_edit_ready",
                  itemId: ${itemId},
                  runtimeSessionId: ${JSON.stringify(runtimeSessionId)},
                  generation: ${appState.htmlEditSession?.runtimeSessionId === runtimeSessionId ? appState.htmlEditSession.generation : 0},
                  count: 0,
                  duplicates: [],
                  shortcutsIntercepted: false
                });
                return;
              }
              setTimeout(function () { waitForHtmlEditRuntime(attempt + 1); }, 50);
            })(0);
          `
        });
        if (!isCurrent()) return false;
        return true;
      }

      async function enterHtmlEditMode(itemId) {
        const tab = getOpenTab(itemId);
        if (!tab || tab.preview?.fileType !== "html-runtime") return;
        if (appState.htmlEditSession?.itemId === itemId) {
          await syncHtmlEditToolbar();
          return;
        }
        if (appState.htmlEditSession && !(await confirmHtmlEditLeaveIfNeeded(appState.htmlEditSession.itemId))) return;
        const generation = nextHtmlEditSessionGeneration();
        if (!isHtmlEditEnterCurrent(itemId, generation)) return;
        const runtimeSessionId = `html-edit-${itemId}-${Date.now()}`;
        let response;
        try {
          await invoke("register_html_edit_session_lease", { itemId, runtimeSessionId, generation });
          response = await invoke("get_html_edit_patch", { itemId, runtimeSessionId, generation });
        } catch (error) {
          await invoke("invalidate_html_edit_session_lease", { itemId, runtimeSessionId, generation }).catch(() => false);
          throw error;
        }
        if (!isHtmlEditEnterCurrent(itemId, generation)) {
          await invoke("invalidate_html_edit_session_lease", { itemId, runtimeSessionId, generation }).catch(() => false);
          return;
        }
        if (response.patchApplyStatus !== "clean") {
          await invoke("invalidate_html_edit_session_lease", { itemId, runtimeSessionId, generation }).catch(() => false);
          setStatus(t("htmlEdit.sourceChanged"), "warn");
          return;
        }
        appState.htmlEditSession = {
          itemId,
          runtimeSessionId,
          artifactEditId: response.artifactEditId,
          sourceFileHash: response.sourceFileHash,
          sourceModifiedAt: response.sourceModifiedAt,
          patchRevision: response.patchRevision || 0,
          generation,
          state: "editing",
          documentRevision: 0,
          assetImportGeneration: 0,
          assetRequestEpoch: 0,
          activeAssetRequestId: "",
          documentStateKey: htmlEditDocumentStateKey({ dirty: false, changes: {} }),
          dirty: false,
          changes: {},
          selectedDataId: null,
          formatState: defaultHtmlEditToolbarFormatState(),
          saveInFlight: null,
          requiresPatchReconciliation: false,
          persistedChanges: response.patch?.changes && typeof response.patch.changes === "object" ? structuredClone(response.patch.changes) : {},
          shortcutsIntercepted: false,
          inlineToolbar: true,
          presentation: null,
          sectionNavigation: null,
          sectionNavigationEpoch: 0
        };
        const session = appState.htmlEditSession;
        const isCurrent = () => isCurrentHtmlEditSession(session);
        try {
          if (!isCurrent()) {
            await invoke("invalidate_html_edit_session_lease", { itemId, runtimeSessionId, generation }).catch(() => false);
            return;
          }
          const documentReady = await waitForHtmlEditableRuntimeDocument(
            itemId,
            runtimeSessionId,
            generation,
            isCurrent
          );
          if (!documentReady || !isCurrent()) {
            await invoke("invalidate_html_edit_session_lease", { itemId, runtimeSessionId, generation }).catch(() => false);
            if (appState.htmlEditSession?.runtimeSessionId === runtimeSessionId) {
              appState.htmlEditSession = null;
            }
            return;
          }
          const injected = await injectHtmlEditRuntime(itemId, runtimeSessionId, response, isCurrent);
          if (!injected || !isCurrent()) {
            await closeStaleHtmlEditToolbar(itemId);
            await invoke("invalidate_html_edit_session_lease", { itemId, runtimeSessionId, generation }).catch(() => false);
            if (appState.htmlEditSession?.runtimeSessionId === runtimeSessionId) {
              appState.htmlEditSession = null;
              appState.htmlEditToolbarVisible = false;
              appState.htmlEditToolbarSyncPending = false;
            }
            return;
          }
          await syncHtmlEditToolbar();
          if (appState.htmlFind.itemId === itemId) await updateActiveHtmlFindContent();
          if (!isCurrent()) {
            await closeStaleHtmlEditToolbar(itemId);
          }
        } catch (error) {
          await invoke("invalidate_html_edit_session_lease", { itemId, runtimeSessionId, generation }).catch(() => false);
          await invoke("close_html_edit_toolbar_overlay_command", { itemId }).catch(() => false);
          if (appState.htmlEditSession?.runtimeSessionId === runtimeSessionId) {
            appState.htmlEditSession = null;
          }
          appState.htmlEditToolbarVisible = false;
          appState.htmlEditToolbarSyncPending = false;
          throw error;
        }
      }

      function htmlEditToolbarBounds(formatState) {
        const preferredWidth = formatState?.editRole === "content" ? 640 : formatState?.editRole === "short" ? 360 : 260;
        const width = Math.max(0, Math.min(preferredWidth, window.innerWidth - 16));
        const height = 56;
        return {
          x: Math.max(0, Math.round((window.innerWidth - width) / 2)),
          y: Math.max(0, Math.round(window.innerHeight - height - 24)),
          width,
          height
        };
      }

      async function syncHtmlEditToolbar() {
        if (appState.htmlEditToolbarSyncInFlight) {
          appState.htmlEditToolbarSyncPending = true;
          return;
        }
        appState.htmlEditToolbarSyncInFlight = true;
        appState.htmlEditToolbarSyncPending = false;
        try {
          await syncHtmlEditToolbarNow();
        } finally {
          appState.htmlEditToolbarSyncInFlight = false;
          if (appState.htmlEditToolbarSyncPending) {
            appState.htmlEditToolbarSyncPending = false;
            syncHtmlEditToolbar().catch((error) => {
              setStatus(htmlEditSaveErrorStatus(error), "error");
            });
          }
        }
      }

      async function syncHtmlEditToolbarNow() {
        const session = appState.htmlEditSession;
        if (!session) return;
        const isCurrent = (options) => isCurrentHtmlEditSession(session, options);
        if (usesInlineHtmlEditToolbarForSession(session)) {
          await invoke("close_html_edit_toolbar_overlay_command", { itemId: session.itemId }).catch(() => false);
          if (isCurrent({ requireActive: false })) appState.htmlEditToolbarVisible = false;
          return;
        }
        if (getActiveTab()?.id !== session.itemId) {
          if (appState.htmlEditToolbarVisible) {
            if (!isCurrent({ requireActive: false })) return;
            await invoke("set_html_edit_toolbar_overlay_visibility_command", {
              itemId: session.itemId,
              visible: false
            }).catch(() => false);
            if (!isCurrent({ requireActive: false })) return;
            appState.htmlEditToolbarVisible = false;
            if (getActiveTab()?.id === session.itemId) {
              appState.htmlEditToolbarSyncPending = true;
            }
          }
          return;
        }
        if (!isCurrent()) return;
        await invoke("attach_html_edit_toolbar_overlay_command", {
          itemId: session.itemId,
          bounds: htmlEditToolbarBounds(session.formatState),
          runtimeSessionId: session.runtimeSessionId,
          generation: session.generation,
          dirty: Boolean(session.dirty),
          selectedDataId: session.selectedDataId || null,
          formatState: session.formatState || defaultHtmlEditToolbarFormatState()
        });
        if (!isCurrent()) {
          await closeStaleHtmlEditToolbar(session.itemId);
          return;
        }
        appState.htmlEditToolbarVisible = true;
      }

      function htmlEditMarkSavedWaiterKey(runtimeSessionId, requestId) {
        return `${runtimeSessionId || ""}:${requestId || ""}`;
      }

      function waitForHtmlEditMarkSavedResult(runtimeSessionId, requestId) {
        const key = htmlEditMarkSavedWaiterKey(runtimeSessionId, requestId);
        return new Promise((resolve) => {
          const timeoutId = window.setTimeout(() => {
            appState.htmlEditMarkSavedWaiters.delete(key);
            resolve(false);
          }, 1200);
          appState.htmlEditMarkSavedWaiters.set(key, (saved) => {
            window.clearTimeout(timeoutId);
            resolve(Boolean(saved));
          });
        });
      }

      function cancelHtmlEditCleanRevisionWaiter(runtimeSessionId) {
        const waiter = appState.htmlEditCleanRevisionWaiters.get(runtimeSessionId);
        if (!waiter) return;
        appState.htmlEditCleanRevisionWaiters.delete(runtimeSessionId);
        window.clearTimeout(waiter.timeoutId);
        waiter.resolve(null);
      }

      function waitForHtmlEditCleanRevision(runtimeSessionId, minimumRevision) {
        cancelHtmlEditCleanRevisionWaiter(runtimeSessionId);
        let resolvePromise = () => {};
        const promise = new Promise((resolve) => { resolvePromise = resolve; });
        const waiter = {
          minimumRevision,
          resolve: resolvePromise,
          timeoutId: window.setTimeout(() => cancelHtmlEditCleanRevisionWaiter(runtimeSessionId), 1200)
        };
        appState.htmlEditCleanRevisionWaiters.set(runtimeSessionId, waiter);
        return { promise, cancel: () => cancelHtmlEditCleanRevisionWaiter(runtimeSessionId) };
      }

      function resolveHtmlEditCleanRevisionWaiter(session) {
        const waiter = appState.htmlEditCleanRevisionWaiters.get(session?.runtimeSessionId);
        if (!waiter || !isHtmlEditCleanRevisionSatisfied(session, waiter.minimumRevision)) return;
        appState.htmlEditCleanRevisionWaiters.delete(session.runtimeSessionId);
        window.clearTimeout(waiter.timeoutId);
        waiter.resolve(session.documentRevision);
      }

      async function saveActiveHtmlEditPatch() {
        const session = appState.htmlEditSession;
        if (!session) return htmlEditSaveResult();
        // The image picker and the child runtime communicate asynchronously.  Do
        // not treat a host-side clean cache as authoritative: first request a
        // fresh snapshot so an immediately-clicked Save cannot silently skip a
        // just-imported image.
        const refreshed = await refreshHtmlEditRuntimeState(session, session.documentRevision);
        logHtmlEditSaveCoordinator(session, `host-save-refreshed:${refreshed ? "accepted" : "rejected"}`);
        if (appState.htmlEditSession !== session) return htmlEditSaveResult({ saved: true, canLeave: true, sessionChanged: true });
        if (!refreshed && !htmlEditLeaveRequiresSave(session)) {
          logHtmlEditSaveCoordinator(session, "host-save-retry-needed");
          setStatus(htmlEditSaveNeedsRetryStatus(), "warn");
          return htmlEditSaveResult();
        }
        if (!htmlEditLeaveRequiresSave(session)) {
          logHtmlEditSaveCoordinator(session, "host-save-already-clean");
          return htmlEditSaveResult({ saved: true, canLeave: true });
        }
        if (session.saveInFlight) {
          logHtmlEditSaveCoordinator(session, "host-save-waiting-for-prior");
          // Never return an earlier Save's result for a newer document state.
          // In particular, Undo can make the document dirty while the prior
          // save request is unwinding. Wait for it, release a stale lock, then
          // start over from a fresh child snapshot.
          const activeSave = session.saveInFlight;
          await activeSave;
          if (appState.htmlEditSession !== session) return htmlEditSaveResult({ saved: true, canLeave: true, sessionChanged: true });
          if (session.saveInFlight === activeSave) session.saveInFlight = null;
          return saveActiveHtmlEditPatch();
        }
        const runtimeSessionId = session.runtimeSessionId;
        const generation = session.generation;
        const savedChangesJson = stableHtmlEditJson(session.changes || {});
        const savedDocumentRevision = session.documentRevision;
        const candidatePersistedChanges = mergeHtmlEditPatchChanges(session.persistedChanges, session.changes);
        // Commit needs the full canonical state: an older sidecar may contain
        // changes this runtime did not touch during the current save.
        const changesForSave = candidatePersistedChanges;
        let savePromise;
        savePromise = (async () => {
          try {
            logHtmlEditSaveCoordinator(session, "host-save-commit-start");
            const result = await invoke("commit_html_edit", {
              itemId: session.itemId,
              runtimeSessionId,
              generation,
              artifactEditId: session.artifactEditId,
              expectedFileHash: session.sourceFileHash,
              expectedModifiedAt: session.sourceModifiedAt,
              changes: changesForSave
            });
            logHtmlEditSaveCoordinator(session, "host-save-commit-success");
            if (appState.htmlEditSession !== session || session.generation !== generation || session.runtimeSessionId !== runtimeSessionId) {
              return htmlEditSaveResult({ saved: true, canLeave: true, sessionChanged: true });
            }
            session.patchRevision = 0;
            session.sourceCommitted = true;
            session.sourceFileHash = result.sourceFileHash ?? session.sourceFileHash;
            session.sourceModifiedAt = result.sourceModifiedAt ?? session.sourceModifiedAt;
            // The commit is now the source of truth for presentation pixels.
            // Do not show a previous page bitmap after a successful save.
            discardPresentationThumbnailsForItem(session.itemId);
            // B2 部分成功合同：前端只根据 durable save ack（sourceSaved）更新保存状态。
            // indexSynchronized=false 时内容已保存、缩略图索引待同步（marker 已写，
            // list/启动重放后补排队），保留明确警告语义，绝不能把它当成保存失败。
            // indexSynchronized=true 时后台为当前 item 排队最新 generation，保存流程
            // 不等待 Chromium，toolbar ack / markSaved / 离开协调器都不被截图阻塞。
            const indexSyncPending = result?.indexSynchronized === false;
            if (indexSyncPending) {
              setStatus(t("htmlEdit.savedIndexPending"), "warn");
            } else {
              queueThumbnailRefreshAfterHtmlSave(session.itemId, result);
            }
            if (markHtmlEditPatchOutOfSync(session, savedChangesJson)) {
              setStatus(htmlEditSaveNeedsRetryStatus(), "warn");
              // Toolbar presentation is deliberately outside the persistence
              // critical section.  The overlay is another WebView and can be
              // delayed while a modal is visible; keeping the save lock until
              // it answers made a completed Save permanently block the next
              // Save after Undo.
              syncHtmlEditToolbar().catch((error) => setStatus(htmlEditSaveErrorStatus(error), "error"));
              return htmlEditSaveResult({ saved: true, canLeave: false });
            }
            const preMarkSavedRevision = session.documentRevision;
            const markSavedRequestId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
            const markSavedResult = waitForHtmlEditMarkSavedResult(runtimeSessionId, markSavedRequestId);
            try {
              await invoke("eval_html_runtime_script_command", {
                itemId: session.itemId,
                script: `
                  (function () {
                    var runtimeSessionId = ${JSON.stringify(runtimeSessionId)};
                    var requestId = ${JSON.stringify(markSavedRequestId)};
                    var saved = false;
                    try {
                      if (window.__NUTBOOK_HTML_EDIT__) {
                        saved = Boolean(window.__NUTBOOK_HTML_EDIT__.markSaved(${JSON.stringify({ runtimeSessionId, expectedDocumentRevision: savedDocumentRevision })}));
                      }
                    } catch (_) {
                      saved = false;
                    }
                    if (window.__NUTBOOK_HTML_EDIT__?.emitHostMessage) {
                      window.__NUTBOOK_HTML_EDIT__.emitHostMessage({
                        type: "html_edit_mark_saved_result",
                        runtimeSessionId: runtimeSessionId,
                        requestId: requestId,
                        saved: saved
                      });
                    }
                  })();
                `
              });
            } catch (error) {
              session.requiresPatchReconciliation = true;
              setStatus(htmlEditSaveNeedsRetryStatus(), "warn");
              return htmlEditSaveResult({ saved: true, canLeave: false });
            }
            const markSavedOk = await markSavedResult;
            if (appState.htmlEditSession !== session || session.generation !== generation || session.runtimeSessionId !== runtimeSessionId) {
              return htmlEditSaveResult({ saved: true, canLeave: true, sessionChanged: true });
            }
            if (!markSavedOk) {
              session.requiresPatchReconciliation = true;
              setStatus(htmlEditSaveNeedsRetryStatus(), "warn");
              syncHtmlEditToolbar().catch((error) => setStatus(htmlEditSaveErrorStatus(error), "error"));
              return htmlEditSaveResult({ saved: true, canLeave: false });
            }
            // `markSaved` is the child runtime's authoritative acknowledgement
            // that this exact revision has become its baseline. Do not hold the
            // save lock waiting for a second asynchronous state message: a user
            // can undo before that message arrives, which otherwise makes every
            // later Save reuse this stale in-flight promise.
            session.documentRevision = Math.max(session.documentRevision, preMarkSavedRevision + 1);
            session.documentStateKey = htmlEditDocumentStateKey({ dirty: false, changes: {} });
            session.dirty = false;
            session.changes = {};
            session.requiresPatchReconciliation = false;
            session.persistedChanges = {};

          ? [activeDirtyTab, ...dirtyTabs.filter((tab) => tab.id !== activeTabId)]
