<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nutbook HTML Controls</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      position: relative;
      pointer-events: none;
      overflow: hidden;
    }

    .panel {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .panel.hidden { display: none; }

    .fullscreen-hint {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      background: rgba(17, 17, 19, 0.58);
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0;
      box-shadow: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 520ms ease, transform 520ms ease;
    }

    .fullscreen-hint.show {
      opacity: 1;
    }

    .fullscreen-hint.fade-out {
      opacity: 0;
      transform: translate(-50%, -8px);
    }

    .row {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 0;
      box-sizing: border-box;
      pointer-events: none;
    }

    .tag-row, .actions-row { pointer-events: auto; }

    .tag-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      overflow: visible;
      min-width: 0;
      min-height: 40px;
      flex: 1 1 auto;
    }

    .actions-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      flex: 0 0 auto;
    }

    .tag-chip {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(31, 35, 40, 0.16);
      color: #5e5e63;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      box-shadow: 0 1px 2px rgba(31, 35, 40, 0.06);
      white-space: nowrap;
      position: relative;
      cursor: default;
      max-width: min(88px, 30vw);
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
    }
    .tag-chip.show { display: inline-flex; }

    /* A1.3 第五轮：来源徽标分组必须是 flex 容器，内部徽标才能随空间压缩
       （普通 inline span 内徽标永不收缩，会把自定义标签挤出小岛边缘） */
    .source-badge-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 0 1 auto;
    }
    .tag-chip.meta {
      flex: 0 0 auto; /* 类型 chip 与 MD 工具栏一致：不可收缩 */
    }

    .tag-chip.custom-btn {
      cursor: pointer;
      overflow: visible;
      /* A1.3 第五轮：自定义标签优先全量（上限 176px），保底 56px ≥ 2 个中文字，绝不只剩省略号 */
      min-width: 56px;
      max-width: min(176px, 30vw);
    }
    .tag-chip.custom-btn:hover {
      background: rgba(20, 20, 20, 0.1);
      color: #111;
    }
    #customTagName {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* A1.3：自定义标签 +N（多标签），与 MD 工具栏 tag-chip-more 一致，不可收缩 */
    .tag-chip-more {
      flex: 0 0 auto;
      min-width: 0;
      padding: 0 7px;
      cursor: default;
    }

    .tag-chip.placeholder-btn {
      cursor: pointer;
      border: 1px dashed rgba(20, 20, 20, 0.16);
      background: rgba(20, 20, 20, 0.02);
    }
    .tag-chip.placeholder-btn:hover {
      background: rgba(20, 20, 20, 0.1);
      color: #111;
    }

    .tag-remove {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 14px;
      height: 14px;
      border: 0;
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.72);
      color: #fff;
      font-size: 8px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease;
    }
    .tag-chip.custom-btn:hover .tag-remove {
      opacity: 1;
      pointer-events: auto;
    }

    /* A1.3：来源徽标（与主页卡片 / Markdown 工具栏同一 sourceBadges 语义，样式与 MD 工具栏统一）。
       顺序固定 自定义 → Project → Skill → 类型；主徽标 min-width 40 / max-width 88 可 ellipsis，
       +N 与类型不可收缩；tooltip 必须留在 overlay bounds 内，显示与否以实测 viewport 高度为门控。 */
    .source-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(31, 35, 40, 0.16);
      color: #5e5e63;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      box-shadow: 0 1px 2px rgba(31, 35, 40, 0.06);
      white-space: nowrap;
      position: relative;
      cursor: default;
      /* A1.3 第五轮：上限 120px ≈ 一个完整英文单词/11 中文字（不多不少）；不足时收缩到 40px */
      max-width: 120px;
      min-width: 40px;
      flex: 0 1 auto;
      overflow: visible;
      box-sizing: border-box;
    }
    .source-badge:hover { color: #1f2329; }
    .source-badge--unavailable {
      color: #8a8d93;
      border-style: dashed;
    }
    .source-badge-more {
      flex: 0 0 auto;
      min-width: 0;
      padding: 0 7px;
    }
    .source-badge-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge-tip {
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 9px;
      border-radius: 8px;
      background: rgba(24, 24, 28, 0.94);
      color: #fff;
      font-size: 11px;
      line-height: 1.45;
      white-space: normal;
      word-break: break-word;
      width: max-content;
      max-width: min(280px, calc(100vw - 12px));
      max-height: calc(3 * 1.45em + 12px);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 100ms ease;
      z-index: 30;
      box-sizing: border-box;
    }

    .action {
      position: relative;
      width: 28px;
      height: 28px;
      min-width: 28px;
      min-height: 28px;
      flex: 0 0 28px;
      padding: 0;
      box-sizing: border-box;
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #8e8e95;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
    }
    .icon-svg {
      display: block;
      width: 18px;
      height: 18px;
      color: currentColor;
      flex: 0 0 auto;
    }
    .action:hover, .action.active { background: #f4f4f6; color: #111; }
    .action:disabled { color: #c0c0c6; cursor: wait; }
    .action:focus-visible {
      outline: 2px solid #111;
      outline-offset: 2px;
    }
    .action .tip {
      position: absolute;
      left: 50%;
      top: calc(100% + 8px);
      transform: translateX(-50%);
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(24, 24, 28, 0.94);
      color: #fff;
      font-size: 10px;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
    }
    .action:hover .tip { opacity: 1; }
    .action:focus-visible .tip { opacity: 1; }
    .action.menu-open .tip { opacity: 0 !important; }
    #moreButton .tip { left: auto; right: 0; transform: none; }
    #moreButton .icon-svg { width: 18px; height: 18px; }
    .remove-stack { position: relative; width: 22px; height: 22px; display: block; }

    .menu, .tag-menu {
      position: absolute;
      padding: 8px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(228, 228, 234, 0.92);
      backdrop-filter: blur(14px);
      display: none;
      pointer-events: auto;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 140ms ease, transform 140ms ease;
    }
    .menu.open, .tag-menu.open {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }
    .menu {
      top: 40px; right: 0;
      min-width: 160px;
      flex-direction: column;
      gap: 4px;
    }
    .menu button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #1f1f24;
      text-align: center;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
    }
    .menu button:hover, .menu button:focus-visible { background: #f4f4f6; }
    .menu button:focus-visible { outline: 2px solid #111; outline-offset: -2px; }
    .menu .menu-option {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      text-align: left;
    }
    .menu .menu-option.danger-option { color: #1f1f24; }
    .menu .menu-option.danger-option:hover,
    .menu .menu-option.danger-option:focus-visible { color: #d93025; background: rgba(217, 48, 37, 0.08); }
    .menu .menu-option:disabled { opacity: 0.45; cursor: not-allowed; }
    .menu .menu-option:disabled:hover { color: inherit; background: transparent; }
    .menu .menu-option .menu-option-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }
    .menu .menu-option .menu-option-icon svg {
      width: 16px;
      height: 16px;
      display: block;
    }
    .menu .menu-option .menu-option-label {
      font-size: 12px;
      line-height: 1;
    }

    .tag-menu {
      top: 40px; left: 0;
      min-width: 240px;
      max-width: 280px;
      flex-direction: column;
      gap: 8px;
    }
    .tag-menu-title { font-size: 11px; font-weight: 700; color: #1f1f24; }
    .tag-menu-create { display: flex; align-items: center; gap: 8px; }
    .tag-menu-create input {
      min-width: 0; flex: 1 1 auto;
      height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(20, 20, 20, 0.08);
      font-size: 11px;
      outline: none;
      background: #fff;
    }
    .tag-menu-create button {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 68px;
      width: 68px;
      min-height: 30px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer !important;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .tag-menu-options {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 280px;
      overflow-y: auto;
    }
    .muted {
      color: #8a8a91;
      font-size: 11px;
      line-height: 1.4;
    }
    .tag-menu-option {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      min-height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(20, 20, 20, 0.08);
      background: rgba(20, 20, 20, 0.06);
      color: #6f6f75;
      font-size: 11px;
      cursor: pointer;
    }
    .tag-menu-option:hover, .tag-menu-option.active {
      background: #f5f5f7; color: #111; font-weight: 600;
    }

  </style>
</head>
<body>
  <div class="panel">
    <div class="row">
      <div id="tagRow" class="tag-row">
        <button id="addTagBtn" class="tag-chip placeholder-btn show" type="button">+ 标签</button>
        <button id="customTagBtn" class="tag-chip custom-btn" type="button"><span id="customTagName"></span><span class="badge-tip" role="tooltip"></span><span id="clearTagBtn" class="tag-remove">×</span></button>
        <span id="customTagMore" class="tag-chip tag-chip-more"><span class="badge-tip" role="tooltip"></span></span>
        <span id="sourceBadgeChips" class="source-badge-group"></span>
        <span id="typeTagChip" class="tag-chip meta">-</span>
      </div>
      <div class="actions-row">
        <button id="favoriteButton" class="action" type="button" aria-label="收藏">
          <svg id="favoriteIcon" class="icon-svg" viewBox="0 0 20 20" aria-hidden="true">
            <path id="favoritePath" d="M10 2.7 12.1 7l4.7.7-3.4 3.3.8 4.7L10 13.5l-4.2 2.2.8-4.7L3.2 7.7 7.9 7 10 2.7Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path>
          </svg>
          <span class="tip">收藏文件</span>
        </button>
        <button id="editButton" class="action" type="button" aria-label="编辑文件">
          <svg class="icon-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13.5 3.5l3 3-9 9-3.5.5.5-3.5z"/>
            <path d="M12 5l3 3"/>
          </svg>
          <span id="editLabel" class="tip">编辑文件</span>
        </button>
        <button id="moreButton" class="action" type="button" aria-label="更多" aria-haspopup="menu" aria-expanded="false">
          <svg class="icon-svg" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="4.7" cy="10" r="1.8" fill="currentColor"></circle>
            <circle cx="10" cy="10" r="1.8" fill="currentColor"></circle>
            <circle cx="15.3" cy="10" r="1.8" fill="currentColor"></circle>
          </svg>
          <span class="tip">更多操作</span>
        </button>
      </div>
    </div>
    <div id="menu" class="menu" role="menu" aria-hidden="true">
      <button id="presentationOption" class="menu-option" type="button" role="menuitem" aria-label="演示模式">
        <span class="menu-option-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="9" rx="1.5"/><path d="M8 16.5h4"/><path d="M10 13v3.5"/></svg></span>
        <span id="presentationLabel" class="menu-option-label">演示模式</span>
      </button>
      <button id="removeOption" class="menu-option danger-option" type="button" role="menuitem" aria-label="移除文件">
        <span class="menu-option-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 5.5h11"/><path d="M7.5 5.5V4a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 12.5 4v1.5"/><path d="M6 5.5l.8 10a1.5 1.5 0 0 0 1.5 1.4h3.4a1.5 1.5 0 0 0 1.5-1.4l.8-10"/></svg></span>
        <span class="menu-option-label">移除文件</span>
      </button>
    </div>
    <div id="tagMenu" class="tag-menu">
      <div class="tag-menu-title">自定义标签</div>
      <div class="tag-menu-create">
        <input id="tagNameInput" placeholder="新标签名" />
        <button id="createTagButton" type="button">新增标签</button>
      </div>
      <div id="tagMenuOptions" class="tag-menu-options"></div>
    </div>
  </div>
  <div id="fullscreenHint" class="fullscreen-hint" aria-live="polite"></div>

  <script src="./i18n.js?v=20260525-update-check"></script>
  <script>
    const i18n = window.NutbookI18n;
    const t = (key) => i18n?.lookup(key) ?? key;

    const state = {
      itemId: null,
      fileName: null,
      isFavorite: false,
      isFullscreen: false,
      isEditing: false,
      isPrimaryBusy: false,
      menuOpen: false,
      tagMenuOpen: false,
      customTag: null,
      availableTags: [],
      skillTag: null,
      typeTag: null,
      customTags: [],
      sourceBadges: [],
      // Start unset so the first host payload, rather than this child
      // WebView's own persisted storage, is authoritative.
      language: null
    };
    let controlsHover = false;
    let menuAutoCloseTimer = null;
    let menuOpenTimer = null;
    let tagMenuAutoCloseTimer = null;
    let lastPresentationActivationAt = 0;
    let lastTagActivationAt = 0;
    let tagMenuOpenTimer = null;
    let actionSequence = 0;
    let actionQueue = [];
    let actionQueueRunning = false;
    let layoutEmitFrame = null;
    let queuedLayout = null;
    let lastLayoutSignature = "";
    let lastEditActivationAt = 0;
    let fullscreenHintFadeTimer = null;
    let fullscreenHintHideTimer = null;
    let lastCreateTagAt = 0;

    const els = {
      favoriteButton: document.getElementById("favoriteButton"),
      favoritePath: document.getElementById("favoritePath"),
      removeOption: document.getElementById("removeOption"),
      moreButton: document.getElementById("moreButton"),
      menu: document.getElementById("menu"),
      editButton: document.getElementById("editButton"),
      editLabel: document.getElementById("editLabel"),
      presentationOption: document.getElementById("presentationOption"),
      presentationLabel: document.getElementById("presentationLabel"),
      addTagBtn: document.getElementById("addTagBtn"),
      customTagBtn: document.getElementById("customTagBtn"),
      customTagName: document.getElementById("customTagName"),
      customTagMore: document.getElementById("customTagMore"),
      clearTagBtn: document.getElementById("clearTagBtn"),
      sourceBadgeGroup: document.getElementById("sourceBadgeChips"),
      typeTagChip: document.getElementById("typeTagChip"),
      tagMenu: document.getElementById("tagMenu"),
      tagMenuOptions: document.getElementById("tagMenuOptions"),
      tagNameInput: document.getElementById("tagNameInput"),
      createTagButton: document.getElementById("createTagButton"),
      fullscreenHint: document.getElementById("fullscreenHint")
    };

    function emit(payload) {
      if (state.itemId == null) return;
      var message = Object.assign({ itemId: state.itemId, seq: ++actionSequence }, payload);
      if (payload.action === "overlay-layout") {
        actionQueue = actionQueue.filter(function(item) {
          return item.action !== "overlay-layout";
        });
        actionQueue.unshift(message);
        drainActionQueue();
        return;
      }
      actionQueue.push(message);
      drainActionQueue();
    }

    function drainActionQueue() {
      if (actionQueueRunning || !actionQueue.length) return;
      actionQueueRunning = true;
      var message = actionQueue.shift();
      var nextTitle = "__NUTBOOK_HTML_CONTROLS__:" + JSON.stringify(message);
      document.title = "Nutbook HTML Controls";
      setTimeout(function() { document.title = nextTitle; }, 24);
      setTimeout(function() {
        if (document.title === nextTitle) document.title = "Nutbook HTML Controls";
        actionQueueRunning = false;
        drainActionQueue();
      }, 120);
    }

    function currentLayoutMode() {
      if (state.tagMenuOpen) return "tags";
      if (state.menuOpen) return "more";
      // A1.3：来源徽标 tooltip 待显示时走 badge-tip 扩高态（宿主实测 viewport ≥ 100 才显示 tooltip）。
      if (pendingTip) return "badge-tip";
      if (controlsHover) return "hover";
      return "default";
    }

    function cancelQueuedLayout() {
      if (layoutEmitFrame != null) {
        cancelAnimationFrame(layoutEmitFrame);
        layoutEmitFrame = null;
      }
      queuedLayout = null;
    }

    function emitLayout() {
      if (state.itemId == null) return;
      var layoutMode = currentLayoutMode();
      var layout = {
        action: "overlay-layout",
        expanded: layoutMode !== "default",
        layoutMode: layoutMode
      };
      var signature = String(layout.expanded) + ":" + layout.layoutMode;
      // Hover → tag menu and menu close can happen in a single frame. Emit
      // only the settled state so the native host does not resize through a
      // transient hover/badge-tip geometry first.
      if (!layoutEmitFrame && signature === lastLayoutSignature) return;
      queuedLayout = layout;
      if (layoutEmitFrame != null) return;
      layoutEmitFrame = requestAnimationFrame(function() {
        layoutEmitFrame = null;
        var next = queuedLayout;
        queuedLayout = null;
        if (!next) return;
        var nextSignature = String(next.expanded) + ":" + next.layoutMode;
        if (nextSignature === lastLayoutSignature) return;
        lastLayoutSignature = nextSignature;
        emit(next);
      });
    }

    // ---- A1.3 来源徽标 tooltip（留在 overlay bounds 内；实测 viewport 门控）----
    // overlay 默认 40px 高，tooltip 在徽标下方会超出 viewport 被 webview 裁剪。
    // 方案：hover 徽标 → 复用既有 overlay-layout 扩高路径把宿主 set_bounds 到 badge-tip 高度，
    // tooltip 只在实测 window.innerHeight ≥ BADGE_TIP_MIN_HEIGHT 后才显示；
    // Rust set_bounds 后 CSS viewport 异步更新，因此用 resize/ResizeObserver 重试，不假设同步。
    const BADGE_TIP_MIN_HEIGHT = 100;
    let pendingTip = null;
    let badgeTipRaf = null;

    function escapeHtmlText(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    }

    let sourceBadgeFingerprint = "";

    function renderSourceBadgeChips() {
      const group = els.sourceBadgeGroup;
      if (!group) return;
      const badges = Array.isArray(state.sourceBadges) ? state.sourceBadges : [];
      const fp = JSON.stringify(badges.map(function (b) {
        return [b && b.kind, b && b.sourceId, b && b.label, b && b.available === false ? 0 : 1, b && b.isOwner ? 1 : 0];
      }));
      if (fp === sourceBadgeFingerprint) return; // 未变化不重建 DOM，避免打断 hover tooltip
      sourceBadgeFingerprint = fp;
      const projects = badges.filter(function (b) { return b && b.kind === "project"; });
      const skills = badges.filter(function (b) { return b && b.kind === "skill"; });
      function chipFor(list, kindClass) {
        if (!list.length) return "";
        const names = list.map(function (b) { return b.label || ""; });
        const fullText = names.join("，");
        const primary = list[0];
        const unavailable = primary.available === false;
        const primaryHtml =
          '<span class="source-badge source-badge-' + kindClass + (unavailable ? " source-badge--unavailable" : "") +
          '" data-badge-kind="' + kindClass + '" aria-label="' + escapeHtmlText(primary.label + (unavailable ? "（来源不可用）" : "")) + '">' +
          '<span class="source-badge-label">' + escapeHtmlText(primary.label) + "</span>" +
          '<span class="badge-tip" role="tooltip">' + escapeHtmlText(fullText) + "</span></span>";
        const moreHtml = list.length > 1
          ? '<span class="source-badge source-badge-more" data-badge-kind="' + kindClass + '" aria-label="' + escapeHtmlText(fullText) + '"><span class="badge-tip" role="tooltip">' + escapeHtmlText(fullText) + "</span>+" + (list.length - 1) + "</span>"
          : "";
        return primaryHtml + moreHtml;
      }
      group.innerHTML = chipFor(projects, "project") + chipFor(skills, "skill");
      // 重建后旧的 pendingTip 锚点已断开，隐藏避免残留（布局由调用方统一管理）
      hidePendingTip(pendingTip && pendingTip.token, { skipLayout: true });
    }

    function viewportSupportsBadgeTip() {
      return (window.innerHeight || 0) >= BADGE_TIP_MIN_HEIGHT;
    }

    function retryShowPendingTip() {
      badgeTipRaf = null;
      const tip = pendingTip;
      if (!tip) return;
      const anchor = tip.anchor;
      if (!anchor || !anchor.isConnected) {
        hidePendingTip(tip.token);
        return;
      }
      if (state.menuOpen || state.tagMenuOpen) return;
      if (!viewportSupportsBadgeTip()) return; // 宿主尚未把 webview 实际扩高，等 resize 再试
      const tipEl = anchor.querySelector(".badge-tip");
      if (!tipEl) return;
      const rect = anchor.getBoundingClientRect();
      const tipWidth = tipEl.offsetWidth;
      const pad = 4;
      // containing block 是徽标本身：left 必须相对徽标左缘，不能直接用 viewport 坐标
      let leftVw = rect.left + rect.width / 2 - tipWidth / 2;
      leftVw = Math.max(pad, Math.min(leftVw, window.innerWidth - tipWidth - pad));
      tipEl.style.left = (leftVw - rect.left) + "px";
      tipEl.style.transform = "none";
      tipEl.style.opacity = "1";
    }

    function hidePendingTip(forceToken, options) {
      if (pendingTip && forceToken !== undefined && forceToken !== pendingTip.token) return;
      const tip = pendingTip;
      const hadPendingTip = Boolean(tip);
      pendingTip = null;
      if (badgeTipRaf) {
        cancelAnimationFrame(badgeTipRaf);
        badgeTipRaf = null;
      }
      if (tip && tip.anchor && tip.anchor.querySelector) {
        const tipEl = tip.anchor.querySelector(".badge-tip");
        if (tipEl) tipEl.style.opacity = "0";
      }
      if (hadPendingTip && (!options || !options.skipLayout)) emitLayout();
    }

    function armBadgeTip(anchor) {
      if (state.tagMenuOpen) return;
      if (!anchor || !anchor.isConnected) return;
      const src = anchor.querySelector(".badge-tip");
      if (!src) return;
      const text = (src.textContent || "").trim();
      if (!text) return;
      if (pendingTip && pendingTip.anchor === anchor && pendingTip.text === text) {
        retryShowPendingTip();
        return;
      }
      hidePendingTip(pendingTip && pendingTip.token);
      pendingTip = { anchor: anchor, text: text, token: Date.now() + Math.random() };
      emitLayout(); // 请求宿主扩高到 badge-tip
      if (badgeTipRaf) cancelAnimationFrame(badgeTipRaf);
      badgeTipRaf = requestAnimationFrame(retryShowPendingTip);
    }

    function resetTransientState(options) {
      const shouldEmitLayout = !options || options.emitLayout !== false;
      cancelQueuedLayout();
      lastLayoutSignature = "";
      clearMenuOpenTimer();
      clearMenuAutoClose();
      clearTagMenuOpenTimer();
      clearTagMenuAutoClose();
      controlsHover = false;
      state.menuOpen = false;
      state.tagMenuOpen = false;
      hidePendingTip(undefined, { skipLayout: true });
      refresh();
      if (shouldEmitLayout) emitLayout();
    }

    function isEscapeKey(event) {
      return event.key === "Escape" || event.key === "Esc" || event.code === "Escape" || event.keyCode === 27 || event.which === 27;
    }

    function clearMenuAutoClose() {
      if (menuAutoCloseTimer) { clearTimeout(menuAutoCloseTimer); menuAutoCloseTimer = null; }
    }
    function clearMenuOpenTimer() {
      if (menuOpenTimer) { clearTimeout(menuOpenTimer); menuOpenTimer = null; }
    }
    function scheduleMenuAutoClose(delay) {
      clearMenuAutoClose();
      if (!state.menuOpen) return;
      menuAutoCloseTimer = setTimeout(function() { state.menuOpen = false; refresh(); emitLayout(); }, delay || 1200);
    }
    function clearTagMenuAutoClose() {
      if (tagMenuAutoCloseTimer) { clearTimeout(tagMenuAutoCloseTimer); tagMenuAutoCloseTimer = null; }
    }
    function clearTagMenuOpenTimer() {
      if (tagMenuOpenTimer) { clearTimeout(tagMenuOpenTimer); tagMenuOpenTimer = null; }
    }
    function scheduleTagMenuAutoClose(delay) {
      clearTagMenuAutoClose();
      if (!state.tagMenuOpen) return;
      tagMenuAutoCloseTimer = setTimeout(function() {
        tagMenuAutoCloseTimer = null;
        closeTagMenu();
      }, delay || 180);
    }

    function updateTagChips() {
      const customTags = Array.isArray(state.customTags) ? state.customTags : [];
      const primary = state.customTag || customTags[0] || null;
      const allNames = customTags.map((tag) => tag && tag.name ? tag.name : "").join("，") || (primary ? primary.name : "");
      if (primary) {
        els.addTagBtn.classList.remove("show");
        els.customTagName.textContent = primary.name;
        els.customTagBtn.classList.add("show");
      } else {
        els.customTagBtn.classList.remove("show");
        els.addTagBtn.classList.add("show");
      }
      const primaryTip = els.customTagBtn.querySelector(".badge-tip");
      if (primaryTip) primaryTip.textContent = allNames;
      if (els.customTagMore) {
        if (customTags.length > 1) {
          els.customTagMore.innerHTML = '<span class="badge-tip" role="tooltip">' + escapeHtmlText(allNames) + "</span>+" + (customTags.length - 1);
          els.customTagMore.classList.add("show");
        } else {
          els.customTagMore.innerHTML = "";
          els.customTagMore.classList.remove("show");
        }
      }
      renderSourceBadgeChips();
      if (state.typeTag) {
        els.typeTagChip.textContent = state.typeTag;
        els.typeTagChip.classList.add("show");
      } else {
        els.typeTagChip.classList.remove("show");
      }
      var isHtml = state.typeTag === "HTML";
      els.moreButton.style.display = isHtml ? "" : "none";
      els.favoriteButton.style.display = isHtml ? "" : "none";
      els.removeOption.style.display = isHtml ? "" : "none";
      els.editButton.style.display = isHtml ? "" : "none";
      els.addTagBtn.textContent = t("actions.addTag");
      els.tagNameInput.placeholder = t("html.newTagName");
      els.createTagButton.textContent = t("actions.createTag");
    }

    function openTagMenu() {
      clearTagMenuOpenTimer();
      clearTagMenuAutoClose();
      // A label hover may have armed its full-name tooltip. It must not win the
      // tags layout race or come back when the menu later settles.
      hidePendingTip(undefined, { skipLayout: true });
      state.tagMenuOpen = true;
      els.tagMenuOptions.innerHTML = state.availableTags.length
        ? state.availableTags.map(function(tag) {
          return '<button class="tag-menu-option' + (state.customTag && state.customTag.id === tag.id ? ' active' : '') + '" type="button" data-tag-id="' + tag.id + '">' + tag.name + '</button>';
        }).join("")
        : '<div class="muted" style="padding:4px 2px;">' + t("settings.noLabels") + '</div>';
      els.tagMenuOptions.querySelectorAll("[data-tag-id]").forEach(function(node) {
        node.addEventListener("click", function() {
          emit({ action: "set-tag", tagId: Number(node.dataset.tagId) });
          closeTagMenuAfterAction();
        });
      });
      emitLayout();
      tagMenuOpenTimer = setTimeout(function() {
        if (state.tagMenuOpen) els.tagMenu.classList.add("open");
        tagMenuOpenTimer = null;
      }, 80);
    }

    function closeTagMenu(options) {
      var shouldEmitLayout = !options || options.emitLayout !== false;
      var wasOpen = state.tagMenuOpen || els.tagMenu.classList.contains("open");
      clearTagMenuOpenTimer();
      clearTagMenuAutoClose();
      state.tagMenuOpen = false;
      els.tagMenu.classList.remove("open");
      hidePendingTip(undefined, { skipLayout: true });
      if (wasOpen && shouldEmitLayout) emitLayout();
      return wasOpen;
    }

    function closeTagMenuAfterAction() {
      closeTagMenu();
    }

    function toggleTagMenu() {
      if (state.tagMenuOpen) { closeTagMenu(); }
      else { openTagMenu(); }
    }

    function refresh() {
      i18n?.apply?.(document);
      els.favoriteButton.classList.toggle("active", state.isFavorite);
      if (els.favoritePath) els.favoritePath.setAttribute("fill", state.isFavorite ? "currentColor" : "none");
      els.moreButton.classList.toggle("menu-open", state.menuOpen);
      els.menu.classList.toggle("open", state.menuOpen);
      els.moreButton.setAttribute("aria-expanded", state.menuOpen ? "true" : "false");
      els.menu.setAttribute("aria-hidden", state.menuOpen ? "false" : "true");
      document.querySelector(".panel").classList.toggle("hidden", state.isFullscreen);
      const editIconSvg = state.isEditing
        ? '<svg class="icon-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l4 4 8-8"/></svg>'
        : '<svg class="icon-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 3.5l3 3-9 9-3.5.5.5-3.5z"/><path d="M12 5l3 3"/></svg>';
      const firstSvg = els.editButton.querySelector('.icon-svg');
      if (firstSvg) firstSvg.outerHTML = editIconSvg;
      els.editLabel.textContent = state.isEditing ? t("htmlEdit.exit") : t("htmlEdit.editTooltip");
      els.editButton.setAttribute("aria-label", state.isEditing ? t("htmlEdit.exit") : t("htmlEdit.editTooltip"));
      els.editButton.disabled = state.isPrimaryBusy;
      els.editButton.setAttribute("aria-busy", state.isPrimaryBusy ? "true" : "false");
      const presentationLabel = state.isFullscreen ? t("actions.exitPresentationShortcut") : t("actions.presentationShortcut");
      if (els.presentationLabel) els.presentationLabel.textContent = presentationLabel;
      els.presentationOption.setAttribute("aria-label", presentationLabel);
      els.presentationOption.disabled = state.isEditing;
      updateTagChips();
      if (!state.tagMenuOpen) els.tagMenu.classList.remove("open");
    }

    function showFullscreenHint() {
      if (!els.fullscreenHint) return;
      clearTimeout(fullscreenHintFadeTimer);
      clearTimeout(fullscreenHintHideTimer);
      els.fullscreenHint.textContent = t("html.presentationExitHint");
      els.fullscreenHint.classList.remove("fade-out");
      els.fullscreenHint.classList.add("show");
      fullscreenHintFadeTimer = setTimeout(function() {
        els.fullscreenHint.classList.add("fade-out");
      }, 1000);
      fullscreenHintHideTimer = setTimeout(function() {
        els.fullscreenHint.classList.remove("show", "fade-out");
      }, 1500);
    }

    function hideFullscreenHint() {
      if (!els.fullscreenHint) return;
      clearTimeout(fullscreenHintFadeTimer);
      clearTimeout(fullscreenHintHideTimer);
      els.fullscreenHint.classList.remove("show", "fade-out");
    }

    function apply(next) {
      var wasFullscreen = state.isFullscreen;
      // 普通状态更新走 eval-only；tooltip 只在 item/fullscreen 切换时清理，
      // 不能因一条标签或收藏状态更新而打断等待 bounds 落地的 tooltip。
      const itemChanged = state.itemId !== next.itemId;
      const fullscreenChanged = state.isFullscreen !== !!next.isFullscreen;
      if (itemChanged || fullscreenChanged) {
        hidePendingTip(undefined, { skipLayout: true });
        lastLayoutSignature = "";
      }
      state.itemId = next.itemId;
      state.fileName = next.fileName || null;
      state.isFavorite = !!next.isFavorite;
      state.isFullscreen = !!next.isFullscreen;
      state.isEditing = !!next.isEditing;
      state.isPrimaryBusy = !!next.isPrimaryBusy;
      state.customTag = next.customTag || null;
      state.availableTags = Array.isArray(next.availableTags) ? next.availableTags : [];
      state.skillTag = next.skillTag || null;
      state.typeTag = next.typeTag || null;
      state.customTags = Array.isArray(next.customTags) ? next.customTags : [];
      state.sourceBadges = Array.isArray(next.sourceBadges) ? next.sourceBadges : [];
      const nextLanguage = next.language === "en-US" ? "en-US" : "zh-CN";
      if (state.language !== nextLanguage) {
        state.language = nextLanguage;
        // This child WebView owns the Custom Tag DOM.  The main window's
        // localStorage update alone does not repaint this already-open child.
        i18n?.setLanguage?.(nextLanguage);
      }
      refresh();
      if (!wasFullscreen && state.isFullscreen) showFullscreenHint();
      if (wasFullscreen && !state.isFullscreen) hideFullscreenHint();
    }

    window.__NUTBOOK_UPDATE_OVERLAY_STATE__ = function(next) { apply(next); };
    window.__NUTBOOK_RESET_TRANSIENT_STATE__ = function() {
      hideFullscreenHint();
      resetTransientState({ emitLayout: false });
    };

    function activateTagMenu(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      var now = Date.now();
      if (now - lastTagActivationAt < 180) return;
      lastTagActivationAt = now;
      toggleTagMenu();
    }
    els.addTagBtn.addEventListener("pointerdown", activateTagMenu);
    els.addTagBtn.addEventListener("click", function(e) { e.preventDefault(); e.stopPropagation(); });
    els.customTagBtn.addEventListener("pointerdown", function(e) {
      e.stopPropagation();
      if (e.target === els.clearTagBtn || els.clearTagBtn.contains(e.target)) {
        emit({ action: "clear-tag" }); return;
      }
      activateTagMenu(e);
    });
    els.customTagBtn.addEventListener("click", function(e) { e.preventDefault(); e.stopPropagation(); });
    els.favoriteButton.addEventListener("click", function() {
      emit({ action: "toggle-favorite" });
      state.isFavorite = !state.isFavorite;
      refresh();
    });
    els.removeOption.addEventListener("click", function() {
      state.menuOpen = false;
      refresh();
      clearMenuAutoClose();
      // 确认弹窗由宿主独立 child-webview overlay 完成，本 controls overlay 只发起请求。
      emit({ action: "request-remove" });
    });
    els.moreButton.addEventListener("click", function() {
      clearMenuOpenTimer();
      if (state.menuOpen) {
        state.menuOpen = false;
        refresh();
        emitLayout();
        clearMenuAutoClose();
        return;
      }
      state.menuOpen = true;
      emitLayout();
      menuOpenTimer = setTimeout(function() {
        menuOpenTimer = null;
        if (!state.menuOpen) return;
        refresh();
        scheduleMenuAutoClose();
      }, 90);
    });
    function menuItems() {
      return Array.from(els.menu.querySelectorAll('[role="menuitem"]:not(:disabled)'));
    }
    function focusMenuItem(index) {
      requestAnimationFrame(function() {
        var items = menuItems();
        if (!items.length) return;
        items[Math.max(0, Math.min(index, items.length - 1))].focus();
      });
    }
    function closeMenuWithFocus() {
      clearMenuOpenTimer();
      clearMenuAutoClose();
      state.menuOpen = false;
      refresh();
      emitLayout();
      els.moreButton.focus();
    }
    els.moreButton.addEventListener("keydown", function(e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        e.stopPropagation();
        clearMenuOpenTimer();
        clearMenuAutoClose();
        state.menuOpen = true;
        refresh();
        emitLayout();
        focusMenuItem(e.key === "ArrowUp" ? Number.MAX_SAFE_INTEGER : 0);
      } else if (e.key === "Escape" && state.menuOpen) {
        e.preventDefault();
        closeMenuWithFocus();
      }
    });
    els.menu.addEventListener("keydown", function(e) {
      var items = menuItems();
      if (e.key === "Escape") {
        e.preventDefault();
        closeMenuWithFocus();
        return;
      }
      if (["ArrowDown", "ArrowUp", "Home", "End"].indexOf(e.key) < 0 || !items.length) return;
      e.preventDefault();
      var currentIndex = items.indexOf(document.activeElement);
      var nextIndex = currentIndex;
      if (e.key === "Home") nextIndex = 0;
      else if (e.key === "End") nextIndex = items.length - 1;
      else if (e.key === "ArrowDown") nextIndex = currentIndex < 0 ? 0 : (currentIndex + 1) % items.length;
      else nextIndex = currentIndex < 0 ? items.length - 1 : (currentIndex - 1 + items.length) % items.length;
      items[nextIndex].focus();
    });
    function activatePresentationMode(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (state.isEditing) return;
      const now = Date.now();
      if (now - lastPresentationActivationAt < 180) return;
      lastPresentationActivationAt = now;
      if (state.isFullscreen) hideFullscreenHint();
      state.menuOpen = false;
      refresh();
      clearMenuAutoClose();
      emitLayout();
      emit({ action: "toggle-presentation" });
    }

    function handleEscapeFullscreen(e) {
      if (!state.isFullscreen || !isEscapeKey(e)) return;
      e.preventDefault();
      e.stopPropagation();
      activatePresentationMode(e);
    }

    function activateEditMode(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (state.isPrimaryBusy) return;
      const now = Date.now();
      if (now - lastEditActivationAt < 180) return;
      lastEditActivationAt = now;
      state.isPrimaryBusy = true;
      state.menuOpen = false;
      refresh();
      clearMenuAutoClose();
      emitLayout();
      emit({ action: "edit" });
    }
    els.editButton.addEventListener("pointerdown", activateEditMode);
    els.editButton.addEventListener("click", function(e) {
      if (e.detail === 0) activateEditMode(e);
      else { e.preventDefault(); e.stopPropagation(); }
    });
    els.presentationOption.addEventListener("pointerdown", activatePresentationMode);
    els.presentationOption.addEventListener("click", activatePresentationMode);
    els.menu.addEventListener("pointerdown", function(e) {
      if (e.target === els.presentationOption || els.presentationOption.contains(e.target)) {
        activatePresentationMode(e);
      }
    });
    function createCustomTag(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      var now = Date.now();
      if (now - lastCreateTagAt < 180) return;
      lastCreateTagAt = now;
      var name = els.tagNameInput.value.trim();
      if (!name) return;
      emit({ action: "create-tag", name: name });
      els.tagNameInput.value = "";
      closeTagMenuAfterAction();
    }
    els.createTagButton.addEventListener("pointerdown", createCustomTag);
    els.createTagButton.addEventListener("click", createCustomTag);
    els.tagNameInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") { e.preventDefault(); els.createTagButton.click(); }
    });
    els.tagMenu.addEventListener("click", function(e) { e.stopPropagation(); });
    els.tagMenu.addEventListener("mouseenter", function() { clearTagMenuAutoClose(); });
    els.tagMenu.addEventListener("mouseleave", function() { scheduleTagMenuAutoClose(220); });
    els.addTagBtn.addEventListener("mouseleave", function() { if (state.tagMenuOpen) scheduleTagMenuAutoClose(900); });
    els.customTagBtn.addEventListener("mouseleave", function() { if (state.tagMenuOpen) scheduleTagMenuAutoClose(900); });
    els.menu.addEventListener("mouseenter", function() { clearMenuAutoClose(); });
    els.menu.addEventListener("mouseleave", function() { scheduleMenuAutoClose(700); });
    els.moreButton.addEventListener("mouseleave", function() {
      if (state.menuOpen) scheduleMenuAutoClose(900);
    });
    document.querySelector(".row").addEventListener("mouseenter", function() {
      controlsHover = true;
      emitLayout();
    });
    document.querySelector(".row").addEventListener("mouseleave", function() {
      controlsHover = false;
      emitLayout();
    });

    // A1.3：标签行内带 .badge-tip 的所有 owner（来源徽标、自定义标签 chip、自定义 +N）
    // 共用同一实测 viewport 门控 tooltip；resize 时宿主 set_bounds 已落地再显示。
    const TAG_ROW_TIP_SELECTOR = ".source-badge, .tag-chip.custom-btn, .tag-chip-more";
    const tagRowEl = document.getElementById("tagRow");
    tagRowEl.addEventListener("mouseover", function(e) {
      const owner = e.target.closest ? e.target.closest(TAG_ROW_TIP_SELECTOR) : null;
      if (!owner || !tagRowEl.contains(owner)) return;
      armBadgeTip(owner);
    });
    tagRowEl.addEventListener("mouseout", function(e) {
      const owner = e.target.closest ? e.target.closest(TAG_ROW_TIP_SELECTOR) : null;
      if (!owner || !tagRowEl.contains(owner)) return;
      const to = e.relatedTarget;
      if (to && to.closest && to.closest(TAG_ROW_TIP_SELECTOR) === owner) return;
      hidePendingTip(pendingTip && pendingTip.token);
    });
    window.addEventListener("resize", function() {
      if (pendingTip) retryShowPendingTip();
    });
    if (typeof ResizeObserver !== "undefined") {
      try {
        const tipResizeObserver = new ResizeObserver(function() {
          if (pendingTip) retryShowPendingTip();
        });
        tipResizeObserver.observe(document.body);
      } catch (_) {}
    }

    document.addEventListener("click", function(e) {
      if (state.menuOpen && !els.menu.contains(e.target) && !els.moreButton.contains(e.target)) {
        state.menuOpen = false; refresh(); clearMenuAutoClose();
        emitLayout();
      }
      if (!els.tagMenu.contains(e.target) && !els.addTagBtn.contains(e.target) && !els.customTagBtn.contains(e.target)) {
        closeTagMenu();
      }
    });
    document.addEventListener("keydown", handleEscapeFullscreen, true);
    window.addEventListener("keydown", handleEscapeFullscreen, true);
    i18n?.observe?.();

    if (window.__NUTBOOK_RUNTIME_CONTROLS__) apply(window.__NUTBOOK_RUNTIME_CONTROLS__);
  </script>
</body>
</html>
