<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nutbook HTML Edit Leave Confirm</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(17, 17, 19, 0.12);
      backdrop-filter: blur(10px);
    }

    .dialog {
      width: min(420px, calc(100vw - 48px));
      box-sizing: border-box;
      padding: 18px;
      border: 1px solid #e2e2e4;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 24px 60px rgba(20, 20, 20, 0.14);
    }

    h1 {
      margin: 0 0 8px;
      color: #151515;
      font-size: 16px;
      font-weight: 700;
      line-height: 22px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 16px;
      color: #555;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.6;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid #e2e2e4;
      border-radius: 999px;
      min-height: 34px;
      padding: 0 14px;
      background: #ffffff;
      color: #111111;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      line-height: 32px;
      letter-spacing: -0.01em;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto;
      transition: transform 120ms ease, opacity 120ms ease, background 120ms ease, color 120ms ease, border-color 120ms ease;
    }

    button:hover, button:focus-visible { transform: translateY(-1px); }
    button:focus-visible { outline: 2px solid #111111; outline-offset: 2px; }
    button[data-programmatic-focus]:focus,
    button[data-programmatic-focus]:focus-visible { outline: none; outline-offset: 0; }
    button.primary { background: #000000; color: #ffffff; border-color: transparent; }
    button.primary:hover, button.primary:focus-visible { background: #252525; }
  </style>
</head>
<body>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="message">
    <h1 id="title">有未保存的修改</h1>
    <p id="message">退出编辑前，可以保存修改或放弃本次修改。</p>
    <div class="actions">
      <button id="keepButton" type="button">继续编辑</button>
      <button id="discardButton" type="button">不保存退出</button>
      <button id="saveButton" class="primary" type="button">保存退出</button>
    </div>
  </section>

  <script src="./i18n.js?v=20260525-update-check"></script>
  <script>
    const i18n = window.NutbookI18n;
    const t = (key, fallback) => i18n?.lookup(key) ?? fallback;
    const config = window.__NUTBOOK_HTML_EDIT_LEAVE_CONFIRM__ || {}; const itemId = config.itemId ?? null; const requestId = config.requestId || ""; const copyMode = config.mode === "create-copy"; const removeMode = config.mode === "remove"; const fileName = config.fileName || "";
    const els = {
      title: document.getElementById("title"),
      message: document.getElementById("message"),
      keepButton: document.getElementById("keepButton"),
      discardButton: document.getElementById("discardButton"),
      saveButton: document.getElementById("saveButton")
    };

    function render() {
      let title, message, keep, discard, save;
      if (removeMode) {
        title = t("removeConfirm.title", "从 Nutbook 移除“{name}”？").replace("{name}", fileName || t("removeConfirm.thisFile", "这个文件"));
        message = t("removeConfirm.message", "文件将从 Nutbook 的列表、搜索和已打开标签中移除，但磁盘上的原文件不会被删除。之后可以重新接入。");
        keep = t("actions.cancel", "取消");
        discard = "";
        save = t("actions.confirmRemove", "确认移除");
      } else if (copyMode) {
        title = "此文件不支持 Nutbook 编辑协议";
        message = "是否尝试创建一个可编辑副本？原文件不会修改。";
        keep = "继续预览";
        discard = "";
        save = "创建并编辑";
      } else {
        title = t("htmlEdit.leavePrompt", "有未保存的修改");
        message = t("htmlEdit.leaveMessage", "退出编辑前，可以保存修改或放弃本次修改。");
        keep = t("htmlEdit.keepEditing", "继续编辑");
        discard = t("htmlEdit.discardAndExit", "不保存退出");
        save = t("htmlEdit.saveAndExit", "保存退出");
      }
      els.title.textContent = title;
      els.message.textContent = message;
      els.keepButton.textContent = keep;
      els.keepButton.setAttribute("aria-label", keep);
      els.keepButton.setAttribute("title", keep);
      els.discardButton.textContent = discard;
      els.discardButton.hidden = copyMode || removeMode;
      els.discardButton.setAttribute("aria-label", discard);
      els.discardButton.setAttribute("title", discard);
      els.saveButton.textContent = save;
      els.saveButton.setAttribute("aria-label", save);
      els.saveButton.setAttribute("title", save);
      i18n?.apply?.(document);
    }

    let settled = false;
    function emit(choice) {
      if (settled) return;
      settled = true;
      Object.values(els).forEach((element) => {
        if (element instanceof HTMLButtonElement) element.disabled = true;
      });
      let action;
      if (removeMode) action = "remove-choice";
      else if (copyMode) action = "create-copy-choice";
      else action = "leave-choice";
      const payload = { action, choice };
      if (itemId != null) payload.itemId = itemId;
      if (requestId) payload.requestId = requestId;
      const nextTitle = "__NUTBOOK_HTML_EDIT_LEAVE__:" + JSON.stringify(payload);
      document.title = "Nutbook HTML Edit Leave Confirm";
      setTimeout(function() { document.title = nextTitle; }, 16);
      setTimeout(function() {
        if (document.title === nextTitle) document.title = "Nutbook HTML Edit Leave Confirm";
      }, 96);
    }

    els.keepButton.addEventListener("click", function() { emit(removeMode || copyMode ? "cancel" : "keep"); });
    els.discardButton.addEventListener("click", function() { emit("discard"); });
    els.saveButton.addEventListener("click", function() { emit(removeMode ? "confirm" : copyMode ? "create" : "save"); });
    render();
    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        event.preventDefault();
        emit(removeMode || copyMode ? "cancel" : "keep");
        return;
      }
      if (event.key !== "Tab") return;
      const focusable = [els.keepButton, els.discardButton, els.saveButton].filter((button) => !button.hidden && !button.disabled);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }, true);
    requestAnimationFrame(function() {
      els.keepButton.dataset.programmaticFocus = "true";
      els.keepButton.addEventListener("blur", function() {
        delete els.keepButton.dataset.programmaticFocus;
      }, { once: true });
      els.keepButton.focus({ preventScroll: true });
    });
    i18n?.observe?.();
    document.title = "__NUTBOOK_HTML_EDIT_LEAVE_READY__:" + JSON.stringify({ itemId });
  </script>
</body>
</html>
