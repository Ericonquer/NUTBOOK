<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUTBOOK 演讲者</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif; background: var(--surface); color: var(--ink); --surface:#f9f9fb; --card:#fff; --well:#f3f3f5; --ink:#1a1c1d; --muted:#5e5e63; --caption:#4c4546; --line:#cfc4c5; --control:#eeeef0; --control-hover:#e2e2e4; --active:#eeeef0; --strong:#000; --on-strong:#fff; --input:#fff; }
    :root[data-theme="dark"] { color-scheme: dark; --surface:#141618; --card:#202326; --well:#17191b; --ink:#f4f4f5; --muted:#b2b5b9; --caption:#d1d3d5; --line:#414549; --control:#303438; --control-hover:#41464b; --active:#363b40; --strong:#f4f4f5; --on-strong:#17191b; --input:#292d30; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 720px; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .45; }
    header { height: 70px; padding: 0 24px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid var(--line); }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
    #status { color: var(--muted); font-size: 14px; margin-left:auto; }
    #status.error { color: #ba1a1a; }
    #timer { font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 700; }
    #timer.overdue { color:#ba1a1a; }
    #target { width:74px; padding:7px; border-radius:8px; border:1px solid var(--line); background:var(--input); color:var(--ink); }
    #target:focus { border-color:var(--ink); outline:none; }
    .theme-toggle { display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
    .theme-swatch { width:15px; height:15px; border:1px solid var(--line); border-radius:50%; background:linear-gradient(90deg,#fff 50%,#1a1c1d 50%); }
    .layout { height: calc(100vh - 122px); min-height: 0; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, .8fr); gap: 18px; padding: 18px; }
    .previews { display: grid; grid-template-rows: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; min-height: 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .caption { min-height: 30px; padding: 6px 12px; color: var(--caption); font-size: 12px; font-weight: 600; letter-spacing: .02em; border-bottom: 1px solid var(--line); }
    .preview-body { flex: 1; min-height: 0; min-width: 0; display: grid; place-items: center; text-align: center; padding: 8px; background: var(--well); overflow: hidden; }
    .preview-body strong { display: block; font-size: clamp(28px, 4vw, 58px); line-height: 1.12; }
    .preview-body span { color: var(--muted); font-size: 13px; margin-top: 10px; display: block; }
    .preview-body img { display:block; width:100%; height:100%; min-height:0; object-fit:contain; border-radius:6px; }
    .preview-body button { margin-top:12px; border:0; color:var(--ink); border-radius:8px; padding:7px 11px; background:var(--control-hover); }
    .next .preview-body strong { font-size: 26px; }
    .side { display: grid; grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; min-height: 0; }
    .notes { min-height: 0; }
    #notes { overflow-y: auto; padding: 18px 20px; line-height: 1.55; font-size: 21px; }
    #notes p { margin: 0 0 1em; }
    #notes .empty { color: var(--muted); }
    .pages { min-height: 0; }
    .caption.tools { display:flex;align-items:center;gap:8px; }
    .caption.tools span { margin-right:auto; }
    .caption.tools input { width:90px; }
    #notesHeight { accent-color:var(--ink); }
    .caption.tools button { background:var(--control);border:0;border-radius:7px;color:var(--ink);padding:2px 7px; }
    #pages { overflow-y: auto; padding: 10px; display: grid; gap: 6px; }
    #pages button { border: 0; background: transparent; color: var(--caption); text-align: left; padding: 8px 11px; border-radius: 8px; }
    #pages button:hover { background: var(--control); }
    #pages button[aria-current="page"] { background: var(--active); color: var(--ink); box-shadow: inset 2px 0 var(--ink); font-weight: 700; }
    footer { height: 52px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 14px; }
    footer button, header button { background: var(--control); border: 0; color: var(--ink); border-radius: 8px; padding: 9px 15px; }
    footer button { padding: 6px 10px; }
    footer button:hover:not(:disabled), header button:hover { background: var(--control-hover); }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    #pageCount { margin-right: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    #end { background: var(--strong); color: var(--on-strong); }
    #recoverDialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); padding:24px; max-width:430px; }
    #recoverMonitor { min-width:280px; padding:9px; background:var(--input); color:var(--ink); border:1px solid var(--line); border-radius:8px; }
    .recover-actions { display:flex; gap:10px; justify-content:flex-end; }
    .recover-actions button { background:var(--control); border:0; color:var(--ink); border-radius:8px; padding:9px 14px; }
    @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1.4fr) minmax(260px, .8fr); gap: 12px; padding: 12px; } .previews, .side { gap: 12px; } }
  </style>
</head>
<body>
  <header><div class="brand">NUTBOOK · 演讲者</div><button id="themeToggle" class="theme-toggle" type="button" aria-label="切换到深色外观" title="切换到深色外观"><span class="theme-swatch" aria-hidden="true"></span><span id="themeToggleText">深色</span></button><div id="status" role="status">等待观众窗口就绪…</div><button id="recover" type="button" aria-label="选择屏幕并恢复" title="选择屏幕并恢复" hidden>选择屏幕并恢复</button><label for="target">目标分钟</label><input id="target" type="number" min="1" max="600" aria-label="目标时长，分钟" title="目标时长，分钟"><div id="timer" aria-label="演示计时">00:00</div><button id="pause" type="button" aria-label="暂停计时" title="暂停计时">暂停</button><button id="reset" type="button" aria-label="重置计时" title="重置计时">重置</button></header>
  <main class="layout">
    <div class="previews">
      <section class="card"><div class="caption">当前页 · 静态信息预览</div><div class="preview-body" id="currentPreview"><div><strong>等待演示开始</strong></div></div></section>
      <section class="card notes"><div class="caption tools"><span>逐页备注 · 只读</span><label for="notesHeight">区域</label><input id="notesHeight" type="range" min="25" max="50" value="34" aria-label="备注区域高度" title="备注区域高度"><button id="smallerNotes" type="button" aria-label="缩小备注字号" title="缩小备注字号">A−</button><button id="largerNotes" type="button" aria-label="放大备注字号" title="放大备注字号">A+</button></div><div id="notes"></div></section>
    </div>
    <div class="side">
      <section class="card next"><div class="caption">下一页 · 静态信息预览</div><div class="preview-body" id="nextPreview"><div><strong>—</strong></div></div></section>
      <section class="card pages"><div class="caption">页面</div><div id="pages"></div></section>
    </div>
  </main>
  <footer><div id="pageCount">— / —</div><button id="previous" type="button" aria-label="上一页" title="上一页">← 上一页</button><button id="next" type="button" aria-label="下一页" title="下一页">下一页 →</button><button id="black" type="button" aria-label="临时黑屏" title="临时黑屏">临时黑屏</button><button id="end" type="button" aria-label="结束演示" title="结束演示">结束演示</button></footer>
  <dialog id="recoverDialog"><h2>恢复观众窗口</h2><p>选择当前可用的观众屏幕；恢复后将从最后确认的页面继续。</p><select id="recoverMonitor" aria-label="观众屏幕"></select><p id="recoverError" role="alert"></p><div class="recover-actions"><button id="recoverCancel" type="button">取消</button><button id="recoverConfirm" type="button">恢复</button></div></dialog>
  <script>
    (() => {
      const invoke = (command, args = {}) => window.__TAURI_INTERNALS__.invoke(command, args);
      const byId = id => document.getElementById(id);
      const COPY = {
        "zh-CN": { brand: "NUTBOOK · 演讲者", waiting: "等待观众窗口就绪…", ready: "观众窗口已就绪", navigating: "正在翻页…", target: "目标分钟", pause: "暂停", resume: "继续", reset: "重置", lightTheme: "浅色", darkTheme: "深色", switchToLight: "切换到浅色外观", switchToDark: "切换到深色外观", current: "当前页 · 静态预览", nextPreview: "下一页 · 静态预览", notes: "逐页备注 · 只读", area: "区域", pages: "页面", previous: "← 上一页", next: "下一页 →", black: "临时黑屏", restore: "恢复画面", end: "结束演示", noNotes: "本页没有备注", previewLoading: "正在生成静态预览 · 动画及媒体仅在观众屏播放", previewFailed: "图片预览不可用，观众播放不受影响", previewRetry: "重试预览", lastPage: "已到末页", recover: "选择屏幕并恢复", recoverTitle: "恢复观众窗口", recoverDescription: "选择当前可用的观众屏幕；恢复后将从最后确认的页面继续。", cancel: "取消", noDisplay: "没有可用显示器", changedDisplay: "屏幕已变化，请重新选择", primary: "主屏" },
        "en-US": { brand: "NUTBOOK · Presenter", waiting: "Waiting for audience window…", ready: "Audience window ready", navigating: "Changing slide…", target: "Target min", pause: "Pause", resume: "Resume", reset: "Reset", lightTheme: "Light", darkTheme: "Dark", switchToLight: "Switch to light appearance", switchToDark: "Switch to dark appearance", current: "Current · static preview", nextPreview: "Next · static preview", notes: "Slide notes · read only", area: "Area", pages: "Slides", previous: "← Previous", next: "Next →", black: "Black screen", restore: "Restore screen", end: "End presentation", noNotes: "No notes for this slide", previewLoading: "Creating static preview · media plays on audience screen", previewFailed: "Image preview unavailable; audience playback continues", previewRetry: "Retry preview", lastPage: "Last slide", recover: "Choose display and resume", recoverTitle: "Restore audience window", recoverDescription: "Choose an available display. Playback resumes from the last confirmed slide.", cancel: "Cancel", noDisplay: "No displays available", changedDisplay: "Display changed; choose again", primary: "Primary" }
      };
      let language = "zh-CN";
      const t = key => COPY[language][key] || COPY["zh-CN"][key];
      let state = null, startedAt = 0, elapsed = 0, paused = false, busy = false;
      const previews = new Map();
      const preferences = (() => { try { return JSON.parse(localStorage.getItem("nutbook-native-presenter-layout") || "{}"); } catch (_) { return {}; } })();
      let notesHeight = Math.max(25, Math.min(50, Number(preferences.notesBottomPercent) || 34));
      let notesFontSize = Math.max(16, Math.min(32, Number(preferences.notesFontSize) || 21));
      let theme = preferences.theme === "dark" ? "dark" : "light";
      function savePreferences() {
        try { localStorage.setItem("nutbook-native-presenter-layout", JSON.stringify({ notesBottomPercent: notesHeight, notesFontSize, theme })); } catch (_) {}
      }
      function applyTheme() {
        document.documentElement.dataset.theme = theme;
        const action = theme === "dark" ? t("switchToLight") : t("switchToDark");
        byId("themeToggleText").textContent = theme === "dark" ? t("lightTheme") : t("darkTheme");
        byId("themeToggle").title = action;
        byId("themeToggle").setAttribute("aria-label", action);
        savePreferences();
      }
      function applyLayout() {
        document.querySelector(".previews").style.gridTemplateRows = `minmax(0, ${100 - notesHeight}fr) minmax(0, ${notesHeight}fr)`;
        byId("notes").style.fontSize = `${notesFontSize}px`;
        byId("notesHeight").value = String(notesHeight);
        savePreferences();
      }
      function applyLanguage() {
        document.documentElement.lang = language;
        document.querySelector(".brand").textContent = t("brand");
        document.querySelector('label[for="target"]').textContent = t("target");
        const captions = document.querySelectorAll(".caption");
        captions[0].textContent = t("current"); captions[2].textContent = t("nextPreview");
        captions[1].querySelector("span").textContent = t("notes");
        captions[1].querySelector('label[for="notesHeight"]').textContent = t("area");
        captions[3].textContent = t("pages");
        byId("previous").textContent = t("previous"); byId("next").textContent = t("next");
        byId("end").textContent = t("end"); byId("reset").textContent = t("reset");
        byId("recover").textContent = t("recover");
        byId("recoverDialog").querySelector("h2").textContent = t("recoverTitle");
        byId("recoverDialog").querySelector("p").textContent = t("recoverDescription");
        byId("recoverCancel").textContent = t("cancel"); byId("recoverConfirm").textContent = t("resume");
        for (const [id, key] of [["previous", "previous"], ["next", "next"], ["end", "end"], ["reset", "reset"], ["recover", "recover"]]) {
          byId(id).title = t(key); byId(id).setAttribute("aria-label", t(key));
        }
        byId("target").title = t("target"); byId("target").setAttribute("aria-label", t("target"));
        applyTheme();
      }
      function renderTimer() {
        const ms = elapsed + (startedAt && !paused ? Date.now() - startedAt : 0);
        const seconds = Math.floor(ms / 1000);
        byId("timer").textContent = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
        byId("timer").classList.toggle("overdue", Boolean(state?.targetMinutes && ms > state.targetMinutes * 60_000));
        byId("pause").textContent = paused ? t("resume") : t("pause");
        byId("pause").title = byId("pause").textContent;
        byId("pause").setAttribute("aria-label", byId("pause").title);
      }
      function requestPreview(page) {
        if (!page || !state || previews.has(page.id)) return;
        previews.set(page.id, { pending: true });
        const sessionId = state.sessionId;
        invoke("native_presentation_thumbnail", { payload: { sessionId, pageId: page.id } })
          .then(result => { if (state?.sessionId === sessionId) { previews.set(page.id, { dataUrl: result.dataUrl }); render(); } })
          .catch(() => { if (state?.sessionId === sessionId) { previews.set(page.id, { failed: true }); render(); } });
      }
      function addPreview(container, page) {
        container.replaceChildren();
        const preview = page && previews.get(page.id);
        if (preview?.dataUrl) {
          const image = document.createElement("img"); image.src = preview.dataUrl;
          image.alt = `${page.title || page.id} 静态预览`;
          container.append(image); return;
        }
        const box = document.createElement("div");
        const heading = document.createElement("strong");
        heading.textContent = page ? page.title || page.id : "—";
        const hint = document.createElement("span");
        hint.textContent = page ? preview?.failed ? t("previewFailed") : t("previewLoading") : t("lastPage");
        box.append(heading, hint); container.append(box);
        if (page && preview?.failed) {
          const retry = document.createElement("button"); retry.type = "button"; retry.textContent = t("previewRetry");
          retry.addEventListener("click", () => { previews.delete(page.id); requestPreview(page); render(); });
          box.append(retry);
        }
        requestPreview(page);
      }
      function renderNotes(pageId) {
        const root = byId("notes"); root.replaceChildren();
        const paragraphs = state.notes?.[pageId] || [];
        if (!paragraphs.length) { const empty = document.createElement("p"); empty.className = "empty"; empty.textContent = t("noNotes"); root.append(empty); return; }
        for (const paragraph of paragraphs) {
          const p = document.createElement("p");
          for (const run of paragraph.runs || []) {
            const node = document.createElement(run.bold ? "strong" : "span");
            node.textContent = run.text || ""; p.append(node);
          }
          root.append(p);
        }
      }
      async function navigate(pageId) {
        if (!state?.ready || busy || state.pendingPageId) return;
        busy = true; render();
        try { state = await invoke("native_presentation_navigate", { payload: { sessionId: state.sessionId, pageId } }); }
        catch (error) { byId("status").textContent = String(error); byId("status").classList.add("error"); }
        finally { busy = false; render(); }
      }
      function render() {
        if (!state) return;
        const index = Math.max(0, state.pages.findIndex(page => page.id === state.activePageId));
        byId("status").textContent = state.error || (state.ready ? state.pendingPageId ? t("navigating") : t("ready") : t("waiting"));
        byId("status").classList.toggle("error", Boolean(state.error));
        byId("recover").hidden = !state.suspended;
        byId("pageCount").textContent = `${index + 1} / ${state.pages.length}`;
        addPreview(byId("currentPreview"), state.pages[index]);
        addPreview(byId("nextPreview"), state.pages[index + 1]);
        renderNotes(state.activePageId);
        byId("previous").disabled = !state.ready || busy || Boolean(state.pendingPageId) || index === 0;
        byId("next").disabled = !state.ready || busy || Boolean(state.pendingPageId) || index >= state.pages.length - 1;
        byId("black").disabled = !state.ready;
        byId("black").textContent = state.black ? t("restore") : t("black");
        byId("black").title = byId("black").textContent;
        byId("black").setAttribute("aria-label", byId("black").textContent);
        const pages = byId("pages"); pages.replaceChildren();
        state.pages.forEach((page, i) => {
          const button = document.createElement("button");
          button.type = "button"; button.textContent = `${i + 1}. ${page.title || page.id}`;
          button.disabled = !state.ready || busy || Boolean(state.pendingPageId);
          button.setAttribute("aria-current", page.id === state.activePageId ? "page" : "false");
          button.addEventListener("click", () => navigate(page.id)); pages.append(button);
        });
      }
      window.__NUTBOOK_NATIVE_PRESENTATION_STATE__ = next => {
        if (state && state.sessionId !== next.sessionId) return;
        state = next; language = next.language === "en-US" ? "en-US" : "zh-CN"; applyLanguage(); elapsed = next.timerElapsedMs || 0;
        startedAt = next.timerRunning ? Date.now() : 0; paused = !next.timerRunning;
        if (document.activeElement !== byId("target")) byId("target").value = next.targetMinutes || "";
        render(); renderTimer();
      };
      byId("previous").addEventListener("click", () => { const i = state.pages.findIndex(page => page.id === state.activePageId); if (i > 0) navigate(state.pages[i - 1].id); });
      byId("next").addEventListener("click", () => { const i = state.pages.findIndex(page => page.id === state.activePageId); if (i >= 0 && i + 1 < state.pages.length) navigate(state.pages[i + 1].id); });
      byId("end").addEventListener("click", async () => { if (state) await invoke("stop_native_presentation", { sessionId: state.sessionId }); });
      byId("black").addEventListener("click", async () => { if (!state?.ready) return; try { window.__NUTBOOK_NATIVE_PRESENTATION_STATE__(await invoke("native_presentation_blackout", { payload: { sessionId: state.sessionId, black: !state.black } })); } catch (error) { byId("status").textContent = String(error); byId("status").classList.add("error"); } });
      byId("recover").addEventListener("click", async () => {
        if (!state?.suspended) return;
        const monitors = await invoke("native_presentation_monitors").catch(() => []);
        const select = byId("recoverMonitor"); select.replaceChildren();
        for (const monitor of monitors) {
          const option = document.createElement("option"); option.value = monitor.id;
          option.textContent = `${monitor.name} · ${monitor.width}×${monitor.height}${monitor.primary ? ` · ${t("primary")}` : ""}`;
          select.append(option);
        }
        byId("recoverError").textContent = monitors.length ? "" : t("noDisplay");
        byId("recoverConfirm").disabled = !monitors.length;
        byId("recoverDialog").showModal();
      });
      byId("recoverCancel").addEventListener("click", () => byId("recoverDialog").close());
      byId("recoverConfirm").addEventListener("click", async () => {
        const monitors = await invoke("native_presentation_monitors").catch(() => []);
        const monitorId = byId("recoverMonitor").value;
        if (!monitors.some(monitor => monitor.id === monitorId)) { byId("recoverError").textContent = t("changedDisplay"); return; }
        try {
          const next = await invoke("recover_native_presentation", { payload: { sessionId: state.sessionId, monitorId, rehearsal: monitors.length === 1 } });
          byId("recoverDialog").close(); window.__NUTBOOK_NATIVE_PRESENTATION_STATE__(next);
        } catch (error) { byId("recoverError").textContent = String(error); }
      });
      byId("pause").addEventListener("click", async () => { if (!state?.ready) return; try { window.__NUTBOOK_NATIVE_PRESENTATION_STATE__(await invoke("native_presentation_timer", { payload: { sessionId: state.sessionId, action: paused ? "resume" : "pause" } })); } catch (_) {} });
      byId("reset").addEventListener("click", async () => { if (!state?.ready) return; try { window.__NUTBOOK_NATIVE_PRESENTATION_STATE__(await invoke("native_presentation_timer", { payload: { sessionId: state.sessionId, action: "reset" } })); } catch (_) {} });
      byId("target").addEventListener("change", async () => {
        if (!state) return;
        const value = Number(byId("target").value);
        const targetMinutes = value >= 1 && value <= 600 ? Math.round(value) : null;
        try { window.__NUTBOOK_NATIVE_PRESENTATION_STATE__(await invoke("native_presentation_timer", { payload: { sessionId: state.sessionId, action: "target", targetMinutes } })); } catch (_) {}
      });
      byId("notesHeight").addEventListener("input", () => { notesHeight = Number(byId("notesHeight").value); applyLayout(); });
      byId("smallerNotes").addEventListener("click", () => { notesFontSize = Math.max(16, notesFontSize - 1); applyLayout(); });
      byId("largerNotes").addEventListener("click", () => { notesFontSize = Math.min(32, notesFontSize + 1); applyLayout(); });
      byId("themeToggle").addEventListener("click", () => { theme = theme === "dark" ? "light" : "dark"; applyTheme(); });
      document.addEventListener("keydown", event => {
        if (event.isComposing || event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey || /INPUT|TEXTAREA|SELECT/.test(event.target?.tagName || "")) return;
        const i = state?.pages.findIndex(page => page.id === state.activePageId) ?? -1;
        if (["ArrowRight", "PageDown"].includes(event.key) && i + 1 < (state?.pages.length || 0)) { event.preventDefault(); navigate(state.pages[i + 1].id); }
        if (["ArrowLeft", "PageUp"].includes(event.key) && i > 0) { event.preventDefault(); navigate(state.pages[i - 1].id); }
        if (event.key === "Escape" && state) { event.preventDefault(); invoke("stop_native_presentation", { sessionId: state.sessionId }); }
      });
      invoke("native_presentation_state").then(current => { if (current) window.__NUTBOOK_NATIVE_PRESENTATION_STATE__(current); });
      applyLayout();
      applyTheme();
      setInterval(renderTimer, 250);
    })();
  </script>
</body>
</html>
