<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUTBOOK 演讲者</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif; background: var(--surface); color: var(--ink); --surface:#f9f9fb; --card:#fff; --well:#f3f3f5; --ink:#1a1c1d; --muted:#5e5e63; --caption:#4c4546; --line:#e2e2e4; --control:#eeeef0; --control-hover:#e2e2e4; --active:#eeeef0; --strong:#000; --on-strong:#fff; --input:#fff; }
    :root[data-theme="dark"] { color-scheme: dark; --surface:#141618; --card:#1b1e20; --well:#17191b; --ink:#f4f4f5; --muted:#b2b5b9; --caption:#d1d3d5; --line:#25282b; --control:#2b2e31; --control-hover:#383c40; --active:#323639; --strong:#f4f4f5; --on-strong:#17191b; --input:#292d30; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 720px; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .45; }
    header { height: 70px; padding: 0 24px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid var(--line); }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
    #status { color: var(--muted); font-size: 14px; margin-left:auto; }
    #status.error { color: #ba1a1a; }
    #timer { font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 700; }
    #timer.overdue { color:#ba1a1a; }
    #target { width:74px; padding:7px; border-radius:8px; border:1px solid var(--line); background:var(--input); color:var(--ink); }
    #target:focus { border-color:var(--ink); outline:none; }
    header button.theme-toggle { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; padding:5px 8px; font-size:12px; }
    .theme-swatch { width:12px; height:12px; border:1px solid var(--line); border-radius:50%; background:linear-gradient(90deg,#fff 50%,#1a1c1d 50%); }
    .layout { height: calc(100vh - 122px); min-height: 0; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, .7fr); gap: 18px; padding: 18px; }
    .previews { display: grid; grid-template-rows: minmax(0, 75fr) 8px minmax(0, 25fr); gap: 8px; min-height: 0; }
    .preview-divider { cursor: row-resize; border-radius: 8px; background: var(--control); position: relative; touch-action: none; }
    .preview-divider::after { content:""; position:absolute; left:50%; top:50%; width:36px; height:2px; border-radius:2px; transform:translate(-50%,-50%); background:var(--muted); }
    .preview-divider:hover, .preview-divider:focus-visible { background:var(--control-hover); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .caption { min-height: 30px; padding: 6px 12px; color: var(--caption); font-size: 12px; font-weight: 600; letter-spacing: .02em; border-bottom: 1px solid var(--line); }
    .preview-body { flex: 1; min-height: 0; min-width: 0; display: grid; place-items: center; text-align: center; padding: 8px; background: var(--well); overflow: hidden; }
    .preview-body strong { display: block; font-size: clamp(28px, 4vw, 58px); line-height: 1.12; }
    .preview-body span { color: var(--muted); font-size: 13px; margin-top: 10px; display: block; }
    .preview-body img { display:block; width:100%; height:100%; min-height:0; object-fit:contain; border-radius:6px; }
    .preview-body button { margin-top:12px; border:0; color:var(--ink); border-radius:8px; padding:7px 11px; background:var(--control-hover); }
    .next .preview-body strong { font-size: 26px; }
    .next .preview-body { aspect-ratio: 16 / 9; flex: none; }
    .side { display: grid; grid-template-rows: max-content minmax(0, 1fr); gap: 18px; min-height: 0; }
    .notes { min-height: 0; }
    #notes { flex:1; min-height:0; outline:none; overflow-y: auto; padding: 18px 20px; line-height: 1.55; font-size: 21px; }
    #notes { --notes-scrollbar:#c1c1c6; scrollbar-width:thin; scrollbar-color:var(--notes-scrollbar) transparent; }
    :root[data-theme="dark"] #notes { --notes-scrollbar:#51565a; }
    #notes::-webkit-scrollbar { width:6px; height:6px; }
    #notes::-webkit-scrollbar-track { background:transparent; }
    #notes::-webkit-scrollbar-thumb { background:var(--notes-scrollbar); border-radius:999px; }
    #notes::-webkit-scrollbar-thumb:hover { background:var(--muted); }
    #notes[contenteditable="true"] { box-shadow:inset 0 0 0 1px var(--muted); border-radius:0 0 8px 8px; }
    #notesError { margin:0; padding:6px 12px; color:#ba1a1a; font-size:13px; }
    #notesAction svg { width:18px; height:18px; }
    #notesLeaveDialog { border:1px solid var(--line); border-radius:16px; background:var(--card); color:var(--ink); padding:24px; max-width:430px; }
    #notesLeaveDialog::backdrop { background:rgb(0 0 0 / .22); }
    #notesLeaveDialog h2 { margin:0 0 12px; font-size:20px; }
    #notesLeaveDialog p { color:var(--muted); line-height:1.5; }
    #notesLeaveDialog .primary { background:var(--strong); color:var(--on-strong); }
    #notesLeaveDialog h2:focus { outline:none; }
    #notesLeaveDialog .recover-actions button { border-radius:999px; padding:9px 16px; white-space:nowrap; }
    #notes p { margin: 0 0 1em; }
    #notes .empty { color: var(--muted); }
    .pages { min-height: 0; }
    .caption.tools { display:flex;align-items:center;gap:8px; }
    .caption.tools span { margin-right:auto; }
    .caption.tools button { display:inline-flex;align-items:center;justify-content:center;flex:none;width:32px;height:28px;background:var(--control);border:0;border-radius:8px;color:var(--ink);padding:0;font-size:12px;font-weight:600;line-height:1; }
    .caption.tools button:hover:not(:disabled) { background:var(--control-hover); }
    #notesTooltip { position:fixed;z-index:100;padding:6px 9px;border-radius:7px;background:var(--ink);color:var(--card);font-size:12px;line-height:1.4;white-space:nowrap;box-shadow:0 3px 12px #0002;pointer-events:none; }
    #notesTooltip[hidden] { display:none; }
    #pages { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: grid; grid-auto-rows: max-content; align-content: start; gap: 6px; }
    #pages button { border: 0; background: transparent; color: var(--caption); text-align: left; padding: 8px 11px; border-radius: 8px; }
    #pages button:hover { background: var(--control); }
    #pages button[aria-current="page"] { background: var(--active); color: var(--ink); box-shadow: inset 2px 0 var(--ink); font-weight: 700; }
    footer { height: 52px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 14px; }
    footer button, header button { background: var(--control); border: 0; color: var(--ink); border-radius: 8px; padding: 9px 15px; }
    footer button { padding: 6px 10px; }
    #motionPause,#motionReplay { display:inline-flex;align-items:center;justify-content:center;line-height:1; }
    #motionPause svg,#motionReplay svg { display:block;flex:none; }
    footer button:hover:not(:disabled), header button:hover { background: var(--control-hover); }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    #pageCount { margin-right: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    #end { background: var(--strong); color: var(--on-strong); }
    #recoverDialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); padding:24px; max-width:430px; }
    #recoverMonitor { min-width:280px; padding:9px; background:var(--input); color:var(--ink); border:1px solid var(--line); border-radius:8px; }
    .recover-actions { display:flex; gap:10px; justify-content:flex-end; }
    .recover-actions button { background:var(--control); border:0; color:var(--ink); border-radius:8px; padding:9px 14px; }
    @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1.7fr) minmax(260px, .7fr); gap: 12px; padding: 12px; } .previews { gap: 6px; } .side { gap: 12px; } }
  </style>
</head>
<body>
  <header><div class="brand">NUTBOOK · 演讲者</div><button id="themeToggle" class="theme-toggle" type="button" aria-label="切换到深色外观" title="切换到深色外观"><span class="theme-swatch" aria-hidden="true"></span><span id="themeToggleText">深色</span></button><div id="status" role="status">等待观众画面就绪…</div><button id="recover" type="button" aria-label="选择屏幕并恢复" title="选择屏幕并恢复" hidden>选择屏幕并恢复</button><label for="target">目标分钟</label><input id="target" type="number" min="1" max="600" aria-label="目标时长，分钟" title="目标时长，分钟"><div id="timer" aria-label="演示计时">00:00</div><button id="pause" type="button" aria-label="暂停计时" title="暂停计时" disabled>暂停</button><button id="reset" type="button" aria-label="开始计时" title="开始计时" disabled>开始</button></header>
  <main class="layout">

      <section class="card notes"><div class="caption tools"><span>逐页备注</span><button id="notesAction" type="button" aria-label="编辑备注" title="编辑备注" disabled></button><button id="smallerNotes" type="button" aria-label="缩小备注字号" title="缩小备注字号">A−</button><button id="largerNotes" type="button" aria-label="放大备注字号" title="放大备注字号">A+</button></div><p id="notesError" role="alert" hidden></p><div id="notes" role="textbox" aria-multiline="true" aria-label="逐页备注" contenteditable="false"></div></section>
    </div>
    <div class="side">

  </main>
  <footer><div id="pageCount">— / —</div><button id="previous" type="button" aria-label="上一页" title="上一页">← 上一页</button><button id="next" type="button" aria-label="下一页" title="下一页">下一页 →</button><div id="motionControls" hidden style="display:none;align-items:center;gap:6px"><button id="motionPause" type="button" title="暂停动效" aria-label="暂停动效"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button><button id="motionReplay" type="button" title="重播当前页动效" aria-label="重播当前页动效"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10a9 9 0 1 1 1 8M3 4v6h6"/></svg></button><input id="motionSeek" type="range" min="0" max="0" step="1" value="0" title="当前页动效时间" aria-label="当前页动效时间" style="width:100px;accent-color:var(--strong)"><output id="motionTime" style="font-size:12px;font-variant-numeric:tabular-nums">0.0s</output></div><button id="black" type="button" aria-label="临时黑屏" title="临时黑屏">临时黑屏</button><button id="end" type="button" aria-label="结束演示" title="结束演示">结束演示</button></footer>
  <dialog id="recoverDialog"><h2>恢复观众画面</h2><p>选择当前可用的观众屏幕；恢复后将从最后确认的页面继续。</p><select id="recoverMonitor" aria-label="观众屏幕"></select><p id="recoverError" role="alert"></p><div class="recover-actions"><button id="recoverCancel" type="button">取消</button><button id="recoverConfirm" type="button">恢复</button></div></dialog>
  <dialog id="notesLeaveDialog" aria-labelledby="notesLeaveTitle"><h2 id="notesLeaveTitle" tabindex="-1"></h2><p id="notesLeaveDescription"></p><div class="recover-actions"><button id="notesKeepEditing" type="button"></button><button id="notesDiscard" type="button"></button><button id="notesSaveLeave" class="primary" type="button"></button></div></dialog>
  <div id="notesTooltip" role="tooltip" hidden></div>
  <script>
    (() => {
      const invoke = (command, args = {}) => window.__TAURI_INTERNALS__.invoke(command, args);
      const byId = id => document.getElementById(id);
      const COPY = {

        "en-US": { brand: "NUTBOOK · Presenter", waiting: "Waiting for audience view…", ready: "Audience view ready", shareWindow: "In online meetings, share the NUTBOOK window", navigating: "Changing slide…", target: "Target min", pause: "Pause", resume: "Resume", start: "Start", reset: "Reset", lightTheme: "Light", darkTheme: "Dark", switchToLight: "Switch to light appearance", switchToDark: "Switch to dark appearance", current: "Current · live preview", nextPreview: "Next · static preview", currentStatic: "Current · static preview", notes: "Slide notes", smallerNotes:"Smaller notes text",largerNotes:"Larger notes text",editNotes:"Edit notes", saveNotes:"Save notes", savingNotes:"Saving notes…", notesSaved:"Notes saved", notesFailed:"Could not save notes. Your changes are retained; retry saving.", notesConflict:"The file changed externally and was not overwritten. Keep a copy of your notes and reopen after ending the presentation.", notesLeave:"Save note changes?", notesLeaveDescription:"The current slide has unsaved notes.", keepEditing:"Keep editing", discardNotes:"Discard changes", saveLeave:"Save and continue", resizePreview: "Resize slide and notes", dragPreview: "Drag to resize slide and notes", pages: "Slides", previous: "← Previous", next: "Next →", motionPause:"Pause animation",motionResume:"Resume animation",motionReplay:"Replay slide animation",motionSeek:"Slide animation time",nextStep:"Next step →", finishStep:"Finish step", syncingMotion:"Syncing animation…", black: "Black screen", restore: "Restore screen", end: "End presentation", noNotes: "No notes for this slide", previewLoading: "Preparing preview…", previewFailed: "Image preview unavailable; audience playback continues", previewRetry: "Retry preview", lastPage: "Last slide", recover: "Choose display and resume", recoverTitle: "Restore audience view", recoverDescription: "Choose an available display. Playback resumes from the last confirmed slide.", cancel: "Cancel", noDisplay: "No displays available", changedDisplay: "Display changed; choose again", primary: "Primary", primaryDisplay: "Primary display", display: "Display" }
      };
      let language = "zh-CN";
      const t = key => COPY[language][key] || COPY["zh-CN"][key];
      let state = null, startedAt = 0, elapsed = 0, paused = false, busy = false;
      const previews = new Map();
      let notesEdit = null, notesBusy = false, notesComposing = false, notesOperation = null, pendingNotesLeave = false;
      let notesMessage = "", notesIntentBusy = false;
      let notesTooltipButton = null;
      function hideNotesTooltip() {
        notesTooltipButton?.removeAttribute("aria-describedby");
        notesTooltipButton = null; byId("notesTooltip").hidden = true;
      }
      function showNotesTooltip(button) {

        notesTooltipButton?.removeAttribute("aria-describedby"); notesTooltipButton = button;
        const tooltip = byId("notesTooltip"), rect = button.getBoundingClientRect();

        tooltip.style.top = `${rect.bottom+6+tooltip.offsetHeight <= innerHeight-8 ? rect.bottom+6 : rect.top-tooltip.offsetHeight-6}px`;
      }
      const editNotesIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 16.5-1 4 4-1L20 7a2.12 2.12 0 0 0-3-3Z"/><path d="m15.5 5.5 3 3m-14 8 3 3"/></svg>';
      const saveNotesIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
      function syncNotesAction() {
        const button = byId("notesAction"), label = t(notesBusy ? "savingNotes" : notesEdit ? "saveNotes" : "editNotes");
        button.innerHTML = notesEdit ? saveNotesIcon : editNotesIcon;
        button.dataset.tooltip = label; button.removeAttribute("title"); button.setAttribute("aria-label", label);

        const paragraphs = []; let runs = [];

          if (!text) return;
          const last = runs[runs.length - 1];
          if (last?.bold === bold) last.text += text; else runs.push({ text, bold });

      }
      async function cancelNotesEdit() {
        if (!notesEdit || notesBusy) return !notesEdit;
        notesBusy = true; syncNotesAction();

          await invoke("native_presentation_notes_edit", { payload: { sessionId:notesEdit.sessionId, editing:false } });
          notesEdit = null; notesMessage = ""; renderNotes(state.activePageId);
          return true;
        } catch (_) { notesMessage = t("notesFailed"); return false; }
        finally { notesBusy = false; syncNotesAction(); }
      }
      function saveNotesEdit() {

            const next = await invoke("native_presentation_notes_save", { payload: {

      }

        try {
          await invoke("native_presentation_notes_edit", { payload:{ sessionId:state.sessionId, editing:true, promptOpen:true } });
        } catch (_) { pendingNotesLeave = false; notesMessage = t("notesFailed"); syncNotesAction(); return false; }
        const dialog = byId("notesLeaveDialog");
        byId("notesLeaveTitle").textContent = t("notesLeave");
        byId("notesLeaveDescription").textContent = t("notesLeaveDescription");
        byId("notesKeepEditing").textContent = t("keepEditing");
        byId("notesDiscard").textContent = t("discardNotes");
        byId("notesSaveLeave").textContent = t("saveLeave");
        return new Promise(resolve => {
          let deciding = false;
