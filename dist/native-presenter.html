<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUTBOOK 演讲者</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif; background: var(--surface); color: var(--ink); --surface:#f9f9fb; --card:#fff; --well:#f3f3f5; --ink:#1a1c1d; --muted:#5e5e63; --caption:#4c4546; --line:#e2e2e4; --control:#eeeef0; --control-hover:#e2e2e4; --active:#eeeef0; --strong:#000; --on-strong:#fff; --input:#fff; }
    :root[data-theme="dark"] { color-scheme: dark; --surface:#141618; --card:#1b1e20; --well:#17191b; --ink:#f4f4f5; --muted:#b2b5b9; --caption:#d1d3d5; --line:#25282b; --control:#2b2e31; --control-hover:#383c40; --active:#323639; --strong:#f4f4f5; --on-strong:#17191b; --input:#292d30; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 720px; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .45; }
    header { height: 70px; padding: 0 24px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid var(--line); }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
    #status { color: var(--muted); font-size: 14px; margin-left:auto; }
    #status.error { color: #ba1a1a; }
    #timer { font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 700; }
    #timer.overdue { color:#ba1a1a; }
    #target { width:74px; padding:7px; border-radius:8px; border:1px solid var(--line); background:var(--input); color:var(--ink); }
    #target:focus { border-color:var(--ink); outline:none; }
    header button.theme-toggle { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; padding:5px 8px; font-size:12px; }
    .theme-swatch { width:12px; height:12px; border:1px solid var(--line); border-radius:50%; background:linear-gradient(90deg,#fff 50%,#1a1c1d 50%); }
    .layout { height: calc(100vh - 122px); min-height: 0; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, .7fr); gap: 18px; padding: 18px; }
    .previews { display: grid; grid-template-rows: minmax(0, 75fr) 8px minmax(0, 25fr); gap: 8px; min-height: 0; }
    .preview-divider { cursor: row-resize; border-radius: 8px; background: var(--control); position: relative; touch-action: none; }
    .preview-divider::after { content:""; position:absolute; left:50%; top:50%; width:36px; height:2px; border-radius:2px; transform:translate(-50%,-50%); background:var(--muted); }
    .preview-divider:hover, .preview-divider:focus-visible { background:var(--control-hover); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .caption { min-height: 30px; padding: 6px 12px; color: var(--caption); font-size: 12px; font-weight: 600; letter-spacing: .02em; border-bottom: 1px solid var(--line); }
    .preview-body { flex: 1; min-height: 0; min-width: 0; display: grid; place-items: center; text-align: center; padding: 8px; background: var(--well); overflow: hidden; }
    .preview-body strong { display: block; font-size: clamp(28px, 4vw, 58px); line-height: 1.12; }
    .preview-body span { color: var(--muted); font-size: 13px; margin-top: 10px; display: block; }
    .preview-body img { display:block; width:100%; height:100%; min-height:0; object-fit:contain; border-radius:6px; }
    .preview-body button { margin-top:12px; border:0; color:var(--ink); border-radius:8px; padding:7px 11px; background:var(--control-hover); }
    .next .preview-body strong { font-size: 26px; }
    .next .preview-body { aspect-ratio: 16 / 9; flex: none; }
    .side { display: grid; grid-template-rows: max-content minmax(0, 1fr); gap: 18px; min-height: 0; }
    .notes { min-height: 0; }
    #notes { overflow-y: auto; padding: 18px 20px; line-height: 1.55; font-size: 21px; }
    #notes p { margin: 0 0 1em; }
    #notes .empty { color: var(--muted); }
    .pages { min-height: 0; }
    .caption.tools { display:flex;align-items:center;gap:8px; }
    .caption.tools span { margin-right:auto; }
    .caption.tools button { background:var(--control);border:0;border-radius:7px;color:var(--ink);padding:2px 7px; }
    #pages { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: grid; grid-auto-rows: max-content; align-content: start; gap: 6px; }
    #pages button { border: 0; background: transparent; color: var(--caption); text-align: left; padding: 8px 11px; border-radius: 8px; }
    #pages button:hover { background: var(--control); }
    #pages button[aria-current="page"] { background: var(--active); color: var(--ink); box-shadow: inset 2px 0 var(--ink); font-weight: 700; }
    footer { height: 52px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 14px; }
    footer button, header button { background: var(--control); border: 0; color: var(--ink); border-radius: 8px; padding: 9px 15px; }
    footer button { padding: 6px 10px; }
    #motionPause,#motionReplay { display:inline-flex;align-items:center;justify-content:center;line-height:1; }
    #motionPause svg,#motionReplay svg { display:block;flex:none; }
    footer button:hover:not(:disabled), header button:hover { background: var(--control-hover); }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    #pageCount { margin-right: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    #end { background: var(--strong); color: var(--on-strong); }
    #recoverDialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); padding:24px; max-width:430px; }
    #recoverMonitor { min-width:280px; padding:9px; background:var(--input); color:var(--ink); border:1px solid var(--line); border-radius:8px; }
    .recover-actions { display:flex; gap:10px; justify-content:flex-end; }
    .recover-actions button { background:var(--control); border:0; color:var(--ink); border-radius:8px; padding:9px 14px; }
    @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1.7fr) minmax(260px, .7fr); gap: 12px; padding: 12px; } .previews { gap: 6px; } .side { gap: 12px; } }
  </style>
</head>
<body>
  <header><div class="brand">NUTBOOK · 演讲者</div><button id="themeToggle" class="theme-toggle" type="button" aria-label="切换到深色外观" title="切换到深色外观"><span class="theme-swatch" aria-hidden="true"></span><span id="themeToggleText">深色</span></button><div id="status" role="status">等待观众画面就绪…</div><button id="recover" type="button" aria-label="选择屏幕并恢复" title="选择屏幕并恢复" hidden>选择屏幕并恢复</button><label for="target">目标分钟</label><input id="target" type="number" min="1" max="600" aria-label="目标时长，分钟" title="目标时长，分钟"><div id="timer" aria-label="演示计时">00:00</div><button id="pause" type="button" aria-label="暂停计时" title="暂停计时" disabled>暂停</button><button id="reset" type="button" aria-label="开始计时" title="开始计时" disabled>开始</button></header>
  <main class="layout">
    <div class="previews">
      <section class="card"><div class="caption">当前页 · 动态预览</div><div class="preview-body" id="currentPreview"><div><strong>等待演示开始</strong></div></div></section>
      <div id="previewDivider" class="preview-divider" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="调整当前页与备注高度" aria-valuemin="20" aria-valuemax="50" aria-valuenow="25" title="拖动调整当前页与备注高度"></div>
      <section class="card notes"><div class="caption tools"><span>逐页备注 · 只读</span><button id="smallerNotes" type="button" aria-label="缩小备注字号" title="缩小备注字号">A−</button><button id="largerNotes" type="button" aria-label="放大备注字号" title="放大备注字号">A+</button></div><div id="notes"></div></section>
    </div>
    <div class="side">
      <section class="card next"><div class="caption">下一页 · 静态预览</div><div class="preview-body" id="nextPreview"><div><strong>—</strong></div></div></section>
      <section class="card pages"><div class="caption">页面</div><div id="pages"></div></section>
    </div>
  </main>
  <footer><div id="pageCount">— / —</div><button id="previous" type="button" aria-label="上一页" title="上一页">← 上一页</button><button id="next" type="button" aria-label="下一页" title="下一页">下一页 →</button><div id="motionControls" hidden style="display:none;align-items:center;gap:6px"><button id="motionPause" type="button" title="暂停动效" aria-label="暂停动效"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button><button id="motionReplay" type="button" title="重播当前页动效" aria-label="重播当前页动效"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10a9 9 0 1 1 1 8M3 4v6h6"/></svg></button><input id="motionSeek" type="range" min="0" max="0" step="1" value="0" title="当前页动效时间" aria-label="当前页动效时间" style="width:100px;accent-color:var(--strong)"><output id="motionTime" style="font-size:12px;font-variant-numeric:tabular-nums">0.0s</output></div><button id="black" type="button" aria-label="临时黑屏" title="临时黑屏">临时黑屏</button><button id="end" type="button" aria-label="结束演示" title="结束演示">结束演示</button></footer>
  <dialog id="recoverDialog"><h2>恢复观众画面</h2><p>选择当前可用的观众屏幕；恢复后将从最后确认的页面继续。</p><select id="recoverMonitor" aria-label="观众屏幕"></select><p id="recoverError" role="alert"></p><div class="recover-actions"><button id="recoverCancel" type="button">取消</button><button id="recoverConfirm" type="button">恢复</button></div></dialog>
  <script>
    (() => {
      const invoke = (command, args = {}) => window.__TAURI_INTERNALS__.invoke(command, args);
      const byId = id => document.getElementById(id);
      const COPY = {
        "zh-CN": { brand: "NUTBOOK · 演讲者", waiting: "等待观众画面就绪…", ready: "观众画面已就绪", shareWindow: "在线会议中请共享 NUTBOOK 窗口", navigating: "正在翻页…", target: "目标分钟", pause: "暂停", resume: "继续", start: "开始", reset: "重置", lightTheme: "浅色", darkTheme: "深色", switchToLight: "切换到浅色外观", switchToDark: "切换到深色外观", current: "当前页 · 动态预览", nextPreview: "下一页 · 静态预览", currentStatic: "当前页 · 静态预览", notes: "逐页备注 · 只读", resizePreview: "调整当前页与备注高度", dragPreview: "拖动调整当前页与备注高度", pages: "页面", previous: "← 上一页", next: "下一页 →", motionPause:"暂停动效",motionResume:"继续动效",motionReplay:"重播当前页动效",motionSeek:"当前页动效时间",nextStep:"下一步 →", finishStep:"完成当前步", syncingMotion:"正在同步动作…", black: "临时黑屏", restore: "恢复画面", end: "结束演示", noNotes: "本页没有备注", previewLoading: "正在准备预览…", previewFailed: "图片预览不可用，观众播放不受影响", previewRetry: "重试预览", lastPage: "已到末页", recover: "选择屏幕并恢复", recoverTitle: "恢复观众画面", recoverDescription: "选择当前可用的观众屏幕；恢复后将从最后确认的页面继续。", cancel: "取消", noDisplay: "没有可用显示器", changedDisplay: "屏幕已变化，请重新选择", primary: "主屏", primaryDisplay: "主屏幕", display: "显示器" },
        "en-US": { brand: "NUTBOOK · Presenter", waiting: "Waiting for audience view…", ready: "Audience view ready", shareWindow: "In online meetings, share the NUTBOOK window", navigating: "Changing slide…", target: "Target min", pause: "Pause", resume: "Resume", start: "Start", reset: "Reset", lightTheme: "Light", darkTheme: "Dark", switchToLight: "Switch to light appearance", switchToDark: "Switch to dark appearance", current: "Current · live preview", nextPreview: "Next · static preview", currentStatic: "Current · static preview", notes: "Slide notes · read only", resizePreview: "Resize slide and notes", dragPreview: "Drag to resize slide and notes", pages: "Slides", previous: "← Previous", next: "Next →", motionPause:"Pause animation",motionResume:"Resume animation",motionReplay:"Replay slide animation",motionSeek:"Slide animation time",nextStep:"Next step →", finishStep:"Finish step", syncingMotion:"Syncing animation…", black: "Black screen", restore: "Restore screen", end: "End presentation", noNotes: "No notes for this slide", previewLoading: "Preparing preview…", previewFailed: "Image preview unavailable; audience playback continues", previewRetry: "Retry preview", lastPage: "Last slide", recover: "Choose display and resume", recoverTitle: "Restore audience view", recoverDescription: "Choose an available display. Playback resumes from the last confirmed slide.", cancel: "Cancel", noDisplay: "No displays available", changedDisplay: "Display changed; choose again", primary: "Primary", primaryDisplay: "Primary display", display: "Display" }
      };
      let language = "zh-CN";
      const t = key => COPY[language][key] || COPY["zh-CN"][key];
      let state = null, startedAt = 0, elapsed = 0, paused = false, busy = false;
      const previews = new Map();
      let liveUnavailable = false, liveFailures = 0, liveSyncBusy = false, liveSyncRequested = false, liveSyncScheduled = false, lastLiveKey = "";
      let liveReady = false, liveTimedOut = false, liveTimer = null;
      function liveCaption() {
        const captions = document.querySelectorAll(".caption");
        captions[0].textContent = t(state?.staticMotion || liveUnavailable || liveTimedOut ? "currentStatic" : "current");
        captions[2].textContent = t("nextPreview");
      }
      window.__NUTBOOK_LIVE_PREVIEW_READY__ = () => {
        liveReady = true; liveTimedOut = false;
        clearTimeout(liveTimer); liveTimer = null;
        liveCaption();
      };
      function fittedPreviewBounds(container) {
        const box = container.getBoundingClientRect();
        const width = Math.max(0, Math.min(box.width - 16, (box.height - 16) * 16 / 9));
        const height = width * 9 / 16;
        return { x: Math.round(box.left + (box.width - width) / 2), y: Math.round(box.top + (box.height - height) / 2), width: Math.round(width), height: Math.round(height) };
      }
      function scheduleLiveSync() {
        if (liveUnavailable || liveSyncScheduled || !state?.ready || state.suspended) return;
        liveSyncScheduled = true;
        requestAnimationFrame(() => { liveSyncScheduled = false; void syncLivePreviews(); });
      }
      async function syncLivePreviews() {
        if (liveUnavailable || !state?.ready || state.suspended) return;
        if (liveSyncBusy) { liveSyncRequested = true; return; }
        const current = fittedPreviewBounds(byId("currentPreview"));
        if (Math.min(current.width, current.height) < 32) return;
        const key = JSON.stringify({ sessionId: state.sessionId, activePageId: state.activePageId, current });
        if (key === lastLiveKey) return;
        liveSyncBusy = true;
        try {
          await invoke("native_presentation_live_preview", { payload: { sessionId: state.sessionId, current, viewportWidth: innerWidth, viewportHeight: innerHeight } });
          lastLiveKey = key; liveFailures = 0;
          if (!liveReady && !liveTimer) liveTimer = setTimeout(() => {
            liveTimer = null;
            if (!liveReady) { liveTimedOut = true; liveCaption(); }
          }, 12000);
        } catch (_) {
          if (++liveFailures >= 3) { liveUnavailable = true; liveCaption(); }
          else setTimeout(scheduleLiveSync, 500);
        } finally {
          liveSyncBusy = false;
          if (liveSyncRequested) { liveSyncRequested = false; scheduleLiveSync(); }
        }
      }
      const preferences = (() => { try { return JSON.parse(localStorage.getItem("nutbook-native-presenter-layout") || "{}"); } catch (_) { return {}; } })();
      const storedNotesHeight = Number(preferences.notesBottomPercent);
      let notesHeight = Math.max(20, Math.min(50, preferences.layoutVersion !== 2 && storedNotesHeight === 34 ? 25 : storedNotesHeight || 25));
      let notesFontSize = Math.max(16, Math.min(32, Number(preferences.notesFontSize) || 21));
      let theme = preferences.theme === "dark" ? "dark" : "light";
      function savePreferences() {
        try { localStorage.setItem("nutbook-native-presenter-layout", JSON.stringify({ layoutVersion: 2, notesBottomPercent: notesHeight, notesFontSize, theme })); } catch (_) {}
      }
      function applyTheme() {
        document.documentElement.dataset.theme = theme;
        const action = theme === "dark" ? t("switchToLight") : t("switchToDark");
        byId("themeToggleText").textContent = theme === "dark" ? t("lightTheme") : t("darkTheme");
        byId("themeToggle").title = action;
        byId("themeToggle").setAttribute("aria-label", action);
        savePreferences();
      }
      function applyLayout() {
        document.querySelector(".previews").style.gridTemplateRows = `minmax(0, ${100 - notesHeight}fr) 8px minmax(0, ${notesHeight}fr)`;
        byId("notes").style.fontSize = `${notesFontSize}px`;
        byId("previewDivider").setAttribute("aria-valuenow", String(notesHeight));
        savePreferences();
        scheduleLiveSync();
      }
      function applyLanguage() {
        document.documentElement.lang = language;
        document.querySelector(".brand").textContent = t("brand");
        document.querySelector('label[for="target"]').textContent = t("target");
        const captions = document.querySelectorAll(".caption");
        liveCaption();
        captions[1].querySelector("span").textContent = t("notes");
        byId("previewDivider").setAttribute("aria-label", t("resizePreview"));
        byId("previewDivider").title = t("dragPreview");
        captions[3].textContent = t("pages");
        byId("previous").textContent = t("previous"); byId("next").textContent = t("next");
        byId("end").textContent = t("end");
        byId("recover").textContent = t("recover");
        byId("recoverDialog").querySelector("h2").textContent = t("recoverTitle");
        byId("recoverDialog").querySelector("p").textContent = t("recoverDescription");
        byId("recoverCancel").textContent = t("cancel"); byId("recoverConfirm").textContent = t("resume");
        for (const [id, key] of [["previous", "previous"], ["next", "next"], ["end", "end"], ["recover", "recover"]]) {
          byId(id).title = t(key); byId(id).setAttribute("aria-label", t(key));
        }
        byId("target").title = t("target"); byId("target").setAttribute("aria-label", t("target"));
        applyTheme();
      }
      function renderTimer() {
        const ms = elapsed + (startedAt && !paused ? Date.now() - startedAt : 0);
        const seconds = Math.floor(ms / 1000);
        byId("timer").textContent = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
        byId("timer").classList.toggle("overdue", Boolean(state?.targetMinutes && ms > state.targetMinutes * 60_000));
        byId("pause").textContent = paused ? t("resume") : t("pause");
        byId("pause").title = byId("pause").textContent;
        byId("pause").setAttribute("aria-label", byId("pause").title);
        byId("pause").disabled = !state?.ready || !state?.timerHasStarted;
        byId("reset").textContent = t(state?.timerHasStarted ? "reset" : "start");
        byId("reset").title = byId("reset").textContent;
        byId("reset").setAttribute("aria-label", byId("reset").title);
        byId("reset").disabled = !state?.ready;
      }
      function requestPreview(page) {
        if (!page || !state || previews.has(page.id)) return;
        previews.set(page.id, { pending: true });
        const sessionId = state.sessionId;
        const stillVisible = () => state?.sessionId === sessionId && (() => {
          const index = state.pages.findIndex(candidate => candidate.id === state.activePageId);
          return state.pages[index - 1]?.id === page.id || state.pages[index]?.id === page.id || state.pages[index + 1]?.id === page.id || state.pages[index + 2]?.id === page.id;
        })();
        invoke("native_presentation_thumbnail", { payload: { sessionId, pageId: page.id } })
          .then(async result => {
            const image = new Image();
            image.src = result.dataUrl;
            await image.decode?.();
            if (stillVisible()) { image.alt = `${page.title || page.id} 静态预览`; previews.set(page.id, { image }); render(); }
          })
          .catch(() => { if (stillVisible()) { previews.set(page.id, { failed: true }); render(); } });
      }
      function addPreview(container, page) {
        requestPreview(page);
        const preview = page && previews.get(page.id);
        const key = `${page?.id || "none"}:${preview?.image ? "ready" : preview?.failed ? "failed" : "pending"}`;
        if (container.dataset.previewKey === key && (!preview?.image || container.firstChild === preview.image)) return;
        container.dataset.previewKey = key;
        if (preview?.image) {
          container.replaceChildren(preview.image); return;
        }
        container.replaceChildren();
        const box = document.createElement("div");
        const heading = document.createElement("strong");
        heading.textContent = page ? page.title || page.id : "—";
        const hint = document.createElement("span");
        hint.textContent = page ? preview?.failed ? t("previewFailed") : t("previewLoading") : t("lastPage");
        box.append(heading, hint); container.append(box);
        if (page && preview?.failed) {
          const retry = document.createElement("button"); retry.type = "button"; retry.textContent = t("previewRetry");
          retry.addEventListener("click", () => { previews.delete(page.id); requestPreview(page); render(); });
          box.append(retry);
        }
      }
      function renderNotes(pageId) {
        const root = byId("notes"); root.replaceChildren();
        const paragraphs = state.notes?.[pageId] || [];
        if (!paragraphs.length) { const empty = document.createElement("p"); empty.className = "empty"; empty.textContent = t("noNotes"); root.append(empty); return; }
        for (const paragraph of paragraphs) {
          const p = document.createElement("p");
          for (const run of paragraph.runs || []) {
            const node = document.createElement(run.bold ? "strong" : "span");
            node.textContent = run.text || ""; p.append(node);
          }
          root.append(p);
        }
      }
      async function navigate(pageId) {
        if (!state?.ready || busy || state.pendingPageId || state.pendingMotion) return;
        busy = true; render();
        try { window.__NUTBOOK_NATIVE_PRESENTATION_STATE__(await invoke("native_presentation_navigate", { payload: { sessionId: state.sessionId, pageId } })); }
        catch (error) { byId("status").textContent = String(error); byId("status").classList.add("error"); }
        finally { busy = false; render(); }
      }
      async function advance(){if(!state?.ready)return;try{window.__NUTBOOK_NATIVE_PRESENTATION_STATE__(await invoke("native_presentation_advance",{payload:{sessionId:state.sessionId}}));}catch(error){byId("status").textContent=String(error);}}
