<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PR C 主样本 · 本地 AI Bundle</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="deck">
    <section class="slide" data-slide="1">
      <h1>PR C 主样本</h1>
      <p>全本地 bundle：子目录 CSS / JS / 图片 / JSON 都应正常加载。</p>
      <img src="assets/cover.png" alt="封面像素">
    </section>
    <section class="slide" data-slide="2" hidden>
      <h2>第二页：脚本状态</h2>
      <p>计数器：<b id="counter">0</b>（点击按钮自增，用于验证加入后重建能恢复交互）</p>
      <button id="bump" type="button">+1</button>
    </section>
    <section class="slide" data-slide="3" hidden>
      <h2>第三页：JSON 资源</h2>
      <pre id="data">加载中…</pre>
    </section>
  </main>
  <nav class="pager">
    <button id="prev" type="button">上一页</button>
    <span id="pageLabel">1 / 3</span>
    <button id="next" type="button">下一页</button>
  </nav>
  <p class="hint">滚动锚点：<a href="#tail">跳到底部</a></p>
  <div class="filler"></div>
  <h3 id="tail">底部锚点</h3>
  <p>用于验证加入后重建恢复滚动位置与 hash。</p>
  <script src="assets/app.js"></script>
</body>
</html>
