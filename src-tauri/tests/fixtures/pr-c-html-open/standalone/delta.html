<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>独立样本 丁</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 48px; line-height: 1.8; color: #1c1c1e; }
    h1 { color: #005C9E; }
    .tall { height: 1800px; background: linear-gradient(#fff, #eef4fa); }
  </style>
</head>
<body>
  <h1>独立样本 丁（第 4 个）</h1>
  <p>find 验收关键词：<b>NUTBOOKFINDDELTA</b>（每个样本唯一，用于确认 find 不串页）。</p>
  <p>计时器：<b id="tick">0</b> 秒（用于验证后台暂停与最小化恢复行为）。</p>
  <div class="tall"></div>
  <p>底部：NUTBOOKFINDDELTA-TAIL</p>
  <script>
    (function () {
      var seconds = 0;
      var node = document.getElementById("tick");
      setInterval(function () { seconds += 1; if (node) { node.textContent = String(seconds); } }, 1000);
    })();
  </script>
</body>
</html>
