<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>演示桥样本</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 40px; line-height: 1.7; color: #1c1c1e; }
    h1 { color: #005C9E; }
    section[hidden] { display: none; }
    .pager { display: flex; gap: 12px; align-items: center; margin: 24px 0; }
    button { padding: 6px 14px; border: 1px solid #005C9E; background: #fff; color: #005C9E; border-radius: 6px; cursor: pointer; }
    #selftest { margin-top: 28px; padding: 12px 14px; background: #f5f5f7; border-radius: 8px; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
    .pass { color: #1b6b3a; } .fail { color: #b3261e; }
  </style>
</head>
<body>
  <h1>演示桥样本（真实合同）</h1>
  <p>本页定义 <code>window.__NUTBOOK_PRESENTATION__</code>（version 1），
  宿主据此序列化 <code>presentationPageId</code> 并在受控重建后调用 <code>goTo(pageId)</code> 恢复。
  同时满足演示预览入口合同：<code>bridge.pages</code> 数组 + 唯一的 <code>data-nutbook-page-id</code> 属性。</p>
  <main>
    <section data-page-id="bridge-a" data-nutbook-page-id="bridge-a"><h2>第一页 bridge-a</h2><p>翻到第二页后加入，重建应回到 bridge-b。</p></section>
    <section data-page-id="bridge-b" data-nutbook-page-id="bridge-b" hidden><h2>第二页 bridge-b</h2><p>本页是页码恢复验收的目标页。</p></section>
    <section data-page-id="bridge-c" data-nutbook-page-id="bridge-c" hidden><h2>第三页 bridge-c</h2><p>尾部页。</p></section>
  </main>
  <nav class="pager">
    <button id="bprev" type="button">上一页</button>
    <span id="blabel">bridge-a</span>
    <button id="bnext" type="button">下一页</button>
  </nav>
  <pre id="selftest">自检未运行</pre>
  <script>
  (function () {
    var sections = Array.prototype.slice.call(document.querySelectorAll("section[data-page-id]"));
    var ids = sections.map(function (s) { return s.getAttribute("data-page-id"); });
    var current = 0;
    var listeners = [];
    var readyResolve;
    var ready = new Promise(function (resolve) { readyResolve = resolve; });
    function show(index) {
      if (index < 0 || index >= sections.length) return;
      current = index;
      sections.forEach(function (node, i) {
        if (i === current) { node.removeAttribute("hidden"); } else { node.setAttribute("hidden", ""); }
      });
      var label = document.getElementById("blabel");
      if (label) { label.textContent = ids[current]; }
      listeners.forEach(function (cb) { try { cb(ids[current]); } catch (e) {} });
    }
    var prev = document.getElementById("bprev");
    var next = document.getElementById("bnext");
    if (prev) { prev.addEventListener("click", function () { show(current - 1); }); }
    if (next) { next.addEventListener("click", function () { show(current + 1); }); }
    show(0);
    readyResolve();
    // Codex R6：宿主以 await bridge.whenReady?.() 方式调用，whenReady 必须是「返回 Promise 的函数」。
    // 直接给 Promise 会被当函数调用抛 TypeError，且被宿主 catch 吞掉，导致页码恢复链路整体跳过。
    window.__NUTBOOK_PRESENTATION__ = {
      version: 1,
      pages: ids.map(function (id) { return { id: id }; }),
      whenReady: function () { return ready; },
      getActivePageId: function () { return ids[current]; },
      goTo: function (pageId) {
        var index = ids.indexOf(String(pageId || ""));
        if (index >= 0) { show(index); return Promise.resolve(true); }
        return Promise.resolve(false);
      },
      subscribe: function (cb) { if (typeof cb === "function") { listeners.push(cb); } }
    };

    // 行为自检（Codex R6）：按宿主真实调用方式验证合同，不能只验语法。
    (function selfTest() {
      var out = document.getElementById("selftest");
      var lines = [];
      var failures = 0;
      function check(name, ok, detail) {
        if (!ok) failures += 1;
        lines.push((ok ? "PASS " : "FAIL ") + name + (detail ? " —— " + detail : ""));
      }
      var bridge = window.__NUTBOOK_PRESENTATION__;
      check("bridge 对象存在", !!bridge && typeof bridge === "object");
      check("version === 1", !!bridge && bridge.version === 1);
      check("whenReady 是函数（宿主以 whenReady?.() 调用）", !!bridge && typeof bridge.whenReady === "function",
        !!bridge ? "typeof=" + typeof bridge.whenReady : "");
      check("getActivePageId 是函数", !!bridge && typeof bridge.getActivePageId === "function");
      check("goTo 是函数", !!bridge && typeof bridge.goTo === "function");
      check("subscribe 是函数", !!bridge && typeof bridge.subscribe === "function");
      check("pages 是数组且含全部 id", !!bridge && Array.isArray(bridge.pages) && bridge.pages.length === ids.length,
        !!bridge && Array.isArray(bridge.pages) ? "pages=" + JSON.stringify(bridge.pages) : "");
      var nutbookPages = Array.prototype.slice.call(document.querySelectorAll("[data-nutbook-page-id]"));
      var nutbookIds = nutbookPages.map(function (n) { return n.getAttribute("data-nutbook-page-id"); });
      check("data-nutbook-page-id 唯一非空", nutbookPages.length === ids.length && nutbookIds.every(Boolean) && new Set(nutbookIds).size === nutbookIds.length,
        "ids=" + JSON.stringify(nutbookIds));
      var notified = [];
      try { bridge.subscribe(function (next) { notified.push(next); }); } catch (e) { check("subscribe 可注册", false, String(e)); }
      var initial = bridge.getActivePageId();
      check("getActivePageId 返回当前页", initial === "bridge-a", "返回 " + JSON.stringify(initial));
      bridge.whenReady().then(function () {
        check("whenReady() resolve", true);
        return bridge.goTo("bridge-b");
      }).then(function (applied) {
        check("goTo(bridge-b) 返回 true", applied === true, "返回 " + JSON.stringify(applied));
        check("goTo 后 getActivePageId = bridge-b", bridge.getActivePageId() === "bridge-b", "返回 " + bridge.getActivePageId());
        check("subscribe 收到 bridge-b 通知", notified.indexOf("bridge-b") >= 0, "通知序列 " + JSON.stringify(notified));
        return bridge.goTo("bridge-a");
      }).then(function () {
        // 自检结束后回到第一页，避免污染人工验收起点。
        check("goTo 回 bridge-a 成功", bridge.getActivePageId() === "bridge-a", "返回 " + bridge.getActivePageId());
        lines.push(failures ? "自检失败 " + failures + " 项" : "自检全部通过");
        out.textContent = lines.join("\n");
        out.className = failures ? "fail" : "pass";
      }).catch(function (error) {
        check("自检链路无异常", false, String(error && error.message ? error.message : error));
        out.textContent = lines.join("\n");
        out.className = "fail";
      });
    })();
  })();
  </script>
</body>
</html>
