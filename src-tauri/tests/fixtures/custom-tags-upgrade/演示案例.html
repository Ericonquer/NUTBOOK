<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>标签升级演示案例</title>
<style>body{font:20px system-ui;margin:60px;background:#faf9f6}button{padding:12px}</style>
<h1>演示案例</h1><p>用于验证原生 HTML controls 菜单以及正文脚本仍可操作。</p>
<button id="counter" type="button">点击次数：0</button>
<script>let count=0;document.getElementById('counter').onclick=event=>{event.target.textContent='点击次数：'+(++count)};</script>
</html>
