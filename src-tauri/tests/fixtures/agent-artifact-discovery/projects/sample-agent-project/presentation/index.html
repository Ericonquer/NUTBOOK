<!doctype html>
<html lang="en" data-nutbook-edit-contract="nutbook-html/v1">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent artifact discovery</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 18px/1.5 system-ui, sans-serif; background: #f4efe7; color: #26221f; }
      main { width: min(760px, calc(100vw - 64px)); padding: 48px; border-radius: 24px; background: #fff; box-shadow: 0 24px 70px #4c3b2a22; }
      img { width: 100%; max-height: 280px; object-fit: cover; border-radius: 16px; }
    </style>
  </head>
  <body>
    <main>
      <img data-id="presentation-cover" data-editable="image" src="assets/cover.png" alt="Warm abstract cover">
      <h1 data-id="presentation-title" data-editable="text">Only primary artifacts become cards</h1>
      <p data-id="presentation-summary" data-editable="text">Scripts and images stay related to this HTML entry.</p>
    </main>
    <script src="assets/runtime.js"></script>
  </body>
</html>
