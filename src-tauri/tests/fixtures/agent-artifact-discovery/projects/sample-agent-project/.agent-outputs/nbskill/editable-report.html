<!doctype html>
<html lang="en" data-nutbook-edit-contract="nutbook-html/v1">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editable registered report</title>
    <style>
      body { margin: 0; padding: 64px; font: 18px/1.6 system-ui, sans-serif; background: #f8f6f2; color: #25211d; }
      article { max-width: 760px; margin: auto; padding: 48px; background: white; border-radius: 24px; }
      img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 16px; }
    </style>
  </head>
  <body>
    <article>
      <p data-id="report-kicker" data-editable="text">Registered by nbskill</p>
      <h1 data-id="report-title" data-editable="rich-text" data-edit-role="short">Editable report</h1>
      <div data-id="report-body" data-editable="rich-text" data-edit-role="content">
        <p>This file declares both the manifest contract and the HTML root marker.</p>
      </div>
      <img data-id="report-cover" data-editable="image" src="../../presentation/assets/cover.png" alt="Warm abstract cover">
    </article>
  </body>
</html>
