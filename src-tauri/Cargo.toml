[package]
name = "nutbook-backend"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[lib]
name = "nutbook_backend"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "NUTBOOK"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "unstable", "macos-private-api"] }
thiserror = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
url = "2"
notify = "8"
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
