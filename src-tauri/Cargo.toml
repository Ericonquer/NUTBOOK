[package]
name = "nutbook-backend"
version = "1.0.0"
edition = "2021"
build = "build.rs"
default-run = "NUTBOOK"

[lib]
name = "nutbook_backend"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "NUTBOOK"
path = "src/main.rs"

[[bin]]
name = "nutbook"
path = "src/bin/nutbook.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
thiserror = "1"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
sha2 = "0.10"
url = "2"
notify = "8"
rfd = "0.15"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
ammonia = "4"
libc = "0.2"
base64 = "0.22"
chrono = "0.4"
pulldown-cmark = "0.13"
# PR C / C2：Markdown 封面位图解码（PNG/JPEG/WebP/GIF 首帧）与像素级裁切。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# PR C / C2：受限静态 SVG renderer（usvg 安全模式不执行脚本、不加载外部资源）。
resvg = "0.45"
# PR C / C2：SVG XML 安全检查（script / foreignObject / 外部资源 / 动态字体拒绝）。
roxmltree = "0.20"
# PR C / C2：JPEG/PNG EXIF orientation（90/270 旋转时交换宽高并旋转裁切）。
kamadak-exif = "0.6"
html5ever = "0.27"
markup5ever_rcdom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# §7.2 文件默认应用：NSWorkspace handler 查询与 setDefaultApplicationAtURL。
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "NSWorkspace", "NSRunningApplication", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSOperation", "block2", "NSURL", "NSBundle"] }
# §7.2：Markdown UTI（net.daringfireball.markdown）用于 setDefaultApplicationAtURL:toOpenContentType:。
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }
block2 = "0.6.2"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
# tauri "test" feature：mock runtime，让 enqueue_native_drop 的运行面归属
# 核验（webview 已登记 + 宿主窗口）能在单测中真实执行。
tauri = { version = "2", features = ["test"] }
