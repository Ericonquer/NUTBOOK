<!doctype html>
<html lang="zh-CN" data-nutbook-editable-protocol="1" data-nutbook-artifact-kind="presentation">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    :root { --slide-bg: #2f3132; --slide-fg: #f0f0f2; --slide-muted: #d6d6da; --slide-accent: #c7c6cb; --slide-panel: rgba(26,28,29,0.76); --slide-panel-border: #45474b; --slide-surface: #1f2123; --slide-rule: #45474b; --slide-radius: 14px; --slide-gap: 18px; --slide-motion-duration: 180ms; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #1a1c1d; color: #f0f0f2; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif; }
    body { overflow: hidden; }
    .deck-shell { width: 100vw; height: 100vh; display: grid; place-items: center; background: #1a1c1d; }
    .deck { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; background: #2f3132; border: 1px solid #45474b; box-shadow: 0 24px 70px rgba(0,0,0,0.32); }
    .deck.aspect-4-3 { width: min(100vw, calc(100vh * 4 / 3)); aspect-ratio: 4 / 3; }
    .slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 58px 76px 62px; opacity: 0; pointer-events: none; transform: translateX(20px); transition: opacity 180ms ease, transform 180ms ease; background: linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px) 0 0 / 40px 40px, linear-gradient(180deg, rgba(255,255,255,0.04) 1px, transparent 1px) 0 0 / 40px 40px, #2f3132; }
    .slide.is-active { opacity: 1; pointer-events: auto; transform: translateX(0); z-index: 2; }
    .kicker { margin: 0 0 13px; color: #c7c6cb; font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .cover-title { margin: 0; max-width: 1080px; font-size: 58px; line-height: 1.06; font-weight: 840; letter-spacing: 0; word-break: keep-all; overflow-wrap: normal; }
    .chapter-copy { display: grid; gap: 18px; }
    .chapter-index { color: #c7c6cb; font-size: 13px; line-height: 1; font-weight: 840; text-transform: uppercase; letter-spacing: 0; }
    .chapter-title { margin: 0; max-width: 1040px; font-size: 58px; line-height: 1.08; font-weight: 840; letter-spacing: 0; word-break: keep-all; overflow-wrap: normal; }
    .slide-title { margin: 0; max-width: 940px; font-size: 40px; line-height: 1.12; font-weight: 800; letter-spacing: 0; }
    .statement-title { margin: 0; max-width: 960px; font-size: 64px; line-height: 1.05; font-weight: 860; letter-spacing: 0; }
    .statement-rule { width: 64px; height: 6px; margin: 0 0 24px; border-radius: 999px; background: #f0f0f2; }
    .statement-note { margin: 22px 0 0; max-width: 760px; color: #d6d6da; font-size: 22px; line-height: 1.34; font-weight: 680; }
    .density-master.chapter { justify-content: flex-end; padding-bottom: 112px; background: #1f2123; }
    .density-master.chapter .chapter-index { color: #d6d6da; font-size: 15px; }
    .density-master.chapter .chapter-title { max-width: 760px; font-size: 42px; line-height: 1.08; }
    .density-master.statement { justify-content: center; }
    .density-master.statement .statement-title { max-width: 1060px; font-size: 72px; line-height: 1.04; overflow-wrap: anywhere; }
    .density-master.statement .statement-note { max-width: 820px; font-size: 20px; }
    .slide-subtitle { margin: 12px 0 0; max-width: 820px; color: #c7c6cb; font-size: 18px; font-weight: 720; line-height: 1.34; }
    .slide-content { margin-top: 24px; max-width: 980px; color: #f0f0f2; font-size: 19px; line-height: 1.5; }
    .density-report .slide-content { max-width: 1040px; font-size: 17px; line-height: 1.46; }
    .slide-content p, .slide-content ul, .slide-content ol, .slide-content blockquote { margin: 0 0 16px; }
    .slide-content ul, .slide-content ol { padding-left: 1.25em; }
    .slide-content li { margin: 7px 0; }
    .slide-content a { color: #f0f0f2; font-weight: 760; text-decoration-color: #6d6f73; text-underline-offset: 3px; }
    .slide-content code, .code-intro code, .code-outro code, .figure-copy code, .list-card-intro code, .list-card-outro code { padding: 0.08em 0.28em; border-radius: 5px; background: #383a3d; color: #f0f0f2; font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace; font-size: 0.92em; font-weight: 720; }
    .slide-content strong, .code-intro strong, .code-outro strong, .figure-copy strong, .list-card-intro strong, .list-card-outro strong { font-size: calc(1em + 2px); font-weight: 820; }
    .slide-content blockquote { padding: 13px 16px; border-left: 4px solid #828488; border-radius: 0 12px 12px 0; background: #1f2123; color: #d6d6da; }
    .topic-card-grid { margin-top: 20px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 13px; align-items: stretch; }
    .topic-card-grid[data-card-count="1"] { grid-template-columns: minmax(0, 0.66fr); }
    .topic-card-grid[data-card-count="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .topic-card-grid[data-card-count="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .topic-card-grid[data-card-count="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .topic-card-grid[data-card-count="6"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .topic-card { height: 100%; min-height: 0; padding: 20px; display: flex; flex-direction: column; justify-content: center; border: 1px solid #45474b; border-radius: 14px; background: rgba(26,28,29,0.76); box-shadow: 0 16px 40px rgba(0,0,0,0.24); }
    .topic-card h3 { margin: 0 0 14px; font-size: 24px; line-height: 1.16; letter-spacing: 0; }
    .topic-card-body { color: #d6d6da; font-size: 15px; line-height: 1.44; }
    .topic-card-body p, .topic-card-body ul { margin: 0 0 10px; }
    .overview-card-grid { margin-top: 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .overview-card { min-height: 164px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--slide-panel-border); border-radius: var(--slide-radius); background: var(--slide-panel); }
    .overview-card-index { color: var(--slide-accent); font-size: 14px; font-weight: 800; line-height: 1; }
    .overview-card h3 { margin: 28px 0 0; font-size: 24px; line-height: 1.24; overflow-wrap: anywhere; }
    .overview-card-grid[data-card-count="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .list-card-flow { margin-top: 18px; width: 100%; display: grid; gap: 16px; transform: translateY(var(--group-offset, 0px)); }
    .list-card-layout { width: 100%; display: grid; gap: 18px; align-items: stretch; }
    .list-card-layout[data-layout="stacked-grid"] { grid-template-columns: 1fr; }
    .list-card-layout[data-layout="side-by-side-stack"] { grid-template-columns: minmax(0, calc(100% - var(--group-width) - 18px)) minmax(0, var(--group-width)); }
    .list-card-intro { max-width: 880px; color: #f0f0f2; font-size: 18px; line-height: 1.42; }
    .list-card-intro p { margin: 0; }
    .list-card-layout[data-layout="side-by-side-stack"] .list-card-copy { display: flex; flex-direction: column; justify-content: flex-start; }
    .list-card-grid { display: grid; width: var(--group-width); grid-template-columns: repeat(var(--card-cols), minmax(0, 1fr)); grid-auto-rows: minmax(var(--card-row-height), max-content); gap: var(--card-gap); align-items: stretch; }
    .list-card-layout[data-layout="side-by-side-stack"] .list-card-grid { width: 100%; grid-template-columns: 1fr; }
    .list-card { min-height: var(--card-row-height); padding: 17px 18px; display: flex; flex-direction: column; justify-content: center; border: 1px solid #45474b; border-radius: 14px; background: rgba(26,28,29,0.76); box-shadow: 0 14px 34px rgba(0,0,0,0.22); }
    .list-card.label-card { align-items: center; text-align: center; }
    .list-card.label-card .list-card-title { margin: 0; }
    .list-card-layout[data-layout="side-by-side-stack"] .list-card { padding: 12px 14px; box-shadow: none; }
    .list-card-title { margin: 0 0 8px; font-size: 19px; line-height: 1.18; letter-spacing: 0; overflow-wrap: anywhere; }
    .list-card-body { color: #d6d6da; font-size: 14px; line-height: 1.42; }
    .list-card-body p { margin: 0; }
    .list-card-outro { margin-top: 16px; max-width: 900px; color: #d6d6da; font-size: 16px; line-height: 1.44; }
    .list-card-outro p { margin: 0; }
    .figure-layout { margin-top: 24px; min-height: 0; display: grid; gap: 24px; align-items: center; }
    .figure-layout.full { place-items: center; }
    .figure-layout.side-by-side { grid-template-columns: minmax(280px, 0.88fr) minmax(0, 1.12fr); }
    .figure-copy { color: #f0f0f2; font-size: 20px; line-height: 1.44; font-weight: 620; }
    .figure-copy p, .figure-copy ul, .figure-copy ol { margin: 0 0 14px; }
    .figure-copy ul, .figure-copy ol { padding-left: 1.15em; }
    .figure-media { min-width: 0; display: grid; place-items: center; }
    .figure-layout img { max-width: 100%; max-height: 470px; border-radius: 8px; object-fit: contain; }
    .figure-layout.side-by-side img { max-height: 440px; }
    .table-frame { margin-top: 22px; max-height: 500px; border: 1px solid #828488; border-radius: 14px; background: rgba(26,28,29,0.76); overflow: hidden; }
    .table-frame table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 15px; }
    .table-frame.table-scroll-y { overflow-y: auto; overflow-x: hidden; }
    .table-frame.table-scroll-x { overflow-x: auto; overflow-y: hidden; }
    .table-frame.table-scroll-x table { min-width: 980px; }
    .table-frame th, .table-frame td { padding: 8px 10px; border-right: 1px solid #45474b; border-bottom: 1px solid #45474b; text-align: left; vertical-align: top; }
    .table-frame th { position: sticky; top: 0; z-index: 1; background: #1f2123; font-weight: 760; }
    .table-frame tr:last-child td { border-bottom: 0; }
    .table-frame th:last-child, .table-frame td:last-child { border-right: 0; }
    .code-frame { margin-top: 22px; max-height: 500px; padding: 18px; border-radius: 10px; background: #111; color: #f0f0f2; font-size: 14px; line-height: 1.5; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
    .code-intro { margin-top: 20px; max-width: 900px; color: #f0f0f2; font-size: 19px; line-height: 1.44; }
    .code-intro p { margin: 0 0 12px; }
    .code-outro { margin-top: 14px; max-width: 900px; color: #d6d6da; font-size: 16px; line-height: 1.42; }
    .code-outro p { margin: 0; }
    .code-frame.code-scroll-y { overflow-y: auto; overflow-x: hidden; }
    .thanks-content { display: grid; place-items: center; gap: 16px; text-align: center; }
    .thanks-content h2 { margin: 0; font-size: 68px; line-height: 1; letter-spacing: 0; }
    .thanks-content p { margin: 0; display: inline-flex; align-items: center; gap: 10px; color: #c7c6cb; font-size: 18px; font-weight: 740; }
    .thanks-logo { width: 106px; height: auto; display: block; filter: invert(1) grayscale(1) brightness(1.8); }
    .missing-image, .export-warnings { display: block; padding: 12px 14px; border-radius: 8px; background: #1f2123; color: #d6d6da; font-size: 14px; }
    .deck-footer { position: absolute; left: 38px; right: 38px; bottom: 22px; display: flex; justify-content: space-between; color: #c7c6cb; font-size: 12px; z-index: 3; }
    .presentation-controls { position: fixed; left: 50%; bottom: 18px; z-index: 10; display: inline-flex; align-items: center; gap: 6px; padding: 6px; border: 1px solid rgba(255,255,255,0.1); border-radius: 999px; background: rgba(26,28,29,0.88); box-shadow: 0 12px 32px rgba(0,0,0,0.28); backdrop-filter: blur(12px); transform: translateX(-50%); }
    .presentation-controls button { width: 30px; height: 30px; border: 0; border-radius: 999px; background: transparent; color: #f0f0f2; cursor: pointer; font-size: 15px; }
    .presentation-controls button:hover { background: #45474b; }
    .presentation-controls [data-counter] { min-width: 52px; text-align: center; color: #c7c6cb; font-size: 12px; font-weight: 700; }
    .presentation-control-button-wrap { position: relative; display: inline-flex; }
    .presentation-control-tooltip { position: absolute; left: 50%; bottom: 38px; min-width: max-content; padding: 6px 9px; border-radius: 8px; background: rgba(240,240,242,0.94); color: #1a1c1d; font-size: 12px; font-weight: 700; line-height: 1; white-space: nowrap; pointer-events: none; opacity: 0; transform: translateX(-50%) translateY(4px); transition: opacity 140ms ease, transform 140ms ease; }
    .presentation-control-button-wrap:hover .presentation-control-tooltip, .presentation-control-button-wrap:focus-within .presentation-control-tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }
    .deck.aspect-4-3 .topic-card-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .deck.aspect-4-3 .overview-card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .section-transition { justify-content: flex-end; padding-bottom: 112px; background: var(--slide-surface); }
    .presentation-quote { margin: 24px 0 0; max-width: 980px; padding: 13px 16px; border-left: 4px solid #828488; border-radius: 0 12px 12px 0; background: #1f2123; color: #d6d6da; font-size: 19px; font-weight: 400; line-height: 1.5; }
    .presentation-quote p { margin: 0; }
    .presentation-process, .presentation-summary { margin-top: 24px; display: grid; gap: 12px; }
    .presentation-cycle { position: relative; width: min(860px, 100%); height: 390px; margin: 14px auto 0; border: 1px solid var(--slide-panel-border); border-radius: 50%; }
    .presentation-cycle-core { position: absolute; top: 50%; left: 50%; width: 112px; height: 112px; display: grid; place-items: center; border-radius: 50%; background: var(--slide-fg); color: #1a1c1d; font-size: 20px; font-weight: 800; transform: translate(-50%, -50%); }
    .presentation-cycle-item { position: absolute; top: 50%; left: 50%; width: 180px; padding: 14px; border: 1px solid var(--slide-panel-border); border-radius: var(--slide-radius); background: var(--slide-panel); transform: translate(-50%, -50%) rotate(var(--cycle-angle)) translateY(-150px) rotate(calc(-1 * var(--cycle-angle))); }
    .presentation-cycle-item h3, .presentation-cycle-item p { margin: 0; }
    .presentation-cycle-item h3 { font-size: 16px; line-height: 1.2; }
    .presentation-cycle-item p { margin-top: 6px; color: var(--slide-muted); font-size: 13px; line-height: 1.35; }
    .presentation-hierarchy { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 22px; align-items: stretch; }
    .presentation-hierarchy-root { position: relative; min-height: 170px; padding: 20px; border: 1px solid var(--slide-panel-border); border-radius: var(--slide-radius); background: var(--slide-panel); }
    .presentation-hierarchy-root::before { content: ''; position: absolute; top: -22px; left: 50%; width: 1px; height: 22px; background: var(--slide-rule); }
    .presentation-hierarchy-root h3 { margin: 0 0 14px; font-size: 22px; }
    .presentation-hierarchy-root ul { margin: 0; padding-left: 1.15em; color: var(--slide-muted); }
    .presentation-step, .summary-item { display: grid; grid-template-columns: 58px minmax(0, 1fr); column-gap: 16px; padding: 16px 18px; border: 1px solid var(--slide-panel-border); border-radius: var(--slide-radius); background: var(--slide-panel); box-shadow: 0 12px 30px rgba(0,0,0,0.22); }
    .presentation-step-number, .summary-item > span { grid-row: span 2; color: var(--slide-accent); font-size: 15px; font-weight: 800; }
    .presentation-step h3, .summary-item h3, .comparison-panel h3 { margin: 0; font-size: 21px; line-height: 1.2; }
    .presentation-step p, .summary-item p, .comparison-panel p { margin: 7px 0 0; color: var(--slide-muted); font-size: 15px; line-height: 1.4; }
    .presentation-comparison { margin-top: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .comparison-panel { min-height: 0; padding: 20px; border: 1px solid var(--slide-panel-border); border-radius: var(--slide-radius); background: var(--slide-panel); }
    .comparison-label { margin: 0 0 16px !important; color: var(--slide-accent) !important; font-size: 13px !important; font-weight: 800; }
    .comparison-panel article + article { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--slide-rule); }
    .presentation-big-number { margin-top: 18px; max-width: 980px; }
    .presentation-big-number strong { display: block; color: var(--slide-fg); font-size: 104px; font-weight: 860; line-height: .92; }
    .presentation-big-number p { margin: 18px 0 0; max-width: 720px; color: var(--slide-muted); font-size: 21px; line-height: 1.35; }
    body[data-output-kind="dynamic"] .fragment:not(.is-fragment-visible) { opacity: 0 !important; transform: translateY(12px) !important; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { body[data-output-kind="dynamic"] .fragment { opacity: 1 !important; transform: none !important; pointer-events: auto; } }
    {{motion_styles}}
    /* ---- Visual rhythm ---- */
    .slide.rhythm-anchor { padding-top: 78px; }
    .slide.rhythm-breathing .slide-content { max-width: 860px; margin-top: 36px; }
    /* ---- Layout variants ---- */
    .slide.layout-wide .slide-content { max-width: 1080px; }
    .slide.layout-compact .slide-title { margin-bottom: 8px; }
    .slide.layout-compact .slide-content { margin-top: 14px; font-size: 17px; line-height: 1.44; }
    @media (max-width: 820px) { .slide { padding: 42px 34px 56px; } .cover-title, .chapter-title { font-size: 36px; } .slide-title { font-size: 28px; } .slide-content { font-size: 16px; } }
  </style>
</head>
<body data-output-kind="{{output_kind}}"{{motion_preset_attr}} data-density="{{density}}" data-aspect-ratio="{{aspect_ratio}}">
  <div class="deck-shell">
    <main class="deck {{deck_class}}">
      {{warnings}}
      {{slides_html}}
    </main>
  </div>
  <div class="presentation-controls" data-presentation-controls>
    <button type="button" data-prev aria-label="上一页">‹</button>
    <span data-counter>1 / {{slide_total}}</span>
    <button type="button" data-next aria-label="下一页">›</button>
    <span class="presentation-control-button-wrap">
      <button type="button" data-fullscreen aria-label="全屏演示" title="全屏演示">⛶</button>
      <span class="presentation-control-tooltip">全屏演示</span>
    </span>
  </div>
  {{motion_script}}
  <script>
    (() => {
      const slides = [...document.querySelectorAll(".slide")];
      const counter = document.querySelector("[data-counter]");
      const controls = document.querySelector("[data-presentation-controls]");
      const subscribers = new Set();
      let editMode = false;
      let index = Math.max(0, slides.findIndex((slide) => slide.classList.contains("is-active")));
      function isEditableTarget(target) {
        return Boolean(target?.closest?.("input, textarea, select, [contenteditable='true']"));
      }
      const reducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)");
      function fragments(slide) { return [...(slide?.querySelectorAll?.(".fragment") ?? [])]; }
      function resetFragments(slide, showAll = false) {
        const items = fragments(slide);
        if (!items.length || reducedMotion?.matches) return;
        items.forEach((item, itemIndex) => item.classList.toggle("is-fragment-visible", showAll || itemIndex === 0));
      }
      function revealNext() {
        const items = fragments(slides[index]);
        if (!items.length || reducedMotion?.matches) return false;
        const hidden = items.find((item) => !item.classList.contains("is-fragment-visible"));
        if (!hidden) return false;
        hidden.classList.add("is-fragment-visible");
        return true;
      }
      function revealPrevious() {
        const items = fragments(slides[index]);
        if (!items.length || reducedMotion?.matches) return false;
        const visible = items.filter((item) => item.classList.contains("is-fragment-visible"));
        if (visible.length <= 1) return false;
        visible.at(-1)?.classList.remove("is-fragment-visible");
        return true;
      }
      function show(next, restoreFragments = false) {
        index = Math.max(0, Math.min(slides.length - 1, next));
        slides.forEach((slide, i) => slide.classList.toggle("is-active", i === index));
        if (counter) counter.textContent = `${index + 1} / ${slides.length}`;
        const activeSlide = slides[index];
        resetFragments(activeSlide, restoreFragments);
        window.NutbookPresentationMotion?.sync?.(activeSlide);
        window.NutbookPresentationMotion?.replay?.(activeSlide);
        const pageId = activeSlide?.dataset.nutbookPageId;
        if (pageId) subscribers.forEach((listener) => listener(pageId));
      }
      function next() { if (!editMode && !revealNext()) show(index + 1); }
      function previous() { if (!editMode && !revealPrevious()) show(index - 1, true); }
      document.querySelector("[data-prev]")?.addEventListener("click", previous);
      document.querySelector("[data-next]")?.addEventListener("click", next);
      document.querySelector("[data-fullscreen]")?.addEventListener("click", () => {
        const target = document.documentElement;
        if (document.fullscreenElement) document.exitFullscreen?.();
        else target.requestFullscreen?.();
      });
      window.addEventListener("keydown", (event) => {
        if (editMode || isEditableTarget(event.target)) return;
        if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
          event.preventDefault();
          next();
        }
        if (event.key === "ArrowLeft" || event.key === "PageUp") {
          event.preventDefault();
          previous();
        }
        if (event.key.toLowerCase() === "f") document.querySelector("[data-fullscreen]")?.click();
      });
      window.__NUTBOOK_PRESENTATION__ = {
        version: 1,
        pages: slides.map((slide, pageIndex) => ({
          id: slide.dataset.nutbookPageId,
          index: pageIndex + 1,
          title: slide.dataset.title || "",
          kind: slide.dataset.slideKind || ""
        })),
        get activePageId() { return slides[index]?.dataset.nutbookPageId || ""; },
        goTo(pageId) {
          const nextIndex = slides.findIndex((slide) => slide.dataset.nutbookPageId === pageId);
          if (nextIndex < 0) return false;
          show(nextIndex);
          return true;
        },
        subscribe(listener) {
          if (typeof listener !== "function") return () => {};
          subscribers.add(listener);
          return () => subscribers.delete(listener);
        },
        setEditMode(enabled) {
          editMode = Boolean(enabled);
          controls?.toggleAttribute("hidden", editMode);
          return true;
        },
        whenReady() { return Promise.resolve(); }
      };
      show(index);
    })();
  </script>
</body>
</html>
