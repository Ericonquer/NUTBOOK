<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #f7f7f8; color: #1a1c1d; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif; }
    body { overflow: hidden; }
    .deck-shell { width: 100vw; height: 100vh; display: grid; place-items: center; background: #f7f7f8; }
    .deck { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; background: #f9f9fb; border: 1px solid #dfdfe3; box-shadow: 0 24px 70px rgba(26,28,29,0.12); }
    .deck.aspect-4-3 { width: min(100vw, calc(100vh * 4 / 3)); aspect-ratio: 4 / 3; }
    .deck.aspect-portrait { width: min(100vw, calc(100vh * 9 / 16)); aspect-ratio: 9 / 16; }
    .slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 58px 76px 62px; opacity: 0; pointer-events: none; transform: translateX(20px); transition: opacity 180ms ease, transform 180ms ease; background: linear-gradient(90deg, rgba(26,28,29,0.035) 1px, transparent 1px) 0 0 / 40px 40px, linear-gradient(180deg, rgba(26,28,29,0.026) 1px, transparent 1px) 0 0 / 40px 40px, #f9f9fb; }
    .slide.is-active { opacity: 1; pointer-events: auto; transform: translateX(0); z-index: 2; }
    .kicker { margin: 0 0 13px; color: #7e7576; font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .cover-title { margin: 0; max-width: 1080px; font-size: 58px; line-height: 1.06; font-weight: 840; letter-spacing: 0; word-break: keep-all; overflow-wrap: normal; }
    .chapter-copy { display: grid; gap: 18px; }
    .chapter-index { color: #7e7576; font-size: 13px; line-height: 1; font-weight: 840; text-transform: uppercase; letter-spacing: 0; }
    .chapter-title { margin: 0; max-width: 1040px; font-size: 58px; line-height: 1.08; font-weight: 840; letter-spacing: 0; word-break: keep-all; overflow-wrap: normal; }
    .slide-title { margin: 0; max-width: 940px; font-size: 40px; line-height: 1.12; font-weight: 800; letter-spacing: 0; }
    .statement-title { margin: 0; max-width: 960px; font-size: 64px; line-height: 1.05; font-weight: 860; letter-spacing: 0; }
    .statement-rule { width: 64px; height: 6px; margin: 0 0 24px; border-radius: 999px; background: #1a1c1d; }
    .statement-note { margin: 22px 0 0; max-width: 760px; color: #4c4546; font-size: 22px; line-height: 1.34; font-weight: 680; }
    .density-master.chapter { justify-content: flex-end; padding-bottom: 112px; background: #ededf0; }
    .density-master.chapter .chapter-index { color: #4c4546; font-size: 15px; }
    .density-master.chapter .chapter-title { max-width: 760px; font-size: 42px; line-height: 1.08; }
    .density-master.statement { justify-content: center; }
    .density-master.statement .statement-title { max-width: 1060px; font-size: 72px; line-height: 1.04; overflow-wrap: anywhere; }
    .density-master.statement .statement-note { max-width: 820px; font-size: 20px; }
    .slide-subtitle { margin: 12px 0 0; max-width: 820px; color: #5e5e63; font-size: 18px; font-weight: 720; line-height: 1.34; }
    .slide-content { margin-top: 24px; max-width: 980px; color: #2f3132; font-size: 19px; line-height: 1.5; }
    .density-report .slide-content { max-width: 1040px; font-size: 17px; line-height: 1.46; }
    .slide-content p, .slide-content ul, .slide-content ol, .slide-content blockquote { margin: 0 0 16px; }
    .slide-content ul, .slide-content ol { padding-left: 1.25em; }
    .slide-content li { margin: 7px 0; }
    .slide-content a { color: #1a1c1d; font-weight: 760; text-decoration-color: #b8b8bc; text-underline-offset: 3px; }
    .slide-content code, .code-intro code, .code-outro code, .figure-copy code, .list-card-intro code, .list-card-outro code { padding: 0.08em 0.28em; border-radius: 5px; background: #eeeeef; color: #1a1c1d; font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace; font-size: 0.92em; font-weight: 720; }
    .slide-content strong, .code-intro strong, .code-outro strong, .figure-copy strong, .list-card-intro strong, .list-card-outro strong { font-weight: 820; }
    .slide-content blockquote { padding: 13px 16px; border-left: 4px solid #cfc4c5; border-radius: 0 12px 12px 0; background: #f0f0f2; color: #4c4546; }
    .topic-card-grid { margin-top: 20px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 13px; align-items: start; }
    .topic-card-grid[data-card-count="1"] { grid-template-columns: minmax(0, 0.66fr); }
    .topic-card-grid[data-card-count="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .topic-card-grid[data-card-count="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .topic-card-grid[data-card-count="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .topic-card-grid[data-card-count="6"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .topic-card { min-height: 0; padding: 20px; display: flex; flex-direction: column; border: 1px solid #dfdfe3; border-radius: 14px; background: rgba(255,255,255,0.86); box-shadow: 0 16px 40px rgba(26,28,29,0.08); }
    .topic-card h3 { margin: 0 0 14px; font-size: 24px; line-height: 1.16; letter-spacing: 0; }
    .topic-card-body { color: #4c4546; font-size: 15px; line-height: 1.44; }
    .topic-card-body p, .topic-card-body ul { margin: 0 0 10px; }
    .list-card-layout { margin-top: 18px; display: grid; gap: 18px; align-items: start; }
    .list-card-layout.stacked { grid-template-columns: 1fr; }
    .list-card-layout.split { grid-template-columns: minmax(260px, 0.82fr) minmax(0, 1.18fr); }
    .list-card-intro { max-width: 880px; color: #2f3132; font-size: 18px; line-height: 1.42; }
    .list-card-intro p { margin: 0; }
    .list-card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; align-items: stretch; }
    .list-card-layout.split .list-card-grid { grid-template-columns: 1fr; gap: 9px; }
    .list-card-grid[data-card-count="1"] { grid-template-columns: minmax(0, 0.7fr); }
    .list-card-grid[data-card-count="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .list-card-grid[data-card-count="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .list-card-grid[data-card-count="5"] { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .list-card-grid[data-card-count="6"], .list-card-grid[data-card-count="7"], .list-card-grid[data-card-count="8"], .list-card-grid[data-card-count="9"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .list-card { padding: 17px 18px; border: 1px solid #dfdfe3; border-radius: 14px; background: rgba(255,255,255,0.86); box-shadow: 0 14px 34px rgba(26,28,29,0.07); }
    .list-card-layout.stacked .list-card { height: 100%; }
    .list-card-layout.split .list-card { padding: 12px 14px; box-shadow: none; }
    .list-card-title { margin: 0 0 8px; font-size: 19px; line-height: 1.18; letter-spacing: 0; overflow-wrap: anywhere; }
    .list-card-body { color: #4c4546; font-size: 14px; line-height: 1.42; }
    .list-card-body p { margin: 0; }
    .list-card-outro { margin-top: 16px; max-width: 900px; color: #4c4546; font-size: 16px; line-height: 1.44; }
    .list-card-outro p { margin: 0; }
    .figure-layout { margin-top: 24px; min-height: 0; display: grid; gap: 24px; align-items: center; }
    .figure-layout.full { place-items: center; }
    .figure-layout.side-by-side { grid-template-columns: minmax(280px, 0.88fr) minmax(0, 1.12fr); }
    .figure-copy { color: #2f3132; font-size: 20px; line-height: 1.44; font-weight: 620; }
    .figure-copy p, .figure-copy ul, .figure-copy ol { margin: 0 0 14px; }
    .figure-copy ul, .figure-copy ol { padding-left: 1.15em; }
    .figure-media { min-width: 0; display: grid; place-items: center; }
    .figure-layout img { max-width: 100%; max-height: 470px; border-radius: 8px; object-fit: contain; }
    .figure-layout.side-by-side img { max-height: 440px; }
    .table-frame { margin-top: 22px; max-height: 500px; border: 1px solid #cfc4c5; border-radius: 14px; background: rgba(255,255,255,0.84); overflow: hidden; }
    .table-frame table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 15px; }
    .table-frame.table-scroll-y { overflow-y: auto; overflow-x: hidden; }
    .table-frame.table-scroll-x { overflow-x: auto; overflow-y: hidden; }
    .table-frame.table-scroll-x table { min-width: 980px; }
    .table-frame th, .table-frame td { padding: 8px 10px; border-right: 1px solid #e2e2e4; border-bottom: 1px solid #e2e2e4; text-align: left; vertical-align: top; }
    .table-frame th { position: sticky; top: 0; z-index: 1; background: #f0f0f2; font-weight: 760; }
    .table-frame tr:last-child td { border-bottom: 0; }
    .table-frame th:last-child, .table-frame td:last-child { border-right: 0; }
    .code-frame { margin-top: 22px; max-height: 500px; padding: 18px; border-radius: 10px; background: #27292c; color: #f0f0f2; font-size: 14px; line-height: 1.5; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
    .code-intro { margin-top: 20px; max-width: 900px; color: #2f3132; font-size: 19px; line-height: 1.44; }
    .code-intro p { margin: 0 0 12px; }
    .code-outro { margin-top: 14px; max-width: 900px; color: #4c4546; font-size: 16px; line-height: 1.42; }
    .code-outro p { margin: 0; }
    .code-frame.code-scroll-y { overflow-y: auto; overflow-x: hidden; }
    .mobile-landscape-hint { margin-top: 22px; cursor: zoom-in; }
    .mobile-hint-preview { height: 210px; display: grid; place-items: center; overflow: hidden; border-radius: 10px; background: rgba(255,255,255,0.56); opacity: 0.9; }
    .mobile-hint-preview img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .mobile-hint-preview table { width: 100%; max-height: 100%; border-collapse: collapse; font-size: 11px; }
    .mobile-hint-preview th, .mobile-hint-preview td { padding: 5px 6px; border: 1px solid #dfdfe3; }
    .mobile-landscape-hint p { margin: 10px 0 0; color: #5e5e63; font-size: 13px; font-weight: 800; }
    .mobile-landscape-viewer { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 24px; background: rgba(247,247,248,0.96); }
    .mobile-landscape-viewer.is-open { display: grid; }
    .mobile-landscape-viewer-content { width: min(100vw - 48px, 1180px); height: min(100vh - 48px, 720px); display: grid; place-items: center; overflow: hidden; }
    .mobile-landscape-viewer-content img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .mobile-landscape-viewer-content table { width: max-content; max-width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
    .mobile-landscape-viewer-content th, .mobile-landscape-viewer-content td { padding: 8px 10px; border: 1px solid #dfdfe3; }
    .mobile-landscape-viewer-close { position: fixed; top: 18px; right: 18px; width: 34px; height: 34px; border: 0; border-radius: 999px; background: #1a1c1d; color: #fff; cursor: pointer; }
    .thanks-content { display: grid; place-items: center; gap: 16px; text-align: center; }
    .thanks-content h2 { margin: 0; font-size: 68px; line-height: 1; letter-spacing: 0; }
    .thanks-content p { margin: 0; display: inline-flex; align-items: center; gap: 10px; color: #5e5e63; font-size: 18px; font-weight: 740; }
    .thanks-logo { width: 106px; height: auto; display: block; }
    .missing-image, .export-warnings { display: block; padding: 12px 14px; border-radius: 8px; background: #eeeef0; color: #4c4546; font-size: 14px; }
    .deck-footer { position: absolute; left: 38px; right: 38px; bottom: 22px; display: flex; justify-content: space-between; color: #7e7576; font-size: 12px; z-index: 3; }
    .presentation-controls { position: fixed; left: 50%; bottom: 18px; z-index: 10; display: inline-flex; align-items: center; gap: 6px; padding: 6px; border: 1px solid rgba(0,0,0,0.08); border-radius: 999px; background: rgba(255,255,255,0.88); box-shadow: 0 12px 32px rgba(0,0,0,0.12); backdrop-filter: blur(12px); transform: translateX(-50%); }
    .presentation-controls button { width: 30px; height: 30px; border: 0; border-radius: 999px; background: transparent; color: #1a1c1d; cursor: pointer; font-size: 15px; }
    .presentation-controls button:hover { background: #f1f1f3; }
    .presentation-controls span { min-width: 52px; text-align: center; color: #5e5e63; font-size: 12px; font-weight: 700; }
    .deck.aspect-4-3 .topic-card-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .deck.aspect-4-3 .list-card-layout.split { grid-template-columns: 1fr; }
    .deck.aspect-portrait .slide { padding: 48px 28px 58px; justify-content: center; }
    .deck.aspect-portrait .cover-title { max-width: 100%; font-size: 32px; line-height: 1.12; word-break: normal; overflow-wrap: anywhere; }
    .deck.aspect-portrait .chapter-title { max-width: 100%; font-size: 28px; line-height: 1.14; word-break: normal; overflow-wrap: anywhere; }
    .deck.aspect-portrait .slide-title { font-size: 21px; line-height: 1.16; }
    .deck.aspect-portrait .slide-subtitle { font-size: 13px; line-height: 1.35; }
    .deck.aspect-portrait .slide-content { margin-top: 16px; font-size: 15px; line-height: 1.5; }
    .deck.aspect-portrait .topic-card-grid { grid-template-columns: 1fr; gap: 10px; }
    .deck.aspect-portrait .topic-card { min-height: 0; padding: 16px; }
    .deck.aspect-portrait .topic-card h3 { font-size: 20px; }
    .deck.aspect-portrait .topic-card-body { font-size: 14px; }
    .deck.aspect-portrait .list-card-grid { grid-template-columns: 1fr; }
    .deck.aspect-portrait .list-card-layout.split { grid-template-columns: 1fr; }
    .deck.aspect-portrait .list-card-title { font-size: 18px; }
    .deck.aspect-portrait .list-card-body, .deck.aspect-portrait .list-card-intro, .deck.aspect-portrait .list-card-outro { font-size: 14px; }
    .deck.aspect-portrait .figure-layout img { max-height: 360px; }
    .deck.aspect-portrait .mobile-hint-preview { height: 190px; }
    .deck.aspect-portrait .table-frame, .deck.aspect-portrait .code-frame { max-height: 360px; font-size: 12px; }
    .deck.aspect-portrait .thanks-content h2 { font-size: 40px; }
    .deck.aspect-portrait .thanks-logo { width: 86px; }
    @media (max-width: 820px) { .slide { padding: 42px 34px 56px; } .cover-title, .chapter-title { font-size: 36px; } .slide-title { font-size: 28px; } .slide-content { font-size: 16px; } }
  </style>
</head>
<body data-output-kind="{{output_kind}}" data-density="{{density}}" data-aspect-ratio="{{aspect_ratio}}">
  <div class="deck-shell">
    <main class="deck {{deck_class}}">
      {{warnings}}
      {{slides_html}}
    </main>
  </div>
  <div class="presentation-controls" data-presentation-controls>
    <button type="button" data-prev aria-label="上一页">‹</button>
    <span data-counter>1 / {{slide_total}}</span>
    <button type="button" data-next aria-label="下一页">›</button>
    <button type="button" data-fullscreen aria-label="演示模式">⛶</button>
  </div>
  <script>
    (() => {
      const slides = [...document.querySelectorAll(".slide")];
      const counter = document.querySelector("[data-counter]");
      let index = Math.max(0, slides.findIndex((slide) => slide.classList.contains("is-active")));
      function show(next) {
        index = Math.max(0, Math.min(slides.length - 1, next));
        slides.forEach((slide, i) => slide.classList.toggle("is-active", i === index));
        if (counter) counter.textContent = `${index + 1} / ${slides.length}`;
      }
      document.querySelector("[data-prev]")?.addEventListener("click", () => show(index - 1));
      document.querySelector("[data-next]")?.addEventListener("click", () => show(index + 1));
      document.querySelector("[data-fullscreen]")?.addEventListener("click", () => {
        const target = document.documentElement;
        if (document.fullscreenElement) document.exitFullscreen?.();
        else target.requestFullscreen?.();
      });
      const viewer = document.createElement("div");
      viewer.className = "mobile-landscape-viewer";
      viewer.innerHTML = '<button type="button" class="mobile-landscape-viewer-close" aria-label="关闭">×</button><div class="mobile-landscape-viewer-content"></div>';
      document.body.appendChild(viewer);
      const viewerContent = viewer.querySelector(".mobile-landscape-viewer-content");
      function closeViewer() {
        viewer.classList.remove("is-open");
        if (viewerContent) viewerContent.innerHTML = "";
      }
      viewer.querySelector(".mobile-landscape-viewer-close")?.addEventListener("click", closeViewer);
      viewer.addEventListener("click", (event) => {
        if (event.target === viewer) closeViewer();
      });
      document.querySelectorAll(".mobile-landscape-hint").forEach((hint) => {
        const open = () => {
          const preview = hint.querySelector(".mobile-hint-preview");
          if (!preview || !viewerContent) return;
          viewerContent.innerHTML = preview.innerHTML;
          viewer.classList.add("is-open");
        };
        hint.addEventListener("click", open);
        hint.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            open();
          }
        });
      });
      window.addEventListener("keydown", (event) => {
        if (viewer.classList.contains("is-open")) {
          if (event.key === "Escape") closeViewer();
          return;
        }
        if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") show(index + 1);
        if (event.key === "ArrowLeft" || event.key === "PageUp") show(index - 1);
        if (event.key.toLowerCase() === "f") document.querySelector("[data-fullscreen]")?.click();
      });
      show(index);
    })();
  </script>
</body>
</html>
