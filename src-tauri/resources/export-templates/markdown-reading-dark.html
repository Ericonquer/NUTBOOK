<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #1a1c1d; color: #f0f0f2; }
    body {
      margin: 0;
      font-family: Inter, "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.72;
    }
    .page {
      width: min({{page_width}}, calc(100vw - 32px));
      margin: 40px auto;
      padding: 56px;
      background: #2f3132;
      border: 1px solid #45474b;
      border-radius: 8px;
      box-shadow: 0 18px 52px rgba(26, 28, 29, 0.08);
    }
    header { margin-bottom: 34px; color: #c6c6cb; font-size: 13px; }
    h1, h2, h3, h4, h5, h6 { color: #f0f0f2; line-height: 1.25; }
    h1 { margin: 0 0 24px; font-size: 34px; }
    h2 { margin: 34px 0 14px; font-size: 25px; }
    h3 { margin: 28px 0 12px; font-size: 21px; }
    p, ul, ol, blockquote, pre, table { margin: 0 0 18px; }
    a { color: #f0f0f2; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    blockquote { padding: 12px 18px; border-left: 4px solid #cfc4c5; border-radius: 0 14px 14px 0; background: #1a1c1d; color: #c7c6cb; }
    blockquote p:last-child { margin-bottom: 0; }
    code { padding: 0.12em 0.35em; border-radius: 5px; background: #45474b; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; }
    pre { position: relative; overflow: auto; padding: 16px; border-radius: 8px; background: #111; color: #f0f0f2; }
    pre code { padding: 0; background: transparent; color: inherit; }
    {{code_copy_styles}}
    table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid #cfc4c5; border-radius: 14px; overflow: hidden; font-size: 0.95em; line-height: 1.38; }
    th, td { min-width: 48px; padding: 7px 10px; border-right: 1px solid #e2e2e4; border-bottom: 1px solid #e2e2e4; text-align: left; vertical-align: top; overflow-wrap: anywhere; word-break: normal; }
    th { background: #1a1c1d; color: #f0f0f2; font-weight: 700; }
    tr:last-child td { border-bottom: 0; }
    th:last-child, td:last-child { border-right: 0; }
    img { max-width: 100%; height: auto; border-radius: 8px; }
    .missing-image { display: block; padding: 14px; border: 1px dashed #cfc4c5; border-radius: 8px; color: #c7c6cb; background: #1a1c1d; }
    .export-warnings { margin: 0 0 24px; padding: 14px 16px; border-radius: 8px; background: #45474b; color: #c7c6cb; }
    .export-warnings ul { margin: 8px 0 0; padding-left: 20px; }
    footer { margin-top: 42px; padding-top: 18px; border-top: 1px solid #e2e2e4; color: #c6c6cb; font-size: 12px; display: inline-flex; align-items: center; gap: 7px; }
    .footer-logo { display: block; width: 74px; height: auto; border-radius: 0; opacity: 0.86; filter: brightness(0) invert(1); }
    .export-layout { display: grid; grid-template-columns: {{outline_columns}}; gap: 28px; }
    .export-outline { position: sticky; top: 24px; align-self: start; max-height: calc(100vh - 48px); overflow: auto; padding-right: 12px; border-right: 1px solid #e2e2e4; font-size: 13px; }
    .export-outline-title { margin: 0 0 10px; color: #f0f0f2; font-size: 12px; font-weight: 800; }
    .export-outline a { display: block; padding: 4px 0; color: #c6c6cb; text-decoration: none; }
    .export-outline a:hover { color: #f0f0f2; }
    .export-outline .depth-3 { padding-left: 12px; font-size: 12px; }
    @media (max-width: 900px) {
      .export-layout { grid-template-columns: 1fr; }
      .export-outline { position: static; max-height: none; border-right: 0; border-bottom: 1px solid #e2e2e4; padding: 0 0 14px; }
    }
    @media (max-width: 720px) {
      .page { width: 100%; min-height: 100vh; margin: 0; padding: 28px 20px; border: 0; border-radius: 0; box-shadow: none; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main class="page" data-template="reading-dark">
    <header>
      <h1>{{title}}</h1>
      <div>{{source_file}} · {{generated_at}}</div>
    </header>
    {{warnings}}
    <div class="export-layout">
      {{outline}}
      <article>
        {{content}}
      </article>
    </div>
    <footer><span>by</span><img class="footer-logo" src="{{logo_data_uri}}" alt="NUTBOOK"></footer>
  </main>
  {{code_copy_script}}
</body>
</html>
