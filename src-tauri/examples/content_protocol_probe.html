<!doctype html><meta charset="utf-8"><title>Nutbook protocol gate</title>
<base href="/"><link rel="stylesheet" href="/style.css">
<script type="module" src="/module.js"></script>
<h1>Resource protocol compatibility gate</h1><img id="image" src="/image.svg"><pre id="result">Testing…</pre>
<script>
addEventListener('load',async()=>{
 const result={origin:location.origin,href:location.href,css:getComputedStyle(document.body).getPropertyValue('--probe-css').trim()==='ready',module:window.probeModule===true,image:document.querySelector('#image').naturalWidth===10};
 try { const r=await fetch('/data.json'); result.fetch=(await r.json()).canary==='A'; }catch(e){result.fetch=false;result.fetchError=String(e)}
 try { const r=await fetch(window.probeOther);result.crossDenied=!r.ok; }catch(e){result.crossDenied=true;result.crossError=String(e)}
 result.fd=window.probeFd;
 result.oldAddressDenied=true;
 if(window.probeOld){try{const r=await fetch(window.probeOld);result.oldAddressDenied=!r.ok;}catch(e){result.oldAddressDenied=true;}}
 result.secureContext=window.isSecureContext;
 try { const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('abc'));result.crypto=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('')==='ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad'; }catch(e){result.crypto=false;result.cryptoError=String(e)}
 try{localStorage.setItem('probe','A');result.storage=localStorage.getItem('probe')==='A';localStorage.removeItem('probe')}catch(e){result.storage=false;result.storageError=String(e)}
 await window.__TAURI_INTERNALS__.invoke('protocol_probe_revoke');
 try { const r=await fetch('/data.json');result.revoked=!r.ok; }catch(e){result.revoked=true;}
 result.ok=result.oldAddressDenied&&result.crypto&&result.storage&&result.revoked&&result.css&&result.module&&result.image&&result.fetch&&result.crossDenied;
 document.querySelector('#result').textContent=JSON.stringify(result,null,2);
 await window.__TAURI_INTERNALS__.invoke('protocol_probe_report',{report:result});
});
</script>
